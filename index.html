國債台高築夾擊 全球債市拋售潮再起", "date": "2026-10-08", "map": "", "source_name": "中央社：油價與各國債台高築夾擊 全球債市拋售潮再起", "url": "https://www.cna.com.tw/news/afe/202610080006.aspx", "summary": "全球債市7日再掀拋售潮，美國30年期公債殖利率盤中一度升至5.73%，創2002年以來最高；英國30年期公債殖利率一度達6.04%的28年新高，法國10年期升至4.87%。美國30年期固定房貸平均利率升至7.49%，市場關注美國財政部本週10年期與30年期公債標售承接情況。"}, {"no": 5, "title": "印度央行調高基準利率1碼 2023年以來首見升息", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Reserve%20Bank%20of%20India%20Mumbai", "source_name": "中央社：印度央行調高基準利率1碼 2023年以來首見升息", "url": "https://www.cna.com.tw/news/aopl/202610070300.aspx", "summary": "中東衝突加劇印度通膨並重創盧比，印度中央銀行印度儲備銀行6人小組一致表決，調高基準附買回利率1碼至5.50%，為2023年以來首次升息。印度央行自2月伊朗戰爭爆發以來按兵不動，此舉意味政策轉向，加入全球為抑制物價或提振本國貨幣而升息的行列。"}]}, {"name": "Currencies", "items": [{"no": 1, "title": "新台幣午盤貶8.1分 暫收31.876元", "date": "2026-10-08", "map": "", "source_name": "中央社：新台幣午盤貶8.1分 暫收31.876元", "url": "https://www.cna.com.tw/news/afe/202610080106.aspx", "summary": "台北外匯市場新台幣兌美元8日中午暫收31.876元，較前一交易日貶值8.1分，午盤成交金額9.7億美元。新台幣當日開盤價為31.82元，早盤最高31.78元、最低31.885元，盤中呈現貶勢。"}, {"no": 2, "title": "菲律賓9月底外匯存底不足千億美元 創3年新低", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=Bangko%20Sentral%20ng%20Pilipinas", "source_name": "中央社：菲律賓9月底外匯存底不足千億美元 創3年新低", "url": "https://www.cna.com.tw/news/aopl/202610080176.aspx", "summary": "菲律賓中央銀行公布9月底外匯存底為999億9660萬美元，跌破1000億美元，創2023年9月以來3年新低，主因央行淨外匯操作、黃金及外幣資產估值下調，以及政府提領外幣存款償付外債。菲律賓披索兌美元9月15日曾觸及62.925披索的盤中歷史低點。"}, {"no": 3, "title": "美日近30年首度聯手支撐日圓，Fed紀錄揭7月干預使用美財政部資金", "date": "2026-10-08", "map": "", "source_name": "Yahoo股市（財訊快報）：美日近30年首度聯手支撐日圓，Fed紀錄揭7月干預使用美財政部資金", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E6%97%A5%E8%BF%9130%E5%B9%B4%E9%A6%96%E5%BA%A6%E8%81%AF%E6%89%8B%E6%94%AF%E6%92%90%E6%97%A5%E5%9C%93-fed%E7%B4%80%E9%8C%84%E6%8F%AD7%E6%9C%88%E5%B9%B2%E9%A0%90%E4%BD%BF%E7%94%A8%E7%BE%8E%E8%B2%A1%E6%94%BF%E9%83%A8%E8%B3%87%E9%87%91-234205643.html", "summary": "聯準會公布的9月FOMC會議紀錄指出，美國7月底與日本聯手干預匯市、支撐日圓，屬美國財政部採取的行動，由紐約聯邦銀行以財政代理人身分執行，並未動用Fed自身資金，為美日近30年首度共同出手撐日圓；紀錄未披露干預的確切時間及規模。"}, {"no": 4, "title": "台股5萬點近關情怯 新台幣終止連5紅量縮小貶", "date": "2026-10-07", "map": "", "source_name": "中央社：台股5萬點近關情怯 新台幣終止連5紅量縮小貶", "url": "https://www.cna.com.tw/news/afe/202610070287.aspx", "summary": "台股在5萬點前震盪小跌，外資續賣超130.44億元，新台幣終止連5升，收31.795元、貶值1.4分，台北及元太外匯市場總成交金額19.915億美元。交易員指出，聯準會年底前升息預期與美債殖利率偏高支撐美元，新台幣短線料在31.650至31.850元區間波動。"}, {"no": 5, "title": "歐元兌美元跌至17個月低點 法債拋售潮加劇市場疑慮", "date": "2026-10-06", "map": "", "source_name": "中央社：歐元兌美元跌至17個月低點 法債拋售潮加劇市場疑慮", "url": "https://www.cna.com.tw/news/afe/202610060036.aspx", "summary": "受法國公債拋售潮與油價上漲影響，歐元兌美元跌至17個月低點，倫敦早盤一度貶值0.8%至1歐元兌1.116美元，隨後回升至1.121美元，今年以來已貶值4.5%。三菱日聯分析師指出，歐元下跌主要受市場對歐元區金融環境惡化的疑慮加劇影響。"}]}, {"name": "Commodities", "items": [{"no": 1, "title": "聯準會會議紀要偏鷹派 金價跌破 4,100 美元創兩個月新低", "date": "2026-10-08", "map": "", "source_name": "Yahoo股市（商傳媒）：聯準會會議紀要偏鷹派 金價跌破 4,100 美元創兩個月新低", "url": "https://tw.stock.yahoo.com/news/%E8%81%AF%E6%BA%96%E6%9C%83%E6%9C%83%E8%AD%B0%E7%B4%80%E8%A6%81%E5%81%8F%E9%B7%B9%E6%B4%BE-%E9%87%91%E5%83%B9%E8%B7%8C%E7%A0%B4-4-100-%E7%BE%8E%E5%85%83%E5%89%B5%E5%85%A9%E5%80%8B%E6%9C%88%E6%96%B0%E4%BD%8E-021831702.html", "summary": "受強勢美元、美債殖利率飆升及聯準會9月會議紀要偏鷹派影響，現貨黃金7日盤中一度跌至每盎司4096.13美元，創8月上旬以來最低。CME FedWatch顯示市場普遍預期10月按兵不動，但12月升息機率達84%至88%；分析師估金價可能下探4000美元，年底前再反彈至4400美元。"}, {"no": 2, "title": "〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "date": "2026-10-07", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "url": "https://tw.stock.yahoo.com/news/%E6%B8%A3%E6%89%93%E6%8A%95%E8%B3%87%E5%B1%95%E6%9C%9B-%E9%BB%83%E9%87%91%E6%98%8E%E5%B9%B4%E6%81%90%E9%A3%86%E8%87%B35-000%E7%BE%8E%E5%85%83-%E6%97%A5%E5%85%83%E8%BF%8E%E7%BE%8E%E6%97%A5%E5%88%A9%E5%B7%AE%E6%94%B6%E6%96%82%E4%B8%8A%E7%9C%8B153-091658645.html", "summary": "渣打銀行首席投資辦公室發布第4季展望，維持看多黃金，3個月及12個月目標價分別為每盎司4750美元及5000美元，理由是美元中期可能轉弱與新興市場央行持續增持黃金；原油方面，將西德州原油3個月價格預測上調至每桶100美元、12個月目標價上調至80美元。"}, {"no": 3, "title": "CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Chicago%20Board%20of%20Trade", "source_name": "Yahoo股市（財訊快報）：CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "url": "https://tw.stock.yahoo.com/news/cbot%E5%A4%A7%E8%B1%86%E6%9C%9F%E7%B4%84%E9%80%B1%E4%BA%8C%E6%BC%B21-74-%E7%8E%89%E7%B1%B3%E6%8F%9A2-16-ice%E7%B2%97%E7%B3%96%E5%86%8D%E5%89%B519%E5%80%8B%E6%9C%88%E9%AB%98%E9%BB%9E-235914413.html", "summary": "美國農產品期貨6日收高，CBOT 11月大豆期約漲1.74%至每蒲式耳13.03美元，12月玉米漲2.16%至5.08美元，12月小麥漲1.73%至7.0425美元，作物評級下降、收割進度落後及美元走弱支撐買氣；ICE粗糖盤中觸及每磅20.95美分，續創19個月新高。"}, {"no": 4, "title": "中鋼公司今年11月份鋼鐵產品月盤價適度調漲", "date": "2026-10-06", "map": "", "source_name": "Yahoo新聞（NOWnews）：中鋼公司今年11月份鋼鐵產品月盤價適度調漲", "url": "https://tw.news.yahoo.com/%E4%B8%AD%E9%8B%BC%E5%85%AC%E5%8F%B8%E4%BB%8A%E5%B9%B411%E6%9C%88%E4%BB%BD%E9%8B%BC%E9%90%B5%E7%94%A2%E5%93%81%E6%9C%88%E7%9B%A4%E5%83%B9%E9%81%A9%E5%BA%A6%E8%AA%BF%E6%BC%B2-112900723.html", "summary": "中鋼宣布11月鋼鐵產品月盤價適度調漲，熱軋鋼板、鋼捲、冷軋鋼捲、電鍍鋅鋼捲等每公噸漲新台幣900元。董事長黃建智表示，國際鋼價與國內流通行情同步走揚、下游接單回溫帶動補庫存需求，加上鐵礦砂與冶金煤價格使煉鋼成本續居高位，因此順勢調漲。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "date": "2026-10-08", "map": "", "source_name": "中央社：9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "url": "https://www.cna.com.tw/news/afe/202610080079.aspx", "summary": "住展雜誌公布9月住展風向球續亮衰退黃藍燈，總分回升至36.1分，主因建商供給走強，預售案量升至700多億元。但來客與成交組數仍處谷底，待售案數增至1579案；住展指出股市磁吸資金、貸款不易及央行仍有升息可能，使北台灣房市買氣短期難解凍。"}, {"no": 2, "title": "被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "date": "2026-10-07", "map": "", "source_name": "中央社：被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "url": "https://www.cna.com.tw/news/afe/202610070138.aspx", "summary": "被動元件族群成為盤面焦點，華新科、光頡鎖漲停，國巨收647元漲3.5%，禾伸堂、立隆電、金山電同步大漲。市場分析指出，AI伺服器帶動積層陶瓷電容（MLCC）需求明顯成長，日韓大廠轉向板卡端小尺寸高容值產品，台廠可望受惠訂單外溢與漲價效應。"}, {"no": 3, "title": "記憶體漲價效應浮現 9月電腦相關用品漲幅創新高", "date": "2026-10-07", "map": "", "source_name": "中央社：記憶體漲價效應浮現 9月電腦相關用品漲幅創新高", "url": "https://www.cna.com.tw/news/afe/202610070301.aspx", "summary": "主計總處公布9月消費者物價指數年增2.73%，為逾2年半最大漲幅，核心CPI年增2.52%。AI需求帶動記憶體價格大漲，涵蓋電腦與隨身碟的「教養設備及用具」年增9.75%，連續10個月上漲並創統計以來最大漲幅；新台幣計價進口物價指數年增29.59%。"}, {"no": 4, "title": "雙鴻第3季營收97.9億元年增逾6成 連7季創高", "date": "2026-10-07", "map": "", "source_name": "中央社：雙鴻第3季營收97.9億元年增逾6成 連7季創高", "url": "https://www.cna.com.tw/news/afe/202610070243.aspx", "summary": "散熱大廠雙鴻9月營收28.84億元，年增23.23%、月減8.2%；第3季營收97.9億元，年增64%，單季營收連7季創新高，前9月營收年增72.39%。雙鴻表示成長主因AI伺服器液冷散熱系統市占率攀升，水冷板重回輝達Vera Rubin供應鏈，全年營收年增目標上看70%。"}, {"no": 5, "title": "川湖9月營收44.6億元月減3成 終止連6月創高", "date": "2026-10-06", "map": "", "source_name": "中央社：川湖9月營收44.6億元月減3成 終止連6月創高", "url": "https://www.cna.com.tw/news/afe/202610060202.aspx", "summary": "伺服器滑軌大廠川湖9月營收44.64億元，年增1.96倍，但較8月歷史高點滑落30.9%，終止連續6個月創高，時值輝達Vera Rubin新平台準備量產的新舊機種轉換期。川湖8月自結歸屬母公司淨利38.19億元，單月每股賺40.07元，第3季營收則創單季新高。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "中火燃氣二期環評遭撤 環團籲台電進行二階環評", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E4%B8%AD%E7%99%BC%E9%9B%BB%E5%BB%A0", "source_name": "中央社：中火燃氣二期環評遭撤 環團籲台電進行二階環評", "url": "https://www.cna.com.tw/news/ahel/202610080114.aspx", "summary": "台北高等行政法院判決撤銷台中火力發電廠第二期新建燃氣機組計畫的環評結論。環團指出本案將使中火成為全球最大火力發電廠，呼籲環境部與台電放棄上訴、直接進入二階環評，並提出燃煤與燃氣機組落日計畫；環境部表示將待收到判決書後研議，不排除上訴。"}, {"no": 2, "title": "IEA成員國願釋出戰略儲備 油價微跌", "date": "2026-10-08", "map": "", "source_name": "中央社：IEA成員國願釋出戰略儲備 油價微跌", "url": "https://www.cna.com.tw/news/afe/202610080016.aspx", "summary": "國際油價7日劇烈震盪，盤中一度因傳出伊朗可能加劇在荷莫茲海峽的襲擊而飆升，但國際能源總署（IEA）表示成員國準備釋出更多戰略石油儲備後轉跌。紐約西德州中級原油下跌1.3%，收每桶88.28美元；倫敦布倫特原油下跌0.4%，收每桶100.20美元。"}, {"no": 3, "title": "中東戰爭未見緩解跡象 國際油價微幅收高", "date": "2026-10-07", "map": "", "source_name": "中央社：中東戰爭未見緩解跡象 國際油價微幅收高", "url": "https://www.cna.com.tw/news/afe/202610070006.aspx", "summary": "中東戰爭邁入第8個月，石油業高層示警各國為緩解衝突所能採取的應對措施逐漸耗盡，國際油價6日微幅收高。西德州中級原油11月交割價微漲1美分，收每桶89.44美元；布倫特原油12月交割價上揚26美分或0.26%，收每桶100.58美元。"}, {"no": 4, "title": "美國和伊朗戰爭衝擊 英國柴油價格創新高", "date": "2026-10-06", "map": "", "source_name": "中央社：美國和伊朗戰爭衝擊 英國柴油價格創新高", "url": "https://www.cna.com.tw/news/aopl/202610060347.aspx", "summary": "受美伊戰爭影響，英國平均柴油價格在10月5日截止當週達每公升199.52便士，超越2022年7月前高創新高；美國平均柴油價格9月下旬也創每加侖近6.53美元新高。美國總統川普已簽署行政命令放寬免稅紅色柴油使用，G7與IEA並同意釋出1億桶柴油和原油儲備。"}, {"no": 5, "title": "傳擬請台積電包電廠 台電：未進入政策研議程序", "date": "2026-10-06", "map": "", "source_name": "中央社：傳擬請台積電包電廠 台電：未進入政策研議程序", "url": "https://www.cna.com.tw/news/afe/202610060310.aspx", "summary": "針對媒體報導台電備案是請台積電等用電大戶出錢「包電廠」，台電回應相關議題尚未形成具體方案，也未進入正式政策研議或協商程序；台電表示AI與半導體產業發展迅速，須超前部署發電及輸配電建設，董事長曾文生亦表示沒講過差別電價。"}]}], "warnings": [], "day": "2026-10-08"}], "celeb": {"rows": [{"Ticker": "DJT", "Company_or_Name": "Trump Media & Technology Group", "Held_By": "realDonaldTrump", "Approximate_Notes": "由 Donald J. Trump Revocable Trust 持有，有出售限制（年度申報列示）", "Source": "OGE 278e 2025年度申報"}, {"Ticker": "MSFT", "Company_or_Name": "Microsoft", "Held_By": "realDonaldTrump", "Approximate_Notes": "2026年8月有買進紀錄，金額級距未核實", "Source": "OGE 278-T 2026-09-17（9/25收件）"}, {"Ticker": "NVDA", "Company_or_Name": "NVIDIA", "Held_By": "realDonaldTrump", "Approximate_Notes": "2026年8月有買進紀錄，金額級距未核實", "Source": "OGE 278-T 2026-09-17（9/25收件）"}, {"Ticker": "IBM", "Company_or_Name": "IBM", "Held_By": "realDonaldTrump", "Approximate_Notes": "2026年8月有買進紀錄，金額級距未核實", "Source": "OGE 278-T 2026-09-17（9/25收件）"}, {"Ticker": "MCD", "Company_or_Name": "McDonald's", "Held_By": "realDonaldTrump", "Approximate_Notes": "2026年8月有買進紀錄，金額級距未核實", "Source": "OGE 278-T 2026-09-17（9/25收件）"}, {"Ticker": "SPCX", "Company_or_Name": "SpaceX", "Held_By": "elonmusk", "Approximate_Notes": "約48.4% A股（折算後6,418,547,515股），投票權約82%", "Source": "SEC Schedule 13G 2026-08-13（截至6/30）"}, {"Ticker": "TSLA", "Company_or_Name": "Tesla", "Held_By": "elonmusk", "Approximate_Notes": "約19.9%（699,580,882股，不含有爭議的績效獎勵股）", "Source": "SEC SC 13G/A 2026-06-17"}, {"Ticker": "SIVE", "Company_or_Name": "Sivers Semiconductors", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱持有100萬股以上，最大個人股東之一", "Source": "X貼文 2026-07-10"}, {"Ticker": "AXTI", "Company_or_Name": "AXT Inc", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱仍持有（still long）", "Source": "X貼文 2026-08-13"}, {"Ticker": "IQE", "Company_or_Name": "IQE plc", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱仍持有（still long）", "Source": "X貼文 2026-08-13"}, {"Ticker": "HPS.A", "Company_or_Name": "Hammond Power Solutions", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱仍有部位", "Source": "X貼文 2026-08-18"}, {"Ticker": "RKLB", "Company_or_Name": "Rocket Lab", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱持有", "Source": "X貼文 2026-08-05"}, {"Ticker": "LPK", "Company_or_Name": "LPKF Laser & Electronics", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱持有", "Source": "X貼文 2026-07-03"}, {"Ticker": "CCXI", "Company_or_Name": "Agility Robotics（經 Churchill Capital XI 合併，預定代號 AGLT）", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱持有 Agility Robotics；10/13 S-4 生效，預計11月掛牌", "Source": "X貼文 2026-07-05、2026-10-13"}, {"Ticker": "EWY", "Company_or_Name": "iShares MSCI South Korea ETF", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱仍做多記憶體（以EWY為例）", "Source": "X貼文 2026-09-21"}, {"Ticker": "DRAM", "Company_or_Name": "記憶體主題ETF（DRAM）", "Held_By": "aleabitoreddit", "Approximate_Notes": "自稱仍做多記憶體（以DRAM為例）", "Source": "X貼文 2026-09-21"}], "md": "# 名人持股與貼文整理（2026-10-14）\n\n整理時間：2026-10-14 22:50（台北）。貼文範圍：2026-10-12 至 10-14（台北時間）。\n**注意**：政府申報只揭露「交易」或「金額級距」，網紅的持股是本人在貼文中的說法，都不是即時的完整持股。以下內容不構成投資建議。\n\n## 最近三日貼文摘要\n\n### @realDonaldTrump\n- 10/12 晚上到 10/14 中午共發了約 25 則，幾乎都是只有連結的影片或圖片，文字內容抓不到。\n- 有文字的一則（10/14 12:30）是講治安和遣送罪犯（[貼文](https://x.com/realDonaldTrump/status/2110226740425445513)），和股市沒有直接關係。\n- 這三天沒有看到他直接提到個股或關稅數字的文字貼文。\n\n### @elonmusk\n- 10/14 05:52 稱讚 **Micron** 的記憶體報價很合理，又說其他廠商「漫天要價」，客戶不會忘記（[貼文](https://x.com/elonmusk/status/2110126632572756339)）。暗指 SK 海力士和三星，對記憶體類股是情緒利空。\n- 10/14 05:35 回應 zerohedge 的資料中心債券賣壓：需求確實很強，但有錢不代表蓋得出來，還說 SpaceX 的團隊表現最好（[貼文](https://x.com/elonmusk/status/2110122281603326170)）。\n- 10/14 07:42「Tesla 自動駕駛感覺像魔法」（[貼文](https://x.com/elonmusk/status/2110154332553597413)），10/13 00:23 說安全一直是 Tesla 和 SpaceX 的第一優先。\n- 10/13 01:01 談中國的量產規模，說 SpaceX 是少數的反例（[貼文](https://x.com/elonmusk/status/2109690977279426846)）。\n- 其餘大多是推廣 Grok Bot 和 Grok Imagine 的轉推。\n\n### @aleabitoreddit（Serenity）\n- 10/13 07:33 長文：記憶體的需求一路看得到 2030 年以後，光通訊（LITE、AAOI、SIVE、MTSI）2027–28 年會進入超級週期，市場把不同的股票綁在一起賣，反而出現錯殺的機會（[貼文](https://x.com/aleabitoreddit/status/2109789664622322081)）。\n- 10/13 11:44 和 14:53：韓股、SK 海力士和三星重挫。他認為 Broadcom 執行長的「AI 投資人像賭徒」被西方媒體斷章取義，原意其實是看好 AI 晶片的需求（[貼文1](https://x.com/aleabitoreddit/status/2109852646484201736)、[貼文2](https://x.com/aleabitoreddit/status/2109900353349300590)）。\n- 10/13 17:22：人形機器人加速發展，提到 NVDA 和 TSLA（[貼文](https://x.com/aleabitoreddit/status/2109937773440577755)）。\n- 10/14 06:56：Agility Robotics（$AGLT）經由 $CCXI 上市的 S-4 已經生效，預計 11/2 股東投票、11 月掛牌（[貼文](https://x.com/aleabitoreddit/status/2110142633716965836)）。\n- 10/14 07:11：認為 Musk 批評記憶體漲價，是衝著 SK 海力士和三星漲價太多（[貼文](https://x.com/aleabitoreddit/status/2110146513766900019)）。\n\n### @SerenityRSH\n- 這三天**沒有發文**。最近一則是 2026-07-19 的「Cooking up something soon」，帳號總共只有 8 則貼文。\n- 從名稱和外部網站看，它和 Serenity（@aleabitoreddit）可能有關，但**無法證實是同一個人**。發過的內容是記憶體和半導體的研究短評（華邦電、旺宏、南亞科等），沒有揭露過任何持股。\n\n## 最新持股\n\n| 帳號 | 持股 | 依據 |\n|---|---|---|\n| Trump | DJT（Trump Media，由信託持有）；另有大量個股、ETF、市政債 | [OGE 2025 年度 278e](https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index/69AEAA9D7455ACD585258E27002DDEE1/$FILE/Donald-J-Trump-2026-278ANNUAL.pdf) |\n| Trump | 2026 年 8 月有買進 MSFT、MCD、CMCSA、STZ、ZTS、AJG、NVDA、IBM、EPAM 等股票，也買了大量市政債 | [OGE 278-T（9/25 收件）](https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index/0BDCCCE7DE13AEFA85258E8A002DE2B5/%24FILE/Donald-J-Trump.09.17.2026-278T.pdf) |\n| Musk | SPCX 約 48.4%（6,418,547,515 股，折算成 A 股），投票權約 82% | [SEC 13G，8/13 申報](https://www.sec.gov/Archives/edgar/data/1181412/000110465926095936/0001104659-26-095936.txt) |\n| Musk | TSLA 約 19.9%（699,580,882 股） | [SEC 13G/A，6/17](https://www.sec.gov/Archives/edgar/data/1494730/000110465926075203/0001104659-26-075203.txt) |\n| Serenity | SIVE（自稱持有 100 萬股以上）、AXTI、IQE、HPS.A、RKLB、LPK、Agility Robotics、EWY/DRAM（做多記憶體） | 本人 X 貼文，2026 年 7–9 月 |\n| SerenityRSH | 沒有揭露 | — |\n\n## 持股增減\n- **Trump**：最新的 278-T 顯示 8 月以**買進**為主（股票和市政債都有）。5–6 月的申報則同時有大量買進和賣出，例如賣出 VISA、WFC、WDAY，買進 VST、WING。278-T 只揭露金額級距，看不出淨持股，而且這些交易據稱由第三方管理，不一定是他本人的判斷。\n- **Musk**：8/13 的 13G 是最新的 SPCX 持股，**這三天沒有新的 Form 4 或 13G**。財經新聞提到，SpaceX 10/13 下跌，部分原因是「更多鎖定股解禁」，但沒有看到 Musk 本人賣股的申報。\n- **Serenity**：這三天沒有宣布任何增減碼。10/13 的長文提到他覺得 LITE 估值偏高，所以「已經相應調整部位」，但沒說清楚是減碼還是放空，所以沒有列進 CSV。7 月他曾自稱「本月回撤 -49.4%，已經降低槓桿」。\n\n## 最近三日新聞\n- **Trump**：紐約聯準銀行研究指出，關稅讓美國本土製造的商品也跟著漲價，到 2026 年 2 月大約推升通膨 2.9 個百分點（10/14）；Bloomberg 報導 3/23 Trump 撤回攻擊伊朗威脅前 15 分鐘，有人大量押注油價下跌，CFTC 的移送被撤回，引發是否干預的疑慮（10/14）；美國國債超過 40.3 兆美元（10/13）。來源：X 新聞彙整，[1](https://x.com/i/trending/2110369888787435739)、[2](https://x.com/i/trending/2109973131372769550)、[3](https://x.com/i/trending/2110107098889765158)\n- **Musk**：SpaceX 10/13 下跌超過 4%，收在約 156.5 美元，Musk 身價跌回 1 兆美元以下（[來源](https://x.com/i/trending/2110071026336022909)）；最高法院將審理 DOGE 紀錄是否必須公開（[來源](https://x.com/i/trending/2110007064886235496)）。\n- **Serenity**：他持續關注的 IREN 有 Anthropic 合作傳聞，股價盤中大跌 5%，最後收平在 34.80 美元（[來源](https://x.com/i/trending/2110174789122007274)）；Agility Robotics 的 S-4 獲 SEC 宣告生效（[官方公告](https://www.agilityrobotics.com/content/agility-robotics-and-churchill-capital-corp-xi-s-4-registration-statement-declared-effective-by-sec-in-connection-with-proposed-business-combination)）。\n\n## $SPCX 近三日新聞\nSPCX 是 **SpaceX 本身的普通股**，2026/6/12 在 Nasdaq 掛牌，**不是 ETF**。原本用 SPCX 代號的 Tuttle SPAC ETF 已經改了代號。另外有 SPCU、SPCQ、LOFF、LOFD 等 2 倍槓桿或反向的 ETF。\n- 10/13：股價下跌超過 4%，收在約 156.5 美元，市值蒸發約 890 億美元，原因包括更多鎖定股解禁（[來源](https://x.com/i/trending/2110071026336022909)）。\n- 10/12：以 80 億美元向 Grain Management 收購 800 MHz 頻譜（尚待 FCC 核准），準備做 Starlink Mobile。Pivotal 把目標價調高到 230 美元，MoffettNathanson 維持 142 美元；預測市場認為 2028 年前和 Tesla 合併的機率約 69%（[來源](https://x.com/i/trending/2109644511374712936)）。\n- 10/12：Morgan Stanley 的 Adam Jonas 說 Starship 第 15 次試飛（10 月底或 11 月初）是 IPO 以來最重要的回收測試，目標價 300 美元（[來源](https://x.com/i/trending/2109488926952181776)）。\n- 10/14：Morgan Stanley 點出軌道 AI 算力（Starmind 星座）是成長引擎，Ron Baron 喊出 10 年內 20–50 兆美元的估值（[來源](https://x.com/i/trending/2110151636681179566)）。\n- 同期間 AST SpaceMobile 被 SpaceX 的手機直連衛星競爭拖累，股價從高點下跌約 65%（[來源](https://x.com/i/trending/2109600795931095431)）。\n\n*以上新聞來自 X 平台的新聞彙整（由 AI 摘要），數字以原始報導為準。*\n\n## #分析 Trump 貼文及財務揭露細節\n- **貼文面**：這三天幾乎都是影片和圖片，沒有直接點名個股，也沒有發布具體的關稅數字，對市場的直接訊號很弱。真正會動到市場的是政策新聞（關稅研究、伊朗、國債）。\n- **揭露面**：OGE 278-T 只揭露超過 1,000 美元的交易和金額級距，而且可以在交易後最多 45 天才申報，所以申報到的都是**1–2 個月前**的交易。資產組成以市政債、大型股和 ETF 為主，比較像分散型的帳戶管理，不是集中押注。最大的單一部位仍然是 DJT（Trump Media），但信託有出售限制。\n- **風險點**：已經有好幾份申報因為遲交被收罰款（OGE 文件上有「late fee」註記）。另外 3 月油價期貨在 Trump 發文前出現異常交易，CFTC 調查受到干預的報導也讓外界懷疑「政策資訊不對稱」。投資上不建議跟著申報買股，因為申報有延遲，金額也只是級距。\n\n## #分析 @aleabitoreddit 貼文及財務揭露細節\n- **貼文面**：核心論點始終是 AI 供應鏈的「卡脖子環節」，包括記憶體、光通訊（InP 和雷射）、人形機器人和上游半導體。這三天他在韓股和記憶體大跌時替多方辯護，並把 Broadcom 執行長的發言解讀成看多。\n- **揭露面**：他**沒有任何監管申報**（不是基金經理人，沒有 13F）。持股全部來自他自己的貼文，例如 SIVE 100 萬股以上、AXTI、IQE、HPS.A、RKLB、LPK、Agility，沒辦法查證，也不知道他什麼時候出場。\n- **風險點**：外部報導（Bloomberg、Reuters）證實他的貼文曾讓 X-Fab 在一天內暴漲約 76%，**影響力是真的，但報酬率沒經過稽核**。他自己承認用了融資，7 月回撤接近 50%。追他推薦的小型股，流動性風險很高，也可能買在他出貨的時候。\n\n## #分析 @elonmusk 貼文及財務揭露細節\n- **貼文面**：最值得注意的是**點名稱讚 Micron、暗批其他記憶體廠漫天要價**，剛好碰上記憶體股大跌，對 SK 海力士和三星的情緒不利。他還說資料中心「有錢不等於蓋得出來」，間接在宣傳 SpaceX 的 AI 基礎建設能力。其他大多是推廣 Grok。\n- **揭露面**：SPCX 持股約 48.4%（A 股折算），因為 B 股一股 10 票，投票權約 82%，SpaceX 屬於「受控公司」。TSLA 持股約 19.9%，不包括一筆約 4.2 億股、由 Tesla 秘書代為投票的績效獎勵股。這三天沒有新的內部人交易申報。\n- **風險點**：SPCX 鎖定股陸續解禁，可能帶來賣壓。市場對 SpaceX 和 Tesla 合併的預期（預測市場約 69%）讓兩檔股票連動。另外他在 X 上的發言可能會牽動他有利益關係的公司股價。\n\n## 資料缺口\n- Trump 的 OGE PDF 從工具這邊下載會被擋，只能從搜尋摘要確認股票名稱，**金額級距沒有逐筆核對**。\n- Trump 這三天的貼文多半只有連結，影片內容沒有分析。\n- 新聞主要來自 X 的新聞彙整（由 AI 摘要）。\n", "report": "holdings_report_20261014.md"}}</script>
