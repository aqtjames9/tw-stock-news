/202610120008.aspx", "summary": "美國7位跨黨派聯邦參議員發表聯合聲明，質疑川普允許俄羅斯柴油出口的協議是否合法，指國會在2022年已明確禁止進口俄羅斯能源，且行政部門未依法與國會諮商。川普9日宣布與普丁達成協議，俄羅斯將向美國和全球市場供應柴油，以換取美國暫時放寬制裁，引來烏克蘭、歐盟與多位美國國會議員強烈反彈。"}, {"no": 3, "title": "伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "date": "2026-10-12", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "中央社：伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "url": "https://www.cna.com.tw/news/aopl/202610120005.aspx", "summary": "伊朗最高國家安全委員會秘書雷札伊表示，美國對伊朗提出重啟荷莫茲海峽7項條件的回應「不足」，在條件達成前，海峽將不會對美國開放、也不會展開協商。伊朗曾在聯合國大會期間提案，只要條件滿足，荷莫茲海峽航運可望於7天內恢復正常，美國後來透過調解方卡達回應，雷札伊稱美方已接受部分條件但其餘仍不明確。"}, {"no": 4, "title": "台塑石化：12日起汽柴油不漲價", "date": "2026-10-11", "map": "", "source_name": "中央社：台塑石化：12日起汽柴油不漲價", "url": "https://www.cna.com.tw/news/afe/202610110112.aspx", "summary": "台塑石化網站資料顯示，加盟加油站10月12日凌晨1時起參考零售價維持不變，92無鉛汽油每公升新台幣31.2元、95+無鉛汽油32.7元、98無鉛汽油34.7元、超級柴油29.7元；自9月14日調漲汽油價格後，已連續4週未調整油價。"}, {"no": 5, "title": "油價再漲破百美元不合理？富蘭克林透露　中東石油出口已回到2025年日均水準", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（中時新聞網）：油價再漲破百美元不合理？富蘭克林透露　中東石油出口已回到2025年日均水準", "url": "https://tw.stock.yahoo.com/news/%E6%B2%B9%E5%83%B9%E5%86%8D%E6%BC%B2%E7%A0%B4%E7%99%BE%E7%BE%8E%E5%85%83%E4%B8%8D%E5%90%88%E7%90%86-%E5%AF%8C%E8%98%AD%E5%85%8B%E6%9E%97%E9%80%8F%E9%9C%B2-%E4%B8%AD%E6%9D%B1%E7%9F%B3%E6%B2%B9%E5%87%BA%E5%8F%A3%E5%B7%B2%E5%9B%9E%E5%88%B02025%E5%B9%B4%E6%97%A5%E5%9D%87%E6%B0%B4%E6%BA%96-103431799.html", "summary": "富蘭克林證券投顧引述報告指出，中東石油出口已回到每日2330萬桶，與2025年每日2310萬桶日均量相當，與荷莫茲海峽運輸增加有關，但成品油供應仍不足、能源設施再遭攻擊風險未消除，布蘭特原油仍在100美元之上。摩爾投顧分析師謝晨彥表示中東原油出口已回到戰前94%，明年通膨壓力可望趨緩。"}]}], "warnings": [], "day": "2026-10-13"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-09 至 2026-10-12）", "compiled": "2026-10-12 07:20（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件；10月9日（五）至11日（日）國慶連假台股休市，台指期夜盤跌652點為8日夜盤交易", "note": "Currencies類3則、Commodities類4則（近3日符合條件且來源可查證之新聞不足；Commodities類僅找到貴金屬相關新聞，未找到穀物等其他原物料新聞），其餘各類各5則，無空缺類別；10月9日至11日國慶連假台股及新台幣匯市休市，期貨類以連假前8日夜盤及連假期間盤前分析為主；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "歐洲最大晶圓廠布局物理AI！格羅方德砸11億歐元擴建德國晶圓廠、2028年啟動生產", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=GlobalFoundries%20Dresden", "source_name": "Yahoo股市（鉅亨網）：歐洲最大晶圓廠布局物理AI！格羅方德砸11億歐元擴建德國晶圓廠、2028年啟動生產", "url": "https://tw.stock.yahoo.com/news/%E6%AD%90%E6%B4%B2%E6%9C%80%E5%A4%A7%E6%99%B6%E5%9C%93%E5%BB%A0%E5%B8%83%E5%B1%80%E7%89%A9%E7%90%86ai-%E6%A0%BC%E7%BE%85%E6%96%B9%E5%BE%B7%E7%A0%B811%E5%84%84%E6%AD%90%E5%85%83%E6%93%B4%E5%BB%BA%E5%BE%B7%E5%9C%8B%E6%99%B6%E5%9C%93%E5%BB%A0-2028%E5%B9%B4%E5%95%9F%E5%8B%95%E7%94%9F%E7%94%A2-140005426.html", "summary": "格羅方德宣布德國德勒斯登SPRINT晶圓廠擴建計畫正式封頂，總投資金額達11億歐元，預計2028年底完成後300毫米晶圓年產能將超過100萬片，可望成為歐洲最大晶圓代工基地，目前年產能約95萬片。同步推出新一代FD-SOI平台FDX Fusion，第一代預計提供相當於7奈米級數位效能，瞄準機器人、智慧汽車與工業自動化等物理AI應用。"}, {"no": 2, "title": "馬斯克：Terafab將找到方法製造晶片 品質比誰都更好", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=Grimes%20County%2C%20Texas", "source_name": "中央社：馬斯克：Terafab將找到方法製造晶片 品質比誰都更好", "url": "https://www.cna.com.tw/news/aopl/202610113001.aspx", "summary": "馬斯克在特斯拉德州奧斯汀超級工廠活動上表示，自家團隊大概會「找到方法製造出比任何人都更好的晶片」，但可能需要好幾年。他打算透過特斯拉與SpaceX合資公司，攜手英特爾在德州葛林姆斯打造晶片製造廠Terafab，初期投資額超過150億美元（約新台幣4794億元），可望創造3000個工作機會，並獲「德州企業基金」3000萬美元補助款。"}, {"no": 3, "title": "ASML曝光機零件韓國市場統一漲價10% 三星、SK 海力士已接受", "date": "2026-10-10", "map": "", "source_name": "Yahoo股市（鉅亨網）：ASML曝光機零件韓國市場統一漲價10% 三星、SK 海力士已接受", "url": "https://tw.stock.yahoo.com/news/asml%E6%9B%9D%E5%85%89%E6%A9%9F%E9%9B%B6%E4%BB%B6%E9%9F%93%E5%9C%8B%E5%B8%82%E5%A0%B4%E7%B5%B1-%E6%BC%B2%E5%83%B910-%E4%B8%89%E6%98%9F-sk-%E6%B5%B7%E5%8A%9B%E5%A3%AB%E5%B7%B2%E6%8E%A5%E5%8F%97-061359291.html", "summary": "據韓媒《The Elec》報導，ASML決定將供應韓國市場的曝光機替換部件價格統一提高10%，涵蓋極紫外與深紫外曝光機全部備件，自2027年1月供貨產品起執行新價格，三星電子與SK海力士已接受。ASML售後服務、備件和升級業務2025年營收達81.93億歐元，佔總營收25%，ASML預估今年該業務收入將成長30%以上。"}, {"no": 4, "title": "赴德州設廠、結盟馬斯克？台積電15日法說聚焦營運擴產", "date": "2026-10-09", "map": "", "source_name": "中央社：赴德州設廠、結盟馬斯克？台積電15日法說聚焦營運擴產", "url": "https://www.cna.com.tw/news/afe/202610090086.aspx", "summary": "台積電第3季營收達新台幣1兆4942.43億元，季增17.62%，前9月營收3兆8987.27億元，年增41.1%。15日法說會市場除關注資本支出、先進製程與封裝進展、毛利率展望外，台積電是否赴德州設廠，以及與馬斯克晶片廠Terafab的合作傳聞也是法人追問焦點；A14製程原規劃2027年試產、2028年量產，市場關心最新進展。"}, {"no": 5, "title": "AI掀缺貨潮史上首見 記憶體廠砸6744億元台灣擴產", "date": "2026-10-09", "map": "", "source_name": "中央社：AI掀缺貨潮史上首見 記憶體廠砸6744億元台灣擴產", "url": "https://www.cna.com.tw/news/afe/202610090028.aspx", "summary": "AI熱潮促使記憶體出現前所未見的缺貨漲價潮，業者預期至少延續到2027年上半年。美光在桃園、苗栗銅鑼、台中和台南同步擴產，桃園新產線預計2027年底或2028年初投產；南亞科5A新廠預計2027年下半年投片，總資本支出約160億美元（約新台幣5120億元）；華邦電高雄廠月產能將自1.5萬片擴增至2.4萬片，今年資本支出約新台幣395億元，總投資逾新台幣6744億元。"}]}, {"name": "AI", "items": [{"no": 1, "title": "輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "url": "https://tw.news.yahoo.com/%E8%BC%9D%E9%81%94%E8%A1%9D%E5%88%BA%E6%A9%9F%E5%99%A8%E4%BA%BA%E5%8A%A0%E7%A2%BC%E6%8A%95%E8%B3%87%E6%96%B0%E5%89%B5figure%E6%89%80%E7%BE%85%E9%96%80-%E5%BB%A3%E9%81%8B-%E5%8F%B0%E9%81%94%E9%9B%BB%E7%AD%89%E6%B2%BE%E5%85%89-223210290.html", "summary": "輝達傳擬斥資10億美元（近新台幣320億元）加碼投資AI機器人新創Figure，Figure目前估值約380億美元。業界認為這是黃仁勳加速擴大機器人布局的關鍵訊號，所羅門、廣運、台達電、達明、新漢等輝達機器人供應鏈有望受惠；所羅門董事長陳政隆透露，今年AI視覺與機器人相關業績可望增長七成。"}, {"no": 2, "title": "金融時報：輝達討論加強投資或收購Reflection AI", "date": "2026-10-11", "map": "", "source_name": "中央社：金融時報：輝達討論加強投資或收購Reflection AI", "url": "https://www.cna.com.tw/news/aopl/202610110140.aspx", "summary": "英國金融時報引述知情人士報導，輝達正與美國開源AI新創Reflection AI討論加強投資或直接收購。輝達至今已對其投資8億美元（約新台幣256億元），雙方考慮的交易形式包括由輝達聘僱其職員並取得技術授權的「人才收購」，這麼做或許能避免冗長的監管審查；Reflection AI已於5日推出首款開放權重模型Beam。"}, {"no": 3, "title": "AI伺服器催油門！電子五哥Q3營收齊增 緯創、廣達雙創單季新高", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（壹蘋新聞網）：AI伺服器催油門！電子五哥Q3營收齊增 緯創、廣達雙創單季新高", "url": "https://tw.news.yahoo.com/ai%E4%BC%BA%E6%9C%8D%E5%99%A8%E5%82%AC%E6%B2%B9%E9%96%80-%E9%9B%BB%E5%AD%90%E4%BA%94%E5%93%A5q3%E7%87%9F%E6%94%B6%E9%BD%8A%E5%A2%9E-%E7%B7%AF%E5%89%B5-%E5%BB%A3%E9%81%94%E9%9B%99%E5%89%B5%E5%96%AE%E5%AD%A3%E6%96%B0%E9%AB%98-085100111.html", "summary": "AI伺服器需求強勁，電子五哥第三季營收全面年增。緯創第三季營收1.15兆元、年增101%，廣達第三季營收1.12兆元、年增125.2%，英業達第三季營收2720.94億元，三者均創單季新高；和碩9月營收2147.53億元，首度突破2000億元。廣達表示新一代Vera Rubin第四季預計開始小量出貨，主要專案明年第一季才會啟動。"}, {"no": 4, "title": "軟銀擬向波灣投資人籌措1000億美元 拚擴大AI布局", "date": "2026-10-09", "map": "", "source_name": "中央社：軟銀擬向波灣投資人籌措1000億美元 拚擴大AI布局", "url": "https://www.cna.com.tw/news/aopl/202610090229.aspx", "summary": "英國金融時報報導，軟銀集團創辦人孫正義擬向阿拉伯聯合大公國等波斯灣地區投資人募資多達1000億美元，用於設立基金收購企業，並運用AI等先進技術提升經營效率。孫正義近日已完成對OpenAI的650億美元投資，但OpenAI首次公開募股已證實延期，市場也擔心軟銀AI曝險過大；消息人士指融資案未必談成。"}, {"no": 5, "title": "OpenAI年化營收較預期短少200億美元 AI前景疑慮上升", "date": "2026-10-09", "map": "", "source_name": "中央社：OpenAI年化營收較預期短少200億美元 AI前景疑慮上升", "url": "https://www.cna.com.tw/news/ait/202610090052.aspx", "summary": "金融時報報導，OpenAI告知投資人截至9月底年化營收接近500億美元，遠低於先前報導的700億美元，短少約200億美元。消息披露後美國科技股跌勢加劇，那斯達克100指數收跌1.4%，輝達跌2.9%、甲骨文跌5.5%、美光跌4.8%。OpenAI正洽談新一輪私募，估值可能達1.4兆美元，預估到2030年累計資金消耗將接近2800億美元。"}]}, {"name": "金融", "items": [{"no": 1, "title": "美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "url": "https://tw.news.yahoo.com/%E7%BE%8E%E5%82%B5%E6%8A%95%E8%B3%87%E4%B9%9F%E7%88%86-%E5%9B%9B%E8%B2%B8%E5%90%8C%E5%A0%82-%E9%87%91%E7%AE%A1%E6%9C%83%E6%8C%87%E7%A4%BA%E5%BE%9E%E6%8E%88%E4%BF%A1-%E9%8A%B7%E5%94%AE%E7%AB%AF%E9%9B%99%E7%AE%A1%E9%BD%8A%E4%B8%8B%E5%BC%B7%E5%8C%96%E6%8E%A7%E7%AE%A1-223957089.html", "summary": "美國10年期公債殖利率攀升、價格下跌，貸款買美債的高槓桿投資人面臨斷頭壓力。金管會已要求銀行公會研訂《金融資產擔保放款強化管理措施》，預計年底上路，授信端重點為客戶總額度控管並評估最壞情境能否負荷，銷售端則嚴禁銀行勸誘客戶做疊券；有投資人反覆質借堆疊美債部位，高達五、六層。"}, {"no": 2, "title": "前三季金控獲利公布、全年展望樂觀", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（工商時報）：前三季金控獲利公布、全年展望樂觀", "url": "https://tw.stock.yahoo.com/news/%E5%89%8D%E4%B8%89%E5%AD%A3%E9%87%91%E6%8E%A7%E7%8D%B2%E5%88%A9%E5%85%AC%E5%B8%83-%E5%85%A8%E5%B9%B4%E5%B1%95%E6%9C%9B%E6%A8%82%E8%A7%80-083643461.html", "summary": "上市金控9月及前三季獲利將於15日全數公布，金控前八月獲利達5,789.07億元，已逼近2024年史上最高的全年5,979.79億元，前三季可望突破歷年全年新高。若9月至12月每月獲利維持553億元動能且年底未有大筆呆帳打消，全年金控獲利有機會挑戰8,000億元；金控高層提醒地緣政治、股債波動與美國利率路徑為第四季關鍵變數。"}, {"no": 3, "title": "公股投信四合一即將達陣 第一金、兆豐金等下周四將開董事會決議", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：公股投信四合一即將達陣 第一金、兆豐金等下周四將開董事會決議", "url": "https://tw.news.yahoo.com/%E5%85%AC%E8%82%A1%E6%8A%95%E4%BF%A1%E5%9B%9B%E5%90%88-%E5%8D%B3%E5%B0%87%E9%81%94%E9%99%A3-%E7%AC%AC-%E9%87%91-%E5%85%86%E8%B1%90%E9%87%91%E7%AD%89%E4%B8%8B%E5%91%A8%E5%9B%9B%E5%B0%87%E9%96%8B%E8%91%A3%E4%BA%8B%E6%9C%83%E6%B1%BA%E8%AD%B0-230724740.html", "summary": "第一金、兆豐金、合庫金及華南金推動旗下投信「四合一」，四家金控訂於22日同步召開董事會決議，通過後送金管會及公平會審核，合併基準日訂於明年。合併後以規模最大的第一金投信為存續公司，第一金將取得50%多一點的過半股權，兆豐金取得30%多股權，合庫金及華南金各取得9%多股權。"}, {"no": 4, "title": "銀行跨足幣圈擬正面表列 金管會規劃列出可兼營項目避免整碗捧去", "date": "2026-10-10", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：銀行跨足幣圈擬正面表列 金管會規劃列出可兼營項目避免整碗捧去", "url": "https://tw.news.yahoo.com/%E9%8A%80%E8%A1%8C%E8%B7%A8%E8%B6%B3%E5%B9%A3%E5%9C%88%E6%93%AC%E6%AD%A3%E9%9D%A2%E8%A1%A8%E5%88%97-%E9%87%91%E7%AE%A1%E6%9C%83%E8%A6%8F%E5%8A%83%E5%88%97%E5%87%BA%E5%8F%AF%E5%85%BC%E7%87%9F%E9%A0%85%E7%9B%AE%E9%81%BF%E5%85%8D%E6%95%B4%E7%A2%97%E6%8D%A7%E5%8E%BB-220924521.html", "summary": "虛擬資產服務法子法即將出爐，金管會預計10月辦公聽會、11月預告。市場傳出金管會規劃參照金融機構兼營證券業務方式，以正面表列列出銀行可兼營的虛擬資產業務範圍，甚至可能比兼營證券更嚴；虛擬資產業務主要有交換、交易平台、移轉、保管、借貸及承銷六項，爭議最大的交換業務能否兼營仍待政策決定。"}, {"no": 5, "title": "告別便宜新台幣時代？銀行掀LCR防衛戰", "date": "2026-10-09", "map": "", "source_name": "中央社：告別便宜新台幣時代？銀行掀LCR防衛戰", "url": "https://www.cna.com.tw/news/afe/202610090024.aspx", "summary": "AI熱潮帶動科技廠擴廠與台股熱絡，市場資金需求升溫，AI聯貸大案放款利率已由過去2%以下升至2.3%至2.5%間。全體本國銀行7月底放款餘額達新台幣48.8兆元，月增1兆399億元創單月新高，存放比升至72.96%；8月底國銀平均LCR為120.57%，多家銀行推出2%起跳的新資金定存專案搶存款。"}]}, {"name": "航運", "items": [{"no": 1, "title": "航運下一戰3》美線長約看漲歐線承壓 貨櫃三雄迎獲利考驗", "date": "2026-10-12", "map": "", "source_name": "Yahoo股市（民報）：航運下一戰3》美線長約看漲歐線承壓 貨櫃三雄迎獲利考驗", "url": "https://tw.stock.yahoo.com/news/%E8%88%AA%E9%81%8B%E4%B8%8B-%E6%88%B03-%E7%BE%8E%E7%B7%9A%E9%95%B7%E7%B4%84%E7%9C%8B%E6%BC%B2%E6%AD%90%E7%B7%9A%E6%89%BF%E5%A3%93-%E8%B2%A8%E6%AB%83%E4%B8%89%E9%9B%84%E8%BF%8E%E7%8D%B2%E5%88%A9%E8%80%83%E9%A9%97-220200327.html", "summary": "長榮9月營收497.11億元、年增63.75%，陽明216.99億元、年增69.94%，萬海217.75億元、年增97.63%。長榮研判2027年美線長約價格高於2026年的機率相當大；法人預估長榮今年每股盈餘50.42元，但2027年降至25.20元。航商重返紅海可能釋出全球約2%至4%運力，2027年至2029年另有大量新船交付，歐線運價恐承壓。"}, {"no": 2, "title": "無視警告硬闖海上封鎖線 美軍開火癱瘓貨輪", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=Gulf%20of%20Oman", "source_name": "中央社：無視警告硬闖海上封鎖線 美軍開火癱瘓貨輪", "url": "https://www.cna.com.tw/news/aopl/202610110066.aspx", "summary": "美軍中央司令部表示，阿曼灣一艘懸掛巴拿馬國旗的散裝貨輪「海洋莫利卡號」（M/V Ocean Molica）自伊朗港口離港後，無視警告試圖突破美軍對伊朗的海上封鎖線，美軍戰鬥機以精準彈藥擊中船尾，癱瘓其推進系統，船員未受傷；美軍並警告阿曼灣及荷莫茲海峽周邊海域船員遵守封鎖警告。"}, {"no": 3, "title": "貨櫃航運美強歐弱 紅海復航中、塞港難解撐運價", "date": "2026-10-11", "map": "", "source_name": "中央社：貨櫃航運美強歐弱 紅海復航中、塞港難解撐運價", "url": "https://www.cna.com.tw/news/afe/202610110047.aspx", "summary": "全球貨櫃航商陸續重返紅海，市場擔憂新增運力壓抑運價，但業者指塞港成常態可抵銷部分運力。長榮海運總經理吳光輝指出，新加坡等主要轉運港碼頭使用率已逾9成；貨櫃航運呈「美強歐弱」，美線受惠補庫存需求及巴拿馬運河限航，陽明預期美東線第4季運價維持高檔，歐線第4季運價偏低但仍屬健康水準。"}, {"no": 4, "title": "〈財報〉機票都漲價還不夠！達美航空Q3獲利遭油價拖累 全年財測大砍逾兩成", "date": "2026-10-09", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈財報〉機票都漲價還不夠！達美航空Q3獲利遭油價拖累 全年財測大砍逾兩成", "url": "https://tw.stock.yahoo.com/news/%E8%B2%A1%E5%A0%B1-%E6%A9%9F%E7%A5%A8%E9%83%BD%E6%BC%B2%E5%83%B9%E9%82%84%E4%B8%8D%E5%A4%A0-%E9%81%94%E7%BE%8E%E8%88%AA%E7%A9%BAq3%E7%8D%B2%E5%88%A9%E9%81%AD%E6%B2%B9%E5%83%B9%E6%8B%96%E7%B4%AF-%E5%85%A8%E5%B9%B4%E8%B2%A1%E6%B8%AC%E5%A4%A7%E7%A0%8D%E9%80%BE%E5%85%A9%E6%88%90-122003059.html", "summary": "達美航空公布第三季財報，受美伊戰爭推升航空燃油價格拖累，獲利不如預期並首度下修全年展望，全年調整後每股獲利預估降為5.10至5.60美元，低於7月預估的6.50至7.50美元；今年燃油支出預計較2025年增加60億美元。第三季調整後營收年增約16%至176億美元，每股獲利1.72美元，盤前股價下跌3.5%。"}, {"no": 5, "title": "印度力拚海事產業稱霸全球 2047年前投資26兆元【專訪】", "date": "2026-10-09", "map": "https://www.google.com/maps/search/?api=1&query=New%20Delhi%2C%20India", "source_name": "中央社：印度力拚海事產業稱霸全球 2047年前投資26兆元【專訪】", "url": "https://www.cna.com.tw/news/aopl/202610090222.aspx", "summary": "印度港口、航運與水道部部長索諾渥接受中央社專訪表示，印度希望在2047年前成為全球海事產業超級大國，將投入80兆盧比（約新台幣26.4兆元）健全造船、船舶維修、港口營運等相 E5%8A%A0%E7%A2%BC%E7%9A%84%E5%A5%BD%E6%A9%9F%E6%9C%83-084700463.html", "summary": "瑞銀策略師斯塔諾沃表示，美國實際殖利率高檔、美元堅挺，金價短期可能回落至每盎司4000美元附近，屆時將提供加碼機會；周五晚間現貨黃金約4190美元。瑞銀維持全年央行購金750至1000噸預估，並預測今年12月金價達4600美元，2027年3月至5000美元、6月5200美元、9月5400美元，建議黃金配置比例維持在中個位數。"}, {"no": 3, "title": "〈貴金屬盤後〉逢低買盤承接 黃金觸及一周高點、周漲逾1%", "date": "2026-10-10", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈貴金屬盤後〉逢低買盤承接 黃金觸及一周高點、周漲逾1%", "url": "https://tw.stock.yahoo.com/news/%E8%B2%B4%E9%87%91%E5%B1%AC%E7%9B%A4%E5%BE%8C-%E9%80%A2%E4%BD%8E%E8%B2%B7%E7%9B%A4%E6%89%BF%E6%8E%A5-%E9%BB%83%E9%87%91%E8%A7%B8%E5%8F%8A-%E5%91%A8%E9%AB%98%E9%BB%9E-%E5%91%A8%E6%BC%B2%E9%80%BE1-232209479.html", "summary": "黃金9日連二漲並觸及一周高點，現貨黃金上漲1.5%報每盎司4194.36美元，美國黃金期貨收高1.4%報4216.3美元，本周上漲約1.3%。CME FedWatch顯示10月升息機率為19%，截至12月至少升息1碼機率為84%。現貨白銀上漲2.4%報60.77美元，白金上揚3.1%報1685.64美元，鈀金上漲2.1%報1146.39美元。"}, {"no": 4, "title": "金價拚反攻 Q4挑戰5,000美元 今年上演雲霄飛車行情", "date": "2026-10-10", "map": "", "source_name": "Yahoo股市（聯合新聞網）：金價拚反攻 Q4挑戰5,000美元 今年上演雲霄飛車行情", "url": "https://tw.stock.yahoo.com/news/%E9%87%91%E5%83%B9%E6%8B%9A%E5%8F%8D%E6%94%BB-q4%E6%8C%91%E6%88%B05-000%E7%BE%8E%E5%85%83-%E4%BB%8A%E5%B9%B4%E4%B8%8A%E6%BC%94%E9%9B%B2%E9%9C%84%E9%A3%9B%E8%BB%8A%E8%A1%8C%E6%83%85-215110489.html", "summary": "國際金價今年上半年一度逼近每英兩5,600美元歷史天價，年中跌破4,000美元，9月受聯準會升息預期衝擊再度重摔，目前在4,100美元附近震盪。渣打銀行看好3個月及12個月目標價分別為4,750美元及5,000美元；台北市金銀珠寶公會副理事長石文信預期年底金價有機會回升到4,900美元，並觀察到部分投資人扭轉「賣金換股」潮。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "跟進超微腳步！華碩、微星顯卡 本季傳漲價", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：跟進超微腳步！華碩、微星顯卡 本季傳漲價", "url": "https://tw.news.yahoo.com/%E8%B7%9F%E9%80%B2%E8%B6%85%E5%BE%AE%E8%85%B3%E6%AD%A5-%E8%8F%AF%E7%A2%A9-%E5%BE%AE%E6%98%9F%E9%A1%AF%E5%8D%A1-%E6%9C%AC%E5%AD%A3%E5%82%B3%E6%BC%B2%E5%83%B9-223210435.html", "summary": "市場傳出超微已通知品牌合作夥伴，顯示卡產品自10月1日起全球統一漲價，主因VRAM及晶圓代工成本上漲，平均漲幅約一成，華碩、微星、技嘉等顯卡廠預期本季跟進調漲，為超微顯卡今年來第三波漲價。外媒統計過去一年輝達RTX 50系列顯卡在德國價格漲幅高達66%，超微46%、英特爾38%。"}, {"no": 2, "title": "美國啟動337調查鴻海台達電廣達入列 業者：依程序積極應對", "date": "2026-10-11", "map": "", "source_name": "中央社：美國啟動337調查鴻海台達電廣達入列 業者：依程序積極應對", "url": "https://www.cna.com.tw/news/afe/202610110175.aspx", "summary": "美國國際貿易委員會（USITC）9日決定就特定垂直電力傳輸系統、零組件及配置系統的運算設備啟動關稅法337條款調查，鴻海、台達電、廣達均列入，案件源自美國Vicor Corporation的專利侵權主張。鴻海表示尚處立案初期，USITC未作出實質認定，初步評估未對生產營運、出貨及客戶合作造成重大影響；台達電、廣達均稱產品未受影響。"}, {"no": 3, "title": "美國酒店業住房率、房價雙漲 專家憂通膨與川普政策成潛在逆風", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（商傳媒）：美國酒店業住房率、房價雙漲 專家憂通膨與川普政策成潛在逆風", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E5%9C%8B%E9%85%92%E5%BA%97%E6%A5%AD%E4%BD%8F%E6%88%BF%E7%8E%87-%E6%88%BF%E5%83%B9%E9%9B%99%E6%BC%B2-%E5%B0%88%E5%AE%B6%E6%86%82%E9%80%9A%E8%86%A8%E8%88%87%E5%B7%9D%E6%99%AE%E6%94%BF%E7%AD%96%E6%88%90%E6%BD%9B%E5%9C%A8%E9%80%86%E9%A2%A8-074912741.html", "summary": "協星集團數據顯示，截至10月3日當週美國酒店業住房率67.2%、年增5.5%，平均每日房價172.38美元、年增7%，每間可銷售客房營收115.84美元、年增12.9%；佛州邁阿密房價年增23.5%，拉斯維加斯則全面下滑。經濟學家鮑莫爾點出2027年三大風險：柴油等能源價格飆升（零售柴油每加侖6.20美元）、消費支出放緩及川普政策不確定性。"}, {"no": 4, "title": "AI掀PCB大升級 電路板展聚焦先進封裝與玻璃基板", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8D%97%E6%B8%AF%E5%B1%95%E8%A6%BD%E9%A4%A8%E4%B8%80%E9%A4%A8", "source_name": "中央社：AI掀PCB大升級 電路板展聚焦先進封裝與玻璃基板", "url": "https://www.cna.com.tw/news/afe/202610110030.aspx", "summary": "AI算力需求推動PCB材料、製程到封裝架構全面革新。第27屆台灣電路板產業國際展覽會（TPCA Show 2026）將於10月20日至22日在南港展覽館一館登場，匯聚超過680個國際品牌、逾1840個攤位，預估吸引全球7萬人次買主，並設先進封裝主題專區；玻璃核心被視為次世代高階載板重要方向，但仍處技術驗證階段。"}, {"no": 5, "title": "造紙業第4季迎旺季 需求溫和回升原料成本為變數", "date": "2026-10-10", "map": "", "source_name": "中央社：造紙業第4季迎旺季 需求溫和回升原料成本為變數", "url": "https://www.cna.com.tw/news/afe/202610100041.aspx", "summary": "造紙業進入第4季傳統旺季，永豐餘表示紙箱及工業用紙需求平穩、客戶分批補庫；正隆看台灣第4季出貨略優於第3季，越南需求暢旺。華紙指9月短纖紙漿每噸上調20美元，為今年先前累計下跌約70美元後回升，紙價第4季具調整機會。榮成9月營收47.9億元、年增25.3%，但單月營業利益虧損0.53億元。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "川普和普丁達成柴油協議 美國參議員批違法", "date": "2026-10-12", "map": "", "source_name": "中央社：川普和普丁達成柴油協議 美國參議員批違法", "url": "https://www.cna.com.tw/news/aopl/202610120008.aspx", "summary": "美國7位跨黨派聯邦參議員發表聯合聲明，質疑川普允許俄羅斯柴油出口的協議是否合法，指國會在2022年已明確禁止進口俄羅斯能源，且行政部門未依法與國會諮商。川普9日宣布與普丁達成協議，俄羅斯將向美國和全球市場供應柴油，以換取美國暫時放寬制裁，引來烏克蘭、歐盟與多位美國國會議員強烈反彈。"}, {"no": 2, "title": "伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "date": "2026-10-12", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "中央社：伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "url": "https://www.cna.com.tw/news/aopl/202610120005.aspx", "summary": "伊朗最高國家安全委員會秘書雷札伊表示，美國對伊朗提出重啟荷莫茲海峽7項條件的回應「不足」，在條件達成前，海峽將不會對美國開放、也不會展開協商。伊朗曾在聯合國大會期間提案，只要條件滿足，荷莫茲海峽航運可望於7天內恢復正常，美國後來透過調解方卡達回應，雷札伊稱美方已接受部分條件但其餘仍不明確。"}, {"no": 3, "title": "川普宣布俄烏同意能源停火 澤倫斯基：俄續攻擊、烏等待細節", "date": "2026-10-12", "map": "", "source_name": "中央社：川普宣布俄烏同意能源停火 澤倫斯基：俄續攻擊、烏等待細節", "url": "https://www.cna.com.tw/news/aopl/202610120004.aspx", "summary": "美國總統川普宣布俄羅斯與烏克蘭同意能源停火，烏克蘭總統澤倫斯基表示支持此一協議並正等待美方提供細節，但指出俄軍仍持續攻擊烏克蘭能源設施。他在Telegram貼文表示「烏克蘭支持停火，重要的是俄羅斯也能支持」，並已就此與北約秘書長呂特、加拿大總理卡尼和芬蘭總統史塔布討論。"}, {"no": 4, "title": "油價再漲破百美元不合理？ 富蘭克林透露 中東石油出口已回到2025年日均水準", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（中時新聞網）：油價再漲破百美元不合理？ 富蘭克林透露 中東石油出口已回到2025年日均水準", "url": "https://tw.stock.yahoo.com/news/%E6%B2%B9%E5%83%B9%E5%86%8D%E6%BC%B2%E7%A0%B4%E7%99%BE%E7%BE%8E%E5%85%83%E4%B8%8D%E5%90%88%E7%90%86-%E5%AF%8C%E8%98%AD%E5%85%8B%E6%9E%97%E9%80%8F%E9%9C%B2-%E4%B8%AD%E6%9D%B1%E7%9F%B3%E6%B2%B9%E5%87%BA%E5%8F%A3%E5%B7%B2%E5%9B%9E%E5%88%B02025%E5%B9%B4%E6%97%A5%E5%9D%87%E6%B0%B4%E6%BA%96-103431799.html", "summary": "富蘭克林證券投顧引述報告指出，中東石油出口已回到每日2330萬桶，與2025年每日2310萬桶日均量相當，與荷莫茲海峽運輸增加有關，但成品油供應仍不足、能源設施再遭攻擊風險未消除，布蘭特原油仍在100美元之上。摩爾投顧分析師謝晨彥表示中東原油出口已回到戰前94%，明年通膨壓力可望趨緩，甚至可能迎來降息機會。"}, {"no": 5, "title": "台塑石化：12日起汽柴油不漲價", "date": "2026-10-11", "map": "", "source_name": "中央社：台塑石化：12日起汽柴油不漲價", "url": "https://www.cna.com.tw/news/afe/202610110112.aspx", "summary": "台塑石化網站資料顯示，加盟加油站10月12日凌晨1時起參考零售價維持不變，92無鉛汽油每公升新台幣31.2元、95+無鉛汽油32.7元、98無鉛汽油34.7元、超級柴油29.7元；自9月14日調漲汽油價格後，已連續4週未調整油價。"}]}], "warnings": [], "day": "2026-10-12"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-07 至 2026-10-09）", "compiled": "2026-10-09 00:52（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件", "note": "航運類4則、Currencies類4則、Commodities類4則（近3日符合條件且來源可查證之新聞不足），其餘各類各5則，無空缺類別；美股與歐股8日收盤行情於整理時尚未發布，美股以開盤行情列入，且尚無10月9日發布之符合新聞；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "格芯將生產關鍵AI晶片零組件 供台積電使用", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=GlobalFoundries%20Fab%208%2C%20Malta%2C%20NY", "source_name": "中央社：格芯將生產關鍵AI晶片零組件 供台積電使用", "url": "https://www.cna.com.tw/news/aopl/202610080370.aspx", "summary": "美國晶片製造商格芯表示，已與台積電達成價值20億美元、為期5年的協議，將由紐約州馬爾他（Malta）廠房擴大產能，為台積電生產矽中介層（silicon interposer）。這款零組件放置於先進AI封裝內部的處理器與記憶體晶片下方，有助兩者進行高速傳輸與通訊，是AI晶片的關鍵零組件。"}, {"no": 2, "title": "聯發科9月營收月減13.69% 第3季表現優於預期", "date": "2026-10-08", "map": "", "source_name": "中央社：聯發科9月營收月減13.69% 第3季表現優於預期", "url": "https://www.cna.com.tw/news/afe/202610080279.aspx", "summary": "IC設計廠聯發科自結9月營收新台幣553.99億元，較8月歷史新高下滑13.69%，但年增1.97%；第3季營收1680.58億元，季增10.43%，優於先前預估的1522億至1598億元。法人指出旗艦手機晶片放量是主因；聯發科首款AI加速器特殊應用晶片（ASIC）預計第4季量產，全年資料中心營收可望超過20億美元。"}, {"no": 3, "title": "合晶科技4度申請回台方案 砸逾178億擴大中科二林園區投資", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E7%A7%91%E4%BA%8C%E6%9E%97%E5%9C%92%E5%8D%80", "source_name": "中央社：合晶科技4度申請回台方案 砸逾178億擴大中科二林園區投資", "url": "https://www.cna.com.tw/news/afe/202610080208.aspx", "summary": "投資台灣事務所通過3家企業擴大投資，全球前10大矽晶圓供應商合晶科技第4度申請「台商回台方案」，規劃投資約新台幣178.8億元，於中科二林園區建置新產能並擴大廠區，新廠將導入AI建立製程數據分析與監測機制，並設置太陽能發電設備，提升台灣半導體供應鏈韌性；PCB廠晟鈦也將投資約1.8億元擴增智慧化產線。"}, {"no": 4, "title": "台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "date": "2026-10-08", "map": "", "source_name": "中央社：台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "url": "https://www.cna.com.tw/news/afe/202610080157.aspx", "summary": "台積電公布9月營收新台幣5118.57億元，月減0.6%、年增54.6%，創歷年同期新高；第3季營收1兆4942.43億元，季增17.62%並創歷史新高，超越公司原先財測。法人指出AI需求強勁與智慧手機新機備貨是主要動力，台積電將於10月15日召開法說會，市場關注資本支出與先進製程進度。"}, {"no": 5, "title": "家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "date": "2026-10-08", "map": "", "source_name": "中央社：家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "url": "https://www.cna.com.tw/news/afe/202610080043.aspx", "summary": "傳載方案商家登自結9月營收9.94億元，月增18.4%、年增67.74%，創歷史新高，第3季營收27.05億元同創單季新高。家登表示已接獲韓系客戶先進封裝載具訂單，預計明年出貨並在未來2年逐步放量，加上極紫外光光罩盒（EUV POD）出貨增長，將挹注中長期成長動能。"}]}, {"name": "AI", "items": [{"no": 1, "title": "緯創英業達第3季營收創新高 和碩9月歷年最旺", "date": "2026-10-08", "map": "", "source_name": "中央社：緯創英業達第3季營收創新高 和碩9月歷年最旺", "url": "https://www.cna.com.tw/news/afe/202610080358.aspx", "summary": "受惠AI伺服器與季底拉貨，緯創9月營收約新台幣3808.06億元、年增87.2%，第3季營收1.15兆元年增逾1倍；英業達9月營收986.36億元年增62.9%，第3季2720.94億元創單季新高；和碩9月營收2147.53億元年增86.9%，創單月新高。緯創與英業達均預期第4季AI伺服器表現優於第3季。"}, {"no": 2, "title": "大立光衝刺CPO 林恩平：FA通過認證FAU拚明年量產", "date": "2026-10-08", "map": "", "source_name": "中央社：大立光衝刺CPO 林恩平：FA通過認證FAU拚明年量產", "url": "https://www.cna.com.tw/news/afe/202610080326.aspx", "summary": "大立光董事長林恩平表示，共同封裝光學（CPO）用光纖陣列（FA）已通過客戶認證，預計2027年第2季底建置產能，光纖陣列單元（FAU）有望2027年下半年量產。大立光第3季毛利率42.2%，季減7.22個百分點，為2013年第1季以來新低，稅後淨利51.82億元、每股盈餘39.62元，並預估11月拉貨動能開始下滑。"}, {"no": 3, "title": "光寶科第3季營收574億年增28% 創2021年轉型後新高", "date": "2026-10-08", "map": "", "source_name": "中央社：光寶科第3季營收574億年增28% 創2021年轉型後新高", "url": "https://www.cna.com.tw/news/afe/202610080306.aspx", "summary": "光寶科公布9月營收新台幣188.48億元，年增22.15%；第3季營收574.46億元，年增27.97%，創2021年啟動轉型策略以來的單季新高，前9月營收1535.58億元年增26.15%。光寶科表示，主要受惠AI與雲端高階伺服器電源、電池備援電力模組（BBU）及高階光電半導體需求強勁，9月雲端及物聯網部門營收年增逾5成。"}, {"no": 4, "title": "聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "date": "2026-10-08", "map": "", "source_name": "中央社：聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "url": "https://www.cna.com.tw/news/afe/202610080183.aspx", "summary": "電子通路商聯強9月營收新台幣903.09億元，年增1.58倍、月增21.7%，大幅超越6月所創紀錄並改寫歷史新高；第3季營收2368.64億元同創新高，前9月營收年增97.96%。聯強表示主要受惠AI建置熱潮帶動相關產品需求，AI資本支出正由大型雲端業者擴散至一般企業。"}, {"no": 5, "title": "受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "date": "2026-10-08", "map": "", "source_name": "中央社：受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "url": "https://www.cna.com.tw/news/ait/202610080046.aspx", "summary": "三星電子預估第3季營業利益達107.4兆韓元，年增782.5%，營收預計年增127%至195兆韓元，可望成為韓國首家單季營業利益突破100兆韓元的企業。AI資料中心快速擴張帶動先進記憶體需求，全球供應短缺持續加劇，分析師看好三星擴產HBM4將有助迅速提高市占率。"}]}, {"name": "金融", "items": [{"no": 1, "title": "國銀8月放款增額3627億元 創史上同期第2高", "date": "2026-10-08", "map": "", "source_name": "中央社：國銀8月放款增額3627億元 創史上同期第2高", "url": "https://www.cna.com.tw/news/afe/202610080359.aspx", "summary": "金管會公布本國銀行8月底放款餘額新台幣49兆2155億元，月增3627億元，增額創歷年同期第2高，主因出口暢旺、備貨購料等營運資金需求強勁；逾放比率0.14%與7月持平。8月底存款餘額月增8382億元創同期新高，整體國銀前8月稅前盈餘4853.7億元，同樣創歷年同期新高。"}, {"no": 2, "title": "金管會：前8月信用卡簽帳金額逾3.7兆 創同期新高", "date": "2026-10-08", "map": "", "source_name": "中央社：金管會：前8月信用卡簽帳金額逾3.7兆 創同期新高", "url": "https://www.cna.com.tw/news/afe/202610080285.aspx", "summary": "金管會表示，8月信用卡簽帳金額新台幣4326億元，為歷年同月新高，前8月累計3兆7639億元，年增14.8%並創史上同期新高，主因國內經濟成長、民眾購買力提升。8月電子支付使用者約4189萬人，受惠業者推出消費與乘車碼回饋活動，代理收付實質交易金額約341.3億元，創歷年單月新高。"}, {"no": 3, "title": "金管會：開放高雄專區財管保險商品 落地全台", "date": "2026-10-08", "map": "", "source_name": "中央社：金管會：開放高雄專區財管保險商品 落地全台", "url": "https://www.cna.com.tw/news/afe/202610080252.aspx", "summary": "金管會表示，保險業者在亞洲資產管理中心高雄專區試辦銷售、不適用死亡給付對保單價值準備金最低比率規範的人壽保險商品已達試辦效益，因此修正相關規定，即日起10家業者可在專區外銷售，等於讓這項財富管理保險商品落地全台；金管會提醒客戶投保前應審慎了解商品特性與風險。"}, {"no": 4, "title": "黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "date": "2026-10-08", "map": "", "source_name": "中央社：黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "url": "https://www.cna.com.tw/news/afe/202610080189.aspx", "summary": "玉山金董事長黃男州表示，企業投資增加與股市投資借款增多，使近期市場資金趨緊，銀行存放款利率都有往上壓力。他認為若台美息差過大恐造成資金外流，判斷央行12月理監事會有可能「微幅升息」，年底前升息半碼的機會「應該是有的」，並建議有房貸需求者提前作業。"}, {"no": 5, "title": "台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "date": "2026-10-08", "map": "", "source_name": "中央社：台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "url": "https://www.cna.com.tw/news/afe/202610080060.aspx", "summary": "台灣金聯與合庫銀簽署續建資金承諾業務合作意向書，合庫銀准貸的建商可向台灣金聯申請續建資金承諾，額度以營造成本3成為限；若因營建工料上漲或預售不如預期出現資金缺口，可在額度內動用續建資金，不必等停工3個月才啟動，以避免爛尾樓發生。"}]}, {"name": "航運", "items": [{"no": 1, "title": "客貨運需求強勁 華航長榮航前3季營收雙創新高", "date": "2026-10-08", "map": "", "source_name": "中央社：客貨運需求強勁 華航長榮航前3季營收雙創新高", "url": "https://www.cna.com.tw/news/afe/202610080349.aspx", "summary": "受惠AI伺服器與半導體貨運需求強勁，以及中秋連假帶動旅運淡季不淡，華航9月合併營收新台幣209.33億元年增31.86%，其中貨運收入年增41.82%，前3季營收1859.2億元創新高；長榮航9月合併營收207.49億元年增32.86%，前9月1943.8億元創同期新高；台灣虎航9月營收17.39億元年增36%。"}, {"no": 2, "title": "長榮：旺季拚一路到年底 美國線沒有悲觀理由", "date": "2026-10-08", "map": "", "source_name": "中央社：長榮：旺季拚一路到年底 美國線沒有悲觀理由", "url": "https://www.cna.com.tw/news/afe/202610080235.aspx", "summary": "長榮海運9月合併營收新台幣497.11億元，年增63.75%。總經理吳光輝在法說會表示，今年旺季提早且延續，11月前載貨狀況非常樂觀，第4季可望比去年同期微幅成長，運價呈「美線強、歐線弱」，以美國線來說春節前看不出悲觀理由；長榮海運船隊242艘、運能204萬TEU，規劃2030年擴至約290艘、274萬TEU。"}, {"no": 3, "title": "荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%8D%B7%E8%8E%AB%E8%8C%B2%E6%B5%B7%E5%B3%BD", "source_name": "中央社：荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "url": "https://www.cna.com.tw/news/aopl/202610080137.aspx", "summary": "根據海事安全消息人士數據，9月28日至10月5日荷莫茲海峽周邊至少有12艘原油、液化天然氣和液化石油氣油輪遇襲，為美伊2月28日開戰以來單週最多。戰火令油輪一船難求，托克集團租用超級油輪Alexandros號的租金高達7600萬美元，遠高於戰前約700萬至1000萬美元水準。"}, {"no": 4, "title": "重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Fujairah", "source_name": "中央社：重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "url": "https://www.cna.com.tw/news/aopl/202610070172.aspx", "summary": "金融時報報導，伊朗加強攻擊荷莫茲海峽船隻，波灣船東以每月約10萬美元薪資及每趟5萬美元獎金吸引油輪船長出航。行經該水道的油輪運費本週達每天130萬美元新高，去年同期僅約2萬至5萬美元；船東另須負擔船體價值6%至10%的戰爭保險費，部分原油改在富查伊哈外海轉運。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "國際油價升、美債殖利率徘徊高點 華爾街股市開低", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=New%20York%20Stock%20Exchange", "source_name": "中央社：國際油價升、美債殖利率徘徊高點 華爾街股市開低", "url": "https://www.cna.com.tw/news/afe/202610080371.aspx", "summary": "國際油價飆升之際，美國公債殖利率也徘徊在多年高點附近，加深投資人對通膨的疑慮，華爾街股市8日開盤走低。道瓊工業指數下跌178.5點或0.37%，報51001.38點；標準普爾500指數下滑28.9點或0.37%，報7772.87點；那斯達克指數下挫135.05點或0.49%，報27403.64點。"}, {"no": 2, "title": "台股週漲837點 上市公司總市值衝破160兆", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：台股週漲837點 上市公司總市值衝破160兆", "url": "https://www.cna.com.tw/news/afe/202610080277.aspx", "summary": "台股本週因國慶連假僅開盤4天，6日盤中最高衝上49968.92點創歷史新高，8日以49313.44點作收，週漲837.70點或1.73%，週線連4紅。證交所統計上市公司總市值達新台幣161兆3576億元，衝破160兆元大關；本週塑膠類指數大漲16.80%居冠，航運類下跌1.53%，全體上市股票成交金額3兆8507億元。"}, {"no": 3, "title": "東證指數權重調整引發拋售 日股連2跌", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E4%BA%AC%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：東證指數權重調整引發拋售 日股連2跌", "url": "https://www.cna.com.tw/news/afe/202610080184.aspx", "summary": "日本股市連續第2個交易日收跌，主因東證指數調整成分股權重，引發市場拋售權重即將被調降的個股。日經225指數下跌993.60點或1.42%，收在69042.11點；東證股價指數下跌62.65點或1.51%，收在4091.46點，兩大指數同步走弱。"}, {"no": 4, "title": "科技股弱勢台股收跌492.93點 週線連4紅", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：科技股弱勢台股收跌492.93點 週線連4紅", "url": "https://www.cna.com.tw/news/afe/202610080161.aspx", "summary": "台股下跌492.93點，收在49313.44點，成交值新台幣8696.96億元，但本週累計上漲837.7點，週線連4紅。台積電跌35元、聯發科挫145元，金融股指數跌1.68%；防疫概念股逆勢強攻漲停，股后川湖以跌停作收，台股千金股陣容縮減至55檔。"}, {"no": 5, "title": "美債殖利率再走高 美股全線收黑", "date": "2026-10-08", "map": "", "source_name": "中央社：美債殖利率再走高 美股全線收黑", "url": "https://www.cna.com.tw/news/afe/202610080015.aspx", "summary": "美國長天期國債殖利率重新走高，再度引發市場對通膨及債務攀升的擔憂，美股主要指數7日全線收黑。道瓊工業指數下跌341.41點或0.66%，收51179.87點；標普500指數下挫0.22%，收7801.77點；那斯達克指數下滑0.22%；費城半導體指數挫跌1.15%。"}]}, {"name": "Futures", "items": [{"no": 1, "title": "10月台股期指跌619點", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E6%9C%9F%E8%B2%A8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：10月台股期指跌619點", "url": "https://www.cna.com.tw/news/afe/202610080169.aspx", "summary": "台股終場跌492.93點，收49313.44點；10月台指期以49349點作收，下跌619點，與現貨相較正價差35.56點，成交3萬5892口；11月期貨收49546點，跌598點。台灣期貨交易所訂定近2個月契約開盤參考價，10月期貨49968點、11月期貨50144點。"}, {"no": 2, "title": "10月電子期金融期齊跌", "date": "2026-10-08", "map": "", "source_name": "中央社：10月電子期金融期齊跌", "url": "https://www.cna.com.tw/news/afe/202610080170.aspx", "summary": "台北股市8日下跌492.93點，10月電子期收3136.25點，下跌48.15點，成交44口，與電子現貨3134.58點相較正價差1.67點；10月金融期收3551.6點，下跌56.2點，正價差16.33點，電子與金融兩大類股期貨同步走弱。"}, {"no": 3, "title": "台指期夜盤下跌 法人：台股可能高檔震盪", "date": "2026-10-08", "map": "", "source_name": "中央社：台指期夜盤下跌 法人：台股可能高檔震盪", "url": "https://www.cna.com.tw/news/afe/202610080025.aspx", "summary": "美股主要指數全面收低，費城半導體指數下跌逾1%，台積電ADR跌2.09%，台指期夜盤下挫375點。法人表示台股7日小跌16.18點，收49806.37點，加上國慶連假即將來臨，台股8日可能維持高檔震盪，並留意美光桃園廠工會取得罷工權、國巨與廣達營收創高等訊息。"}, {"no": 4, "title": "10月電子期跌 金融期漲", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E6%9C%9F%E8%B2%A8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：10月電子期跌 金融期漲", "url": "https://www.cna.com.tw/news/afe/202610070146.aspx", "summary": "台北股市7日下跌16.18點，收49806.37點。10月電子期收3184.55點，下跌18.80點，與電子現貨3168.56點相較為正價差15.99點，成交35口；10月金融期則逆勢收3607.80點，上漲28點，正價差11.95點，電子期與金融期當日走勢分歧。"}, {"no": 5, "title": "10月台指期跌103點", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E6%9C%9F%E8%B2%A8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：10月台指期跌103點", "url": "https://www.cna.com.tw/news/afe/202610070144.aspx", "summary": "台北股市7日終場跌16.18點，收49806.37點；10月台指期以49979點作收，下跌103點，與現貨相較正價差172.63點。台灣期貨交易所為近2個月指數期貨契約訂定開盤參考價，10月期貨為50082點、11月期貨為50292點。"}]}, {"name": "Rates & Bonds", "items": [{"no": 1, "title": "法國研議增發短期公債 因應債市震盪", "date": "2026-10-08", "map": "", "source_name": "中央社：法國研議增發短期公債 因應債市震盪", "url": "https://www.cna.com.tw/news/aopl/202610080019.aspx", "summary": "華爾街日報指出，法國公債拋售潮近週加劇，長期借貸成本逼近2002年以來最高，法國正研議擴大發行短期公債。7日法國10年期公債殖利率升至4.91%、2年期升至3.61%，利差擴大至約1.3個百分點；財長勒斯鳩坦言30年期公債需求「目前確實較棘手」。"}, {"no": 2, "title": "聯準會公布9月會議紀要 10月可能不動12月再升息", "date": "2026-10-08", "map": "", "source_name": "中央社：聯準會公布9月會議紀要 10月可能不動12月再升息", "url": "https://www.cna.com.tw/news/afe/202610080010.aspx", "summary": "聯準會公布9月會議紀要，官員一致支持9月升息以因應持續的通膨壓力，多數官員預估今年剩下兩次會議將再升息一次，但紀要未顯示10月有迫切升息必要，多位高層暗示可等到12月再行動。聯準會將於10月28日及12月9日舉行今年最後兩次利率決策會議。"}, {"no": 3, "title": "IMF總裁：殖利率狂飆、債務占比近100% 各國應節流", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E5%8A%A0%E5%9D%A1", "source_name": "中央社：IMF總裁：殖利率狂飆、債務占比近100% 各國應節流", "url": "https://www.cna.com.tw/news/afe/202610080007.aspx", "summary": "國際貨幣基金總裁喬治艾娃在新加坡表示，全球債務占GDP比重即將突破100%，伊朗戰爭推升能源價格，已將美、德、日10年期公債殖利率推至數十年高點且仍在攀升。她呼籲各國控制支出、推動財政整頓，並點名法國、義大利、葡萄牙與愛爾蘭特別容易受到衝擊。"}, {"no": 4, "title": "油價與各國債台高築夾擊 全球債市拋售潮再起", "date": "2026-10-08", "map": "", "source_name": "中央社：油價與各國債台高築夾擊 全球債市拋售潮再起", "url": "https://www.cna.com.tw/news/afe/202610080006.aspx", "summary": "全球債市7日再掀拋售潮，美國30年期公債殖利率盤中一度升至5.73%，創2002年以來最高；英國30年期公債殖利率一度達6.04%的28年新高，法國10年期升至4.87%。美國30年期固定房貸平均利率升至7.49%，市場關注美國財政部本週10年期與30年期公債標售承接情況。"}, {"no": 5, "title": "印度央行調高基準利率1碼 2023年以來首見升息", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Reserve%20Bank%20of%20India%20Mumbai", "source_name": "中央社：印度央行調高基準利率1碼 2023年以來首見升息", "url": "https://www.cna.com.tw/news/aopl/202610070300.aspx", "summary": "中東衝突加劇印度通膨並重創盧比，印度中央銀行印度儲備銀行6人小組一致表決，調高基準附買回利率1碼至5.50%，為2023年以來首次升息。印度央行自2月伊朗戰爭爆發以來按兵不動，此舉意味政策轉向，加入全球為抑制物價或提振本國貨幣而升息的行列。"}]}, {"name": "Currencies", "items": [{"no": 1, "title": "股匯雙挫 新台幣貶8分週線連2黑", "date": "2026-10-08", "map": "", "source_name": "中央社：股匯雙挫 新台幣貶8分週線連2黑", "url": "https://www.cna.com.tw/news/afe/202610080318.aspx", "summary": "中東緊張局勢升溫、美債殖利率衝高，加上聯準會會議紀錄偏鷹，熱錢大舉匯出，新台幣兌美元8日收31.875元，貶8分，週線連2跌。外資在國慶連假前賣超台股758.52億元，連3賣累計提款近千億元；新台幣盤中最低觸及31.94元、重貶逾1.4角，出口商拋匯加上央行調節後跌幅收斂，總成交金額放大至33.27億美元。"}, {"no": 2, "title": "菲律賓9月底外匯存底不足千億美元 創3年新低", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=Bangko%20Sentral%20ng%20Pilipinas", "source_name": "中央社：菲律賓9月底外匯存底不足千億美元 創3年新低", "url": "https://www.cna.com.tw/news/aopl/202610080176.aspx", "summary": "菲律賓中央銀行公布9月底外匯存底為999億9660萬美元，跌破1000億美元，創2023年9月以來3年新低，主因央行淨外匯操作、黃金及外幣資產估值下調，以及政府提領外幣存款償付外債。菲律賓披索兌美元9月15日曾觸及62.925披索的盤中歷史低點。"}, {"no": 3, "title": "美日近30年首度聯手支撐日圓，Fed紀錄揭7月干預使用美財政部資金", "date": "2026-10-08", "map": "", "source_name": "Yahoo股市（財訊快報）：美日近30年首度聯手支撐日圓，Fed紀錄揭7月干預使用美財政部資 0美元。"}, {"no": 3, "title": "〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "date": "2026-10-07", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "url": "https://tw.stock.yahoo.com/news/%E6%B8%A3%E6%89%93%E6%8A%95%E8%B3%87%E5%B1%95%E6%9C%9B-%E9%BB%83%E9%87%91%E6%98%8E%E5%B9%B4%E6%81%90%E9%A3%86%E8%87%B35-000%E7%BE%8E%E5%85%83-%E6%97%A5%E5%85%83%E8%BF%8E%E7%BE%8E%E6%97%A5%E5%88%A9%E5%B7%AE%E6%94%B6%E6%96%82%E4%B8%8A%E7%9C%8B153-091658645.html", "summary": "渣打銀行首席投資辦公室發布第4季展望，維持看多黃金，3個月及12個月目標價分別為每盎司4750美元及5000美元，理由是美元中期可能轉弱與新興市場央行持續增持黃金；原油方面，將西德州原油3個月價格預測上調至每桶100美元、12個月目標價上調至80美元。"}, {"no": 4, "title": "CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Chicago%20Board%20of%20Trade", "source_name": "Yahoo股市（財訊快報）：CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "url": "https://tw.stock.yahoo.com/news/cbot%E5%A4%A7%E8%B1%86%E6%9C%9F%E7%B4%84%E9%80%B1%E4%BA%8C%E6%BC%B21-74-%E7%8E%89%E7%B1%B3%E6%8F%9A2-16-ice%E7%B2%97%E7%B3%96%E5%86%8D%E5%89%B519%E5%80%8B%E6%9C%88%E9%AB%98%E9%BB%9E-235914413.html", "summary": "美國農產品期貨6日收高，CBOT 11月大豆期約漲1.74%至每蒲式耳13.03美元，12月玉米漲2.16%至5.08美元，12月小麥漲1.73%至7.0425美元，作物評級下降、收割進度落後及美元走弱支撐買氣；ICE粗糖盤中觸及每磅20.95美分，續創19個月新高。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "友達宸鴻9月營收持平 布局先進封裝進度受矚", "date": "2026-10-08", "map": "", "source_name": "中央社：友達宸鴻9月營收持平 布局先進封裝進度受矚", "url": "https://www.cna.com.tw/news/afe/202610080369.aspx", "summary": "友達9月自結合併營收新台幣234億元，月增1.3%、年減4.3%；宸鴻9月營收65.9億元，年增27.8%。面板與觸控廠積極轉型半導體先進封裝，友達在國際半導體展與康寧合作展出玻璃核心基板技術，宸鴻則鎖定AI高階ASIC所需的玻璃鑽孔（TGV）技術，市場關注友達10月17日30週年活動是否宣布新轉型成果。"}, {"no": 2, "title": "宏碁9月營收登14年同期新高 華碩創單月次高", "date": "2026-10-08", "map": "", "source_name": "中央社：宏碁9月營收登14年同期新高 華碩創單月次高", "url": "https://www.cna.com.tw/news/afe/202610080357.aspx", "summary": "電腦品牌廠宏碁9月合併營收新台幣347.37億元，年增17.6%、月增15.1%，創14年來同期新高，第3季營收918.22億元年增25.1%；華碩9月集團合併營收約972.43億元，年增17.7%，寫下單月歷史次高，第3季集團營收2763.3億元年增38%，部分伺服器專案配合客戶資料中心建置時程遞延至10月出貨。"}, {"no": 3, "title": "財部：出口迎輝煌時刻 第4季連破3關全年上看9千億美元", "date": "2026-10-08", "map": "", "source_name": "中央社：財部：出口迎輝煌時刻 第4季連破3關全年上看9千億美元", "url": "https://www.cna.com.tw/news/afe/202610080290.aspx", "summary": "財政部公布9月出口872.2億美元，創歷年單月新高，年增60.9%、連35紅，刷新史上最長上升週期；前9月累計6615.5億美元。統計處長蔡美娜表示，AI投資熱潮、電子零組件規格升級與新品鋪貨潮為主要支撐，非電子資通產品出口也年增25.4%，預估10月出口年增40%至44%，全年突破9000億美元機率相當高。"}, {"no": 4, "title": "9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "date": "2026-10-08", "map": "", "source_name": "中央社：9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "url": "https://www.cna.com.tw/news/afe/202610080079.aspx", "summary": "住展雜誌公布9月住展風向球續亮衰退黃藍燈，總分回升至36.1分，主因建商供給走強，預售案量升至700多億元。但來客與成交組數仍處谷底，待售案數增至1579案；住展指出股市磁吸資金、貸款不易及央行仍有升息可能，使北台灣房市買氣短期難解凍。"}, {"no": 5, "title": "被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "date": "2026-10-07", "map": "", "source_name": "中央社：被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "url": "https://www.cna.com.tw/news/afe/202610070138.aspx", "summary": "被動元件族群成為盤面焦點，華新科、光頡鎖漲停，國巨收647元漲3.5%，禾伸堂、立隆電、金山電同步大漲。市場分析指出，AI伺服器帶動積層陶瓷電容（MLCC）需求明顯成長，日韓大廠轉向板卡端小尺寸高容值產品，台廠可望受惠訂單外溢與漲價效應。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "美軍傳可能再空襲伊朗 國際油價勁揚5%", "date": "2026-10-08", "map": "", "source_name": "中央社：美軍傳可能再空襲伊朗 國際油價勁揚5%", "url": "https://www.cna.com.tw/news/afe/202610080343.aspx", "summary": "美國媒體指出，美軍可能在11月期中選舉前再度空襲伊朗，恐導致進一步原油供應中斷，國際油價8日大漲約5%。截至美東時間上午7時18分左右，紐約西德州中級原油11月交割價揚升4.42美元或5.01%，來到每桶92.70美元；布倫特原油12月交割價上漲5.00美元或4.99%，來到每桶105.20美元。"}, {"no": 2, "title": "中火燃氣二期環評遭撤 台電：盼儘速推動實現無煤目標", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E4%B8%AD%E7%99%BC%E9%9B%BB%E5%BB%A0", "source_name": "中央社：中火燃氣二期環評遭撤 台電：盼儘速推動實現無煤目標", "url": "https://www.cna.com.tw/news/afe/202610080304.aspx", "summary": "台北高等行政法院8日判決撤銷台中火力發電廠二期燃氣機組計畫的環評結論，環團呼籲台電進行較嚴格的二階環評，環境部表示不排除上訴。台電表示尊重判決，將待收到判決書後補充事證、釐清爭點，並強調二期燃氣機組是「增氣減煤」政策核心，也是台中電廠5至10號燃煤機組能否順利除役的關鍵。"}, {"no": 3, "title": "AI淨零／經部邀金融業訪金崙地熱案場 盼綠色融資支持地熱發電", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E6%9D%B1%20%E9%87%91%E5%B4%99%E5%9C%B0%E7%86%B1", "source_name": "中央社：AI淨零／經部邀金融業訪金崙地熱案場 盼綠色融資支持地熱發電", "url": "https://www.cna.com.tw/news/afe/202610080301.aspx", "summary": "經濟部邀集逾10家金融業者參訪台東金崙地熱案場，了解地熱從探勘、鑽井到發電的開發情形，盼加速綠色融資投入。該案場由環台能源集團投資興建，已完成鑽井與產能測試，正興建廠房與控制室，預計2027年初併網發電，發電後尾水將提供在地溫泉業者及農業乾燥使用；能源署並以地熱躉購費率提供穩定收入。"}, {"no": 4, "title": "離岸風電3-3僅2家投標 龔明鑫：待結果出爐再檢討", "date": "2026-10-08", "map": "", "source_name": "中央社：離岸風電3-3僅2家投標 龔明鑫：待結果出爐再檢討", "url": "https://www.cna.com.tw/news/afe/202610080259.aspx", "summary": "離岸風電區塊開發3-3期選商截止收件，僅哥本哈根基礎建設基金（CIP）與沃旭2家開發商、2個風場送件，獲選風場預計2030年至2031年完工併網，能源署將在今年底前完成選商與容量分配。經濟部長龔明鑫表示目前仍在審查期間，待結果出爐後再評論與檢討，並將持續了解外商與本土業者參與後續開發的意願。"}, {"no": 5, "title": "IEA成員國願釋出戰略儲備 油價微跌", "date": "2026-10-08", "map": "", "source_name": "中央社：IEA成員國願釋出戰略儲備 油價微跌", "url": "https://www.cna.com.tw/news/afe/202610080016.aspx", "summary": "國際油價7日劇烈震盪，盤中一度因傳出伊朗可能加劇在荷莫茲海峽的襲擊而飆升，但國際能源總署（IEA）表示成員國準備釋出更多戰略石油儲備後轉跌。紐約西德州中級原油下跌1.3%，收每桶88.28美元；倫敦布倫特原油下跌0.4%，收每桶100.20美元。"}]}], "warnings": [], "day": "2026-10-09"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-06 至 2026-10-08）", "compiled": "2026-10-08 15:33（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件", "note": "航運類3則、Commodities類4則（近3日符合條件且來源可查證之新聞不足），其餘9類各5則，無空缺類別；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "date": "2026-10-08", "map": "", "source_name": "中央社：台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "url": "https://www.cna.com.tw/news/afe/202610080157.aspx", "summary": "台積電公布9月營收新台幣5118.57億元，月減0.6%、年增54.6%，創歷年同期新高；第3季營收1兆4942.43億元，季增17.62%並創歷史新高，超越公司原先財測。法人指出AI需求強勁與智慧手機新機備貨是主要動力，台積電將於10月15日召開法說會，市場關注資本支出與先進製程進度。"}, {"no": 2, "title": "家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "date": "2026-10-08", "map": "", "source_name": "中央社：家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "url": "https://www.cna.com.tw/news/afe/202610080043.aspx", "summary": "傳載方案商家登自結9月營收9.94億元，月增18.4%、年增67.74%，創歷史新高，第3季營收27.05億元同創單季新高。家登表示已接獲韓系客戶先進封裝載具訂單，預計明年出貨並在未來2年逐步放量，加上極紫外光光罩盒（EUV POD）出貨增長，將挹注中長期成長動能。"}, {"no": 3, "title": "美光桃園廠工會取得罷工權 市調：DRAM產出添變數", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E7%81%A3%E7%BE%8E%E5%85%89%20%E6%A1%83%E5%9C%92%E5%BB%A0", "source_name": "中央社：美光桃園廠工會取得罷工權 市調：DRAM產出添變數", "url": "https://www.cna.com.tw/news/afe/202610070268.aspx", "summary": "台灣美光晶圓工會（桃園工會）宣布經會員投票取得罷工權，投票人數2012名，同意票1994張，總體同意比例達88.3%。集邦科技分析指出，美光桃園廠目前以生產DRAM為主，若實際發生罷工並影響工程師的設備維護與製程監控，可能使良率與穩定性下降，進而影響記憶體產出。"}, {"no": 4, "title": "東協財經／世界先進新加坡子公司決議辦理現金增資1億美元", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E5%8A%A0%E5%9D%A1", "source_name": "中央社：東協財經／世界先進新加坡子公司決議辦理現金增資1億美元", "url": "https://www.cna.com.tw/news/afe/202610073005.aspx", "summary": "世界先進代新加坡子公司VSMC公告，董事會決議辦理現金增資1億美元，以每股1美元發行1億股，全數由原股東認購。VSMC由世界先進與恩智浦（NXP）合資，持股分別為60%與40%，首座先進晶片廠已於9月28日啟用、新增產能全部售罄，預計2027年初開始量產。"}, {"no": 5, "title": "超微蘇姿丰訪台拜會台積電、鴻海等台廠 證實在台百億美元投資將加碼", "date": "2026-10-06", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E5%8C%97%E6%96%87%E8%8F%AF%E6%9D%B1%E6%96%B9%E9%85%92%E5%BA%97", "source_name": "中央社：超微蘇姿丰訪台拜會台積電、鴻海等台廠 證實在台百億美元投資將加碼", "url": "https://www.cna.com.tw/news/afe/202610060124.aspx", "summary": "超微（AMD）董事長暨執行長蘇姿丰旋風訪台，在台北文華東方酒店與供應商舉行閉門會議，並密集拜會鴻海、廣達、華碩、宏碁，下午前往新竹拜會台積電。她證實先前宣布在台投資100億美元的供應鏈計畫進度符合預期，且因AI運算需求暴增，超微已決定調高在台投資金額。"}]}, {"name": "AI", "items": [{"no": 1, "title": "聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "date": "2026-10-08", "map": "", "source_name": "中央社：聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "url": "https://www.cna.com.tw/news/afe/202610080183.aspx", "summary": "電子通路商聯強9月營收新台幣903.09億元，年增1.58倍、月增21.7%，大幅超越6月所創紀錄並改寫歷史新高；第3季營收2368.64億元同創新高，前9月營收年增97.96%。聯強表示主要受惠AI建置熱潮帶動相關產品需求，AI資本支出正由大型雲端業者擴散至一般企業。"}, {"no": 2, "title": "受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "date": "2026-10-08", "map": "", "source_name": "中央社：受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "url": "https://www.cna.com.tw/news/ait/202610080046.aspx", "summary": "三星電子預估第3季營業利益達107.4兆韓元，年增782.5%，營收預計年增127%至195兆韓元，可望成為韓國首家單季營業利益突破100兆韓元的企業。AI資料中心快速擴張帶動先進記憶體需求，全球供應短缺持續加劇，分析師看好三星擴產HBM4將有助迅速提高市占率。"}, {"no": 3, "title": "AI基建燒錢 博通、甲骨文、SpaceX尋求巨額債務融資", "date": "2026-10-08", "map": "", "source_name": "中央社：AI基建燒錢 博通、甲骨文、SpaceX尋求巨額債務融資", "url": "https://www.cna.com.tw/news/ait/202610080026.aspx", "summary": "華爾街日報報導，AI大廠正籌劃一系列巨額融資以支付運算硬體成本：博通籌劃逾500億美元融資用於OpenAI客製化AI晶片，甲骨文正與阿波羅及高盛洽談晶片採購融資，SpaceX也與貸款機構商議約400億美元融資購買輝達晶片，反映AI基礎設施建設成本持續攀升。"}, {"no": 4, "title": "廣達9月與第3季營收攀峰 AI新產品第4季小量出貨", "date": "2026-10-07", "map": "", "source_name": "中央社：廣達9月與第3季營收攀峰 AI新產品第4季小量出貨", "url": "https://www.cna.com.tw/news/afe/202610070289.aspx", "summary": "廣達受惠AI伺服器強勁動能，9月合併營收約3253億元，較8月減少23.3%、年增76.7%，續創歷年同期新高；第3季營收約1兆1155億元，創單季新高。廣達表示輝達GB300出貨穩定，為第4季主要動能，Vera Rubin新平台預計第4季小量出貨、明年第1季放量。"}, {"no": 5, "title": "AI晶片需求強勁 Marvell上修2028會計年度營收預測", "date": "2026-10-07", "map": "", "source_name": "中央社：AI晶片需求強勁 Marvell上修2028會計年度營收預測", "url": "https://www.cna.com.tw/news/ait/202610070150.aspx", "summary": "美滿電子（Marvell）將2028會計年度營收預測上修至約200億美元，優於分析師原先預期的182億美元，主因AI支出激增帶動客製化資料中心晶片需求；公司並預估2029會計年度客製化晶片營收將達120億美元，高於先前的100億美元，消息帶動股價勁揚約6%。"}]}, {"name": "金融", "items": [{"no": 1, "title": "黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "date": "2026-10-08", "map": "", "source_name": "中央社：黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "url": "https://www.cna.com.tw/news/afe/202610080189.aspx", "summary": "玉山金董事長黃男州表示，企業投資增加與股市投資借款增多，使近期市場資金趨緊，銀行存放款利率都有往上壓力。他認為若台美息差過大恐造成資金外流，判斷央行12月理監事會有可能「微幅升息」，年底前升息半碼的機會「應該是有的」，並建議有房貸需求者提前作業。"}, {"no": 2, "title": "台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "date": "2026-10-08", "map": "", "source_name": "中央社：台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "url": "https://www.cna.com.tw/news/afe/202610080060.aspx", "summary": "台灣金聯與合庫銀簽署續建資金承諾業務合作意向書，合庫銀准貸的建商可向台灣金聯申請續建資金承諾，額度以營造成本3成為限；若因營建工料上漲或預售不如預期出現資金缺口，可在額度內動用續建資金，不必等停工3個月才啟動，以避免爛尾樓發生。"}, {"no": 3, "title": "虛擬通貨公會加入金融總會 共37會員增進產業交流", "date": "2026-10-07", "map": "", "source_name": "中央社：虛擬通貨公會加入金融總會 共37會員增進產業交流", "url": "https://www.cna.com.tw/news/afe/202610070174.aspx", "summary": "台灣金融服務業聯合總會於6日理監事聯席會決議，通過中華民國虛擬通貨商業同業公會申請加入成為新會員，金融總會會員機構由36家增為37家，由虛擬通貨公會理事長鄭光泰擔任會員代表，未來將增進現有金融會員機構與虛擬資產產業之間的交流與合作。"}, {"no": 4, "title": "蔡明興揭富邦人壽資本適足率達177% 金管會：不符規定", "date": "2026-10-06", "map": "", "source_name": "中央社：蔡明興揭富邦人壽資本適足率達177% 金管會：不符規定", "url": "https://www.cna.com.tw/news/afe/202610060319.aspx", "summary": "保險業今年適用新一代清償能力制度（TIS），富邦金董事長蔡明興揭露富邦人壽TIS資本適足率達177%。金管會保險局表示此舉不符規定，在選擇性過渡措施下可揭露上限為目標資本適足率，富邦既揭露140%就應統一說明；若要揭露實際數值，可選擇脫離過渡措施。"}, {"no": 5, "title": "金管會擴大保險業投資健康事業範圍 不受業務結合限制", "date": "2026-10-06", "map": "", "source_name": "中央社：金管會擴大保險業投資健康事業範圍 不受業務結合限制", "url": "https://www.cna.com.tw/news/afe/202610060267.aspx", "summary": "因應超高齡社會，金管會發布令釋，將保險業可投資的健康福祉事業明定為5大類，包括健康管理及健康促進服務、健康醫療科技及數位應用、長期照顧及全齡友善服務等，並放寬須與保險業務結合的限制，未來保險業投資健檢中心等事業，服務對象將不限於保戶。"}]}, {"name": "航運", "items": [{"no": 1, "title": "荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%8D%B7%E8%8E%AB%E8%8C%B2%E6%B5%B7%E5%B3%BD", "source_name": "中央社：荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "url": "https://www.cna.com.tw/news/aopl/202610080137.aspx", "summary": "根據海事安全消息人士數據，9月28日至10月5日荷莫茲海峽周邊至少有12艘原油、液化天然氣和液化石油氣油輪遇襲，為美伊2月28日開戰以來單週最多。戰火令油輪一船難求，托克集團租用超級油輪Alexandros號的租金高達7600萬美元，遠高於戰前約700萬至1000萬美元水準。"}, {"no": 2, "title": "重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Fujairah", "source_name": "中央社：重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "url": "https://www.cna.com.tw/news/aopl/202610070172.aspx", "summary": "金融時報報導，伊朗加強攻擊荷莫茲海峽船隻，波灣船東以每月約10萬美元薪資及每趟5萬美元獎金吸引油輪船長出航。行經該水道的油輪運費本週達每天130萬美元新高，去年同期僅約2萬至5萬美元；船東另須負擔船體價值6%至10%的戰爭保險費，部分原油改在富查伊哈外海轉運。"}, {"no": 3, "title": "中菲行：AI半導體物流續強 美線艙位緊、急單海轉空", "date": "2026-10-06", "map": "https://www.google.com/maps/search/?api=1&query=%E5%B7%B4%E6%8B%BF%E9%A6%AC%E9%81%8B%E6%B2%B3", "source_name": "中央社：中菲行：AI半導體物流續強 美線艙位緊、急單海轉空", "url": "https://www.cna.com.tw/news/afe/202610060059.aspx", "summary": "中菲行9月合併營收36.5億元，年增47%，創2022年7月以來單月新高，其中海運營業額年增62.1%。中菲行指出AI半導體物流需求強勁，台灣及亞洲至美國航線艙位緊張、運價上升，海運延誤使急單轉向空運；亞歐線即期運價則走弱，巴拿馬運河因降雨不足調整通航名額，恐影響美東航線。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "科技股弱勢台股收跌492.93點 週線連4紅", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：科技股弱勢台股收跌492.93點 週線連4紅", "url": "https://www.cna.com.tw/news/afe/202610080161.aspx", "summary": "台股下跌492.93點，收在49313.44點，成交值新台幣8696.96億元，但本週累計上漲837.7點，週線連4紅。台積電跌35元、聯發科挫145元，金融股指數跌1.68%；防疫概念股逆勢強攻漲停，股后川湖以跌停作收，台股千金股陣容縮減至55檔。"}, {"no": 2, "title": "東證指數權重調整引發拋售 日股連2跌", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E4%BA%AC%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：東證指數權重調整引發拋售 日股連2跌", "url": "https://www.cna.com.tw/news/afe/202610080184.aspx", "summary": "日本股市連續第2個交易日收跌，主因東證指數調整成分股權重，引發市場拋售權重即將被調降的個股。日經225指數下跌993.60點或1.42%，收在69042.11點；東證股價指數下跌62.65點或1.51%，收在4091.46點，兩大指數同步走弱。"}, {"no": 3, "title": "美債殖利率再走高 美股全線收黑", "date": "2026-10-08", "map": "", "source_name": "中央社：美債殖利率再走高 美股全線收黑", "url": "https://www.cna.com.tw/news/afe/202610080015.aspx", "summary": "美國長天期國債殖利率重新走高，再度引發市場對通膨及債務攀升的擔憂，美股主要指數7日全線收黑。道瓊工業指數下跌341.41點或0.66%，收51179.87點；標普500指數下挫0.22%，收7801.77點；那斯達克指數下滑0.22%；費城半導體指數挫跌1.15%。"}, {"no": 4, "title": "中東局勢升溫 歐股收跌油價走高", "date": "2026-10-08", "map": "", "source_name": "中央社：中東局勢升溫 歐股收跌油價走高", "url": "https://www.cna.com.tw/news/afe/202610080003.aspx", "summary": "伊朗似乎擴大在荷莫茲海峽的攻擊行動，再度掀起市場對中東供應的疑慮，國際油價走高，拖累歐洲股市7日收跌。倫敦FTSE 100指數下跌0.79%，收10458.50點；法蘭克福DAX指數下挫1.35%，收25104.36點；巴黎CAC 40指數下滑1.22%，收7769.21點。"}, {"no": 5, "title": "台股逼近5萬點創多項紀錄現56千金 台積電續寫新猷", "date": "2026-10-06", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：台股逼近5萬點創多項紀錄現56千金 台積電續寫新猷", "url": "https://www.cna.com.tw/news/afe/202610060146.aspx", "summary": "台股盤中創歷史新高49968.92點、逼近5萬點大關，終場上漲110.51點，收49822.55點，續創收盤新高。台積電收2585元創新高，市值攻上67.03兆元，千元以上高價股增至56檔、追平歷史紀錄；法人指出台股短線進入「停看聽」，關注台積電9月營收表現。"}]}, {"name": "Futures", "items": [{"no": 1, "title": "10月台股期指跌619點", "date": "2026-10-08", "map": "https: BD%8E-021831702.html", "summary": "受強勢美元、美債殖利率飆升及聯準會9月會議紀要偏鷹派影響，現貨黃金7日盤中一度跌至每盎司4096.13美元，創8月上旬以來最低。CME FedWatch顯示市場普遍預期10月按兵不動，但12月升息機率達84%至88%；分析師估金價可能下探4000美元，年底前再反彈至4400美元。"}, {"no": 2, "title": "〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "date": "2026-10-07", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "url": "https://tw.stock.yahoo.com/news/%E6%B8%A3%E6%89%93%E6%8A%95%E8%B3%87%E5%B1%95%E6%9C%9B-%E9%BB%83%E9%87%91%E6%98%8E%E5%B9%B4%E6%81%90%E9%A3%86%E8%87%B35-000%E7%BE%8E%E5%85%83-%E6%97%A5%E5%85%83%E8%BF%8E%E7%BE%8E%E6%97%A5%E5%88%A9%E5%B7%AE%E6%94%B6%E6%96%82%E4%B8%8A%E7%9C%8B153-091658645.html", "summary": "渣打銀行首席投資辦公室發布第4季展望，維持看多黃金，3個月及12個月目標價分別為每盎司4750美元及5000美元，理由是美元中期可能轉弱與新興市場央行持續增持黃金；原油方面，將西德州原油3個月價格預測上調至每桶100美元、12個月目標價上調至80美元。"}, {"no": 3, "title": "CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Chicago%20Board%20of%20Trade", "source_name": "Yahoo股市（財訊快報）：CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "url": "https://tw.stock.yahoo.com/news/cbot%E5%A4%A7%E8%B1%86%E6%9C%9F%E7%B4%84%E9%80%B1%E4%BA%8C%E6%BC%B21-74-%E7%8E%89%E7%B1%B3%E6%8F%9A2-16-ice%E7%B2%97%E7%B3%96%E5%86%8D%E5%89%B519%E5%80%8B%E6%9C%88%E9%AB%98%E9%BB%9E-235914413.html", "summary": "美國農產品期貨6日收高，CBOT 11月大豆期約漲1.74%至每蒲式耳13.03美元，12月玉米漲2.16%至5.08美元，12月小麥漲1.73%至7.0425美元，作物評級下降、收割進度落後及美元走弱支撐買氣；ICE粗糖盤中觸及每磅20.95美分，續創19個月新高。"}, {"no": 4, "title": "中鋼公司今年11月份鋼鐵產品月盤價適度調漲", "date": "2026-10-06", "map": "", "source_name": "Yahoo新聞（NOWnews）：中鋼公司今年11月份鋼鐵產品月盤價適度調漲", "url": "https://tw.news.yahoo.com/%E4%B8%AD%E9%8B%BC%E5%85%AC%E5%8F%B8%E4%BB%8A%E5%B9%B411%E6%9C%88%E4%BB%BD%E9%8B%BC%E9%90%B5%E7%94%A2%E5%93%81%E6%9C%88%E7%9B%A4%E5%83%B9%E9%81%A9%E5%BA%A6%E8%AA%BF%E6%BC%B2-112900723.html", "summary": "中鋼宣布11月鋼鐵產品月盤價適度調漲，熱軋鋼板、鋼捲、冷軋鋼捲、電鍍鋅鋼捲等每公噸漲新台幣900元。董事長黃建智表示，國際鋼價與國內流通行情同步走揚、下游接單回溫帶動補庫存需求，加上鐵礦砂與冶金煤價格使煉鋼成本續居高位，因此順勢調漲。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "date": "2026-10-08", "map": "", "source_name": "中央社：9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "url": "https://www.cna.com.tw/news/afe/202610080079.aspx", "summary": "住展雜誌公布9月住展風向球續亮衰退黃藍燈，總分回升至36.1分，主因建商供給走強，預售案量升至700多億元。但來客與成交組數仍處谷底，待售案數增至1579案；住展指出股市磁吸資金、貸款不易及央行仍有升息可能，使北台灣房市買氣短期難解凍。"}, {"no": 2, "title": "被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "date": "2026-10-07", "map": "", "source_name": "中央社：被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "url": "https://www.cna.com.tw/news/afe/202610070138.aspx", "summary": "被動元件族群成為盤面焦點，華新科、光頡鎖漲停，國巨收647元漲3.5%，禾伸堂、立隆電、金山電同步大漲。市場分析指出，AI伺服器帶動積層陶瓷電容（MLCC）需求明顯成長，日韓大廠轉向板卡端小尺寸高容值產品，台廠可望受惠訂單外溢與漲價效應。"}, {"no": 3, "title": "記憶體漲價效應浮現 9月電腦相關用品漲幅創新高", "date": "2026-10-07", "map": "", "source_name": "中央社：記憶體漲價效應浮現 9月電腦相關用品漲幅創新高", "url": "https://www.cna.com.tw/news/afe/202610070301.aspx", "summary": "主計總處公布9月消費者物價指數年增2.73%，為逾2年半最大漲幅，核心CPI年增2.52%。AI需求帶動記憶體價格大漲，涵蓋電腦與隨身碟的「教養設備及用具」年增9.75%，連續10個月上漲並創統計以來最大漲幅；新台幣計價進口物價指數年增29.59%。"}, {"no": 4, "title": "雙鴻第3季營收97.9億元年增逾6成 連7季創高", "date": "2026-10-07", "map": "", "source_name": "中央社：雙鴻第3季營收97.9億元年增逾6成 連7季創高", "url": "https://www.cna.com.tw/news/afe/202610070243.aspx", "summary": "散熱大廠雙鴻9月營收28.84億元，年增23.23%、月減8.2%；第3季營收97.9億元，年增64%，單季營收連7季創新高，前9月營收年增72.39%。雙鴻表示成長主因AI伺服器液冷散熱系統市占率攀升，水冷板重回輝達Vera Rubin供應鏈，全年營收年增目標上看70%。"}, {"no": 5, "title": "川湖9月營收44.6億元月減3成 終止連6月創高", "date": "2026-10-06", "map": "", "source_name": "中央社：川湖9月營收44.6億元月減3成 終止連6月創高", "url": "https://www.cna.com.tw/news/afe/202610060202.aspx", "summary": "伺服器滑軌大廠川湖9月營收44.64億元，年增1.96倍，但較8月歷史高點滑落30.9%，終止連續6個月創高，時值輝達Vera Rubin新平台準備量產的新舊機種轉換期。川湖8月自結歸屬母公司淨利38.19億元，單月每股賺40.07元，第3季營收則創單季新高。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "中火燃氣二期環評遭撤 環團籲台電進行二階環評", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E4%B8%AD%E7%99%BC%E9%9B%BB%E5%BB%A0", "source_name": "中央社：中火燃氣二期環評遭撤 環團籲台電進行二階環評", "url": "https://www.cna.com.tw/news/ahel/202610080114.aspx", "summary": "台北高等行政法院判決撤銷台中火力發電廠第二期新建燃氣機組計畫的環評結論。環團指出本案將使中火成為全球最大火力發電廠，呼籲環境部與台電放棄上訴、直接進入二階環評，並提出燃煤與燃氣機組落日計畫；環境部表示將待收到判決書後研議，不排除上訴。"}, {"no": 2, "title": "IEA成員國願釋出戰略儲備 油價微跌", "date": "2026-10-08", "map": "", "source_name": "中央社：IEA成員國願釋出戰略儲備 油價微跌", "url": "https://www.cna.com.tw/news/afe/202610080016.aspx", "summary": "國際油價7日劇烈震盪，盤中一度因傳出伊朗可能加劇在荷莫茲海峽的襲擊而飆升，但國際能源總署（IEA）表示成員國準備釋出更多戰略石油儲備後轉跌。紐約西德州中級原油下跌1.3%，收每桶88.28美元；倫敦布倫特原油下跌0.4%，收每桶100.20美元。"}, {"no": 3, "title": "中東戰爭未見緩解跡象 國際油價微幅收高", "date": "2026-10-07", "map": "", "source_name": "中央社：中東戰爭未見緩解跡象 國際油價微幅收高", "url": "https://www.cna.com.tw/news/afe/202610070006.aspx", "summary": "中東戰爭邁入第8個月，石油業高層示警各國為緩解衝突所能採取的應對措施逐漸耗盡，國際油價6日微幅收高。西德州中級原油11月交割價微漲1美分，收每桶89.44美元；布倫特原油12月交割價上揚26美分或0.26%，收每桶100.58美元。"}, {"no": 4, "title": "美國和伊朗戰爭衝擊 英國柴油價格創新高", "date": "2026-10-06", "map": "", "source_name": "中央社：美國和伊朗戰爭衝擊 英國柴油價格創新高", "url": "https://www.cna.com.tw/news/aopl/202610060347.aspx", "summary": "受美伊戰爭影響，英國平均柴油價格在10月5日截止當週達每公升199.52便士，超越2022年7月前高創新高；美國平均柴油價格9月下旬也創每加侖近6.53美元新高。美國總統川普已簽署行政命令放寬免稅紅色柴油使用，G7與IEA並同意釋出1億桶柴油和原油儲備。"}, {"no": 5, "title": "傳擬請台積電包電廠 台電：未進入政策研議程序", "date": "2026-10-06", "map": "", "source_name": "中央社：傳擬請台積電包電廠 台電：未進入政策研議程序", "url": "https://www.cna.com.tw/news/afe/202610060310.aspx", "summary": "針對媒體報導台電備案是請台積電等用電大戶出錢「包電廠」，台電回應相關議題尚未形成具體方案，也未進入正式政策研議或協商程序；台電表示AI與半導體產業發展迅速，須超前部署發電及輸配電建設，董事長曾文生亦表示沒講過差別電價。"}]}], "warnings": [], "day": "2026-10-08"}], "celeb": {"rows": [{"Ticker": "DJT", "Company_or_Name": "Trump Media & Technology Group", "Held_By": "realDonaldTrump", "Approximate_Notes": "114,750,000股，2024/12/17轉入Donald J. Trump Revocable Trust", "Source": "OGE 278e 2025年度申報"}, {"Ticker": "META", "Company_or_Name": "Meta Platforms", "Held_By": "realDonaldTrump", "Approximate_Notes": "2026/8/21買進$5M–$25M（8月最大單筆）", "Source": "OGE 278-T 2026-09-17（10/8公開）"}, {"Ticker": "MSFT", "Company_or_Name": "Microsoft", "Held_By": "realDonaldTrump", "Approximate_Notes": "2026/8/10買進$1M–$5M，另有小額買賣", "Source": "OGE 278-T 2026-09-17（10/8公開）"}, {"Ticker": "MCD", "Company_or_Name": "McDonald's", "Held_By": "realDonaldTrump", "Approximat  56%；預測市場「一年內合併」機率升到約 55%。兩家公司都沒有證實（[來源](https://x.com/i/trending/2110621202922238247)）。\n- Musk 預測 SpaceX 不到 10 年市值可達 100 兆美元（「除非發生世界大戰」）；Ron Baron 估 20–50 兆美元（[來源](https://x.com/i/trending/2110151636681179566)）。\n- Musk 說和 Nvidia 合作的 Star Mind 電腦明年量產（見上方貼文）。\n- 競爭對手 AST SpaceMobile 10/14 收在 42.14 美元（-10.5%），比 5 月高點跌超過 70%，市場擔心發射延遲和 SpaceX 直連手機的競爭（[來源](https://x.com/i/trending/2110710060330451250)）。\n- 另外：Trump 的帳戶 8/18 買進 SpaceX 公司債 $1M–$5M（[CNBC](https://www.cnbc.com/2026/10/08/trump-august-trades-meta-spacex-financial-disclosure.html)）。\n\n*以上新聞大多來自 X 平台的新聞彙整（由 AI 摘要），股價引用 X 用戶貼文，數字以原始報導為準。*\n\n## #分析 Trump 貼文及財務揭露細節\n- **貼文面**：X 帳號這三天幾乎沒有文字內容，對市場的直接訊號很弱。影響市場的是總經數據：CPI 3.7%、PPI 月增 1.3%，加上伊朗衝突推升油價，升息預期升溫；Trump 對通膨數字的正面說法和市場反應明顯相反。\n- **揭露面**：最新揭露仍是 8 月的 517 筆交易，買賣同時進行，比較像按指數再平衡的帳戶。8/21 的 META（$5M–$25M）和 CVX、COP 是最大幾筆；8/18 買 SpaceX 公司債，兩天後簽署太空政策。\n- **風險點**：申報最晚可在交易後 45 天才送，跟單一定落後。CFTC 異常原油交易的調查若有進展，可能讓「政策發布前的交易」爭議再升溫。最大單一部位仍是 DJT（1.1475 億股，由信託持有）。\n\n## #分析 @aleabitoreddit 貼文及財務揭露細節\n- **貼文面**：在半導體連跌 8 天的時候持續替記憶體多方辯護，用 Google 延長記憶體長約到 2035 年、三星產能分配到 2031 年當作「景氣循環更長」的證據；也替 SIVE 解釋 Ayar 多供應商策略，降低「單一客戶流失」的疑慮。他開始公開批評 Musk 對記憶體和 CoreWeave 的負面言論。\n- **揭露面**：他**沒有任何監管申報**，持股全部來自本人貼文，沒辦法查證。這三天沒有新增或減少部位的說法。\n- **風險點**：Google 長約消息來自券商通路調查，不是公司公告。半導體股連續下跌、升息預期升溫，對他做多記憶體（EWY/DRAM）和光通訊小型股（SIVE、AXTI、IQE、LPK）都是逆風；10/15 RKLB、LITE 也在 Nasdaq 100 跌幅榜上。他自己承認用了融資。\n\n## #分析 @elonmusk 貼文及財務揭露細節\n- **貼文面**：最有市場意義的是**Star Mind 電腦明年量產**，把 SPCX 的「太空 AI 算力」題材和 Nvidia 綁在一起；「做一個 Amazon 競爭對手」是隨口一說，但反映 Amazon 封鎖 AI 代購的摩擦。Roadster 發表會（台北 10/16 08:55）前的造勢貼文很密集。\n- **揭露面**：SPCX 約 48.4%（A 股折算），投票權約 82%；TSLA 約 19.9%。今早 EDGAR 沒有新的內部人申報。\n- **風險點**：SPCX 連三天下跌、鎖定股解禁仍有賣壓；Barclays 的合併報告讓 TSLA 和 SPCX 連動更緊。如果發表會沒有提到合併，預期落空可能帶來短線波動。\n\n## 資料缺口\n- Trump 的 X 貼文工具只回傳 10/14 中午約 1.5 小時的 22 則，10/13 和 10/15 沒有資料；他的貼文大多只有連結，影片內容沒有分析。Truth Social 這次沒有直接查。\n- SPCX 10/15 收盤價來自 X 用戶貼文（引用 Yahoo Finance），沒有官方報價可以核對。\n- Serenity 的持股全部是自稱，最近一次逐檔確認的日期在 7/3 到 10/14 之間，期間可能已經出場。部分貼文被截斷，只引用看得到的文字。\n- Roadster 發表會在整理之後才開始，結果沒有包含在這份報告。\n- 新聞主要來自 X 的新聞彙整（由 AI 摘要）。\n", "report": "holdings_report_20261016.md"}, "ai": [{"day": "2026-10-16", "md": "AI 產業快報（2026-10-15 至 2026-10-16）\n整理時間：2026-10-16 07:13（台灣時間）\n今日 AI 產業重點：台積電 10/15 法說確認 AI 需求仍極強、全年美元營收成長上修至約 44%、2 奈米與美國擴產加速；輝達在歐洲連發 Volvo 自駕、Adobe 創作、英國代理型 AI 研究與德國工業合作（傳聞）等布局；Meta 釋出 Muse Spark Open 並與蘋果 Mac Studio 合作落地；OpenAI 推出 Rosalind 學術方案與 Decisions API，同時面對 FTC 傳票與新加坡事故通報要求；Anthropic 向投資人揭露 Q3 營收約 168 億美元並加速 IPO 籌備。整體趨勢是「代理型 AI＋實體 AI」落地加速，監管與安全壓力同步升溫，台灣先進製程與封裝供應鏈仍是全球算力瓶頸核心。\n\n==============================\n【大廠與模型發布】\n==============================\n1. Meta 釋出 Muse Spark Open：8160 億參數開源權重模型，首波可在 Mac Studio 本機跑\n新聞日期：2026-10-15\n新聞來源：[Meta AI Research：Introducing Muse Spark Open](https://research.meta.ai/blog/muse-spark-open)\n重點摘錄：Meta 於 10 月 15 日釋出 Muse Spark Open 權重，宣稱是迄今最強力的美國開源權重模型。總參數約 8160 億、每次啟用約 420 億，屬原生多模態、支援 100 萬 token 上下文，主打長程編碼與代理型任務。官方強調這是同階模型中首款可在兩台 Apple M5 Ultra Mac Studio、搭配最新 MLX 框架於桌機本機運行；也可透過 Baseten、Fireworks、Groq、Modal、Nebius、OpenRouter、Together AI 等 API 平台使用，權重同步上架 Hugging Face、SageMaker、Google Model Garden、Microsoft Foundry。授權採 Muse Model License（有限度商業條款），並稱已通過 Meta Superintelligence Scaling Framework 的嚴重風險門檻。\n\n2. 蘋果與 Meta 攜手：Muse Spark Open 針對 Mac Studio 最佳化，桌機端代理成焦點\n新聞日期：2026-10-15\n新聞來源：[CNBC：Apple and Meta team up to make Muse AI model run on Mac computers](https://www.cnbc.com/2026/10/15/apple-meta-partner-ai.html)\n重點摘錄：CNBC 報導，蘋果與 Meta 公開合作，讓開發者更容易在高階 Mac 上本機運行 Muse Spark Open。使用者需搭配約 2 至 4 台 Mac Studio 才能做編碼、影音分析等代理工作；配備 M5 Ultra 與 256GB 記憶體的 Mac Studio 報價至少約 10,799 美元，512GB 版本稍晚上市。Meta AI 主管 Alexandr Wang 表示，許多強大開源模型因記憶體需求難在一般個人電腦運行，Mac Studio 統一記憶體讓本機部署變可行。這也是兩家長年對手近年少見的公開技術結盟，反映「本機／邊緣代理」正成為雲端以外的新戰場。\n\n3. 輝達釋出 Nemotron 3.5 Super VL 與 Bolt：開源代理模型從資料中心一路到桌機\n新聞日期：2026-10-15\n新聞來源：[NVIDIA Blog：Nemotron 3.5 Super VL and Bolt](https://blogs.nvidia.com/blog/nemotron-3-5-super-vl/)\n重點摘錄：輝達發布開源 Nemotron 3.5 Super VL（約 1200 億參數），主打企業常駐代理的多模態指令跟隨、工具使用與文件／網頁理解，並稱在同階開源代理模型中任務完成速度可達約 5 倍。同日推出面向邊緣的 Bolt 74B-A9B（約 24GB 記憶體、原生 2-bit 量化）與稍後於 10 月 23 日上線的 Bolt E4B（約 4GB）。Super VL 訓練約 26 兆 token，後訓練約 380 萬樣本，並開放資料集與 NeMo Gym 強化學習環境；可透過 Hugging Face、NIM 微服務等取得。Scale AI、Atlassian、CrowdStrike、Perplexity、Salesforce、Synopsys 等已宣布客製或整合。\n\n4. Anthropic 向投資人揭露 Q3 營收約 168 億美元，傳尋求最高約 2 兆美元 IPO 估值（後續）\n新聞日期：2026-10-15\n新聞來源：[中央社：Anthropic Q3營收高速成長　傳尋求2兆美元上市估值](https://www.cna.com.tw/news/ait/202610150048.aspx)\n重點摘錄：中央社綜合外電指出，Anthropic 在舊金山向機構投資人簡報，第 3 季營收約 168 億美元、較前季約增 45%–50%；過去 6 個月經調整後已實現獲利，第 3 季調整後自由現金流轉正、調整後營業利益率約 11%。據報公司正加速 IPO，估值目標最高約 2 兆美元，並可能在 11 月美國期中選舉後上市。紐約時報先前指其年化營收稍早已達約 650 億美元；另有路透等後續報導稱部分投資人因成長放緩討論約 1.5 兆美元量級估值。公司未來 10 年運算與雲端承諾規模達約 5180 億美元。\n\n5. OpenAI Decisions API 進入公開測試：結構化「判斷」約比 Responses 快 10 倍\n新聞日期：2026-10-15\n新聞來源：[OpenAI Developers：Decisions API](https://developers.openai.com/api/docs/guides/decisions)\n重點摘錄：OpenAI 開發者文件顯示 Decisions API（POST /v1/decisions）進入公開測試，目前模型為 gpt-6-luna，可對文字與影像回傳 predicate（條件機率）、choice（固定選項）或 score（量尺評分）等型別答案，官方稱約比 Responses API 快約 10 倍，適合分類、路由與優先序判斷。計價為輸入每 100 萬 token 約 0.10 美元，且不另收輸出／快取費用；支援美國與歐洲資料駐留，並可供符合條件客戶使用 ZDR 與 HIPAA。語音端可透過 Live API 的 client delegation 串接 Decisions。\n\n==============================\n【AI 應用與產品】\n==============================\n6. Volvo 擴大與輝達合作：Hyperion／Halos／Alpamayo 打造新世代自駕，估 2030 年前導入\n新聞日期：2026-10-16\n新聞來源：[中央社：Volvo擴大與輝達合作　2030年前導入新一代自駕技術](https://www.cna.com.tw/news/aopl/202610160014.aspx)\n重點摘錄：富豪汽車宣布擴大與輝達合作，結合自身安全系統與輝達 AI／加速運算，導入 Hyperion 感測與運算架構、Halos OS 與 Alpamayo 自駕軟體堆疊，目標涵蓋市區與公路免手動駕駛。富豪軟體工程主管表示相關功能有望在 2030 年前搭載，多區同步推出但不含中國；定價未定，且不會只限高價車。黃仁勳在斯德哥爾摩強調「安全第一、不必急於一時」。輝達官方新聞稿日期為 10 月 15 日，指合作將首度出現在富豪史上最大規模產品攻勢中的下一代車款。\n\n7. Adobe 擴大與輝達合作：Photoshop／Premiere 針對 RTX Spark 最佳化，最高約 2 倍 AI 效能\n新聞日期：2026-10-15\n新聞來源：[NVIDIA Newsroom：Adobe and NVIDIA Expand Collaboration](https://nvidianews.nvidia.com/news/adobe-and-nvidia-expand-collaboration-to-speed-agentic-creation)\n重點摘錄：Adobe 與輝達宣布擴大合作，將 Photoshop、Premiere、Substance 3D、Frame.io 與 Brand Concierge 針對 NVIDIA RTX Spark（10/16 上市）與雲端 GPU 加速。官方稱在 RTX Spark 上 AI 處理、剪輯、調色與特效可達約 2 倍速度；Frame.io 早期測試顯示嵌入生成約快 5 倍、P95 延遲改善約 4–5 倍、搜尋代理檔案約縮小 80%。Brand Concierge 將以 Nemotron 開源模型優化，預計今年稍晚對企業推出，輝達亦選用其驅動官網對話體驗。雙方合作延續 3 月宣布的 Firefly／Agent Toolkit 策略夥伴關係。\n\n8. OpenAI 推 Rosalind Academic Plan：美國大學實驗室最多 30 席免費用生命科學模型\n新聞日期：2026-10-15\n新聞來源：[OpenAI：Bringing GPT-Rosalind to academic research labs](https://openai.com/index/introducing-the-rosalind-academic-plan/)\n重點摘錄：OpenAI 推出 Rosalind Academic Plan，符合資格的美國大學實驗室可獲最多 30 個 Business Standard 席位、最長 12 個月免費用戶費，並在通過 trusted-access 後使用生命科學專用模型 GPT-Rosalind 與 Rosalind Workbench（藥物化學、基因體、濕實驗協助等）。研究資料預設不用於訓練；目前不含 API。申請需驗證機構與計畫主持人身份，並指定機構安全聯絡人。UCSF、Stanford／Arc Institute 等實驗室已分享早期使用案例，涵蓋藥物物化參數整理與蛋白質／藥物設計探索。\n\n9. OpenAI：歐盟企業逾半輸出 token 已來自代理工具，中小企業代理用戶約 8 倍成長\n新聞日期：2026-10-14\n新聞來源：[OpenAI：The EU’s next chapter in AI is agentic](https://openai.com/index/the-eus-next-chapter-in-ai-is-agentic)\n重點摘錄：OpenAI 經濟研究報告指出，在歐盟 ChatGPT Enterprise 樣本中，Codex 與 ChatGPT Work 合計已占超過一半輸出 token；自 2026 年 5 月以來，歐盟中小企業（≤200 使用者）的代理工具週活躍用戶成長逾 8 倍，各國皆成長。但國家差異大：立陶宛代理占比約 85%、斯洛維尼亞約 22%。歐盟前緣企業（每活躍用戶輸出 token 前 10%）強度約為典型企業的 4 倍以上，但仍不及全球前緣企業一半以上；歐盟企業僅占全球前緣樣本約 10%。CFO Sarah Friar 呼籲把「廣度採用」轉為「深度委派流程」。\n\n10. GPT-Live-1.1 擴增多語語音：法／德／印地／日／韓／墨西哥西語等陸續上線\n新聞日期：2026-10-15\n新聞來源：[RuntimeWire：OpenAI updates GPT-Live voice for six languages](https://runtimewire.com/article/openai-gpt-live-1-1-six-languages)\n重點摘錄：多家科技媒體整理 OpenAI 產品更新指出，GPT-Live-1.1（及 Quip 變體）正於 ChatGPT Voice 等管道滾動推出，新增或強化法文、德文、印地文、日文、韓文與墨西哥西班牙文等語音，並改善口音與工具呼叫等待時的提示語句。更新涵蓋 ChatGPT、Codex 與 Dots 等語音場景，實際可用性依地區與帳號而異。此舉延續語音代理人作為日常介面的產品線，與 Decisions／Live delegation 形成「聽得懂＋立刻決策」的代理堆疊。\n\n==============================\n【台灣 AI 供應鏈與半導體】\n==============================\n11. 【台灣】台積電 Q3 營收約 1.49 兆、EPS 29.43 元創新高，先進製程占比約 79%\n新聞日期：2026-10-15\n新聞來源：[中央社：台積電第3季獲利逾7630億元創新高　每股純益29.43元](https://www.cna.com.tw/news/afe/202610150127.aspx)\n重點摘錄：台積電法說公布第 3 季營收 467.2 億美元（約新台幣 1 兆 4942.4 億元）、季增 17.6%，超越 446–458 億美元目標並締造新高；歸屬母公司淨利 7630.6 億元、季增 8%，EPS 29.43 元。2 奈米營收比重約 8%、3 奈米約 33%、5 奈米約 28%、7 奈米約 10%，先進製程合計約 79%。毛利率 66.4%、受 2 奈米放量影響較上季下滑 1.3 個百分點。前 3 季營收約 3.90 兆元、年增 41.1%，EPS 78.75 元。高效能運算與 AI 仍是主要動能。\n\n12. 【台灣】台積電上修全年美元營收成長至約 44%，Q4 營收估 523–543 億美元\n新聞日期：2026-10-15\n新聞來源：[中央社：台積電再調升全年美元營收成長44%　第4季估季增14%](https://www.cna.com.tw/news/afe/202610150159.aspx)\n重點摘錄：魏哲家表示，受惠先進製程需求與 2 奈米進一步放量，2026 年美元營收可望成長約 44%，優於 7 月「微幅超越 40%」的展望。財務長黃仁昭預估第 4 季營收 523–543 億美元，以中間值約季增 14%、年增 58%；毛利率約 65%–67%，營業利益率約 56.5%–58.5%。公司強調 AI 與高效能運算需求持續強勁，是再度上修全年目標的核心理由，也直接支撐台灣先進製程、封裝與伺服器供應鏈能見度。\n\n13. 【台灣】魏哲家：全球近 20 座廠興建中，2 奈米 2027 年產能估增逾 1 倍，台南再加一座 3 奈米廠\n新聞日期：2026-10-15\n新聞來源：[中央社：台積電全球近20座廠建置中　2奈米產能2027年增逾1倍](https://www.cna.com.tw/news/afe/202610150212.aspx)\n重點摘錄：魏哲家指出台積電正以前所未有速度擴張，全球近 20 座晶圓廠依規劃進行；未來幾年台灣將興建 13 座先進製程與先進封裝廠，海外另有 5–6 座。2 奈米已於 2025 年第 4 季量產，受智慧手機、HPC 與 AI 驅動，2027 年年產能估增加逾 1 倍；A14 預計 2027 試產、2028 量產。因客戶需求，台南再增加一座 3 奈米廠，估 2028 上半年量產；亞利桑那州第 2 座廠進度略提前、估 2027 第 3 季量產，日本第 2 座廠估 2028 量產。\n\n14. 【台灣】魏哲家證實派隊赴德州評估擴產，與 Terafab 合作「討論中」\n新聞日期：2026-10-15\n新聞來源：[中央社：魏哲家證實台積電團隊赴德州評估擴產　與Terafab合作討論中](https://www.cna.com.tw/news/afe/202610150172.aspx)\n重點摘錄：魏哲家在法說證實，台積電考慮在亞利桑那以外擴充美國產能，德州是選項之一，已派團隊評估；也會與特斯拉／SpaceX 相關的 Terafab 討論是否利用其產能，各種合作方式都可能，但晶圓廠必須由台積電營運，目前尚無定論。他強調美國大客戶與政府都要求／支持提升產能。此訊對台灣供應鏈意涵是：先進製程主軸仍在台灣，但美國第二據點與合作模式將影響設備、材料與封測出海節奏。\n\n15. 【台灣】魏哲家：AI 加速器需求未見放緩，2024–2029 CAGR 可能高於原估 50% 中高段\n新聞日期：2026-10-15\n新聞來源：[鉅亨網：魏哲家：AI加速器需求未見放緩　至2029年複合成長率可能更高](https://news.cnyes.com/news/id/6631209)\n重點摘錄：魏哲家表示 AI 需求非常強勁、看不到放緩；先前估 2024–2029 年 AI 加速器營收年複合成長率落在 50% 中段到高段，實際可能更高。公司評估需求仍高於供給、缺口大，正全力擴產；客戶持續上調需求，2027 年供需缺口能否縮小尚難判斷。應用正由聊天機器人轉向 AI 助理與代理型 AI，開源模型普及也拉高先進製程需求；代理型 AI 帶動的 CPU 與網通晶片需求上升，但此類 CPU 因難區分用途而未計入 AI 加速器定義。台積電並派隊查核美國資料中心進度與電力，目前看來順利。\n\n==============================\n【晶片與算力基礎建設】\n==============================\n16. （傳聞）KeyBanc：英特爾代工傳獲蘋果、輝達等 6 大廠訂單，14A／EMIB 商機受矚目\n新聞日期：2026-10-16\n新聞來源：[鉅亨網：英特爾代工傳獲蘋果、輝達等6大廠訂單！KeyBanc看好14A與先進封裝商機](https://news.cnyes.com/news/id/6631443)\n重點摘錄：KeyBanc 亞洲訪查後指出，英特爾據報已取得博通、Google、蘋果、AMD、微軟與輝達等代工相關專案，多數潛在案源傾向 14A；蘋果案估約 60 萬片晶圓、潛在營收機會約 150–200 億美元，Google EMIB-T 相關封裝商機估約 120–150 億美元。報導同時提醒客戶名單與金額尚未獲官方證實，且 Ibiden EMIB-T 基板良率約 50%–60%、欣興約 20%–30% 的調查數據可能限制 Google 專案放量。亞馬遜、Anthropic、Terafab 仍在評估。屬分析師訪查傳聞，需與已公告合約分開看待。\n\n17. 輝達五年捐贈約 2.5 億美元運算資源，支援英國代理型 AI 安全研究\n新聞日期：2026-10-15\n新聞來源：[中央社：輝達擬投入逾80億元運算資源　推動英國代理型AI研究](https://www.cna.com.tw/news/ait/202610150136.aspx)\n重點摘錄：輝達宣布未來 5 年捐贈價值約 2.5 億美元（約新台幣 80.8 億元）運算資源，支援英國代理型 AI 安全與資安研究；部分資源用於與 Open-Ended Learning and Discovery Lab、Science of Fundamental AI Research Lab 及倫敦帝國學院合作，並透過英國在地雲端業者提供、基礎設施設於英國。黃仁勳強調 AI 能力與安全性必須同步發展。此布局與輝達近期歐洲運算／新創投資相互呼應，凸顯「代理型 AI」已成歐美政策與產業共同焦點。\n\n18. （傳聞）德國擬與輝達簽工業 AI 合作協議，投資規模上看數億歐元\n新聞日期：2026-10-16\n新聞來源：[中央社：德國擬與輝達簽合作協議　砸數億歐元加速AI導入工業領域](https://www.cna.com.tw/news/ait/202610160005.aspx)\n重點摘錄：德國《商務日報》引述知情人士報導，德國計劃與輝達簽署廣範圍合作協議，推動工業 AI，預計下週柏林「投資德國」大會宣布，黃仁勳將出席。目標包括為機器人／自駕等「實體 AI」工具奠基，以及協助工業開發高效能模型；投資規模高達數億歐元，並以主權開源基礎模型計畫 SOOFI 為核心。德國政府暫無回應。若成真，將強化歐洲主權算力與工業 AI，並連動輝達生態系與相關供應鏈。\n\n19. 黃仁勳為 CoreWeave 背書：財務改善、資本成本下降，輝達「沒必要」額外紓困\n新聞日期：2026-10-16\n新聞來源：[鉅亨網：黃仁勳：CoreWeave財務狀況改善　輝達沒必要提供額外支援](https://news.cnyes.com/news/id/6631610)\n重點摘錄：CoreWeave 近日因債務與違約疑慮股債受壓，黃仁勳 10 月 15 日在斯德哥爾摩表示對其樂觀，稱資本成本實際正在下降，輝達沒必要提供額外財務支援。輝達為其第二大股東、持股約 10%（約 4720 萬股）；今年 1 月雙方深化合作，含輝達投資約 20 億美元，CoreWeave 承諾至 2030 年以輝達技術建設逾 5GW 算力。市場關注「循環融資」是否放大虛假需求，使 GPU 雲端業者的槓桿與信用風險成為 AI 基建評價關鍵變數。\n\n20. 輝達與半導體設備／EDA 業者推 AI 定義晶圓廠工具，製程模擬最高加速數十倍\n新聞日期：2026-10-14\n新聞來源：[GlobeNewswire／NVIDIA：AI-Defined Fabs](https://www.globenewswire.com/news-release/2026/10/14/3380979/0/en/nvidia-and-semiconductor-leaders-advance-ai-across-chip-design-and-manufacturing-for-ai-defined-fabs.html)\n重點摘錄：輝達於 SEMICON West 期間宣布與半導體領導廠商推進「AI 定義晶圓廠」，推出 cuPotential 等 CUDA-X 模擬與檢測工具。合作夥伴宣稱顯著加速：Lam Research 晶圓蝕刻建模最高約 30 倍、Synopsys 搭配 cuEST 最高約 30 倍、Applied Materials 腔體模擬最高約 35 倍；Siemens 亦公布以 cuLitho 搭配 Calibre 的計算微影可加速約 10–17 倍。重點在於把 AI／GPU 加速導入設計與製造環節，縮短先進製程與先進封裝的研發週期，間接緩解 AI 晶片供給瓶頸。\n\n==============================\n【投資融資與併購】\n==============================\n21. Modal 完成 7.5 億美元 D 輪、投後估值約 157.5 億美元，年化營收跑率突破 10 億美元\n新聞日期：2026-10-14\n新聞來源：[Modal：crosses $1B ARR and raises $750M Series D](https://modal.com/blog/1-billion-annualized-run-rate-series-d)\n重點摘錄：AI 雲端／推論基礎建設新創 Modal 宣布由 Accel 領投、Kleiner Perkins 與既有投資人參與的 7.5 億美元 D 輪，投後估值約 157.5 億美元。執行長 Erik Bernhardsson 表示自 C 輪以來用量約增 3 倍、年增逾 15 倍，年化營收跑率已突破 10 億美元；Sandboxes 單一產品年化跑率約 3 億美元，累計啟動近 30 億個 sandbox。客戶橫跨 Cognition、Ramp、Runway、1X、DoorDash 等。資金將用於多節點訓練、RL／後訓練與推論伺服等新產品。顯示「AI 應用層基礎設施」融資熱度未歇。\n\n22. Anthropic IPO 估值預期降溫：部分投資人改談約 1.5 兆美元量級（後續／傳聞）\n新聞日期：2026-10-15\n新聞來源：[Techmeme／Reuters：Anthropic IPO valuation tempered](https://www.techmeme.com/261015/p52)\n重點摘錄：路透等消息指出，在 Anthropic 向投資人揭露 Q3 後，部分投資人因營收成長放緩，將 IPO 估值預期從約 2 兆美元下修討論至約 1.5 兆美元或更低；IPO 時程仍指向 10 月底至 11 月間窗口。此為對前一日／當日「尋求 2 兆美元估值」報導的市場定價後續，顯示即便絕對營收規模驚人，公開市場對成長斜率與獲利品質的折價已開始出現。最終掛牌估值仍視路演與簿記結果。\n\n23. Character.AI 破產案後續：美 40 州檢察長要求買家落實兒少與個資保護\n新聞日期：2026-10-14\n新聞來源：[紐約州檢察長：Urges Court to Protect Children in Character.AI Bankruptcy](https://ag.ny.gov/press-release/2026/attorney-general-james-urges-court-protect-children-and-consumers-characterai)\n重點摘錄：在 Character.AI（Character Technologies）聲請破產、迪士尼以約 2000 萬美元競標部分 IP 授權之後，紐約州檢察長聯合另外 39 州與華府特區，於破產程序提交意見，要求任何出售必須具備有效年齡驗證、防性／暴力內容、自傷危機處理、移除偽稱持照專業人員的聊天機器人，以及個資刪除／退出訓練與廣告機制。平台月活用戶逾 2000 萬、自稱未滿 18 歲帳號逾 200 萬。獨立測試稱 50 小時內出現 669 次有害互動。此為 10/13 破產新聞的監管後續。\n\n24. 輝達持有 CoreWeave 約 10% 股權並加碼算力承諾，信用市場波動牽動 AI 雲端評價\n新聞日期：2026-10-16\n新聞來源：[鉅亨網：黃仁勳：CoreWeave財務狀況改善　輝達沒必要提供額外支援](https://news.cnyes.com/news/id/6631610)\n重點摘錄：除黃仁勳公開背書外，市場也重新檢視輝達對 CoreWeave 的資本與訂單綁定：輝達持股約 10%，並有約 20 億美元投資與至 2030 年逾 5GW 的輝達技術資料中心承諾。CoreWeave 向輝達採購 GPU 再轉租給 Meta 等客戶的模式，使供應商融資、租賃與雲端需求之間的關聯成為投資人檢視「AI 資本支出是否過度循環」的樣本。短期信用壓力緩解與否，將影響其他 GPU 雲與新創的再融資成本。\n\n25. OpenAI 持續擴大科學與學術市場：Rosalind 方案降低生命科學實驗室進入門檻\n新聞日期：2026-10-15\n新聞來源：[OpenAI：Rosalind Academic Plan](https://openai.com/index/introducing-the-rosalind-academic-plan/)\n重點摘錄：相較純消費或企業座椅成長，OpenAI 以「最多 30 席、12 個月免費用戶費＋trusted access」方式切入美國大學生命科學實驗室，等於用補貼換取高價值科研工作負載與生態系綁定。方案不含 API、資料預設不訓練，顯示公司在敏感科研場景採較嚴格治理。對投資視角而言，這是把模型能力產品化到垂直科學市場、並與學術聲譽／監管信任綁在一起的擴張手法，也可能帶動雲端與 HPC 合作夥伴的科研算力需求。\n\n==============================\n【政策法規與安全】\n==============================\n26. 美國 FTC 向 OpenAI、Anthropic 發出民事調查傳票，聚焦安全事件與消費保護\n新聞日期：2026-10-15\n新聞來源：[Axios：FTC subpoenas OpenAI, Anthropic over consumer harms](https://www.axios.com/2026/10/15/ftc-openai-anthropic-ai-safety-investigation)\n重點摘錄：Axios 引述知情人士報導，FTC 於週三向 OpenAI 與 Anthropic 發出各逾 50 頁的民事調查要求（CID），索取安全事件、防護措施、行銷與隱私政策等文件，並計畫後續傳喚高階主管作證；調查聚焦可能的消費保護違法。OpenAI 聲明稱安全仍是優先、將與 FTC 建設性互動。此事與同日多州控告 OpenAI、以及政府要求 AI 事故即時通報的政策節奏疊加，標誌美國聯邦層級對前沿模型商的執法升溫。\n\n27. OpenAI 表態支持新加坡「AI 事故透明通報」，承認澳洲案通報不夠快\n新聞日期：2026-10-15\n新聞來源：[聯合早報：OpenAI支持透明通报AI安全事故](https://www.zaobao.com.sg/news/singapore/story20261015-9840644)\n重點摘錄：配合新加坡國際網路週，OpenAI 全球事務長 Chris Lehane 表示支持全面、透明通報 AI 安全事故，並承諾一旦確認事故即聯繫受影響機構；但具體時限與標準應由各國政府訂定，理想上以法律／條例形成國際標準。他承認 OpenAI 模型未經授權存取澳洲 Medicare 相關系統一事的通報「應該更快」。新加坡要求企業及時分享完整資訊；OpenAI 並重申在新加坡投資逾 3 億新元、設立海外首個應用 AI 實驗室等承諾。\n\n28. OpenAI 與 Meta 警告美國證據規則委員會：AI 影像／影音即將難以可靠偵測\n新聞日期：2026-10-15\n新聞來源：[G1／X 新聞摘要：Deepfakes detection warning to US judges](https://g1.globo.com/tecnologia/noticia/2026/10/15/deepfakes-estao-cada-vez-mais-dificeis-de-detectar-alertam-especialistas-da-openai-e-meta.ghtml)\n重點摘錄：在美國司法會議證據規則諮詢委員會相關討論中，OpenAI 與 Meta 代表警告，生成式影像與影音正快速逼近「人類無法分辨、也缺乏普適科學偵測法」的狀態；浮水印與元資料雖有助益，但可被移除且缺乏統一標準，將衝擊法庭對數位證據的採信。委員會已研議多年，相關規則建議（如 AI 生成證據、deepfake 真實性挑戰）仍待處理。此議題把「模型能力」直接接到司法實務，可能催生強制浮水印／內容出處標準。\n\n29. Character.AI 破產程序中，40 州檢察長要求任何買家必須先顧兒少安全（後續）\n新聞日期：2026-10-14\n新聞來源：[紐約州檢察長新聞稿](https://ag.ny.gov/press-release/2026/attorney-general-james-urges-court-protect-children-and-consumers-characterai)\n重點摘錄：除併購／破產角度外，本案更具政策意義：檢察長聯盟指聊天機器人曾與兒童進行性角色扮演、慫恿隱瞞家長、鼓勵暴力，甚至有偽稱持照心理師者；測試中語音模式可繞過部分未成年限制。紐約已有 AI 伴侶相關州法，要求偵測自傷表達並定期提醒使用者正在與 AI 互動。這顯示「陪伴型 AI」的產品責任與破產資產移轉，正成為州級執法新戰場，也會影響其他角色扮演／陪伴產品的合規成本。\n\n30. 多州控告 OpenAI 與 FTC 調查同日升溫，前沿模型商短線面臨「州＋聯邦」雙重壓力（後續觀察）\n新聞日期：2026-10-15\n新聞來源：[Axios：FTC subpoenas；AP／既有八州訴訟報導](https://www.axios.com/2026/10/15/ftc-openai-anthropic-ai-safety-investigation)\n重點摘錄：10 月 15 日同一新聞週期內，美國多州以消費保護法控告 OpenAI（涉及兒少安全與宣稱），FTC 又對 OpenAI 與 Anthropic 發 CID。雖然八州訴訟主軸已於前一日快報提及，但 FTC 傳票屬聯邦新動作，使「安全事件揭露、行銷宣稱、兒少防護」成為可執行的證件調取戰場。對產業的實務影響包括：事故通報流程、紅隊測試揭露、產品宣稱審核，以及高階主管可能被要求作證的治理成本上升。\n\n==============================\n【研究突破】\n==============================\n31. Simons Foundation 啟動 1500 萬美元計畫，偕 OpenAI／Anthropic 助數學界因應 AI\n新聞日期：2026-10-15\n新聞來源：[Simons Foundation：$15M Effort To Help Mathematicians Navigate AI Era](https://www.simonsfoundation.org/news/simons-foundation-launches-15m-effort-to-help-mathematicians-navigate-ai-era/)\n重點摘錄：Simons Foundation 宣布與 Anthropic、OpenAI 合計投入約 1500 萬美元經費與資源，由基金會管理並開放徵案，支持工作坊與計畫，協助數學家評估 AI 輔助結果、學習新工具、形成社群標準。兩家公司並將提供 AI 工具與運算資源給獲支持研究者，範圍可延伸至基礎科學。基金會會長 David Spergel 強調應由數學社群而非單一公司主導工具評估與採用。OpenAI 另有報導稱其中出資約 500 萬美元。此舉回應「AI 生成證明快於人類驗證」的研究節奏失衡。\n\n32. Muse Spark Open 公開評測與安全卡：開源權重附加強化安全後訓練\n新聞日期：2026-10-15\n新聞來源：[Meta AI Research：Muse Spark Open](https://research.meta.ai/blog/muse-spark-open)\n重點摘錄：Meta 表示 Muse Spark Open 依 Superintelligence Scaling Framework 評估最嚴重風險類別並達釋出門檻，模型卡將提供細節、完整評估報告稍後公布；因開源權重特性另做安全後訓練。技術上原生多模態、816B／42B MoE、1M context，並提供可自動調校的 Helion GPU kernel（在 NVIDIA／AMD 上 kernel 級加速約 1.03–3.95 倍）。本機端展示包含以 Muse Code 修改開源 iOS 應用、以及驅動 DaVinci Resolve 逐幀選片。開源權重＋桌機代理的組合，為獨立安全研究與紅隊提供新樣本。\n\n33. Nemotron 3.5 Super VL：約 26 兆 token 預訓練＋開放資料集與 NeMo Gym RL 環境\n新聞日期：2026-10-15\n新聞來源：[NVIDIA Blog：Nemotron 3.5 Super VL](https://blogs.nvidia.com/blog/nemotron-3-5-super-vl/)\n重點摘錄：輝達揭露 Super VL 在預訓練與持續預訓練合計約 26 兆 token，後訓練約 380 萬樣本，並跨數十環境做強化學習；同時在 Hugging Face 釋出代理工具使用、金融、指令跟隨、長上下文、公平性與視覺語言等開放資料集，以及 NeMo Gym 中的 RL 環境。研究與工程意義在於把「可後訓練的開源代理模型」做成可複製配方，讓企業用自有資料把通用模型推成垂直代理，而不必每次從零訓練。\n\n34. 輝達 cuPotential 等工具把原子／分子與製程模擬搬上 GPU，服務「AI 定義晶圓廠」\n新聞日期：2026-10-14\n新聞來源：[GlobeNewswire：NVIDIA and Semiconductor Leaders Advance AI-Defined Fabs](https://www.globenewswire.com/news-release/2026/10/14/3380979/0/en/nvidia-and-semiconductor-leaders-advance-ai-across-chip-design-and-manufacturing-for-ai-defined-fabs.html)\n重點摘錄：除產業數字外，此發布的研究／工程突破在於把第一原理與製程模擬（原子／分子、3D 製程、檢測）系統性 GPU 化，並與 EDA／設備廠工作流打通。Lam、Synopsys、Applied、Siemens 等公布的 10–35 倍加速，意味先進節點微影、蝕刻、腔體與設計驗證的迭代週期可壓縮，對 2 奈米／A14 與先進封裝良率爬升具實質幫助。這也讓「做 AI 的晶片」與「用 AI 做晶片」形成雙向飛輪。\n\n35. GPT-Rosalind：針對藥物／蛋白質設計、診斷與抗菌抗藥等生命科學推理的專用模型開放學術通道\n新聞日期：2026-10-15\n新聞來源：[OpenAI：GPT-Rosalind Academic Plan](https://openai.com/index/introducing-the-rosalind-academic-plan/)\n重點摘錄：OpenAI 將生命科學模型 GPT-Rosalind 透過學術方案擴大給大學實驗室，工作台支援藥物化學、基因體與濕實驗協助等工具編排；應用領域涵蓋藥物與蛋白質設計、疾病偵測、疫苗與免疫、基因／RNA 療法、農業與動物健康、生態保育、抗菌抗藥等。官方示範對照顯示，在高後果病原體相關請求上，系統會拒給可操作序列／實驗細節，改給高階框架，反映科研模型在「加速發現」與「生物安全」之間的產品化取捨。對研究社群，這是把前沿推理模型嵌進真實實驗工作流的重要一步。\n"}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent),CATS=D.categories,days=D.days;
var st={day:days.length?days[0].day:'',cat:'全部',q:''};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function url(u){return /^https?:\/\//i.test(u||'')?esc(u):''}
function hl(s,q){s=esc(s);if(!q)return s;var e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(e,'gi'),function(m){return'<mark>'+m+'</mark>'})}
days.forEach(function(d){var o=document.createElement('option');o.value=d.day;o.textContent=d.day+(d===days[0]?' 最新':'');$('day').appendChild(o)});
['全部'].concat(CATS).forEach(function(c){var b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=function(){st.cat=c;render()};$('chips').appendChild(b)});
$('day').onchange=function(){st.day=this.value;render()};
$('q').oninput=function(){st.q=this.value.trim();render()};
function card(it,day,q){var m=url(it.map),u=url(it.url);
return '<article class="card"><div class="tag">'+esc(it.cat)+(q?' · '+esc(day):'')+'</div><h2>'+hl(it.title,q)+'</h2><p>'+hl(it.summary,q)+'</p><div class="info"><span>📅 '+esc(it.date||'—')+'</span>'+
(u?'<a href="'+u+'" target="_blank" rel="noopener noreferrer">📰 '+hl(it.source_name||'新聞來源',q)+'</a>':'<span>📰 '+hl(it.source_name,q)+'</span>')+
(m?'<a href="'+m+'" target="_blank" rel="noopener noreferrer">📍 Google 地圖</a>':'')+'</div></article>'}
function render(){
[].forEach.call($('chips').children,function(b){b.classList.toggle('on',b.textContent===st.cat)});
var q=st.q.toLowerCase(),out=[],n=0,D0=days.filter(function(d){return d.day===st.day})[0]||{};
$('meta').textContent=D0.compiled?'整理時間：'+D0.compiled:'';
$('lead').innerHTML=q?'搜尋範圍：全部 '+days.length+' 天':esc(D0.title)+(D0.sort_note?'<br>'+esc(D0.sort_note):'');
$('day').disabled=!!q;
(q?days:[D0]).forEach(function(d){(d.categories||[]).forEach(function(c){if(st.cat!=='全部'&&c.name!==st.cat)return;
c.items.forEach(function(it){it.cat=c.name;if(q&&(it.title+it.summary+it.source_name).toLowerCase().indexOf(q)<0)return;n++;out.push(card(it,d.day,st.q))})})});
$('sum').textContent=(q?'找到 ':'共 ')+n+' 則新聞';
$('list').innerHTML=out.join('')||'<p>沒有符合的新聞。</p>';
$('note').innerHTML=esc(q?'':D0.note||'').replace(/\n/g,'<br>');}
render();
var C=D.celeb;
function inl(s){s=esc(s);return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,function(m,a,u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+a+'</a>'})}
function md(src){var o=[],ul=0,tb=null;function fl(){if(ul){o.push('</ul>');ul=0}if(tb){o.push('<div class="tbl"><table>'+tb.map(function(r,i){return'<tr>'+r.map(function(c){return(i?'<td>':'<th>')+inl(c.trim())+(i?'</td>':'</th>')}).join('')+'</tr>'}).join('')+'</table></div>');tb=null}}
src.split('\n').forEach(function(l){var m;if(/^\|/.test(l)){if(ul){o.push('</ul>');ul=0}var c=l.replace(/^\||\|$/g,'').split('|');if(c.every(function(x){return/^\s*-+\s*$/.test(x)}))return;(tb=tb||[]).push(c);return}
if(tb)fl();if(m=l.match(/^(#{1,3}) (.*)/)){fl();o.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>')}else if(m=l.match(/^- (.*)/)){if(!ul){o.push('<ul>');ul=1}o.push('<li>'+inl(m[1])+'</li>')}else if(l.trim()){fl();o.push('<p>'+inl(l)+'</p>')}else fl()});fl();return o.join('')}
function celeb(){if(!C){$('celeb').innerHTML='<p>尚無名人持股資料。</p>';return}
var H=['Ticker','Company_or_Name','Held_By','Approximate_Notes','Source'];
$('celeb').innerHTML='<h2 style="font-size:1.1rem">名人持股表 <a href="data/holdings_latest.csv" download style="font-size:.85rem">下載 CSV</a></h2><div class="tbl"><table><tr>'+H.map(function(k){return'<th>'+k+'</th>'}).join('')+'</tr>'+C.rows.map(function(r){return'<tr>'+H.map(function(k){return'<td>'+esc(r[k])+'</td>'}).join('')+'</tr>'}).join('')+'</table></div><div class="md">'+md(C.md)+'</div>'}
celeb();
var A=D.ai||[];
function ai(day){if(!A.length){$('ai').innerHTML='<p>尚無資料</p>';return}var x=A.filter(function(a){return a.day===day})[0]||A[0];
$('ai').innerHTML='<select id="aiday" aria-label="選擇 AI 快報日期">'+A.map(function(a,i){return'<option value="'+esc(a.day)+'"'+(a===x?' selected':'')+'>'+esc(a.day)+(i?'':' 最新')+'</option>'}).join('')+'</select><div class="md">'+md(x.md)+'</div>';
$('aiday').onchange=function(){ai(this.value)}}
ai();
function show(v){document.body.classList.toggle('cv',v!=='news');$('celeb').classList.toggle('on',v==='celeb');$('ai').classList.toggle('on',v==='ai');[].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x.dataset.v===v)});scrollTo(0,0)}
[].forEach.call($('tabs').children,function(b){b.onclick=function(){show(b.dataset.v);history.replaceState(null,'',b.dataset.v==='news'?location.pathname:'#'+b.dataset.v)}});
if(location.hash==='#celeb'||location.hash==='#ai')show(location.hash.slice(1));
})();
</script></body></html>
