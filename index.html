: "2026-10-13", "map": "", "source_name": "中央社：京元電與輝達簽預付款協議　母子公司供應測試產能", "url": "https://www.cna.com.tw/news/afe/202610130188.aspx", "summary": "晶圓測試廠京元電公告，董事會決議與輝達簽訂客戶預付款協議，由輝達預付款項，京元電及美國全資子公司AeternZ Semiconductor Testing Corporation在美國建置產能，為輝達保留產能並提供測試服務，預付款以日後服務款項抵減。京元電先前公告董事會決議在美國設立孫公司及投資設廠，授權董事長謝其俊在14億美元（約新台幣449億元）額度內全權處理美國投資設廠事宜。"}, {"no": 4, "title": "矽格集團砸21.88億元　購建漢竹科廠房擴AI測試", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E7%AB%B9%E7%A7%91%E5%AD%B8%E5%9C%92%E5%8D%80", "source_name": "中央社：矽格集團砸21.88億元　購建漢竹科廠房擴AI測試", "url": "https://www.cna.com.tw/news/afe/202610130315.aspx", "summary": "矽格子公司矽格聯測以新台幣21.88億元得標購置建漢科技竹科廠房，因應美系客戶AI高效能運算晶片的強勁需求；廠房與附屬設備占地7870坪、建物約1萬4215坪，新廠房量產後預估較現有量產廠區再增加25%產能，將聚焦AI互連矽光子高速光通訊IC測試、AI特殊應用晶片（ASIC）晶圓及CoWoS晶片測試服務。矽格前8月AI、CPU/GPU、ASIC、矽光子等業績占比增至24%，預估2027年可提升至3成。"}, {"no": 5, "title": "愛普GDR折價5.22%發行　籌4.16億美元支應外幣購料", "date": "2026-10-13", "map": "", "source_name": "中央社：愛普GDR折價5.22%發行　籌4.16億美元支應外幣購料", "url": "https://www.cna.com.tw/news/afe/202610130031.aspx", "summary": "客製化記憶體設計廠愛普科技完成海外存託憑證（GDR）發行訂價，每單位56.15美元（約每股新台幣898元），較12日收盤價947元折價約5.22%，共發行740萬單位GDR、募集資金4.16億美元，短時間內即獲5倍超額認購，預計於盧森堡證券交易所掛牌。受消費性設備記憶體供不應求、價格調漲及矽電容放量帶動，9月營收攀高至11.9億元創歷史新高；分離式矽電容今年第2季量產出貨。"}]}, {"name": "AI", "items": [{"no": 1, "title": "「歐洲必須加入競賽！」黃仁勳預告20億美元AI投資", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：「歐洲必須加入競賽！」黃仁勳預告20億美元AI投資", "url": "https://tw.stock.yahoo.com/news/%E6%AD%90%E6%B4%B2%E5%BF%85%E9%A0%88%E5%8A%A0%E5%85%A5%E7%AB%B6%E8%B3%BD-%E9%BB%83%E4%BB%81%E5%8B%B3%E9%A0%90%E5%91%8A20%E5%84%84%E7%BE%8E%E5%85%83ai%E6%8A%95%E8%B3%87-172003186.html", "summary": "輝達執行長黃仁勳13日在巴黎表示，公司計劃未來一周宣布20億美元的歐洲投資案，延續過去一年已投入當地的80億美元布局，並宣布對Doctolib、Genesis AI、Pigment及Entalpic等法國新創提供新資金，喊話「歐洲必須加入競賽」。巴黎是此次歐洲行首站，後續將前往倫敦與柏林；黃仁勳將開源模型視為歐洲追趕美國AI發展的途徑，輝達已投資Mistral AI，Mistral最新模型使用4,000顆Grace Blackwell晶片訓練。"}, {"no": 2, "title": "AI支出何時降溫？高盛緊盯三大訊號、兩項已浮現", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：AI支出何時降溫？高盛緊盯三大訊號、兩項已浮現", "url": "https://tw.stock.yahoo.com/news/ai%E6%94%AF%E5%87%BA%E4%BD%95%E6%99%82%E9%99%8D%E6%BA%AB-%E9%AB%98%E7%9B%9B%E7%B7%8A%E7%9B%AF%E4%B8%89%E5%A4%A7%E8%A8%8A%E8%99%9F-%E5%85%A9%E9%A0%85%E5%B7%B2%E6%B5%AE%E7%8F%BE-171003199.html", "summary": "高盛資深宏觀交易員Bobby Molavi指出，判斷AI資本支出週期是否逼近轉折的三大訊號中，股價與實際獲利背離、信貸市場重新評估AI融資風險兩項已出現，資本支出增速放緩則尚待驗證。今年已有超過5,000億美元債務發行用於支持AI基礎設施；高盛預測超大規模雲端服務商資本支出年增率將於2026年第三季達116%高峰，到2027年底降至20%出頭。10檔核心AI相關股票占標普500總市值約40%。"}, {"no": 3, "title": "AMD推代理式AI機櫃Helion　11月供貨、鴻海緯穎雲達挺進", "date": "2026-10-13", "map": "", "source_name": "Yahoo新聞（緯來新聞網）：AMD推代理式AI機櫃Helion　11月供貨、鴻海緯穎雲達挺進", "url": "https://tw.news.yahoo.com/amd-%E6%8E%A8%E4%BB%A3%E7%90%86%E5%BC%8F-ai-%E6%A9%9F%E6%AB%83-helion-095900680.html", "summary": "AMD於2026 OCP全球高峰會發表代理式AI機櫃AMD Helion，預計2026年11月供貨。「純CPU機櫃」搭載第6代EPYC處理器，單一機櫃最多可容納32,768個CPU核心，鎖定超大規模雲端業者；「整合式機櫃」則把EPYC CPU、Instinct MI350P GPU與通用運算節點放進同一平台，瞄準企業用戶。Helion是參考設計，AMD計劃把規格提交給OCP交由合作夥伴開發，鴻海、雲達、緯穎等台廠已表態支援。"}, {"no": 4, "title": "鴻海參加OCP高峰會　聚焦新一代AI機櫃方案", "date": "2026-10-13", "map": "", "source_name": "中央社：鴻海參加OCP高峰會　聚焦新一代AI機櫃方案", "url": "https://www.cna.com.tw/news/afe/202610130153.aspx", "summary": "2026年開放運算計畫（OCP）全球高峰會登場，鴻海旗下鴻佰科技展出輝達Vera Rubin NVL72平台等方案，以及對MGX架構Vera Rubin平台的完整產品支援，鴻騰精密則聚焦AI資料中心高速互連、供電與散熱需求。鴻海並持續攜手英特爾，以Intel Xeon平台為基礎共同推進Rack-scale Agentic AI解決方案，呈現集團從關鍵零組件、運算托盤到機架級系統的布局。"}, {"no": 5, "title": "日媒：Anthropic日本首座數據中心擬設於大阪", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E5%BA%9C", "source_name": "中央社：日媒：Anthropic日本首座數據中心擬設於大阪", "url": "https://www.cna.com.tw/news/aopl/202610130104.aspx", "summary": "日本經濟新聞報導，NTT子公司NTT DATA集團與Anthropic正協商於大阪府南部灣岸地區新設數據中心據點，計劃在2026年度內簽約、2028年開始局部運轉，建設費用上看1兆日圓，若大量導入搭載先進GPU的伺服器，整體設施投資額預計擴大至數兆日圓規模。這將是Anthropic在日本的首座數據中心；日本政府目標在2035年度前由公私部門合計投入32.7兆日圓於數據中心與蓄電池等領域。"}]}, {"name": "金融", "items": [{"no": 1, "title": "8月國銀存款衝8382億　改寫歷年同月新紀錄", "date": "2026-10-14", "map": "", "source_name": "Yahoo新聞（卡優新聞網）：8月國銀存款衝8382億　改寫歷年同月新紀錄", "url": "https://tw.news.yahoo.com/8%E6%9C%88%E5%9C%8B%E9%8A%80%E5%AD%98%E6%AC%BE%E8%A1%9D8382%E5%84%84-%E6%94%B9%E5%AF%AB%E6%AD%B7%E5%B9%B4%E5%90%8C%E6%9C%88%E6%96%B0%E7%B4%80%E9%8C%84-191629991.html", "summary": "金管會統計，38家本國銀行8月底存款餘額達67兆7,973億元，單月彈升8,382億元，創史上8月新高、史上單月第3高；放款月增3,627億元至49兆2,155億元，為歷年8月次高。8月個人放款增加1,870億元，企業投資單月暴增296億元衝上歷年8月最高；累計1~8月存款增4兆7,049億元、放款增4兆3,950億元，均超越去年全年水準。8月底逾放比維持0.14%，備抵呆帳覆蓋率升至963.6%。"}, {"no": 2, "title": "華爾街大行財報亮點藏隱憂！股票交易撐場　成長動能能否延續？", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：華爾街大行財報亮點藏隱憂！股票交易撐場　成長動能能否延續？", "url": "https://tw.stock.yahoo.com/news/%E8%8F%AF%E7%88%BE%E8%A1%97%E5%A4%A7%E8%A1%8C%E8%B2%A1%E5%A0%B1%E4%BA%AE%E9%BB%9E%E8%97%8F%E9%9A%B1%E6%86%82-%E8%82%A1%E7%A5%A8%E4%BA%A4%E6%98%93%E6%92%90%E5%A0%B4-%E6%88%90%E9%95%B7%E5%8B%95%E8%83%BD%E8%83%BD%E5%90%A6%E5%BB%B6%E7%BA%8C-165004233.html", "summary": "摩根大通、富國銀行與花旗等華爾街大型銀行第三季業績呈現兩樣情，股債震盪推升股票交易收入，但企業併購、IPO與部分債券交易降溫，多家銀行高層指出9月下旬業務放緩尤其明顯。摩根大通第三季市場業務收入年增15%，其中股票交易收入大增49%；高盛第三季獲利優於預期，但固定收益、外匯及大宗商品交易收入年減1%。富國銀行財務長表示，美國10年期公債殖利率大幅攀升已對業務產生影響。"}, {"no": 3, "title": "金管會：疊券要確保客戶風險承受　控管準則預計年底上路", "date": "2026-10-13", "map": "", "source_name": "中央社：金管會：疊券要確保客戶風險承受　控管準則預計年底上路", "url": "https://www.cna.com.tw/news/afe/202610130290.aspx", "summary": "外界關注「疊券」槓桿風險，金管會銀行局副局長王允中表示，日常監理發現少數銀行槓桿操作偏高，今年4月20日已邀銀行公會研議「銀行以金融資產辦理擔保授信的強化措施」，公會近期將函報，若沒問題將在今年底公布施行，並透過金融檢查了解財富管理、私人銀行業務有無過度疊券。據了解，強化措施包含禁止銀行勸誘客戶做疊券、評估最壞情況能否承擔，以及針對客戶做總額度管理。"}, {"no": 4, "title": "金管會10措施強化投信治理　估明年7業者須設類獨董", "date": "2026-10-13", "map": "", "source_name": "中央社：金管會10措施強化投信治理　估明年7業者須設類獨董", "url": "https://www.cna.com.tw/news/afe/202610130281.aspx", "summary": "金管會就公司治理、內部控制及資訊揭露3大面向提出10項強化投信事業治理措施，分2階段推動：第1階段5項措施預計今年底上路，第2階段預計明年6月底實施，將規範負責人兼職行為，並要求資產規模達1兆元以上的投信設置非利害關係董事及公司治理委員會。以今年1月至8月情況預估，元大、國泰、群益、富邦、復華、安聯、統一等7家投信可能適用；國泰投信先前因內控失靈遭重罰600萬元。"}, {"no": 5, "title": "違約交割管控加嚴新制　明年4/1上路", "date": "2026-10-13", "map": "", "source_name": "中央社：違約交割管控加嚴新制　明年4/1上路", "url": "https://www.cna.com.tw/news/afe/202610130297.aspx", "summary": "測試設備廠致茂發生約新台幣5859萬元鉅額違約交割，為上市公司今年第13起。金管會表示，違約管理新制明年4月1日起實施，違約結案者追蹤列管期間延長到5年，首次違約者需預收足額款券10個交易日，再次違約者提高到30個交易日。證期局副局長黃厚銘指出，今年1月到9月集中市場違約金額占全體市場總成交金額比例為10萬分之1.8，交割風險在可控範圍；當沖降稅是否展延將與財政部充分討論。"}]}, {"name": "航運", "items": [{"no": 1, "title": "戰爭紅利持續釋放　全球超大型油輪運費漲到60年來最高", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（鉅亨網）：戰爭紅利持續釋放　全球超大型油輪運費漲到60年來最高", "url": "https://tw.stock.yahoo.com/news/%E6%88%B0%E7%88%AD%E7%B4%85%E5%88%A9%E6%8C%81%E7%BA%8C%E9%87%8B%E6%94%BE-%E5%85%A8%E7%90%83%E8%B6%85%E5%A4%A7%E5%9E%8B%E6%B2%B9%E8%BC%AA%E9%81%8B%E8%B2%BB%E6%BC%B2%E5%88%B060%E5%B9%B4%E4%BE%86%E6%9C%80%E9%AB%98-012738826.html", "summary": "中東戰事延宕大幅拉升長距離原油運輸需求，加上船隊供給嚴重短缺，全球超大型油輪（VLCC）運費已飆升至60年來最高水準。荷蘭國際集團報告指出，一艘9月從沙烏地阿拉伯出發前往荷蘭的油輪，運費折算每桶原油運輸成本達35美元，去年同期均值僅2美元；部分船齡10年左右的二手VLCC成交價已突破1.5億美元，高於約1.35億美元的新船平均造價，出現船價倒掛，部分油輪船長月薪已漲至10萬美元。"}, {"no": 2, "title": "伊朗宣稱兩天內打擊3艘油輪，近日至少10艘超大型油輪停航或掉頭", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "Yahoo股市（財訊快報）：伊朗宣稱兩天內打擊3艘油輪，近日至少10艘超大型油輪停航或掉頭", "url": "https://tw.stock.yahoo.com/news/%E4%BC%8A%E6%9C%97%E5%AE%A3%E7%A8%B1%E5%85%A9%E5%A4%A9%E5%85%A7%E6%89%93%E6%93%8A3%E8%89%98%E6%B2%B9%E8%BC%AA-%E8%BF%91%E6%97%A5%E8%87%B3%E5%B0%9110%E8%89%98%E8%B6%85%E5%A4%A7%E5%9E%8B%E6%B2%B9%E8%BC%AA%E5%81%9C%E8%88%AA%E6%88%96%E6%8E%89%E9%A0%AD-233034262.html", "summary": "伊朗伊斯蘭革命衛隊海軍聲明，12日在荷姆茲海峽打擊一艘大型油輪，稱是兩天內第三艘試圖駛離海峽遭打擊的「違規」大型油輪，並警告在海峽及波斯灣與美軍合作的商船或油輪將招致行動。船舶追蹤數據顯示，近幾日至少10艘超大型原油運輸船（VLCC）及數艘蘇伊士型油輪在駛向阿聯富查伊拉港途中停航或掉頭；報導指若空載油輪撤離擴大，海上接駁與轉運效率恐下降，推高運輸成本並拖慢海灣原油出口恢復。"}, {"no": 3, "title": "關稅提前拉貨與航線改道　洛杉磯港9月貨櫃量新高", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=Port%20of%20Los%20Angeles", "source_name": "Yahoo新聞（台灣新生報）：關稅提前拉貨與航線改道　洛杉磯港9月貨櫃量新高", "url": "https://tw.news.yahoo.com/%E9%97%9C%E7%A8%85%E6%8F%90%E5%89%8D%E6%8B%89%E8%B2%A8%E8%88%87%E8%88%AA%E7%B7%9A%E6%94%B9%E9%81%93-%E6%B4%9B%E6%9D%89%E7%A3%AF%E6%B8%AF9%E6%9C%88%E8%B2%A8%E6%AB%83%E9%87%8F%E6%96%B0%E9%AB%98-121309222.html", "summary": "美國洛杉磯港今年九月貨櫃處理量達一百零四萬二千六百五十二TEU，創港口有史以來單月最高紀錄，較二○二五年七月前次紀錄增加約二萬三千個TEU，是連續第四個月締造歷史性運量；九月滿載進口貨櫃達五十四萬TEU、空貨櫃處理量達三十七萬TEU，同創新高。執行董事Gene Seroka表示，零售業者為因應關稅提前進口、加上全球航線調整推升貨量，聖嬰現象可能影響巴拿馬運河通航，預估未來洛杉磯與長堤兩港貨櫃運量可能增加約五％。"}, {"no": 4, "title": "水手上船時間到？大咖法人「3原因」喊買長榮　全年EPS估飆1倍挑戰43元", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（FTNN新聞網）：水手上船時間到？大咖法人「3原因」喊買長榮　全年EPS估飆1倍挑戰43元", "url": "https://tw.stock.yahoo.com/news/%E6%B0%B4%E6%89%8B%E4%B8%8A%E8%88%B9%E6%99%82%E9%96%93%E5%88%B0-%E5%A4%A7%E5%92%96%E6%B3%95%E4%BA%BA-3%E5%8E%9F%E5%9B%A0-%E5%96%8A%E8%B2%B7%E9%95%B7%E6%A6%AE-%E5%85%A8%E5%B9%B4eps%E4%BC%B0%E9%A3%861%E5%80%8D%E6%8C%91%E6%88%B043%E5%85%83-224000385.html", "summary": "長榮9月營收達497.11億元、年增65%，第3季營收1467.76億元、季增39.6%、年增51.4%。本土法人將長榮第3季稅後EPS預估由7.01元上修至19.43元，2026年稅後EPS上修至43.53元、2027年估51.04元，投資評等調升至「買進」、目標價290元。法人看好美國零售商回補庫存，巴拿馬運河限航效應可能延續至2027年上半年；2026年9月歐洲線平均運價年增121%，美西線及美東線年增均超過250%。"}, {"no": 5, "title": "李在明歡迎北極航線貨櫃輪返國　拚2030年前開通定期服務", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=%E9%87%9C%E5%B1%B1", "source_name": "中央社：李在明歡迎北極航線貨櫃輪返國　拚2030年前開通定期服務", "url": "https://www.cna.com.tw/news/aopl/202610130286.aspx", "summary": "韓國總統李在明在釜山的儀式中，歡迎首艘經由北極航線成功往返歐洲的韓國貨櫃輪PanStar Acro號返國；該船11日返抵韓國，完成長達50天航程，期間停靠英國費利克斯托、荷蘭鹿特丹及波蘭格但斯克。當局指北極航線應可比蘇伊士運河航線縮減約1/3航行時間；海洋水產部長官黃鐘宇表示，預計2027年進一步試航，目標2030年正式啟動定期航班服務，約在2040年達成經濟效益。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "〈美股盤後〉美光跌3.6%晶片股承壓　那指收低、費半連五跌", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈美股盤後〉美光跌3.6%晶片股承壓　那指收低、費半連五跌", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E7%9B%A4%E5%BE%8C-%E7%BE%8E%E5%85%89%E8%B7%8C3-6-%E6%99%B6%E7%89%87%E8%82%A1%E6%89%BF%E5%A3%93-%E9%82%A3%E6%8C%87%E6%94%B6%E4%BD%8E-214147916.html", "summary": "美股13日收低，道瓊指數下跌180.45點收51,670.10點，那斯達克指數下跌41.52點收27,204.38點，S&P 500指數下跌1.79點收7,805.45點，費城半導體指數下跌0.23%、連續第五個交易日走低，過去五個交易日累計下跌逾8%。美光下跌3.6%、應用材料重挫近7%；銀行財報季開跑，花旗下跌5.6%、富國銀行下跌3.1%、摩根大通下跌0.9%。蘋果盤中創348.15美元歷史新高，台積電ADR上漲0.17%。"}, {"no": 2, "title": "美股太樂觀了？花旗指標亮警訊　撤回加碼建議", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：美股太樂觀了？花旗指標亮警訊　撤回加碼建議", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E5%A4%AA%E6%A8%82%E8%A7%80%E4%BA%86-%E8%8A%B1%E6%97%97%E6%8C%87%E6%A8%99%E4%BA%AE%E8%AD%A6%E8%A8%8A-%E6%92%A4%E5%9B%9E%E5%8A%A0%E7%A2%BC%E5%BB%BA%E8%AD%B0-182003359.html", "summary": "花旗集團13日撤回對美股的「加碼」建議，並結束標普500等權重指數的多頭部位，理由是其綜合觀察市場部位、樂觀程度、流動性、槓桿及壓力的POLLS指標，近期讀數已觸及歷史上曾與市場高點同時出現的水準，因此決定「戰術性降低部分風險曝險」。花旗強調此舉並非全面看空；高盛則於週一將全球股票評等上調至「加碼」，認為近期市場回檔後估值已更具吸引力。"}, {"no": 3, "title": "台股挫960點科技股賣壓沉重　塑化、航運與金融強勢", "date": "2026-10-13", "map": "", "source_name": "中央社：台股挫960點科技股賣壓沉重　塑化、航運與金融強勢", "url": "https://www.cna.com.tw/news/afe/202610130147.aspx", "summary": "博通執行長陳福陽、英特爾執行長陳立武雙雙示警AI擴張最大瓶頸是資金，引爆科技股賣壓，台股13日盤中最多重跌逾1200點，終場下跌960.65點、收48341.31點，成交值放大到新台幣1兆1250億元。台積電跌50元收2490元，聯發科跌100元收4525元，台達電跌125元或6.58%收1775元；華南金大漲3.57%收49.35元，台塑化攻上漲停板119元，國喬亮燈漲停。分析師指本週頭號重點為週四台積電法說會。"}, {"no": 4, "title": "三大法人賣超1984億元　外資減碼1653億元史上第3大", "date": "2026-10-13", "map": "", "source_name": "中央社：三大法人賣超1984億元　外資減碼1653億元史上第3大", "url": "https://www.cna.com.tw/news/afe/202610130217.aspx", "summary": "三大法人13日合計賣超新台幣1984.46億元，外資賣超1653.42億元，連續5個交易日賣超並創史上第3大單日賣超金額；自營商大砍569.76億元為史上第4大賣超，僅投信買超238.72億元。外資賣超前3名為主動中信台灣收益（00406A）11萬8944張、元大台灣50（0050）10萬6149張及力積電9萬7828張；買超前3名為群益台灣精選高息（00919）3萬4488張、台新新光金2萬2310張及陽明2萬1905張。"}, {"no": 5, "title": "AI投資前景疑慮引發科技股賣壓　韓日台領跌亞股", "date": "2026-10-13", "map": "", "source_name": "中央社：AI投資前景疑慮引發科技股賣壓　韓日台領跌亞股", "url": "https://www.cna.com.tw/news/afe/202610130274.aspx", "summary": "市場對AI投資熱潮前景再生疑慮，引發科技股重挫，韓、日、台股市13日在科技股賣壓拖累下領跌亞股。韓國Kospi指數早盤一度重挫逾5%，觸發賣方程式交易暫停機制，首爾股市終場下跌5.5%，SK海力士暴跌10%、三星電子跌逾7%；日經225指數下跌1.8%，鎧俠暴跌逾13%，東京威力科創重挫逾7%，愛德萬測試跌逾8%。市場密切關注財報季及美國即將公布的經濟數據。"}]}, {"name": "Futures", "items": [{"no": 1, "title": "開盤迎大反彈？美股微幅走跌　台指期夜盤逆勢上漲", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（民視財經網）：開盤迎大反彈？美股微幅走跌　台指期夜盤逆勢上漲", "url": "https://tw.stock.yahoo.com/news/%E9%96 "2026-10-13", "map": "", "source_name": "Yahoo股市（財訊快報）：高市籲緊急推動積極財政，重申美日協調穩匯、未提日圓防守價位", "url": "https://tw.stock.yahoo.com/news/%E9%AB%98%E5%B8%82%E7%B1%B2%E7%B7%8A%E6%80%A5%E6%8E%A8%E5%8B%95%E7%A9%8D%E6%A5%B5%E8%B2%A1%E6%94%BF-%E9%87%8D%E7%94%B3%E7%BE%8E%E6%97%A5%E5%8D%94%E8%AA%BF%E7%A9%A9%E5%8C%AF-%E6%9C%AA%E6%8F%90%E6%97%A5%E5%9C%93%E9%98%B2%E5%AE%88%E5%83%B9%E4%BD%8D-052601060.html", "summary": "日本首相高市早苗13日表示，當前正是緊急實施「負責任、積極主動」財政政策的時刻，日本將持續與美國保持溝通以確保外匯市場穩定，美日兩國正努力維持匯市秩序，但未提出具體干預安排或匯率防守價位。日本政府10月9日宣布擴大支出檢討，聚焦201項專用基金，預估下一財政年度底合計餘額約7兆日圓以尋找政策財源；報導指相關表態尚不能解讀為已決定聯手進場干預。"}]}, {"name": "Commodities", "items": [{"no": 1, "title": "《貴金屬》美元指數上漲　COMEX黃金下跌0.6%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（MoneyDJ）：《貴金屬》美元指數上漲　COMEX黃金下跌0.6%", "url": "https://tw.stock.yahoo.com/news/%E8%B2%B4%E9%87%91%E5%B1%AC-%E7%BE%8E%E5%85%83%E6%8C%87%E6%95%B8%E4%B8%8A%E6%BC%B2-comex%E9%BB%83%E9%87%91%E4%B8%8B%E8%B7%8C0-6-221600063.html", "summary": "COMEX 12月黃金期貨12日收盤下跌25.7美元或0.6%至每盎司4,190.6美元，美元指數上漲0.4%；12月白銀期貨下跌0.9%至每盎司60.51美元，NYMEX 1月鉑金期貨上漲0.1%至1,695.7美元，12月鈀金期貨下跌0.7%至1,142美元，COMEX 12月期銅上漲1%至每磅6.7615美元。分析師指美元接近一年半高點令金價承壓，市場關注聯準會主席華許談話及週三公布的CPI；SPDR黃金ETF持有量持平於1,053.13公噸。"}, {"no": 2, "title": "全球央行購金第4大戶轉賣方　年底前黃金儲存占比降至75%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（鉅亨網）：全球央行購金第4大戶轉賣方　年底前黃金儲存占比降至75%", "url": "https://tw.stock.yahoo.com/news/%E5%85%A8%E7%90%83%E5%A4%AE%E8%A1%8C%E8%B3%BC%E9%87%91%E7%AC%AC4%E5%A4%A7%E6%88%B6%E8%BD%89%E8%B3%A3%E6%96%B9-%E5%B9%B4%E5%BA%95%E5%89%8D%E9%BB%83%E9%87%91%E5%84%B2%E5%AD%98%E5%8D%A0%E6%AF%94%E9%99%8D%E8%87%B375-012003875.html", "summary": "哈薩克央行副行長Moldabekova表示，美國公債殖利率升至多年高點使美元資產吸引力明顯提高，央行計劃今年底前將黃金占外匯存底比重從目前約78%降至75%，一半透過出售黃金相關選擇權、一半透過出售實體黃金。哈薩克黃金儲備已增至386噸，9月底外匯存底規模達664億美元；世界黃金協會數據顯示，2026年前八個月哈薩克央行為全球第四大黃金買家。金價今年1月曾一度攀升至每盎司5,600美元。"}, {"no": 3, "title": "黃金最壞時刻已過？瑞銀：美債殖利率回落將讓黃金復甦", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（鉅亨網）：黃金最壞時刻已過？瑞銀：美債殖利率回落將讓黃金復甦", "url": "https://tw.stock.yahoo.com/news/%E9%BB%83%E9%87%91%E6%9C%80%E5%A3%9E%E6%99%82%E5%88%BB%E5%B7%B2%E9%81%8E-%E7%91%9E%E9%8A%80-%E7%BE%8E%E5%82%B5%E6%AE%96%E5%88%A9%E7%8E%87%E5%9B%9E%E8%90%BD%E5%B0%87%E8%AE%93%E9%BB%83%E9%87%91%E5%BE%A9%E7%94%A6-234002390.html", "summary": "瑞銀12日報告指出，金價自9月初以來累計下跌約5%，同期美國10年期公債殖利率從約4.8%升至5.3%以上，美元指數從約100升至102以上，金價從每盎司逾4,400美元回落至約4,140美元；市場對進一步升息的預期已大致反映，若勞動市場降溫帶動殖利率回落，黃金有機會反彈。瑞銀將每盎司3,990至4,030美元視為近期重要支撐區，若站穩4,280至4,320美元以上則顯示技術動能改善。"}, {"no": 4, "title": "智利銅礦崩塌事故引發斷供隱憂，LME期銅週一上漲0.54%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（財訊快報）：智利銅礦崩塌事故引發斷供隱憂，LME期銅週一上漲0.54%", "url": "https://tw.stock.yahoo.com/news/%E6%99%BA%E5%88%A9%E9%8A%85%E7%A4%A6%E5%B4%A9%E5%A1%8C%E4%BA%8B%E6%95%85%E5%BC%95%E7%99%BC%E6%96%B7%E4%BE%9B%E9%9A%B1%E6%86%82-lme%E6%9C%9F%E9%8A%85%E9%80%B1-%E4%B8%8A%E6%BC%B20-54-001728577.html", "summary": "倫敦金屬交易所（LME）3個月銅合約12日收盤上漲78.50美元或0.54%，報每噸14,618.50美元，智利國家銅業公司（Codelco）一座礦山發生崩塌並造成人員死亡，加劇市場對銅供應的擔憂。其他基本金屬方面，錫上漲203美元報每噸53,209美元，鋅下跌1.26%報3,757.50美元，鉛下跌0.24%報1,883.50美元，鋁上漲0.13%報3,052.50美元，鎳下跌0.02%報15,619美元。"}, {"no": 5, "title": "礦山增產受限　白銀市場連續六年供給短缺", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（MoneyDJ）：礦山增產受限　白銀市場連續六年供給短缺", "url": "https://tw.stock.yahoo.com/news/%E7%A4%A6%E5%B1%B1%E5%A2%9E%E7%94%A2%E5%8F%97%E9%99%90-%E7%99%BD%E9%8A%80%E5%B8%82%E5%A0%B4%E9%80%A3%E7%BA%8C%E5%85%AD%E5%B9%B4%E4%BE%9B%E7%B5%A6%E7%9F%AD%E7%BC%BA-014900324.html", "summary": "白銀協會《世界白銀調查報告》指出，全球白銀市場預計在2026年連續第六年出現供應短缺，缺口將由2025年的4,030萬盎司擴大至4,630萬盎司；全球礦山產量預計持平，白銀總供應量則可能減少約2%。報導指礦山增產能力有限、新礦開發週期漫長及高品位礦床儲備不足等結構性限制，可能形成中長期支撐，但供應短缺並不代表價格必然持續上漲，仍須觀察需求變化與投資資金流向。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "第3季PC智慧手機出貨年減逾2成　記憶體高漲衝擊", "date": "2026-10-13", "map": "", "source_name": "中央社：第3季PC智慧手機出貨年減逾2成　記憶體高漲衝擊", "url": "https://www.cna.com.tw/news/afe/202610130119.aspx", "summary": "研調機構顧能統計，第3季全球個人電腦出貨量滑落至5540萬台，為2023年初以來最低水準，年減22.4%，主因第2季DRAM成本較去年同期飆升5倍，電腦廠將成本轉嫁客戶。Counterpoint Research估計第3季全球智慧手機出貨量年減20%，為2012年以來同期新低，智慧手機零售價格今年來上漲20%，消費者拉長換機時間；該機構表示在零組件成本和供應狀況改善前，整體出貨量不太可能實質復甦。"}, {"no": 2, "title": "光通訊台、美股雙殺！「這指標股」跌停摔破3000元　IET、上詮暴跌逾9%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（FTNN新聞網）：光通訊台、美股雙殺！「這指標股」跌停摔破3000元　IET、上詮暴跌逾9%", "url": "https://tw.stock.yahoo.com/news/%E5%85%89%E9%80%9A%E8%A8%8A%E5%8F%B0-%E7%BE%8E%E8%82%A1%E9%9B%99%E6%AE%BA-%E9%80%99%E6%8C%87%E6%A8%99%E8%82%A1-%E8%B7%8C%E5%81%9C%E6%91%94%E7%A0%B43000%E5%85%83-%E5%85%A8%E6%96%B0-102500283.html", "summary": "美股12日光通訊族群集體下挫，Lumentum暴跌9.78%、Coherent挫7.87%、Ciena暴跌近10%；台股13日光通訊概念股同受牽連呈一片綠海，指標股聯亞收跌停價2725元，全新跌停收508元、成交量破萬張，前鼎跌停收219元，IET-KY、上詮均暴跌逾9%，華星光、訊芯-KY、聯鈞全跌逾8%；盤面僅台通小漲0.61%、台星科漲1.53%收266元逆勢收紅。"}, {"no": 3, "title": "銅箔基板也撐不住...聯茂、台光電慘吞跌停　分析師看法曝", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（Yahoo財經）：銅箔基板也撐不住...聯茂、台光電慘吞跌停　分析師看法曝", "url": "https://tw.stock.yahoo.com/news/%E9%8A%85%E7%AE%94%E5%9F%BA%E6%9D%BF%E4%B9%9F%E6%92%90%E4%B8%8D%E4%BD%8F%E8%81%AF%E8%8C%82%E3%80%81%E5%8F%B0%E5%85%89%E9%9B%BB%E6%85%98%E5%90%9E%E8%B7%8C%E5%81%9C-%E5%88%86%E6%9E%90%E5%B8%AB%E7%9C%8B%E6%B3%95%E6%9B%9D-031542064.html", "summary": "台股13日重挫，銅箔基板龍頭台光電一早最低來到5535元一度跌停、摔破5600元大關，聯茂重挫跌停，台燿大跌半根以上，族群氣氛低迷。資深分析師謝明哲認為產業本身沒有問題，在ASIC、GPU的需求與發展下，明後兩年銅箔基板需求持續提升並帶動M8至M9的發展，但族群先前漲勢強勁、跌幅更深，建議暫時觀望，待股價出現止穩再做布局。"}, {"no": 4, "title": "車用零配件台廠　搶攻AI伺服器液冷散熱商機", "date": "2026-10-13", "map": "", "source_name": "中央社：車用零配件台廠　搶攻AI伺服器液冷散熱商機", "url": "https://www.cna.com.tw/news/afe/202610130117.aspx", "summary": "車用零配件和車用精密機械加工台廠加速切入AI伺服器和資料中心供應鏈，主要聚焦AI伺服器液冷散熱關鍵零組件。宇隆看好液冷系統關鍵元件通用快接頭UQD，目標今年UQD業績占比力拚1成；時碩獲日系大廠伺服器散熱應用訂單，劍麟加快液冷散熱分歧管客戶驗證與量產，智伸科已切入AI晶片和美系機櫃水冷板等大廠供應鏈，吉茂獲北美客戶認證、今年逐步放量。"}, {"no": 5, "title": "全體上市公司前9月總營收45.18兆元　年增38%", "date": "2026-10-13", "map": "", "source_name": "中央社：全體上市公司前9月總營收45.18兆元　年增38%", "url": "https://www.cna.com.tw/news/afe/202610130205.aspx", "summary": "證交所統計，1054家上市公司前9月累計總營收達新台幣45兆1846億元，較去年同期成長38.3%，營收成長公司739家、衰退315家；9月全體上市公司總營收6兆1679億元，年增47.28%。前9月營收成長較大產業為受惠AI應用與新世代記憶體需求的電子通路業、受惠AI伺服器需求的電腦及周邊設備業，以及受惠AI應用與高效能運算需求的半導體業；9月油電燃氣業則因中東戰事推升產品價格。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "〈能源盤後〉多空拉鋸！俄美柴油協議遇上中東戰火　油市漲跌互現", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈能源盤後〉多空拉鋸！俄美柴油協議遇上中東戰火　油市漲跌互現", "url": "https://tw.stock.yahoo.com/news/%E8%83%BD%E6%BA%90%E7%9B%A4%E5%BE%8C-%E5%A4%9A%E7%A9%BA%E6%8B%89%E9%8B%B8-%E4%BF%84%E7%BE%8E%E6%9F%B4%E6%B2%B9%E5%8D%94%E8%AD%B0%E9%81%87%E4%B8%8A%E4%B8%AD%E6%9D%B1%E6%88%B0%E7%81%AB-%E6%B2%B9%E5%B8%82%E6%BC%B2%E8%B7%8C%E4%BA%92%E7%8F%BE-214004022.html", "summary": "國際油價13日收盤漲跌互見，布蘭特原油期貨下跌0.96美元或0.9%收每桶105.69美元，WTI期貨上漲0.40美元或0.4%收每桶94.14美元；WTI 2027年期貨連續第12個交易日創紀錄高點、觸及每桶84美元。美國柴油期貨上漲約5%，美國柴油零售價格週一平均約每加侖6.27美元，較去年同期高出71%。OPEC連續第6個月下調2026年全球石油需求成長預測，已由年初的每日140萬桶下調至每日40萬桶。"}, {"no": 2, "title": "川普稱青年運動企圖在美期中選舉前推升油價　批行徑惡劣", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=King%20Khalid%20International%20Airport", "source_name": "中央社：川普稱青年運動企圖在美期中選舉前推升油價　批行徑惡劣", "url": "https://www.cna.com.tw/news/aopl/202610140004.aspx", "summary": "美伊戰爭引發的區域衝突擴大之際，美國總統川普發文指控葉門叛軍「青年運動」企圖在美國期中選舉前蓄意推升油價，並警告他「絕不忘記」該組織襲擊沙烏地阿拉伯一事，警告將延續至11月3日期中選舉結束後。青年運動近日對沙國展開一系列攻擊，包括空襲利雅德的哈立德國王國際機場，造成13死、逾300人受傷，迫使機場暫停營運；川普指該組織在伊朗授意下重啟攻擊。"}, {"no": 3, "title": "沙國計畫將輸油管線出口能力提高至每日千萬桶", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（MoneyDJ）：沙國計畫將輸油管線出口能力提高至每日千萬桶", "url": "https://tw.stock.yahoo.com/news/%E6%B2%99%E5%9C%8B%E8%A8%88%E7%95%AB%E5%B0%87%E8%BC%B8%E6%B2%B9%E7%AE%A1%E7%B7%9A%E5%87%BA%E5%8F%A3%E8%83%BD%E5%8A%9B%E6%8F%90%E9%AB%98%E8%87%B3%E6%AF%8F%E6%97%A5%E5%8D%83%E8%90%AC%E6%A1%B6-230400319.html", "summary": "沙烏地阿拉伯能源部長阿卜杜勒阿齊茲親王在利雅德世界石油大會表示，沙國計畫將輸油管線原油出口能力從700萬桶/日提高至每日最高1,000萬桶；可透過暫時將一條天然氣管線改作原油運輸用途，在七至八週內增加每日最高120萬桶出口能力，若進一步投入資金，新增出口能力總計可達每日300萬桶。升級東西向輸油管線抽油站等建設，可望在未來兩至三年內將避開波斯灣及紅海主要航線的運輸能力提高至每日約1,000萬桶。"}, {"no": 4, "title": "川普稱俄將對外供應柴油　俄估年底前月出口量上看350萬公噸", "date": "2026-10-13", "map": "", "source_name": "中央社：川普稱俄將對外供應柴油　俄估年底前月出口量上看350萬公噸", "url": "https://www.cna.com.tw/news/aopl/202610130283.aspx", "summary": "川普表示俄羅斯將立即向美國及全球市場供應逾30萬公噸柴油，11月再供應50萬噸，之後追加100萬噸，美國並暫時解除對俄羅斯燃料的制裁。俄國副總理諾瓦克表示，今年底前柴油出口量可能達到每月300萬到350萬公噸，重返危機前水準；俄羅斯上個月對中亞出口相當於42.7萬公噸柴油。美國柴油價格飆升已成11月3日期中選舉前關注議題，協議則引發部分美國國會議員強烈反彈。"}, {"no": 5, "title": "中油：油氣供應至年底無虞　已提前規劃明年第1季採購", "date": "2026-10-13", "map": "", "source_name": "中央社：中油：油氣供應至年底無虞　已提前規劃明年第1季採購", "url": "https://www.cna.com.tw/news/afe/202610130019.aspx", "summary": "中東情勢升溫，台灣中油表示已增購非中東地區原油、彈性調整油輪及液化天然氣（LNG）船期，國內油氣供應至年底無虞，並已提前規劃明年第1季採購量。中油指出，9月中旬沙烏地阿美因東西管線遭炸，無法供應9、10月期約貨油，已立即增購現貨原油補足缺口；近期國際原油價格高檔震盪、運費及保險費大幅上漲，中油將配合政府穩定物價政策，持續凍漲或緩漲主要油氣產品價格。"}]}], "warnings": [], "day": "2026-10-14"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-11 至 2026-10-13）", "compiled": "2026-10-13 07:11（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件；10月12日為國慶連假後首個台股交易日，台指期夜盤及美股收盤依台灣時間12日晚間至13日凌晨報導", "note": "金融類4則、Currencies類4則、Commodities類2則、Sectors類4則（近3日符合條件且來源可查證之新聞不足5則；Commodities類以貴金屬與銅為主，原油走勢歸入Energy類），其餘各類各5則；10月12日為國慶連假後首個台股交易日，期貨類涵蓋連假夜盤補跌與12日夜盤費半拖累；航運與部分產業新聞對「十一長假後出貨」僅作過境提及、未以中國為主軸；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "微軟推新一代AI晶片Maia 300　部分採台積電2奈米製程", "date": "2026-10-12", "map": "", "source_name": "中央社：微軟推新一代AI晶片Maia 300　部分採台積電2奈米製程", "url": "https://www.cna.com.tw/news/ait/202610120307.aspx", "summary": "微軟宣布推出第3代自研AI晶片Maia 300，計劃明年部署數量可能超過100萬顆、規模達數個GW。負責關鍵運算的小晶片採用台積電2奈米製程，其餘小晶片採成本較低的3奈米製程負責資料傳輸；每機櫃容納96顆晶片、耗電約167kW，對照輝達GB300機櫃72顆GPU、耗電約142kW。微軟先前表示今年資本支出將超過1750億美元。"}, {"no": 2, "title": "南亞科：DRAM仍非常缺貨　第4季價格和毛利率看升", "date": "2026-10-12", "map": "", "source_name": "中央社：南亞科：DRAM仍非常缺貨　第4季價格和毛利率看升", "url": "https://www.cna.com.tw/news/afe/202610120167.aspx", "summary": "南亞科第3季營收新台幣1336.49億元、季增61.9%，DRAM平均售價季增逾60%，毛利率85.7%、稅後淨利876.27億元、每股純益25.4元；前9月稅後淨利1638.77億元、每股純益49.28元。總經理李培瑛表示DRAM仍非常缺貨，第4季價格可望續漲、毛利率有機會再升；AI基礎設施相關營收比重逾20%，5A新廠預計2027年第1季裝機，2028年底月投片3萬片、2030年底5萬片。"}, {"no": 3, "title": "南亞科擴大資本支出　林口5A新廠投資近4800億元", "date": "2026-10-12", "map": "https://www.google.com/maps/search/?api=1&query=%E6%9E%97%E5%8F%A3%E5%8D%97%E4%BA%9E%E7%A7%91", "source_name": "Yahoo股市（三立新聞網）：南亞科擴大資本支出　未來月產能5萬片", "url": "https://tw.stock.yahoo.com/news/%E5%8D%97%E4%BA%9E%E7%A7%91%E6%93%B4%E5%A4%A7%E8%B3%87%E6%9C%AC%E6%94%AF%E5%87%BA-%E6%9C%AA%E4%BE%86%E6%9C%88%E7%94%A2%E8%83%BD5%E8%90%AC%E7%89%87-070600257.html", "summary": "南亞科總經理李培瑛在法說會表示，林口5A新廠含廠房建設及EUV等設備，總投資金額預估接近新台幣4800億元，可由自有資金支應；產能目標由先前約4.5萬片上修，2028年達月投片3萬片、2030年有機會至5萬片。另規劃屏東科學園區3D晶圓封測廠，以3D IC及晶圓對晶圓鍵合為方向，預計2028年下半年有機會開始裝機。"}, {"no": 4, "title": "ASML對三星及海力士漲價、可能與台積電談判中　應材、東京威力科創也要漲價", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（東森財經新聞）：ASML對三星及海力士漲價、可能與台積電談判中　應材、東京威力科創也要漲價", "url": "https://tw.stock.yahoo.com/news/asml%E5%B0%8D%E4%B8%89%E6%98%9F%E5%8F%8A%E6%B5%B7%E5%8A%9B%E5%A3%AB%E6%BC%B2%E5%83%B9-%E5%8F%AF%E8%83%BD%E8%88%87%E5%8F%B0%E7%A9%8D%E9%9B%BB%E8%AB%87%E5%88%A4%E4%B8%AD-%E6%87%89%E6%9D%90-%E6%9D%B1%E4%BA%AC%E5%A8%81%E5%8A%9B%E7%A7%91%E5%89%B5%E4%B9%9F%E8%A6%81%E6%BC%B2%E5%83%B9-014500552.html", "summary": "韓媒《THE ELEC》報導，ASML對三星電子與SK海力士發送漲價通知，自2027年1月供貨起全面調漲韓國市場維護與替換零件價格10%，涵蓋EUV與DUV全部更換零組件，兩大記憶體廠已接受。業界消息指ASML亦正與客戶協商新機台價格調漲；應用材料與東京威力科創也已對新產品與既有產品線實施或規劃漲價。"}, {"no": 5, "title": "世芯-KY擴大2奈米封裝整合，年底新案投片", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（MoneyDJ）：世芯-KY擴大2奈米封裝整合，年底新案投片", "url": "https://tw.stock.yahoo.com/news/%E4%B8%96%E8%8A%AF-ky%E6%93%B4%E5%A4%A72%E5%A5%88%E7%B1%B3%E5%B0%81%E8%A3%9D%E6%95%B4%E5%90%88-%E5%B9%B4%E5%BA%95%E6%96%B0%E6%A1%88%E6%8A%95%E7%89%87-023100581.html", "summary": "世芯-KY在AI Infra Summit 2026展示2奈米設計平台，現階段90%設計採7奈米以下製程，並列入NVIDIA NVLink Fusion首批客製化晶片合作夥伴。北美CSP客戶3奈米AI加速器已於第2季末量產、第3季出貨放大；下一代2奈米AI加速器目標2026年底前完成tape-out。前8月營收278.95億元、年增13.58%，8月營收87.76億元、年增273.61%。"}]}, {"name": "AI", "items": [{"no": 1, "title": "伺服器出貨1520萬台　台廠受惠12強", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（三立新聞網）：伺服器出貨1520萬台　台廠受惠12強", "url": "https://tw.news.yahoo.com/%E4%BC%BA%E6%9C%8D%E5%99%A8%E5%87%BA%E8%B2%A81520%E8%90%AC%E5%8F%B0-%E5%8F%B0%E5%BB%A0%E5%8F%97%E6%83%A012%E5%BC%B7-190500110.html", "summary": "法人將2026年全球伺服器總出貨量預估上調至1520萬台、年增21%，2027年上修至1900萬台、年增25%；AI伺服器2026年可望達350萬台、年增45%，2027年520萬台。2026年上半年全球伺服器出貨717萬台、年增22%，其中AI伺服器160萬台、年增56%。輝達GB與VR平台高階伺服器2026年出貨估6.9萬至7萬櫃；鴻海、緯創、緯穎、奇鋐、健策、台達電、台光電、金像電、欣興、川湖、嘉澤、信驊等台廠受惠。"}, {"no": 2, "title": "台達電第3季營收續創新高　積極因應美337調查維護權益", "date": "2026-10-12", "map": "", "source_name": "中央社：台達電第3季營收續創新高　積極因應美337調查維護權益", "url": "https://www.cna.com.tw/news/afe/202610120169.aspx", "summary": "台達電公布9月營收新台幣654億元，年增14.6%、月增1.3%，創單月營收第3高；第3季營收1970.59億元，季增7.5%、年增31.1%，連2季創歷史新高；前9月營收5396.68億元、年增37.2%。針對美國USITC啟動垂直電力傳輸系統337調查，台達電表示將依程序積極因應，相關產品目前未受影響。"}, {"no": 3, "title": "輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "url": "https://tw.news.yahoo.com/%E8%BC%9D%E9%81%94%E8%A1%9D%E5%88%BA%E6%A9%9F%E5%99%A8%E4%BA%BA%E5%8A%A0%E7%A2%BC%E6%8A%95%E8%B3%87%E6%96%B0%E5%89%B5figure%E6%89%80%E7%BE%85%E9%96%80-%E5%BB%A3%E9%81%8B-%E5%8F%B0%E9%81%94%E9%9B%BB%E7%AD%89%E6%B2%BE%E5%85%89-223210290.html", "summary": "輝達傳擬斥資10億美元（近新台幣320億元）加碼投資AI機器人新創Figure，Figure目前估值約380億美元。業界認為這是黃仁勳加速擴大機器人布局的關鍵訊號，所羅門、廣運、台達電、達明、新漢等輝達機器人供應鏈有望受惠；所羅門董事長陳政隆透露，今年AI視覺與機器人相關業績可望增長七成。"}, {"no": 4, "title": "AI伺服器催油門！電子五哥Q3營收齊增　緯創、廣達雙創單季新高", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（壹蘋新聞網）：AI伺服器催油門！電子五哥Q3營收齊增　緯創、廣達雙創單季新高", "url": "https://tw.news.yahoo.com/ai%E4%BC%BA%E6%9C%8D%E5%99%A8%E5%82%AC%E6%B2%B9%E9%96%80-%E9%9B%BB%E5%AD%90%E4%BA%94%E5%93%A5q3%E7%87%9F%E6%94%B6%E9%BD%8A%E5%A2%9E-%E7%B7%AF%E5%89%B5-%E5%BB%A3%E9%81%94%E9%9B%99%E5%89%B5%E5%96%AE%E5%AD%A3%E6%96%B0%E9%AB%98-085100111.html", "summary": "AI伺服器需求強勁，電子五哥第三季營收全面年增。緯創第三季營收1.15兆元、年增101%，廣達第三季營收1.12兆元、年增125.2%，英業達第三季營收2720.94億元，三者均創單季新高；和碩9月營收2147.53億元，首度突破2000億元。廣達表示新一代Vera Rubin第四季預計開始小量出貨，主要專案明年第一季才會啟動。"}, {"no": 5, "title": "金融時報：輝達討論加強投資或收購Reflection AI", "date": "2026-10-11", "map": "", "source_name": "中央社：金融時報：輝達討論加強投資或收購Reflection AI", "url": "https://www.cna.com.tw/news/aopl/202610110140.aspx", "summary": "英國金融時報引述知情人士報導，輝達正與美國開源AI新創Reflection AI討論加強投資或直接收購。輝達至今已對其投資8億美元（約新台幣256億元），雙方考慮的交易形式包括由輝達聘僱其職員並取得技術授權的「人才收購」，這麼做或許能避免冗長的監管審查；Reflection AI已於5日推出首款開放權重模型Beam。"}]}, {"name": "金融", "items": [{"no": 1, "title": "國銀高資產大戶8月突破3萬人　資產管理規模達3.1兆", "date": "2026-10-12", "map": "", "source_name": "中央社：國銀高資產大戶8月突破3萬人　資產管理規模達3.1兆", "url": "https://www.cna.com.tw/news/afe/202610120276.aspx", "summary": "金管會統計，截至2026年8月底，23家國銀高資產客戶管理資產規模（AUM）增至新台幣3兆1089億元，月增1698億元；高資產客戶達3萬596人，月增1984人，AUM與客戶數單月增額皆創歷來新高。存款比率跌破4成至39.4%，創2022年4月以來新低，基金升至17.3%、債券14.9%、保險13.2%。證券商高資產業務累計客戶2136人、交易金額約6585億元。"}, {"no": 2, "title": "疊券風險引關注　金管會：公會提強化措施估年底上路", "date": "2026-10-12", "map": "", "source_name": "中央社：疊券風險引關注　金管會：公會提強化措施估年底上路", "url": "https://www.cna.com.tw/news/afe/202610120244.aspx", "summary": "美債殖利率攀升、債券價格下跌，市場關注投資人以金融資產反覆質押的「疊券」槓桿風險。金管會表示，銀行公會近期將函報金融資產擔保授信強化措施，預計今年底前上路，高雄專區內外皆適用；銀行須在銷售端評估客戶風險承受度，並落實「三要一不」原則（要做好風險管控、要落實內控及洗錢防制、要培育人才、不做惡性競爭）。"}, {"no": 3, "title": "美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "url": "https://tw.news.yahoo.com/%E7%BE%8E%E5%82%B5%E6%8A%95%E8%B3%87%E4%B9%9F%E7%88%86-%E5%9B%9B%E8%B2%B8%E5%90%8C%E5%A0%82-%E9%87%91%E7%AE%A1%E6%9C%83%E6%8C%87%E7%A4%BA%E5%BE%9E%E6%8E%88%E4%BF%A1-%E9%8A%B7%E5%94%AE%E7%AB%AF%E9%9B%99%E7%AE%A1%E9%BD%8A%E4%B8%8B%E5%BC%B7%E5%8C%96%E6%8E%A7%E7%AE%A1-223957089.html", "summary": "美國10年期公債殖利率攀升、價格下跌，貸款買美債的高槓桿投資人面臨斷頭壓力。金管會已要求銀行公會研訂《金融資產擔保放款強化管理措施》，預計年底上路，授信端重點為客戶總額度控管並評估最壞情境能否負荷，銷售端則嚴禁銀行勸誘客戶做疊券；有投資人反覆質借堆疊美債部位，高達五、六層。"}, {"no": 4, "title": "前三季金控獲利公布、全年展望樂觀", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（工商時報）：前三季金控獲利公布、全年展望樂觀", "url": "https://tw.stock.yahoo.com/news/%E5%89%8D%E4%B8%89%E5%AD%A3%E9%87%91%E6%8E%A7%E7%8D%B2%E5%88%A9%E5%85%AC%E5%B8%83-%E5%85%A8%E5%B9%B4%E5%B1%95%E6%9C%9B%E6%A8%82%E8%A7%80-083643461.html", "summary": "上市金控9月及前三季獲利將於15日全數公布，金控前八月獲利達5,789.07億元，已逼近2024年史上最高的全年5,979.79億元，前三季可望突破歷年全年新高。若9月至12月每月獲利維持553億元動能且年底未有大筆呆帳打消，全年金控獲利有機會挑戰8,000億元；金控高層提醒地緣政治、股債波動與美國利率路徑為第四季關鍵變數。"}]}, {"name": "航運", "items": [{"no": 1, "title": "旺季行情延續　貨櫃三雄大漲長榮強勢漲停", "date": "2026-10-12", "map": "", "source_name": "中央社：旺季行情延續　貨櫃三雄大漲長榮強勢漲停", "url": "https://www.cna.com.tw/news/afe/202610120127.aspx", "summary": "貨櫃航運股12日走勢強勁，長榮海運早盤亮燈漲停，萬海漲逾8.5%，陽明漲逾6.5%。長榮9月合併營收新台幣497.11億元、年增63.75%，陽明216.99億元、年增69.94%，萬海217.75億元、年增97.63%。SCFI假期後止跌回升，歐線、地中海線數月連跌後首見止跌小漲；長榮總經理吳光輝指美國線春節前看不出悲觀理由，新加坡等轉運港碼頭使用率已逾9成。"}, {"no": 2, "title": "長榮、萬海漲停背後祕密！分析師直言：還會再漲", "date": "2026-10-12", "map": "", "source_name": "Yahoo股市（東森財經）：長榮、萬海漲停背後祕密！分析師直言：還會再漲", "url": "https://tw.stock.yahoo.com/news/%E9%95%B7%E6%A6%AE-%E8%90%AC%E6%B5%B7%E6%BC%B2%E5%81%9C%E8%83%8C%E5%BE%8C%E7%A5%95%E5%AF%86-%E5%88%86%E6%9E%90%E5%B8%AB%E7%9B%B4%E8%A8%80-%E9%82%84%E6%9C%83%E5%86%8D%E6%BC%B2-094000130.html", "summary": "分析師周代運指出，聖嬰現象發酵引發運河水位下修，船舶吃水深度已下調至48英呎，大船減載導致艙位稀缺、運價上揚。上海出口貨櫃運價指數（SCFI）來到3662點，美東線報價達10,528美元/FEU；他強調航商獲利關鍵在於船期溢價，艙位供不應求下船期轉變為競價資產，並認為貨櫃三雄底部起漲後續還會再漲。"}, {"no": 3, "title": "貨櫃航運美強歐弱　紅海復航中、塞港難解撐運價", "date": "2026-10-11", "map": "", "source_name": "中央社：貨櫃航運美強歐弱　紅海復航中、塞港難解撐運價", "url": "https://www.cna.com.tw/news/afe/202610110047.aspx", "summary": "全球貨櫃航商陸續重返紅海，市場擔憂新增運力壓抑運價，但業者指塞港成常態可抵銷部分運力。長榮海運總經理吳光輝指出，新加坡等主要轉運港碼頭使用率已逾9成；貨櫃航運呈「美強歐弱」，美線受惠補庫存需求及巴拿馬運河限航，陽明預期美東線第4季運價維持高檔，歐線第4季運價偏低但仍屬健康水準。"}, {"no": 4, "title": "航運下一戰3》美線長約看漲歐線承壓　貨櫃三雄迎獲利考驗", "date": "2026-10-12", "map": "", "source_name": "Yahoo股市（民報）：航運下一戰3》美線長約看漲歐線承壓　貨櫃三雄迎獲利考驗", "url": "https://tw.stock.yahoo.com/news/%E8%88%AA%E9%81%8B%E4%B8%8B-%E6%88%B03-%E7%BE%8E%E7%B7%9A%E9%95%B7%E7%B4%84%E7%9C%8B%E6%BC%B2%E6%AD%90%E7%B7%9A%E6%89%BF%E5%A3%93-%E8%B2%A8%E6%AB%83%E4%B8%89%E9%9B%84%E8%BF%8E%E7%8D%B2%E5%88%A9%E8%80%83%E9%A9%97-220200327.html", "summary": "長榮9月營收497.11億元、年增63.75%，陽明216.99億元、年增69.94%，萬海217.75億元、年增97.63%。長榮研判2027年美線長約價格高於2026年的機率相當大；法人預估長榮今年每股盈餘50.42元，但2027年降至25.20元。航商重返紅海可能釋出全球約2%至4%運力，2027年至2029年另有大量新船交付，歐線運價恐承壓。"}, {"no": 5, "title": "無視警告硬闖海上封鎖線　美軍開火癱瘓貨輪", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=Gulf%20of%20Oman", "source_name": "中央社：無視警告硬闖海上封鎖線　美軍開火癱瘓貨輪", "url": "https://www.cna.com.tw/news/aopl/202610110066.aspx", "summary": "美軍中央司令部表示，阿曼灣一艘懸掛巴拿馬國旗的散裝貨輪「海洋莫利卡號」（M/V Ocean Molica）自伊朗港口離港後，無視警告試圖突破美軍對伊朗的海上封鎖線，美軍戰鬥機以精準彈藥擊中船尾，癱瘓其推進系統，船員未受傷；美軍並警告阿曼灣及荷莫茲海峽周邊海域船員遵守封鎖警告。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "台股開低走高終場守49300點　貨櫃、光學股強勢", "date": "2026-10-12", "map": "", "source_name": "中央社：台股開低走高終場守49300點　貨櫃、光學股強勢", "url": "https://www.cna.com.tw/news/afe/202610120120.aspx", "summary": "台股12日開低震盪走高，早盤一度下跌逾500點、最低達48768.82點，高低震盪644點，終場下跌11.48點、收49301.96點，跌幅0.02%，成交值新台幣8439.31億元。台積電跌10元收2540元；長榮以255.5元漲停，萬海漲8.52%收121元，陽明漲6.53%收63.6元；大立光漲665元以7325元漲停。金融類股指數上漲2.87%，電子類股指數下跌0.37%。"}, {"no": 2, "title": "美股走勢分歧！道指收漲　那指受科技股拖累", "date": "2026-10-12", "map": "", "source_name": "Yahoo股市（今日新聞）：美股走勢分歧！道指收漲　那指受科技股拖累", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E8%B5%B0%E5%8B%A2%E5%88%86%E6%AD%A7-%E9%81%93%E6%8C%87%E6%94%B6%E6%BC%B2-%E9%82%A3%E6%8C%87%E5%8F%97%E7%A7%91%E6%8A%80%E8%82%A1%E6%8B%96%E7%B4%AF-220804682.html", "summary": "12日美股道瓊工業指數上漲195.60點或0.38%，收51850.55點；那斯達克指數下跌120.27點或0.44%，收27245.90點；標普500指數下跌4.30點或0.055%，收7807.24點；費城半導體指數下挫335.63點或2.67%，收12236.79點。西德州原油升2.06%報每桶93.74美元，布蘭特期油漲1.84%報每桶106.65美元；美光科技股價下跌3.9%拖累那指。"}, {"no": 3, "title": "外資賣超台股521億　台塑遭調節3.6萬張最多", "date": "2026-10-12", "map": "", "source_name": "中央社：外資賣超台股521億　台塑遭調節3.6萬張最多", "url": "https://www.cna.com.tw/news/afe/202610120258.aspx", "summary": "台股12日下跌11.48點、收49301.96點，成交值8439.31億元。外資賣超521.98億元已連4日賣超，賣超台塑最多達3萬6881張，其次為友達2萬6282張；三大法人合計賣超593.69億元，其中自營商賣超142.94億元、投信買超71.23億元。資深分析師王兆立預期台積電法說會前指數將維持震盪整理。"}, {"no": 4, "title": "川普稱俄烏達成能源停火油價聞訊回落　亞股走勢不一", "date": "2026-10-12", "map": "", "source_name": "中央社：川普稱俄烏達成能源停火油價聞訊回落　亞股走勢不一", "url": "https://www.cna.com.tw/news/afe/202610120214.aspx", "summary": "美國總統川普宣布俄烏達成「能源停火」後，國際兩大基準原油期貨一度回跌逾1%。亞股走勢不一，香港、雪梨、新加坡、威靈頓及馬尼拉股市收漲；首爾與台北股市受晶片廠股價下跌拖累，東京適逢國定假日休市。摩根大通、高盛及美國銀行等大型銀行本週將公布財報，揭開財報季序幕。"}, {"no": 5, "title": "美科技股壓回　投顧：台股本週聚焦台積電法說會", "date": "2026-10-11", "m ow 2026）將於10月20日至22日在南港展覽館一館登場，匯聚超過680個國際品牌、逾1840個攤位，預估吸引全球7萬人次買主，並設先進封裝主題專區；玻璃核心被視為次世代高階載板重要方向，但仍處技術驗證階段。"}, {"no": 4, "title": "航海王重返航道　台股49K失而復得", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合報）：航海王重返航道　台股49K失而復得", "url": "https://tw.news.yahoo.com/%E8%88%AA%E6%B5%B7%E7%8E%8B%E9%87%8D%E8%BF%94%E8%88%AA%E9%81%93-%E5%8F%B0%E8%82%A149k%E5%A4%B1%E8%80%8C%E5%BE%A9%E5%BE%97-201000904.html", "summary": "台股12日開盤受國際利空拖累一度大跌逾500點、下探48768點，午盤後翻紅，終場僅小跌11.48點、收49301.96點。盤面最強為貨櫃三雄，長榮拉漲停、萬海盤中一度亮燈、陽明漲逾6%；捲入美國337調查的鴻海、廣達跌幅超過1%，台達電一度重挫超過半根停板。三大法人賣超593.69億元，外資賣超521.98億元。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "俄烏和中東皆傳供應利空消息　國際油價走揚", "date": "2026-10-13", "map": "", "source_name": "中央社：俄烏和中東皆傳供應利空消息　國際油價走揚", "url": "https://www.cna.com.tw/news/afe/202610130008.aspx", "summary": "國際油價12日攀漲，烏克蘭對川普鼓吹的俄烏「能源設施停火」表達質疑，且沙烏地阿拉伯又面臨新一波攻擊。紐約商品交易所西德州中級原油11月交割價揚升1.89美元或2.06%，來到每桶93.74美元；倫敦北海布倫特原油12月交割價上漲1.93美元或1.84%，來到每桶106.65美元。"}, {"no": 2, "title": "川普和普丁達成柴油協議　美國跨黨參議員批違法", "date": "2026-10-12", "map": "", "source_name": "中央社：川普和普丁達成柴油協議　美國跨黨參議員批違法", "url": "https://www.cna.com.tw/news/aopl/202610120008.aspx", "summary": "美國7位跨黨派聯邦參議員發表聯合聲明，質疑川普允許俄羅斯柴油出口的協議是否合法，指國會在2022年已明確禁止進口俄羅斯能源，且行政部門未依法與國會諮商。川普9日宣布與普丁達成協議，俄羅斯將向美國和全球市場供應柴油，以換取美國暫時放寬制裁，引來烏克蘭、歐盟與多位美國國會議員強烈反彈。"}, {"no": 3, "title": "伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "date": "2026-10-12", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "中央社：伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "url": "https://www.cna.com.tw/news/aopl/202610120005.aspx", "summary": "伊朗最高國家安全委員會秘書雷札伊表示，美國對伊朗提出重啟荷莫茲海峽7項條件的回應「不足」，在條件達成前，海峽將不會對美國開放、也不會展開協商。伊朗曾在聯合國大會期間提案，只要條件滿足，荷莫茲海峽航運可望於7天內恢復正常，美國後來透過調解方卡達回應，雷札伊稱美方已接受部分條件但其餘仍不明確。"}, {"no": 4, "title": "台塑石化：12日起汽柴油不漲價", "date": "2026-10-11", "map": "", "source_name": "中央社：台塑石化：12日起汽柴油不漲價", "url": "https://www.cna.com.tw/news/afe/202610110112.aspx", "summary": "台塑石化網站資料顯示，加盟加油站10月12日凌晨1時起參考零售價維持不變，92無鉛汽油每公升新台幣31.2元、95+無鉛汽油32.7元、98無鉛汽油34.7元、超級柴油29.7元；自9月14日調漲汽油價格後，已連續4週未調整油價。"}, {"no": 5, "title": "油價再漲破百美元不合理？富蘭克林透露　中東石油出口已回到2025年日均水準", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（中時新聞網）：油價再漲破百美元不合理？富蘭克林透露　中東石油出口已回到2025年日均水準", "url": "https://tw.stock.yahoo.com/news/%E6%B2%B9%E5%83%B9%E5%86%8D%E6%BC%B2%E7%A0%B4%E7%99%BE%E7%BE%8E%E5%85%83%E4%B8%8D%E5%90%88%E7%90%86-%E5%AF%8C%E8%98%AD%E5%85%8B%E6%9E%97%E9%80%8F%E9%9C%B2-%E4%B8%AD%E6%9D%B1%E7%9F%B3%E6%B2%B9%E5%87%BA%E5%8F%A3%E5%B7%B2%E5%9B%9E%E5%88%B02025%E5%B9%B4%E6%97%A5%E5%9D%87%E6%B0%B4%E6%BA%96-103431799.html", "summary": "富蘭克林證券投顧引述報告指出，中東石油出口已回到每日2330萬桶，與2025年每日2310萬桶日均量相當，與荷莫茲海峽運輸增加有關，但成品油供應仍不足、能源設施再遭攻擊風險未消除，布蘭特原油仍在100美元之上。摩爾投顧分析師謝晨彥表示中東原油出口已回到戰前94%，明年通膨壓力可望趨緩。"}]}], "warnings": [], "day": "2026-10-13"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-09 至 2026-10-12）", "compiled": "2026-10-12 07:20（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件；10月9日（五）至11日（日）國慶連假台股休市，台指期夜盤跌652點為8日夜盤交易", "note": "Currencies類3則、Commodities類4則（近3日符合條件且來源可查證之新聞不足；Commodities類僅找到貴金屬相關新聞，未找到穀物等其他原物料新聞），其餘各類各5則，無空缺類別；10月9日至11日國慶連假台股及新台幣匯市休市，期貨類以連假前8日夜盤及連假期間盤前分析為主；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "歐洲最大晶圓廠布局物理AI！格羅方德砸11億歐元擴建德國晶圓廠、2028年啟動生產", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=GlobalFoundries%20Dresden", "source_name": "Yahoo股市（鉅亨網）：歐洲最大晶圓廠布局物理AI！格羅方德砸11億歐元擴建德國晶圓廠、2028年啟動生產", "url": "https://tw.stock.yahoo.com/news/%E6%AD%90%E6%B4%B2%E6%9C%80%E5%A4%A7%E6%99%B6%E5%9C%93%E5%BB%A0%E5%B8%83%E5%B1%80%E7%89%A9%E7%90%86ai-%E6%A0%BC%E7%BE%85%E6%96%B9%E5%BE%B7%E7%A0%B811%E5%84%84%E6%AD%90%E5%85%83%E6%93%B4%E5%BB%BA%E5%BE%B7%E5%9C%8B%E6%99%B6%E5%9C%93%E5%BB%A0-2028%E5%B9%B4%E5%95%9F%E5%8B%95%E7%94%9F%E7%94%A2-140005426.html", "summary": "格羅方德宣布德國德勒斯登SPRINT晶圓廠擴建計畫正式封頂，總投資金額達11億歐元，預計2028年底完成後300毫米晶圓年產能將超過100萬片，可望成為歐洲最大晶圓代工基地，目前年產能約95萬片。同步推出新一代FD-SOI平台FDX Fusion，第一代預計提供相當於7奈米級數位效能，瞄準機器人、智慧汽車與工業自動化等物理AI應用。"}, {"no": 2, "title": "馬斯克：Terafab將找到方法製造晶片 品質比誰都更好", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=Grimes%20County%2C%20Texas", "source_name": "中央社：馬斯克：Terafab將找到方法製造晶片 品質比誰都更好", "url": "https://www.cna.com.tw/news/aopl/202610113001.aspx", "summary": "馬斯克在特斯拉德州奧斯汀超級工廠活動上表示，自家團隊大概會「找到方法製造出比任何人都更好的晶片」，但可能需要好幾年。他打算透過特斯拉與SpaceX合資公司，攜手英特爾在德州葛林姆斯打造晶片製造廠Terafab，初期投資額超過150億美元（約新台幣4794億元），可望創造3000個工作機會，並獲「德州企業基金」3000萬美元補助款。"}, {"no": 3, "title": "ASML曝光機零件韓國市場統一漲價10% 三星、SK 海力士已接受", "date": "2026-10-10", "map": "", "source_name": "Yahoo股市（鉅亨網）：ASML曝光機零件韓國市場統一漲價10% 三星、SK 海力士已接受", "url": "https://tw.stock.yahoo.com/news/asml%E6%9B%9D%E5%85%89%E6%A9%9F%E9%9B%B6%E4%BB%B6%E9%9F%93%E5%9C%8B%E5%B8%82%E5%A0%B4%E7%B5%B1-%E6%BC%B2%E5%83%B910-%E4%B8%89%E6%98%9F-sk-%E6%B5%B7%E5%8A%9B%E5%A3%AB%E5%B7%B2%E6%8E%A5%E5%8F%97-061359291.html", "summary": "據韓媒《The Elec》報導，ASML決定將供應韓國市場的曝光機替換部件價格統一提高10%，涵蓋極紫外與深紫外曝光機全部備件，自2027年1月供貨產品起執行新價格，三星電子與SK海力士已接受。ASML售後服務、備件和升級業務2025年營收達81.93億歐元，佔總營收25%，ASML預估今年該業務收入將成長30%以上。"}, {"no": 4, "title": "赴德州設廠、結盟馬斯克？台積電15日法說聚焦營運擴產", "date": "2026-10-09", "map": "", "source_name": "中央社：赴德州設廠、結盟馬斯克？台積電15日法說聚焦營運擴產", "url": "https://www.cna.com.tw/news/afe/202610090086.aspx", "summary": "台積電第3季營收達新台幣1兆4942.43億元，季增17.62%，前9月營收3兆8987.27億元，年增41.1%。15日法說會市場除關注資本支出、先進製程與封裝進展、毛利率展望外，台積電是否赴德州設廠，以及與馬斯克晶片廠Terafab的合作傳聞也是法人追問焦點；A14製程原規劃2027年試產、2028年量產，市場關心最新進展。"}, {"no": 5, "title": "AI掀缺貨潮史上首見 記憶體廠砸6744億元台灣擴產", "date": "2026-10-09", "map": "", "source_name": "中央社：AI掀缺貨潮史上首見 記憶體廠砸6744億元台灣擴產", "url": "https://www.cna.com.tw/news/afe/202610090028.aspx", "summary": "AI熱潮促使記憶體出現前所未見的缺貨漲價潮，業者預期至少延續到2027年上半年。美光在桃園、苗栗銅鑼、台中和台南同步擴產，桃園新產線預計2027年底或2028年初投產；南亞科5A新廠預計2027年下半年投片，總資本支出約160億美元（約新台幣5120億元）；華邦電高雄廠月產能將自1.5萬片擴增至2.4萬片，今年資本支出約新台幣395億元，總投資逾新台幣6744億元。"}]}, {"name": "AI", "items": [{"no": 1, "title": "輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "url": "https://tw.news.yahoo.com/%E8%BC%9D%E9%81%94%E8%A1%9D%E5%88%BA%E6%A9%9F%E5%99%A8%E4%BA%BA%E5%8A%A0%E7%A2%BC%E6%8A%95%E8%B3%87%E6%96%B0%E5%89%B5figure%E6%89%80%E7%BE%85%E9%96%80-%E5%BB%A3%E9%81%8B-%E5%8F%B0%E9%81%94%E9%9B%BB%E7%AD%89%E6%B2%BE%E5%85%89-223210290.html", "summary": "輝達傳擬斥資10億美元（近新台幣320億元）加碼投資AI機器人新創Figure，Figure目前估值約380億美元。業界認為這是黃仁勳加速擴大機器人布局的關鍵訊號，所羅門、廣運、台達電、達明、新漢等輝達機器人供應鏈有望受惠；所羅門董事長陳政隆透露，今年AI視覺與機器人相關業績可望增長七成。"}, {"no": 2, "title": "金融時報：輝達討論加強投資或收購Reflection AI", "date": "2026-10-11", "map": "", "source_name": "中央社：金融時報：輝達討論加強投資或收購Reflection AI", "url": "https://www.cna.com.tw/news/aopl/202610110140.aspx", "summary": "英國金融時報引述知情人士報導，輝達正與美國開源AI新創Reflection AI討論加強投資或直接收購。輝達至今已對其投資8億美元（約新台幣256億元），雙方考慮的交易形式包括由輝達聘僱其職員並取得技術授權的「人才收購」，這麼做或許能避免冗長的監管審查；Reflection AI已於5日推出首款開放權重模型Beam。"}, {"no": 3, "title": "AI伺服器催油門！電子五哥Q3營收齊增 緯創、廣達雙創單季新高", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（壹蘋新聞網）：AI伺服器催油門！電子五哥Q3營收齊增 緯創、廣達雙創單季新高", "url": "https://tw.news.yahoo.com/ai%E4%BC%BA%E6%9C%8D%E5%99%A8%E5%82%AC%E6%B2%B9%E9%96%80-%E9%9B%BB%E5%AD%90%E4%BA%94%E5%93%A5q3%E7%87%9F%E6%94%B6%E9%BD%8A%E5%A2%9E-%E7%B7%AF%E5%89%B5-%E5%BB%A3%E9%81%94%E9%9B%99%E5%89%B5%E5%96%AE%E5%AD%A3%E6%96%B0%E9%AB%98-085100111.html", "summary": "AI伺服器需求強勁，電子五哥第三季營收全面年增。緯創第三季營收1.15兆元、年增101%，廣達第三季營收1.12兆元、年增125.2%，英業達第三季營收2720.94億元，三者均創單季新高；和碩9月營收2147.53億元，首度突破2000億元。廣達表示新一代Vera Rubin第四季預計開始小量出貨，主要專案明年第一季才會啟動。"}, {"no": 4, "title": "軟銀擬向波灣投資人籌措1000億美元 拚擴大AI布局", "date": "2026-10-09", "map": "", "source_name": "中央社：軟銀擬向波灣投資人籌措1000億美元 拚擴大AI布局", "url": "https://www.cna.com.tw/news/aopl/202610090229.aspx", "summary": "英國金融時報報導，軟銀集團創辦人孫正義擬向阿拉伯聯合大公國等波斯灣地區投資人募資多達1000億美元，用於設立基金收購企業，並運用AI等先進技術提升經營效率。孫正義近日已完成對OpenAI的650億美元投資，但OpenAI首次公開募股已證實延期，市場也擔心軟銀AI曝險過大；消息人士指融資案未必談成。"}, {"no": 5, "title": "OpenAI年化營收較預期短少200億美元 AI前景疑慮上升", "date": "2026-10-09", "map": "", "source_name": "中央社：OpenAI年化營收較預期短少200億美元 AI前景疑慮上升", "url": "https://www.cna.com.tw/news/ait/202610090052.aspx", "summary": "金融時報報導，OpenAI告知投資人截至9月底年化營收接近500億美元，遠低於先前報導的700億美元，短少約200億美元。消息披露後美國科技股跌勢加劇，那斯達克100指數收跌1.4%，輝達跌2.9%、甲骨文跌5.5%、美光跌4.8%。OpenAI正洽談新一輪私募，估值可能達1.4兆美元，預估到2030年累計資金消耗將接近2800億美元。"}]}, {"name": "金融", "items": [{"no": 1, "title": "美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "url": "https://tw.news.yahoo.com/%E7%BE%8E%E5%82%B5%E6%8A%95%E8%B3%87%E4%B9%9F%E7%88%86-%E5%9B%9B%E8%B2%B8%E5%90%8C%E5%A0%82-%E9%87%91%E7%AE%A1%E6%9C%83%E6%8C%87%E7%A4%BA%E5%BE%9E%E6%8E%88%E4%BF%A1-%E9%8A%B7%E5%94%AE%E7%AB%AF%E9%9B%99%E7%AE%A1%E9%BD%8A%E4%B8%8B%E5%BC%B7%E5%8C%96%E6%8E%A7%E7%AE%A1-223957089.html", "summary": "美國10年期公債殖利率攀升、價格下跌，貸款買美債的高槓桿投資人面臨斷頭壓力。金管會已要求銀行公會研訂《金融資產擔保放款強化管理措施》，預計年底上路，授信端重點為客戶總額度控管並評估最壞情境能否負荷，銷售端則嚴禁銀行勸誘客戶做疊券；有投資人反覆質借堆疊美債部位，高達五、六層。"}, {"no": 2, "title": "前三季金控獲利公布、全年展望樂觀", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（工商時報）：前三季金控獲利公布、全年展望樂觀", "url": "https://tw.stock.yahoo.com/news/%E5%89%8D%E4%B8%89%E5%AD%A3%E9%87%91%E6%8E%A7%E7%8D%B2%E5%88%A9%E5%85%AC%E5%B8%83-%E5%85%A8%E5%B9%B4%E5%B1%95%E6%9C%9B%E6%A8%82%E8%A7%80-083643461.html", "summary": "上市金控9月及前三季獲利將於15日全數公布，金控前八月獲利達5,789.07億元，已逼近2024年史上最高的全年5,979.79億元，前三季可望突破歷年全年新高。若9月至12月每月獲利維持553億元動能且年底未有大筆呆帳打消，全年金控獲利有機會挑戰8,000億元；金控高層提醒地緣政治、股債波動與美國利率路徑為第四季關鍵變數。"}, {"no": 3, "title": "公股投信四合一即將達陣 第一金、兆豐金等下周四將開董事會決議", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：公股投信四合一即將達陣 第一金、兆豐金等下周四將開董事會決議", "url": "https://tw.news.yahoo.com/%E5%85%AC%E8%82%A1%E6%8A%95%E4%BF%A1%E5%9B%9B%E5%90%88-%E5%8D%B3%E5%B0%87%E9%81%94%E9%99%A3-%E7%AC%AC-%E9%87%91-%E5%85%86%E8%B1%90%E9%87%91%E7%AD%89%E4%B8%8B%E5%91%A8%E5%9B%9B%E5%B0%87%E9%96%8B%E8%91%A3%E4%BA%8B%E6%9C%83%E6%B1%BA%E8%AD%B0-230724740.html", "summary": "第一金、兆豐金、合庫金及華南金推動旗下投信「四合一」，四家金控訂於22日同步召開董事會決議，通過後送金管會及公平會審核，合併基準日訂於明年。合併後以規模最大的第一金投信為存續公司，第一金將取得50%多一點的過半股權，兆豐金取得30%多股權，合庫金及華南金各取得9%多股權。"}, {"no": 4, "title": "銀行跨足幣圈擬正面表列 金管會規劃列出可兼營項目避免整碗捧去", "date": "2026-10-10", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：銀行跨足幣圈擬正面表列 金管會規劃列出可兼營項目避免整碗捧去", "url": "https://tw.news.yahoo.com/%E9%8A%80%E8%A1%8C%E8%B7%A8%E8%B6%B3%E5%B9%A3%E5%9C%88%E6%93%AC%E6 ：柴油等能源價格飆升（零售柴油每加侖6.20美元）、消費支出放緩及川普政策不確定性。"}, {"no": 4, "title": "AI掀PCB大升級 電路板展聚焦先進封裝與玻璃基板", "date": "2026-10-11", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8D%97%E6%B8%AF%E5%B1%95%E8%A6%BD%E9%A4%A8%E4%B8%80%E9%A4%A8", "source_name": "中央社：AI掀PCB大升級 電路板展聚焦先進封裝與玻璃基板", "url": "https://www.cna.com.tw/news/afe/202610110030.aspx", "summary": "AI算力需求推動PCB材料、製程到封裝架構全面革新。第27屆台灣電路板產業國際展覽會（TPCA Show 2026）將於10月20日至22日在南港展覽館一館登場，匯聚超過680個國際品牌、逾1840個攤位，預估吸引全球7萬人次買主，並設先進封裝主題專區；玻璃核心被視為次世代高階載板重要方向，但仍處技術驗證階段。"}, {"no": 5, "title": "造紙業第4季迎旺季 需求溫和回升原料成本為變數", "date": "2026-10-10", "map": "", "source_name": "中央社：造紙業第4季迎旺季 需求溫和回升原料成本為變數", "url": "https://www.cna.com.tw/news/afe/202610100041.aspx", "summary": "造紙業進入第4季傳統旺季，永豐餘表示紙箱及工業用紙需求平穩、客戶分批補庫；正隆看台灣第4季出貨略優於第3季，越南需求暢旺。華紙指9月短纖紙漿每噸上調20美元，為今年先前累計下跌約70美元後回升，紙價第4季具調整機會。榮成9月營收47.9億元、年增25.3%，但單月營業利益虧損0.53億元。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "川普和普丁達成柴油協議 美國參議員批違法", "date": "2026-10-12", "map": "", "source_name": "中央社：川普和普丁達成柴油協議 美國參議員批違法", "url": "https://www.cna.com.tw/news/aopl/202610120008.aspx", "summary": "美國7位跨黨派聯邦參議員發表聯合聲明，質疑川普允許俄羅斯柴油出口的協議是否合法，指國會在2022年已明確禁止進口俄羅斯能源，且行政部門未依法與國會諮商。川普9日宣布與普丁達成協議，俄羅斯將向美國和全球市場供應柴油，以換取美國暫時放寬制裁，引來烏克蘭、歐盟與多位美國國會議員強烈反彈。"}, {"no": 2, "title": "伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "date": "2026-10-12", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "中央社：伊朗：美國對重開荷莫茲海峽提案所作回應有所不足", "url": "https://www.cna.com.tw/news/aopl/202610120005.aspx", "summary": "伊朗最高國家安全委員會秘書雷札伊表示，美國對伊朗提出重啟荷莫茲海峽7項條件的回應「不足」，在條件達成前，海峽將不會對美國開放、也不會展開協商。伊朗曾在聯合國大會期間提案，只要條件滿足，荷莫茲海峽航運可望於7天內恢復正常，美國後來透過調解方卡達回應，雷札伊稱美方已接受部分條件但其餘仍不明確。"}, {"no": 3, "title": "川普宣布俄烏同意能源停火 澤倫斯基：俄續攻擊、烏等待細節", "date": "2026-10-12", "map": "", "source_name": "中央社：川普宣布俄烏同意能源停火 澤倫斯基：俄續攻擊、烏等待細節", "url": "https://www.cna.com.tw/news/aopl/202610120004.aspx", "summary": "美國總統川普宣布俄羅斯與烏克蘭同意能源停火，烏克蘭總統澤倫斯基表示支持此一協議並正等待美方提供細節，但指出俄軍仍持續攻擊烏克蘭能源設施。他在Telegram貼文表示「烏克蘭支持停火，重要的是俄羅斯也能支持」，並已就此與北約秘書長呂特、加拿大總理卡尼和芬蘭總統史塔布討論。"}, {"no": 4, "title": "油價再漲破百美元不合理？ 富蘭克林透露 中東石油出口已回到2025年日均水準", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（中時新聞網）：油價再漲破百美元不合理？ 富蘭克林透露 中東石油出口已回到2025年日均水準", "url": "https://tw.stock.yahoo.com/news/%E6%B2%B9%E5%83%B9%E5%86%8D%E6%BC%B2%E7%A0%B4%E7%99%BE%E7%BE%8E%E5%85%83%E4%B8%8D%E5%90%88%E7%90%86-%E5%AF%8C%E8%98%AD%E5%85%8B%E6%9E%97%E9%80%8F%E9%9C%B2-%E4%B8%AD%E6%9D%B1%E7%9F%B3%E6%B2%B9%E5%87%BA%E5%8F%A3%E5%B7%B2%E5%9B%9E%E5%88%B02025%E5%B9%B4%E6%97%A5%E5%9D%87%E6%B0%B4%E6%BA%96-103431799.html", "summary": "富蘭克林證券投顧引述報告指出，中東石油出口已回到每日2330萬桶，與2025年每日2310萬桶日均量相當，與荷莫茲海峽運輸增加有關，但成品油供應仍不足、能源設施再遭攻擊風險未消除，布蘭特原油仍在100美元之上。摩爾投顧分析師謝晨彥表示中東原油出口已回到戰前94%，明年通膨壓力可望趨緩，甚至可能迎來降息機會。"}, {"no": 5, "title": "台塑石化：12日起汽柴油不漲價", "date": "2026-10-11", "map": "", "source_name": "中央社：台塑石化：12日起汽柴油不漲價", "url": "https://www.cna.com.tw/news/afe/202610110112.aspx", "summary": "台塑石化網站資料顯示，加盟加油站10月12日凌晨1時起參考零售價維持不變，92無鉛汽油每公升新台幣31.2元、95+無鉛汽油32.7元、98無鉛汽油34.7元、超級柴油29.7元；自9月14日調漲汽油價格後，已連續4週未調整油價。"}]}], "warnings": [], "day": "2026-10-12"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-07 至 2026-10-09）", "compiled": "2026-10-09 00:52（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件", "note": "航運類4則、Currencies類4則、Commodities類4則（近3日符合條件且來源可查證之新聞不足），其餘各類各5則，無空缺類別；美股與歐股8日收盤行情於整理時尚未發布，美股以開盤行情列入，且尚無10月9日發布之符合新聞；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "格芯將生產關鍵AI晶片零組件 供台積電使用", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=GlobalFoundries%20Fab%208%2C%20Malta%2C%20NY", "source_name": "中央社：格芯將生產關鍵AI晶片零組件 供台積電使用", "url": "https://www.cna.com.tw/news/aopl/202610080370.aspx", "summary": "美國晶片製造商格芯表示，已與台積電達成價值20億美元、為期5年的協議，將由紐約州馬爾他（Malta）廠房擴大產能，為台積電生產矽中介層（silicon interposer）。這款零組件放置於先進AI封裝內部的處理器與記憶體晶片下方，有助兩者進行高速傳輸與通訊，是AI晶片的關鍵零組件。"}, {"no": 2, "title": "聯發科9月營收月減13.69% 第3季表現優於預期", "date": "2026-10-08", "map": "", "source_name": "中央社：聯發科9月營收月減13.69% 第3季表現優於預期", "url": "https://www.cna.com.tw/news/afe/202610080279.aspx", "summary": "IC設計廠聯發科自結9月營收新台幣553.99億元，較8月歷史新高下滑13.69%，但年增1.97%；第3季營收1680.58億元，季增10.43%，優於先前預估的1522億至1598億元。法人指出旗艦手機晶片放量是主因；聯發科首款AI加速器特殊應用晶片（ASIC）預計第4季量產，全年資料中心營收可望超過20億美元。"}, {"no": 3, "title": "合晶科技4度申請回台方案 砸逾178億擴大中科二林園區投資", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E7%A7%91%E4%BA%8C%E6%9E%97%E5%9C%92%E5%8D%80", "source_name": "中央社：合晶科技4度申請回台方案 砸逾178億擴大中科二林園區投資", "url": "https://www.cna.com.tw/news/afe/202610080208.aspx", "summary": "投資台灣事務所通過3家企業擴大投資，全球前10大矽晶圓供應商合晶科技第4度申請「台商回台方案」，規劃投資約新台幣178.8億元，於中科二林園區建置新產能並擴大廠區，新廠將導入AI建立製程數據分析與監測機制，並設置太陽能發電設備，提升台灣半導體供應鏈韌性；PCB廠晟鈦也將投資約1.8億元擴增智慧化產線。"}, {"no": 4, "title": "台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "date": "2026-10-08", "map": "", "source_name": "中央社：台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "url": "https://www.cna.com.tw/news/afe/202610080157.aspx", "summary": "台積電公布9月營收新台幣5118.57億元，月減0.6%、年增54.6%，創歷年同期新高；第3季營收1兆4942.43億元，季增17.62%並創歷史新高，超越公司原先財測。法人指出AI需求強勁與智慧手機新機備貨是主要動力，台積電將於10月15日召開法說會，市場關注資本支出與先進製程進度。"}, {"no": 5, "title": "家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "date": "2026-10-08", "map": "", "source_name": "中央社：家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "url": "https://www.cna.com.tw/news/afe/202610080043.aspx", "summary": "傳載方案商家登自結9月營收9.94億元，月增18.4%、年增67.74%，創歷史新高，第3季營收27.05億元同創單季新高。家登表示已接獲韓系客戶先進封裝載具訂單，預計明年出貨並在未來2年逐步放量，加上極紫外光光罩盒（EUV POD）出貨增長，將挹注中長期成長動能。"}]}, {"name": "AI", "items": [{"no": 1, "title": "緯創英業達第3季營收創新高 和碩9月歷年最旺", "date": "2026-10-08", "map": "", "source_name": "中央社：緯創英業達第3季營收創新高 和碩9月歷年最旺", "url": "https://www.cna.com.tw/news/afe/202610080358.aspx", "summary": "受惠AI伺服器與季底拉貨，緯創9月營收約新台幣3808.06億元、年增87.2%，第3季營收1.15兆元年增逾1倍；英業達9月營收986.36億元年增62.9%，第3季2720.94億元創單季新高；和碩9月營收2147.53億元年增86.9%，創單月新高。緯創與英業達均預期第4季AI伺服器表現優於第3季。"}, {"no": 2, "title": "大立光衝刺CPO 林恩平：FA通過認證FAU拚明年量產", "date": "2026-10-08", "map": "", "source_name": "中央社：大立光衝刺CPO 林恩平：FA通過認證FAU拚明年量產", "url": "https://www.cna.com.tw/news/afe/202610080326.aspx", "summary": "大立光董事長林恩平表示，共同封裝光學（CPO）用光纖陣列（FA）已通過客戶認證，預計2027年第2季底建置產能，光纖陣列單元（FAU）有望2027年下半年量產。大立光第3季毛利率42.2%，季減7.22個百分點，為2013年第1季以來新低，稅後淨利51.82億元、每股盈餘39.62元，並預估11月拉貨動能開始下滑。"}, {"no": 3, "title": "光寶科第3季營收574億年增28% 創2021年轉型後新高", "date": "2026-10-08", "map": "", "source_name": "中央社：光寶科第3季營收574億年增28% 創2021年轉型後新高", "url": "https://www.cna.com.tw/news/afe/202610080306.aspx", "summary": "光寶科公布9月營收新台幣188.48億元，年增22.15%；第3季營收574.46億元，年增27.97%，創2021年啟動轉型策略以來的單季新高，前9月營收1535.58億元年增26.15%。光寶科表示，主要受惠AI與雲端高階伺服器電源、電池備援電力模組（BBU）及高階光電半導體需求強勁，9月雲端及物聯網部門營收年增逾5成。"}, {"no": 4, "title": "聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "date": "2026-10-08", "map": "", "source_name": "中央社：聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "url": "https://www.cna.com.tw/news/afe/202610080183.aspx", "summary": "電子通路商聯強9月營收新台幣903.09億元，年增1.58倍、月增21.7%，大幅超越6月所創紀錄並改寫歷史新高；第3季營收2368.64億元同創新高，前9月營收年增97.96%。聯強表示主要受惠AI建置熱潮帶動相關產品需求，AI資本支出正由大型雲端業者擴散至一般企業。"}, {"no": 5, "title": "受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "date": "2026-10-08", "map": "", "source_name": "中央社：受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "url": "https://www.cna.com.tw/news/ait/202610080046.aspx", "summary": "三星電子預估第3季營業利益達107.4兆韓元，年增782.5%，營收預計年增127%至195兆韓元，可望成為韓國首家單季營業利益突破100兆韓元的企業。AI資料中心快速擴張帶動先進記憶體需求，全球供應短缺持續加劇，分析師看好三星擴產HBM4將有助迅速提高市占率。"}]}, {"name": "金融", "items": [{"no": 1, "title": "國銀8月放款增額3627億元 創史上同期第2高", "date": "2026-10-08", "map": "", "source_name": "中央社：國銀8月放款增額3627億元 創史上同期第2高", "url": "https://www.cna.com.tw/news/afe/202610080359.aspx", "summary": "金管會公布本國銀行8月底放款餘額新台幣49兆2155億元，月增3627億元，增額創歷年同期第2高，主因出口暢旺、備貨購料等營運資金需求強勁；逾放比率0.14%與7月持平。8月底存款餘額月增8382億元創同期新高，整體國銀前8月稅前盈餘4853.7億元，同樣創歷年同期新高。"}, {"no": 2, "title": "金管會：前8月信用卡簽帳金額逾3.7兆 創同期新高", "date": "2026-10-08", "map": "", "source_name": "中央社：金管會：前8月信用卡簽帳金額逾3.7兆 創同期新高", "url": "https://www.cna.com.tw/news/afe/202610080285.aspx", "summary": "金管會表示，8月信用卡簽帳金額新台幣4326億元，為歷年同月新高，前8月累計3兆7639億元，年增14.8%並創史上同期新高，主因國內經濟成長、民眾購買力提升。8月電子支付使用者約4189萬人，受惠業者推出消費與乘車碼回饋活動，代理收付實質交易金額約341.3億元，創歷年單月新高。"}, {"no": 3, "title": "金管會：開放高雄專區財管保險商品 落地全台", "date": "2026-10-08", "map": "", "source_name": "中央社：金管會：開放高雄專區財管保險商品 落地全台", "url": "https://www.cna.com.tw/news/afe/202610080252.aspx", "summary": "金管會表示，保險業者在亞洲資產管理中心高雄專區試辦銷售、不適用死亡給付對保單價值準備金最低比率規範的人壽保險商品已達試辦效益，因此修正相關規定，即日起10家業者可在專區外銷售，等於讓這項財富管理保險商品落地全台；金管會提醒客戶投保前應審慎了解商品特性與風險。"}, {"no": 4, "title": "黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "date": "2026-10-08", "map": "", "source_name": "中央社：黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "url": "https://www.cna.com.tw/news/afe/202610080189.aspx", "summary": "玉山金董事長黃男州表示，企業投資增加與股市投資借款增多，使近期市場資金趨緊，銀行存放款利率都有往上壓力。他認為若台美息差過大恐造成資金外流，判斷央行12月理監事會有可能「微幅升息」，年底前升息半碼的機會「應該是有的」，並建議有房貸需求者提前作業。"}, {"no": 5, "title": "台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "date": "2026-10-08", "map": "", "source_name": "中央社：台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "url": "https://www.cna.com.tw/news/afe/202610080060.aspx", "summary": "台灣金聯與合庫銀簽署續建資金承諾業務合作意向書，合庫銀准貸的建商可向台灣金聯申請續建資金承諾，額度以營造成本3成為限；若因營建工料上漲或預售不如預期出現資金缺口，可在額度內動用續建資金，不必等停工3個月才啟動，以避免爛尾樓發生。"}]}, {"name": "航運", "items": [{"no": 1, "title": "客貨運需求強勁 華航長榮航前3季營收雙創新高", "date": "2026-10-08", "map": "", "source_name": "中央社：客貨運需求強勁 華航長榮航前3季營收雙創新高", "url": "https://www.cna.com.tw/news/afe/202610080349.aspx", "summary": "受惠AI伺服器與半導體貨運需求強勁，以及中秋連假帶動旅運淡季不淡，華航9月合併營收新台幣209.33億元年增31.86%，其中貨運收入年增41.82%，前3季營收1859.2億元創新高；長榮航9月合併營收207.49億元年增32.86%，前9月1943.8億元創同期新高；台灣虎航9月營收17.39億元年增36%。"}, {"no": 2, "title": "長榮：旺季拚一路到年底 美國線沒有悲觀理由", "date": "2026-10-08", "map": "", "source_name": "中央社：長榮：旺季拚一路到年底 美國線沒有悲觀理由", "url": "https://www.cna.com.tw/news/afe/202610080235.aspx", "summary": "長榮海運9月合併營收新台幣497.11億元，年增63.75%。總經理吳光輝在法說會表示，今年旺季提早且延續，11月前載貨狀況非常樂觀，第4季可望比去年同期微幅成長，運價呈「美線強、歐線弱」，以美國線來說春節前看不出悲觀理由；長榮海運船隊242艘、運能204萬TEU，規劃2030年擴至約290艘、274萬TEU。"}, {"no": 3, "title": "荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%8D%B7%E8%8E%AB%E8%8C%B2%E6%B5%B7%E5%B3%BD", "source_name": "中央社：荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "url": "https://www.cna.com.tw/news/aopl/202610080137.aspx", "summary": "根據海事安全消息人士數據，9月28日至10月5日荷莫茲海峽周邊至少有12艘原油、液化天然氣和液化石油氣油輪遇襲，為美伊2月28日開戰以來單週最多。戰火令油輪一船難求，托克集團租用超級油輪Alexandros號的租金高達7600萬美元，遠高於戰前約700萬至1000萬美元水準。"}, {"no": 4, "title": "重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Fujairah", "source_name": "中央社：重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "url": "https://www.cna.com.tw/news/aopl/202610070172.aspx", "summary": "金融時報報導，伊朗加強攻擊荷莫茲海峽船隻，波灣船東以每月約10萬美元薪資及每趟5萬美元獎金吸引油輪船長出航。行經該水道的油輪運費本週達每天130萬美元新高，去年同期僅約2萬至5萬美元；船東另須負擔船體價值6%至10%的戰爭保險費，部分原油改在富查伊哈外海轉運。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "國際油價升、美債殖利率徘徊高點 華爾街股市開低", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=New%20York%20Stock%20Exchange", "source_name": "中央社：國際油價升、美債殖利率徘徊高點 華爾街股市開低", "url": "https://www.cna.com.tw/news/afe/202610080371.aspx", "summary": "國際油價飆升之際，美國公債殖利率也徘徊在多年高點附近，加深投資人對通膨的疑慮，華爾街股市8日開盤走低。道瓊工業指數下跌178.5點或0.37%，報51001.38點；標準普爾500指數下滑28.9點或0.37%，報7772.87點；那斯達克指數下挫135.05點或0.49%，報27403.64點。"}, {"no": 2, "title": "台股週漲837點 上市公司總市值衝破160兆", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：台股週漲837點 上市公司總市值衝破160兆", "url": "https://www.cna.com.tw/news/afe/202610080277.aspx", "summary": "台股本週因國慶連假僅開盤4天，6日盤中最高衝上49968.92點創歷史新高，8日以49313.44點作收，週漲837.70點或1.73%，週線連4紅。證交所統計上市公司總市值達新台幣161兆3576億元，衝破160兆元大關；本週塑膠類指數大漲16.80%居冠，航運類下跌1.53%，全體上市股票成交金額3兆8507億元。"}, {"no": 3, "title": "東證指數權重調整引發拋售 日股連2跌", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E4%BA%AC%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：東證指數權重調整引發拋售 日股連2跌", "url": "https://www.cna.com.tw/news/afe/202610080184.aspx", "summary": "日本股市連續第2個交易日收跌，主因東證指數調整成分股權重，引發市場拋售權重即將被調降的個股。日經225指數下跌993.60點或1.42%，收在69042.11點；東證股價指數下跌62.65點或1.51%，收在4091.46點，兩大指數同步走弱。"}, {"no": 4, "title": "科技股弱勢台股收跌492.93點 週線連4紅", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：科技股弱勢台股收跌492.93點 週線連4紅", "url": "https://www.cna.com.tw/news/afe/202610080161.aspx", "summary": "台股下跌492.93點，收在49313.44點，成交值新台幣8696.96億元，但本週累計上漲837.7點，週線連4紅。台積電跌35元、聯發科挫145元，金融股指數跌1.68%；防疫概念股逆勢強攻漲停，股后川湖以跌停作收，台股千金股陣容縮減至55檔。"}, {"no": 5, "title": "美債殖利率再走高 美股全線收黑", "date": "2026-10-08", "map": "", "source_name": "中央社：美債殖利率再走高 美股全線收黑", "url": "https://www.cna.com.tw/news/afe/202610080015.aspx", "summary": "美國長天期國債殖利率重新走高，再度引發市場對通膨及債務攀升的擔憂，美股主要指數7日全線收黑。道瓊工業指數下跌341.41點或0.66%，收51179.87點；標普500指數下挫0.22%，收7801.77點；那斯達克指數下滑0.22%；費城半導體指數挫跌1.15%。"}]}, {"name": "Futures", "items": [{"no": 1, "title": "10月台股期指跌619點", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E6%9C%9F%E8%B2%A8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：10月台股期指跌619點", "url": "https://www.cna.com.tw/news/afe/202610080169.aspx", "summary": "台股終場跌492.93點，收49313.44點；10月台指期以49349點作收，下跌619點，與現貨相較正價差35.56點，成交3萬5892口；11月期貨收49546點，跌598點。台灣期貨交易所訂定近2個月契約開盤參考價，10月期貨49968點、11月期貨50144點。"}, {"no": 2, "title": "10月電子期金融期齊跌", "date": "2026-10-08", "map": "", "source_name": "中央社：10月電子期金融期齊跌", "url": "https://www.cna.com.tw/news/afe/202610080170.aspx", "summary": "台北股市8日下跌492.93點，10月電子期收3136.25點，下跌48.15點，成交44口，與電子現貨3134.58點相較正價差1.67點；10月金融期收3551.6點，下跌56.2點，正價差16.33點，電子與金融兩大類股期貨同步走弱。"}, {"no": 3, "title": "台指期夜盤下跌 法人：台股可能高檔震盪", "date": "2026-10-08", "map": "", "source_name": "中央社：台指期夜盤下跌 法人：台股可能高檔震盪", "url": "https://www.cna.com.tw/news/afe/202610080025.aspx", "summary": "美股主要指數全面收低，費城半導體指數下跌逾1%，台積電ADR跌2.09%，台指期夜盤下挫375點。法人表示台股7日小跌16.18點，收49806.37點，加上國慶連假即將來臨，台股8日可能維持高檔震盪，並留意美光桃園廠工會取得罷工權、國巨與廣達營收創高等訊息。"}, {"no": 4, "title": "10月電子期跌 金融期漲", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E6%9C%9F%E8%B2%A8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：10月電子期跌 金融期漲", "url": "https://www.cna.com.tw/news/afe/202610070146.aspx", "summary": "台北股市7日下跌16.18點，收49806.37點。10月電子期收3184.55點，下跌18.80點，與電子現貨3168.56點相較為正價差15.99點，成交35口；10月金融期則逆勢收3607.80點，上漲28點，正價差11.95點，電子期與金融期當日走勢分歧。"}, {"no": 5, "title": "10月台指期跌103點", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E6%9C%9F%E8%B2%A8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：10月台指期跌103點", "url": "https://www.cna.com.tw/news/afe/202610070144.aspx", "summary": "台北股市7日終場跌16.18點，收49806.37點；10月台指期以49979點作收，下跌103點，與現貨相較正價差172.63點。台灣期貨交易所為近2個月指數期貨契約訂定開盤參考價，10月期貨為50082點、11月期貨為50292點。"}]}, {"name": "Rates & Bonds", "items": [{"no": 1, "title": "法國研議增發短期公債 因應債市震盪", "date": "2026-10-08", "map": "", "source_name": "中央社：法國研議增發短期公債 因應債市震盪", "url": "https://www.cna.com.tw/news/aopl/202610080019.aspx", "summary": "華爾街日報指出，法國公債拋售潮近週加劇，長期借貸成本逼近2002年以來最高，法國正研議擴大發行短期公債。7日法國10年期公債殖利率升至4.91%、2年期升至3.61%，利差擴大至約1.3個百分點；財長勒斯鳩坦言30年期公債需求「目前確實較棘手」。"}, {"no": 2, "title": "聯準會公布9月會議紀要 10月可能不動12月再升息", "date": "2026-10-08", "map": "", "source_name": "中央社：聯準會公布9月會議紀要 10月可能不動12月再升息", "url": "https://www.cna.com.tw/news/afe/202610080010.aspx", "summary": "聯準會公布9月會議紀要，官員一致支持9月升息以因應持續的通膨壓力，多數官員預估今年剩下兩次會議將再升息一次，但紀要未顯示10月有迫切升息必要，多位高層暗示可等到12月再行動。聯準會將於10月28日及12月9日舉行今年最後兩次利率決策會議。"}, {"no": 3, "title": "IMF總裁：殖利率狂飆、債務占比近100% 各國應節流", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E5%8A%A0%E5%9D%A1", "source_name": "中央社：IMF總裁：殖利率狂飆、債務占比近100% 各國應節流", "url": "https://www.cna.com.tw/news/afe/202610080007.aspx", "summary": "國際貨幣基金總裁喬治艾娃在新加坡表示，全球債務占GDP比重即將突破100%，伊朗戰爭推升能源價格，已將美、德、日10年期公債殖利率推至數十年高點且仍在攀升。她呼籲各國控制支出、推動財政整頓，並點名法國、義大利、葡萄牙與愛爾蘭特別容易受到衝擊。"}, {"no": 4, "title": "油價與各國債台高築夾擊 全球債市拋售潮再起", "date": "2026-10-08", "map": "", "source_name": "中央社：油價與各國債台高築夾擊 全球債市拋售潮再起", "url": "https://www.cna.com.tw/news/afe/202610080006.aspx", "summary": "全球債市7日再掀拋售潮，美國30年期公債殖利率盤中一度升至5.73%，創2002年以來最高；英國30年期公債殖利率一度達6.04%的28年新高，法國10年期升至4.87%。美國30年期固定房貸平均利率升至7.49%，市場關注美國財政部本週10年期與30年期公債標售承接情況。"}, {"no": 5, "title": "印度央行調高基準利率1碼 2023年以來首見升息", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Reserve%20Bank%20of%20India%20Mumbai", "source_name": "中央社：印度央行調高基準利率1碼 2023年以來首見升息", "url": "https://www.cna.com.tw/news/aopl/202610070300.aspx", "summary": "中東衝突加劇印度通膨並重創盧比，印度中央銀行印度儲備銀行6人小組一致表決，調高基準附買回利率1碼至5.50%，為2023年以來首次升息。印度央行自2月伊朗戰爭爆發以來按兵不動，此舉意味政策轉向，加入全球為抑制物價或提振本國貨幣而升息的行列。"}]}, {"name": "Currencies", "items": [{"no": 1, "title": "股匯雙挫 新台幣貶8分週線連2黑", "date": "2026-10-08", "map": "", "source_name": "中央社：股匯雙挫 新台幣貶8分週線連2黑", "url": "https://www.cna.com.tw/news/afe/202610080318.aspx", "summary": "中東緊張局勢升溫、美債殖利率衝高，加上聯準會會議紀錄偏鷹，熱錢大舉匯出，新台幣兌美元8日收31.875元，貶8分，週線連2跌。外資在國慶連假前賣超台股758.52億元，連3賣累計提款近千億元；新台幣盤中最低觸及31.94元、重貶逾1.4角，出口商拋匯加上央行調節後跌幅收斂，總成交金額放大至33.27億美元。"}, {"no": 2, "title": "菲律賓9月底外匯存底不足千億美元 創3年新低", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=Bangko%20Sentral%20ng%20Pilipinas", "source_name": "中央社：菲律賓9月底外匯存底不足千億美元 創3年新低", "url": "https://www.cna.com.tw/news/aopl/202610080176.aspx", "summary": "菲律賓中央銀行公布9月底外匯存底為999億9660萬美元，跌破1000億美元，創2023年9月以來3年新低，主因央行淨外匯操作、黃金及外幣資產估值下調，以及政府提領外幣存款償付外債。菲律賓披索兌美元9月15日曾觸及62.925披索的盤中歷史低點。"}, {"no": 3, "title": "美日近30年首度聯手支撐日圓，Fed紀錄揭7月干預使用美財政部資金", "date": "2026-10-08", "map": "", "source_name": "Yahoo股市（財訊快報）：美日近30年首度聯手支撐日圓，Fed紀錄揭7月干預使用美財政部資金", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E6%97%A5%E8%BF%9130%E5%B9%B4%E9%A6%96%E5%BA%A6%E8%81%AF%E6%89%8B%E6%94%AF%E6%92%90%E6%97%A5%E5%9C%93-fed%E7%B4%80%E9%8C%84%E6%8F%AD7%E6%9C%88%E5%B9%B2%E9%A0%90%E4%BD%BF%E7%94%A8%E7%BE%8E%E8%B2%A1%E6%94%BF%E9%83%A8%E8%B3%87%E9%87%91-234205643.html", "summary": "聯準會公布的9月FOMC會議紀錄指出，美國7月底與日本聯手干預匯市、支撐日圓，屬美國財政部採取的行動，由紐約聯邦銀行以財政代理人身分執行，並未動用Fed自身資金，為美日近30年首度共同出手撐日圓；紀錄未披露干預的確切時間及規模。"}, {"no": 4, "title": "台股5萬點近關情怯 新台幣終止連5紅量縮小貶", "date": "2026-10-07", "map": "", "source_name": "中央社：台股5萬點近關情怯 新台幣終止連5紅量縮小貶", "url": "https://www.cna.com.tw/news/afe/202610070287.aspx", "summary": "台股在5萬點前震盪小跌，外資續賣超130.44億元，新台幣終止連5升，收31.795元、貶值1.4分，台北及元太外匯市場總成交金額19.915億美元。交易員指出，聯準會年底前升息預期與美債殖利率偏高支撐美元，新台幣短線料在31.650至31.850元區間波動。"}]}, {"name": "Commodities", "items": [{"no": 1, "title": "美元強勢壓抑全球穀物價格 台灣進口成本恐受衝擊", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=Chicago%20Board%20of%20Trade", "source_name": "Yahoo股市（商傳媒）：美元強勢壓抑全球穀物價格 台灣進口成本恐受衝擊", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E5%85%83%E5%BC%B7%E5%8B%A2%E5%A3%93%E6%8A%91%E5%85%A8%E7%90%83%E7%A9%80%E7%89%A9%E5%83%B9%E6%A0%BC-%E5%8F%B0%E7%81%A3%E9%80%B2%E5%8F%A3%E6%88%90%E6%9C%AC%E6%81%90%E5%8F%97%E8%A1%9D%E6%93%8A-102626689.html", "summary": "美元指數逼近一年半高點，壓抑以美元計價的穀物期貨，7日12月玉米期貨下跌6美分至每英斗5.02美元，11月大豆跌5.5美分至12.975美元，12月小麥跌17.75美分至6.865美元，豆粕則逆勢走高。報導指出，台灣高度仰賴農產品進口，即使國際穀價下跌，美元走強仍可能推升進口成本與國內物價，壓縮食品加工與畜牧業利潤。"}, {"no": 2, "title": "聯準會會議紀要偏鷹派 金價跌破 4,100 美元創兩個月新低", "date": "2026-10-08", "map": "", "source_name": "Yahoo股市（商傳媒）：聯準會會議紀要偏鷹派 金價跌破 4,100 美元創兩個月新低", "url": "https://tw.stock.yahoo.com/news/%E8%81%AF%E6%BA%96%E6%9C%83%E6%9C%83%E8%AD%B0%E7%B4%80%E8%A6%81%E5%81%8F%E9%B7%B9%E6%B4%BE-%E9%87%91%E5%83%B9%E8%B7%8C%E7%A0%B4-4-100-%E7%BE%8E%E5%85%83%E5%89%B5%E5%85%A9%E5%80%8B%E6%9C%88%E6%96%B0%E4%BD%8E-021831702.html", "summary": "受強勢美元、美債殖利率飆升及聯準會9月會議紀要偏鷹派影響，現貨黃金7日盤中一度跌至每盎司4096.13美元，創8月上旬以來最低。CME FedWatch顯示市場普遍預期10月按兵不動，但12月升息機率達84%至88%；分析師估金價可能下探4000美元，年底前再反彈至4400美元。"}, {"no": 3, "title": "〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "date": "2026-10-07", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈渣打投資展望〉黃金明年恐飆至5,000美元 日元迎美日利差收斂上看153", "url": "https://tw.stock.yahoo.com/news/%E6%B8%A3%E6%89%93%E6%8A%95%E8%B3%87%E5%B1%95%E6%9C%9B-%E9%BB%83%E9%87%91%E6%98%8E%E5%B9%B4%E6%81%90%E9%A3%86%E8%87%B35-000%E7%BE%8E%E5%85%83-%E6%97%A5%E5%85%83%E8%BF%8E%E7%BE%8E%E6%97%A5%E5%88%A9%E5%B7%AE%E6%94%B6%E6%96%82%E4%B8%8A%E7%9C%8B153-091658645.html", "summary": "渣打銀行首席投資辦公室發布第4季展望，維持看多黃金，3個月及12個月目標價分別為每盎司4750美元及5000美元，理由是美元中期可能轉弱與新興市場央行持續增持黃金；原油方面，將西德州原油3個月價格預測上調至每桶100美元、12個月目標價上調至80美元。"}, {"no": 4, "title": "CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Chicago%20Board%20of%20Trade", "source_name": "Yahoo股市（財訊快報）：CBOT大豆期約週二漲1.74%、玉米揚2.16%，ICE粗糖再創19個月高點", "url": "https://tw.stock.yahoo.com/news/cbot%E5%A4%A7%E8%B1%86%E6%9C%9F%E7%B4%84%E9%80%B1%E4%BA%8C%E6%BC%B21-74-%E7%8E%89%E7%B1%B3%E6%8F%9A2-16-ice%E7%B2%97%E7%B3%96%E5%86%8D%E5%89%B519%E5%80%8B%E6%9C%88%E9%AB%98%E9%BB%9E-235914413.html", "summary": "美國農產品期貨6日收高，CBOT 11月大豆期約漲1.74%至每蒲式耳13.03美元，12月玉米漲2.16%至5.08美元，12月小麥漲1.73%至7.0425美元，作物評級下降、收割進度落後及美元走弱支撐買氣；ICE粗糖盤中觸及每磅20.95美分，續創19個月新高。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "友達宸鴻9月營收持平 布局先進封裝進度受矚", "date": "2026-10-08", "map": "", "source_name": "中央社：友達宸鴻9月營收持平 布局先進封裝進度受矚", "url": "https://www.cna.com.tw/news/afe/202610080369.aspx", "summary": "友達9月自結合併營收新台幣234億元，月增1.3%、年減4.3%；宸鴻9月營收65.9億元，年增27.8%。面板與觸控廠積極轉型半導體先進封裝，友達在國際半導體展與康寧合作展出玻璃核心基板技術，宸鴻則鎖定AI高階ASIC所需的玻璃鑽孔（TGV）技術，市場關注友達10月17日30週年活動是否宣布新轉型成果。"}, {"no": 2, "title": "宏碁9月營收登14年同期新高 華碩創單月次高", "date": "2026-10-08", "map": "", "source_name": "中央社：宏碁9月營收登14年同期新高 華碩創單月次高", "url": "https://www.cna.com.tw/news/afe/202610080357.aspx", "summary": "電腦品牌廠宏碁9月合併營收新台幣347.37億元，年增17.6%、月增15.1%，創14年來同期新高，第3季營收918.22億元年增25.1%；華碩9月集團合併營收約972.43億元，年增17.7%，寫下單月歷史次高，第3季集團營收2763.3億元年增38%，部分伺服器專案配合客戶資料中心建置時程遞延至10月出貨。"}, {"no": 3, "title": "財部：出口迎輝煌時刻 第4季連破3關全年上看9千億美元", "date": "2026-10-08", "map": "", "source_name": "中央社：財部：出口迎輝煌時刻 第4季連破3關全年上看9千億美元", "url": "https://www.cna.com.tw/news/afe/202610080290.aspx", "summary": "財政部公布9月出口872.2億美元，創歷年單月新高，年增60.9%、連35紅，刷新史上最長上升週期；前9月累計6615.5億美元。統計處長蔡美娜表示，AI投資熱潮、電子零組件規格升級與新品鋪貨潮為主要支撐，非電子資通產品出口也年增25.4%，預估10月出口年增40%至44%，全年突破9000億美元機率相當高。"}, {"no": 4, "title": "9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "date": "2026-10-08", "map": "", "source_name": "中央社：9月住展風向球續亮黃藍燈 股市吸金等3因素拖累房市買氣", "url": "https://www.cna.com.tw/news/afe/202610080079.aspx", "summary": "住展雜誌公布9月住展風向球續亮衰退黃藍燈，總分回升至36.1分，主因建商供給走強，預售案量升至700多億元。但來客與成交組數仍處谷底，待售案數增至1579案；住展指出股市磁吸資金、貸款不易及央行仍有升息可能，使北台灣房市買氣短期難解凍。"}, {"no": 5, "title": "被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "date": "2026-10-07", "map": "", "source_name": "中央社：被動元件強勢表態 台廠受惠訂單外溢和漲價效應", "url": "https://www.cna.com.tw/news/afe/202610070138.aspx", "summary": "被動元件族群成為盤面焦點，華新科、光頡鎖漲停，國巨收647元漲3.5%，禾伸堂、立隆電、金山電同步大漲。市場分析指出，AI伺服器帶動積層陶瓷電容（MLCC）需求明顯成長，日韓大廠轉向板卡端小尺寸高容值產品，台廠可望受惠訂單外溢與漲價效應。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "美軍傳可能再空襲伊朗 國際油價勁揚5%", "date": "2026-10-08", "map": "", "source_name": "中央社：美軍傳可能再空襲伊朗 國際油價勁揚5%", "url": "https://www.cna.com.tw/news/afe/202610080343.aspx", "summary": "美國媒體指出，美軍可能在11月期中選舉前再度空襲伊朗，恐導致進一步原油供應中斷，國際油價8日大漲約5%。截至美東時間上午7時18分左右，紐約西德州中級原油11月交割價揚升4.42美元或5.01%，來到每桶92.70美元；布倫特原油12月交割價上漲5.00美元或4.99%，來到每桶105.20美元。"}, {"no": 2, "title": "中火燃氣二期環評遭撤 台電：盼儘速推動實現無煤目標", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E4%B8%AD%E7%99%BC%E9%9B%BB%E5%BB%A0", "source_name": "中央社：中火燃氣二期環評遭撤 台電：盼儘速推動實現無煤目標", "url": "https://www.cna.com.tw/news/afe/202610080304.aspx", "summary": "台北高等行政法院8日判決撤銷台中火力發電廠二期燃氣機組計畫的環評結論，環團呼籲台電進行較嚴格的二階環評，環境部表示不排除上訴。台電表示尊重判決，將待收到判決書後補充事證、釐清爭點，並強調二期燃氣機組是「增氣減煤」政策核心，也是台中電廠5至10號燃煤機組能否順利除役的關鍵。"}, {"no": 3, "title": "AI淨零／經部邀金融業訪金崙地熱案場 盼綠色融資支持地熱發電", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E6%9D%B1%20%E9%87%91%E5%B4%99%E5%9C%B0%E7%86%B1", "source_name": "中央社：AI淨零／經部邀金融業訪金崙地熱案場 盼綠色融資支持地熱發電", "url": "https://www.cna.com.tw/news/afe/202610080301.aspx", "summary": "經濟部邀集逾10家金融業者參訪台東金崙地熱案場，了解地熱從探勘、鑽井到發電的開發情形，盼加速綠色融資投入。該案場由環台能源集團投資興建，已完成鑽井與產能測試，正興建廠房與控制室，預計2027年初併網發電，發電後尾水將提供在地溫泉業者及農業乾燥使用；能源署並以地熱躉購費率提供穩定收入。"}, {"no": 4, "title": "離岸風電3-3僅2家投標 龔明鑫：待結果出爐再檢討", "date": "2026-10-08", "map": "", "source_name": "中央社：離岸風電3-3僅2家投標 龔明鑫：待結果出爐再檢討", "url": "https://www.cna.com.tw/news/afe/202610080259.aspx", "summary": "離岸風電區塊開發3-3期選商截止收件，僅哥本哈根基礎建設基金（CIP）與沃旭2家開發商、2個風場送件，獲選風場預計2030年至2031年完工併網，能源署將在今年底前完成選商與容量分配。經濟部長龔明鑫表示目前仍在審查期間，待結果出爐後再評論與檢討，並將持續了解外商與本土業者參與後續開發的意願。"}, {"no": 5, "title": "IEA成員國願釋出戰略儲備 油價微跌", "date": "2026-10-08", "map": "", "source_name": "中央社：IEA成員國願釋出戰略儲備 油價微跌", "url": "https://www.cna.com.tw/news/afe/202610080016.aspx", "summary": "國際油價7日劇烈震盪，盤中一度因傳出伊朗可能加劇在荷莫茲海峽的襲擊而飆升，但國際能源總署（IEA）表示成員國準備釋出更多戰略石油儲備後轉跌。紐約西德州中級原油下跌1.3%，收每桶88.28美元；倫敦布倫特原油下跌0.4%，收每桶100.20美元。"}]}], "warnings": [], "day": "2026-10-09"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-06 至 2026-10-08）", "compiled": "2026-10-08 15:33（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件", "note": "航運類3則、Commodities類4則（近3日符合條件且來源可查證之新聞不足），其餘9類各5則，無空缺類別；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "date": "2026-10-08", "map": "", "source_name": "中央社：台積電9月營收5118.57億元創同期新高 第3季衝歷史新高", "url": "https://www.cna.com.tw/news/afe/202610080157.aspx", "summary": "台積電公布9月營收新台幣5118.57億元，月減0.6%、年增54.6%，創歷年同期新高；第3季營收1兆4942.43億元，季增17.62%並創歷史新高，超越公司原先財測。法人指出AI需求強勁與智慧手機新機備貨是主要動力，台積電將於10月15日召開法說會，市場關注資本支出與先進製程進度。"}, {"no": 2, "title": "家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "date": "2026-10-08", "map": "", "source_name": "中央社：家登9月營收衝新高 韓系客戶先進封裝載具明年出貨", "url": "https://www.cna.com.tw/news/afe/202610080043.aspx", "summary": "傳載方案商家登自結9月營收9.94億元，月增18.4%、年增67.74%，創歷史新高，第3季營收27.05億元同創單季新高。家登表示已接獲韓系客戶先進封裝載具訂單，預計明年出貨並在未來2年逐步放量，加上極紫外光光罩盒（EUV POD）出貨增長，將挹注中長期成長動能。"}, {"no": 3, "title": "美光桃園廠工會取得罷工權 市調：DRAM產出添變數", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E7%81%A3%E7%BE%8E%E5%85%89%20%E6%A1%83%E5%9C%92%E5%BB%A0", "source_name": "中央社：美光桃園廠工會取得罷工權 市調：DRAM產出添變數", "url": "https://www.cna.com.tw/news/afe/202610070268.aspx", "summary": "台灣美光晶圓工會（桃園工會）宣布經會員投票取得罷工權，投票人數2012名，同意票1994張，總體同意比例達88.3%。集邦科技分析指出，美光桃園廠目前以生產DRAM為主，若實際發生罷工並影響工程師的設備維護與製程監控，可能使良率與穩定性下降，進而影響記憶體產出。"}, {"no": 4, "title": "東協財經／世界先進新加坡子公司決議辦理現金增資1億美元", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E5%8A%A0%E5%9D%A1", "source_name": "中央社：東協財經／世界先進新加坡子公司決議辦理現金增資1億美元", "url": "https://www.cna.com.tw/news/afe/202610073005.aspx", "summary": "世界先進代新加坡子公司VSMC公告，董事會決議辦理現金增資1億美元，以每股1美元發行1億股，全數由原股東認購。VSMC由世界先進與恩智浦（NXP）合資，持股分別為60%與40%，首座先進晶片廠已於9月28日啟用、新增產能全部售罄，預計2027年初開始量產。"}, {"no": 5, "title": "超微蘇姿丰訪台拜會台積電、鴻海等台廠 證實在台百億美元投資將加碼", "date": "2026-10-06", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E5%8C%97%E6%96%87%E8%8F%AF%E6%9D%B1%E6%96%B9%E9%85%92%E5%BA%97", "source_name": "中央社：超微蘇姿丰訪台拜會台積電、鴻海等台廠 證實在台百億美元投資將加碼", "url": "https://www.cna.com.tw/news/afe/202610060124.aspx", "summary": "超微（AMD）董事長暨執行長蘇姿丰旋風訪台，在台北文華東方酒店與供應商舉行閉門會議，並密集拜會鴻海、廣達、華碩、宏碁，下午前往新竹拜會台積電。她證實先前宣布在台投資100億美元的供應鏈計畫進度符合預期，且因AI運算需求暴增，超微已決定調高在台投資金額。"}]}, {"name": "AI", "items": [{"no": 1, "title": "聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "date": "2026-10-08", "map": "", "source_name": "中央社：聯強9月營收903億元年增1.58倍 受惠AI建置熱潮", "url": "https://www.cna.com.tw/news/afe/202610080183.aspx", "summary": "電子通路商聯強9月營收新台幣903.09億元，年增1.58倍、月增21.7%，大幅超越6月所創紀錄並改寫歷史新高；第3季營收2368.64億元同創新高，前9月營收年增97.96%。聯強表示主要受惠AI建置熱潮帶動相關產品需求，AI資本支出正由大型雲端業者擴散至一般企業。"}, {"no": 2, "title": "受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "date": "2026-10-08", "map": "", "source_name": "中央社：受惠AI熱潮 三星電子預估第3季營業利益年增逾780%", "url": "https://www.cna.com.tw/news/ait/202610080046.aspx", "summary": "三星電子預估第3季營業利益達107.4兆韓元，年增782.5%，營收預計年增127%至195兆韓元，可望成為韓國首家單季營業利益突破100兆韓元的企業。AI資料中心快速擴張帶動先進記憶體需求，全球供應短缺持續加劇，分析師看好三星擴產HBM4將有助迅速提高市占率。"}, {"no": 3, "title": "AI基建燒錢 博通、甲骨文、SpaceX尋求巨額債務融資", "date": "2026-10-08", "map": "", "source_name": "中央社：AI基建燒錢 博通、甲骨文、SpaceX尋求巨額債務融資", "url": "https://www.cna.com.tw/news/ait/202610080026.aspx", "summary": "華爾街日報報導，AI大廠正籌劃一系列巨額融資以支付運算硬體成本：博通籌劃逾500億美元融資用於OpenAI客製化AI晶片，甲骨文正與阿波羅及高盛洽談晶片採購融資，SpaceX也與貸款機構商議約400億美元融資購買輝達晶片，反映AI基礎設施建設成本持續攀升。"}, {"no": 4, "title": "廣達9月與第3季營收攀峰 AI新產品第4季小量出貨", "date": "2026-10-07", "map": "", "source_name": "中央社：廣達9月與第3季營收攀峰 AI新產品第4季小量出貨", "url": "https://www.cna.com.tw/news/afe/202610070289.aspx", "summary": "廣達受惠AI伺服器強勁動能，9月合併營收約3253億元，較8月減少23.3%、年增76.7%，續創歷年同期新高；第3季營收約1兆1155億元，創單季新高。廣達表示輝達GB300出貨穩定，為第4季主要動能，Vera Rubin新平台預計第4季小量出貨、明年第1季放量。"}, {"no": 5, "title": "AI晶片需求強勁 Marvell上修2028會計年度營收預測", "date": "2026-10-07", "map": "", "source_name": "中央社：AI晶片需求強勁 Marvell上修2028會計年度營收預測", "url": "https://www.cna.com.tw/news/ait/202610070150.aspx", "summary": "美滿電子（Marvell）將2028會計年度營收預測上修至約200億美元，優於分析師原先預期的182億美元，主因AI支出激增帶動客製化資料中心晶片需求；公司並預估2029會計年度客製化晶片營收將達120億美元，高於先前的100億美元，消息帶動股價勁揚約6%。"}]}, {"name": "金融", "items": [{"no": 1, "title": "黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "date": "2026-10-08", "map": "", "source_name": "中央社：黃男州：資金緊俏、利率拉高 央行12月升息半碼有機會", "url": "https://www.cna.com.tw/news/afe/202610080189.aspx", "summary": "玉山金董事長黃男州表示，企業投資增加與股市投資借款增多，使近期市場資金趨緊，銀行存放款利率都有往上壓力。他認為若台美息差過大恐造成資金外流，判斷央行12月理監事會有可能「微幅升息」，年底前升息半碼的機會「應該是有的」，並建議有房貸需求者提前作業。"}, {"no": 2, "title": "台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "date": "2026-10-08", "map": "", "source_name": "中央社：台灣金聯推續建資金承諾業務 攜手合庫銀避免爛尾樓", "url": "https://www.cna.com.tw/news/afe/202610080060.aspx", "summary": "台灣金聯與合庫銀簽署續建資金承諾業務合作意向書，合庫銀准貸的建商可向台灣金聯申請續建資金承諾，額度以營造成本3成為限；若因營建工料上漲或預售不如預期出現資金缺口，可在額度內動用續建資金，不必等停工3個月才啟動，以避免爛尾樓發生。"}, {"no": 3, "title": "虛擬通貨公會加入金融總會 共37會員增進產業交流", "date": "2026-10-07", "map": "", "source_name": "中央社：虛擬通貨公會加入金融總會 共37會員增進產業交流", "url": "https://www.cna.com.tw/news/afe/202610070174.aspx", "summary": "台灣金融服務業聯合總會於6日理監事聯席會決議，通過中華民國虛擬通貨商業同業公會申請加入成為新會員，金融總會會員機構由36家增為37家，由虛擬通貨公會理事長鄭光泰擔任會員代表，未來將增進現有金融會員機構與虛擬資產產業之間的交流與合作。"}, {"no": 4, "title": "蔡明興揭富邦人壽資本適足率達177% 金管會：不符規定", "date": "2026-10-06", "map": "", "source_name": "中央社：蔡明興揭富邦人壽資本適足率達177% 金管會：不符規定", "url": "https://www.cna.com.tw/news/afe/202610060319.aspx", "summary": "保險業今年適用新一代清償能力制度（TIS），富邦金董事長蔡明興揭露富邦人壽TIS資本適足率達177%。金管會保險局表示此舉不符規定，在選擇性過渡措施下可揭露上限為目標資本適足率，富邦既揭露140%就應統一說明；若要揭露實際數值，可選擇脫離過渡措施。"}, {"no": 5, "title": "金管會擴大保險業投資健康事業範圍 不受業務結合限制", "date": "2026-10-06", "map": "", "source_name": "中央社：金管會擴大保險業投資健康事業範圍 不受業務結合限制", "url": "https://www.cna.com.tw/news/afe/202610060267.aspx", "summary": "因應超高齡社會，金管會發布令釋，將保險業可投資的健康福祉事業明定為5大類，包括健康管理及健康促進服務、健康醫療科技及數位應用、長期照顧及全齡友善服務等，並放寬須與保險業務結合的限制，未來保險業投資健檢中心等事業，服務對象將不限於保戶。"}]}, {"name": "航運", "items": [{"no": 1, "title": "荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%8D%B7%E8%8E%AB%E8%8C%B2%E6%B5%B7%E5%B3%BD", "source_name": "中央社：荷莫茲油輪遇襲創新高 超級油輪運費飆破24億元", "url": "https://www.cna.com.tw/news/aopl/202610080137.aspx", "summary": "根據海事安全消息人士數據，9月28日至10月5日荷莫茲海峽周邊至少有12艘原油、液化天然氣和液化石油氣油輪遇襲，為美伊2月28日開戰以來單週最多。戰火令油輪一船難求，托克集團租用超級油輪Alexandros號的租金高達7600萬美元，遠高於戰前約700萬至1000萬美元水準。"}, {"no": 2, "title": "重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "date": "2026-10-07", "map": "https://www.google.com/maps/search/?api=1&query=Fujairah", "source_name": "中央社：重金之下有勇夫 油輪船長冒險闖荷莫茲月薪318萬", "url": "https://www.cna.com.tw/news/aopl/202610070172.aspx", "summary": "金融時報報導，伊朗加強攻擊荷莫茲海峽船隻，波灣船東以每月約10萬美元薪資及每趟5萬美元獎金吸引油輪船長出航。行經該水道的油輪運費本週達每天130萬美元新高，去年同期僅約2萬至5萬美元；船東另須負擔船體價值6%至10%的戰爭保險費，部分原油改在富查伊哈外海轉運。"}, {"no": 3, "title": "中菲行：AI半導體物流續強 美線艙位緊、急單海轉空", "date": "2026-10-06", "map": "https://www.google.com/maps/search/?api=1&query=%E5%B7%B4%E6%8B%BF%E9%A6%AC%E9%81%8B%E6%B2%B3", "source_name": "中央社：中菲行：AI半導體物流續強 美線艙位緊、急單海轉空", "url": "https://www.cna.com.tw/news/afe/202610060059.aspx", "summary": "中菲行9月合併營收36.5億元，年增47%，創2022年7月以來單月新高，其中海運營業額年增62.1%。中菲行指出AI半導體物流需求強勁，台灣及亞洲至美國航線艙位緊張、運價上升，海運延誤使急單轉向空運；亞歐線即期運價則走弱，巴拿馬運河因降雨不足調整通航名額，恐影響美東航線。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "科技股弱勢台股收跌492.93點 週線連4紅", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E7%81%A3%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：科技股弱勢台股收跌492.93點 週線連4紅", "url": "https://www.cna.com.tw/news/afe/202610080161.aspx", "summary": "台股下跌492.93點，收在49313.44點，成交值新台幣8696.96億元，但本週累計上漲837.7點，週線連4紅。台積電跌35元、聯發科挫145元，金融股指數跌1.68%；防疫概念股逆勢強攻漲停，股后川湖以跌停作收，台股千金股陣容縮減至55檔。"}, {"no": 2, "title": "東證指數權重調整引發拋售 日股連2跌", "date": "2026-10-08", "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E4%BA%AC%E8%AD%89%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80", "source_name": "中央社：東證指數權重調整引發拋售 日股連2跌", "url": "https://www.cna.com.tw/news/afe/202610080184.aspx", "summary": "日本股市連續第2個交易日收跌，主因東證指數調整成分股權重，引發市場拋售權重即將被調降的個股。日經225指數下跌993.60點或1.42%，收在69042.11點；東證股價指數下跌62.65點或1.51%，收在4091.46點，兩大指數同步走弱。"}, {"no": 3, "title": "美債殖利率再走高 美股全線收黑", "date": "2026-10-08", "map": "", "source_nam
