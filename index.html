廠，海外另有5至6座；2奈米年產能將於2027年增加超過1倍，A14預計2027年試產、2028年量產。因客戶需求強勁，已決定在台南再增加一座3奈米晶圓廠，預計2028年上半年量產；美國亞利桑那州第2座廠將於2027年第3季量產，日本第2座廠預計2028年量產。"}, {"no": 3, "title": "魏哲家證實台積電團隊赴德州評估擴產　與Terafab合作討論中", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Texas%2C%20USA", "source_name": "中央社：魏哲家證實台積電團隊赴德州評估擴產　與Terafab合作討論中", "url": "https://www.cna.com.tw/news/afe/202610150172.aspx", "summary": "台積電董事長魏哲家在法說會證實，台積電考慮在亞利桑那州以外的地方擴充美國產能，德州是其中一個選項，已派團隊前往評估；也會與特斯拉和SpaceX打造的晶片製造廠Terafab溝通是否利用其產能，各種合作方式都有可能，但晶圓廠必須由台積電營運，目前仍在討論中。他指出，所有客戶、尤其美國大客戶都要求台積電提高產能，美國政府也給予極大幫助。"}, {"no": 4, "title": "台積電再調升全年美元營收成長44%　第4季估季增14%", "date": "2026-10-15", "map": "", "source_name": "中央社：台積電再調升全年美元營收成長44%　第4季估季增14%", "url": "https://www.cna.com.tw/news/afe/202610150159.aspx", "summary": "台積電15日法說會預估第4季營收523億至543億美元，以中間值估計季增14%、年增58%，毛利率約65%至67%，營業利益率約56.5%至58.5%。董事長魏哲家表示，第4季先進製程需求持續強勁、2奈米進一步放量，預期2026年美元營收可望成長約44%，優於7月調升的「微幅超越40%」，為今年再度上調營運目標。"}, {"no": 5, "title": "台積電第3季獲利逾7630億元創新高　每股純益29.43元", "date": "2026-10-15", "map": "", "source_name": "中央社：台積電第3季獲利逾7630億元創新高　每股純益29.43元", "url": "https://www.cna.com.tw/news/afe/202610150127.aspx", "summary": "台積電第3季營收467.2億美元、約新台幣1兆4942.4億元，季增17.6%並超越446億至458億美元的營運目標，創歷史新高；毛利率66.4%，受2奈米出貨增加影響較第2季下滑1.3個百分點；歸屬母公司淨利7630.6億元、季增8%，每股純益29.43元。2奈米營收比重8%，先進製程合計達79%；前3季營收3兆8987.27億元、年增41.1%，每股純益78.75元。"}]}, {"name": "AI", "items": [{"no": 1, "title": "Volvo擴大與輝達合作　2030年前導入新一代自駕技術", "date": "2026-10-16", "map": "https://www.google.com/maps/search/?api=1&query=Stockholm%2C%20Sweden", "source_name": "中央社：Volvo擴大與輝達合作　2030年前導入新一代自駕技術", "url": "https://www.cna.com.tw/news/aopl/202610160014.aspx", "summary": "瑞典富豪汽車宣布擴大與輝達合作，共同開發新一代駕駛輔助及自動駕駛技術，合作內容包括輝達Hyperion感測器、電腦架構及自動駕駛軟體系統，預計最終支援市區道路及公路免手動駕駛，有望在2030年前搭載於富豪車款。黃仁勳在斯德哥爾摩受訪時稱合作是「極大的機會」，並強調「不必急於一時，安全第一」；富豪表示相關功能定價未定，且不會僅限高價車款。"}, {"no": 2, "title": "獲黃仁勳背書支持　CoreWeave股價由跌轉升", "date": "2026-10-16", "map": "", "source_name": "Yahoo新聞（今日新聞NOWNEWS）：獲黃仁勳背書支持　CoreWeave股價由跌轉升", "url": "https://tw.news.yahoo.com/%E7%8D%B2%E9%BB%83%E4%BB%81%E5%8B%B3%E8%83%8C%E6%9B%B8%E6%94%AF%E6%8C%81-coreweave%E8%82%A1%E5%83%B9%E7%94%B1%E8%B7%8C%E8%BD%89%E5%8D%87-222056554.html", "summary": "AI雲端運算業者CoreWeave因違約率及公司債殖利率飆升，週三股價一度大跌15.5%，週四盤中也曾再挫近10%；輝達執行長黃仁勳表示CoreWeave實力每天都在增強、資本成本正在降低，無須輝達為其財務兜底後，股價由黑翻紅、收漲近6%。輝達持有CoreWeave約10%股份，報導提醒信用市場緊張情緒正在蔓延，其2032年到期債券殖利率一度觸及15%。"}, {"no": 3, "title": "德國擬與輝達簽合作協議　砸數億歐元加速AI導入工業領域", "date": "2026-10-16", "map": "https://www.google.com/maps/search/?api=1&query=Berlin%2C%20Germany", "source_name": "中央社：德國擬與輝達簽合作協議　砸數億歐元加速AI導入工業領域", "url": "https://www.cna.com.tw/news/ait/202610160005.aspx", "summary": "德國《商務日報》引述知情人士報導，德國計劃與輝達簽署範圍廣泛的合作協議，推動AI在德國工業的應用，預計於下週在柏林「投資德國」大會上宣布，黃仁勳也將出席。協議兩大目標為替訓練機器人或自駕車的「實體AI」工具奠定基礎，以及協助為工業開發高效能AI模型，投資規模高達數億歐元，並以主權開源基礎模型SOOFI計畫為核心；德國政府暫無回應。"}, {"no": 4, "title": "輝達擬投入逾80億元運算資源　推動英國代理型AI研究", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Imperial%20College%20London", "source_name": "中央社：輝達擬投入逾80億元運算資源　推動英國代理型AI研究", "url": "https://www.cna.com.tw/news/ait/202610150136.aspx", "summary": "輝達宣布將在未來5年內捐贈價值2.5億美元（約新台幣80.8億元）的運算資源，支持英國各地的代理型AI安全與資安研究，部分資源將用於與英國開放式學習與探索實驗室、基礎AI研究科學實驗室及倫敦帝國學院的合作，並透過英國雲端合作業者提供、基礎設施設於英國。黃仁勳表示，AI能力與安全性必須同步發展。"}, {"no": 5, "title": "Anthropic Q3營收高速成長　傳尋求2兆美元上市估值", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=San%20Francisco%2C%20CA", "source_name": "中央社：Anthropic Q3營收高速成長　傳尋求2兆美元上市估值", "url": "https://www.cna.com.tw/news/ait/202610150048.aspx", "summary": "美國媒體報導，Anthropic向投資人表示第3季營收躍升約50%至168億美元，過去6個月經調整後已實現獲利，第3季調整後自由現金流轉正、調整後營業利益率達11%。公司正加快籌備首次公開募股，據報預計尋求高達2兆美元估值，超越SpaceX 6月上市時創下的1.8兆美元紀錄，並計劃於11月美國期中選舉後上市；紐約時報指其年化營收今年稍早已達650億美元。"}]}, {"name": "金融", "items": [{"no": 1, "title": "債券殖利率彈升　6大壽險9月獲利縮至90億元", "date": "2026-10-15", "map": "", "source_name": "中央社：債券殖利率彈升　6大壽險9月獲利縮至90億元", "url": "https://www.cna.com.tw/news/afe/202610150341.aspx", "summary": "美債9月殖利率彈升，使壽險業放在FVTPL的債券評價產生未實現損失，6大壽險9月獲利縮至新台幣90.71億元、月減逾7成，前3季獲利仍達2298.01億元。富邦人壽9月稅後淨利6.7億元、前3季658.5億元；國泰人壽9月17.6億元、前3季601.7億元，9月底外匯價格變動準備金餘額1425億元創新高；南山人壽9月自結獲利26.8億元。"}, {"no": 2, "title": "金融業AI使用率增至43%　33家導入代理式AI、證期業最多", "date": "2026-10-15", "map": "", "source_name": "中央社：金融業AI使用率增至43%　33家導入代理式AI、證期業最多", "url": "https://www.cna.com.tw/news/afe/202610150319.aspx", "summary": "金管會公布115年金融業應用AI調查，受調383家金融機構及周邊單位中有164家導入AI、占43%，高於113年的29%；已使用AI業者中生成式AI導入率達76%。新增調查的代理式AI有33家業者運用，以證券期貨業15家最多，主要用於資料蒐集、研究報告撰寫及程式碼檢核；個別類型以本國銀行導入比例87%最高，銀行業金融大語言模型盼明年提供業者落地使用。"}, {"no": 3, "title": "13家金控前3季大賺6318億元　超越2024全年歷史紀錄", "date": "2026-10-15", "map": "", "source_name": "中央社：13家金控前3季大賺6318億元　超越2024全年歷史紀錄", "url": "https://www.cna.com.tw/news/afe/202610150310.aspx", "summary": "13家上市金控9月獲利新台幣529.74億元、月減38%，主因台股成交量能較8月降溫及美國公債殖利率走升影響金融資產評價；不過前3季累計獲利6318.81億元，已超越2024年全年5979.79億元的歷史高點紀錄。富邦金前3季稅後淨利1272.2億元、每股稅後盈餘8.8元，國泰金1053.6億元、每股6.94元，元大金549.59億元、年增106%。"}, {"no": 4, "title": "出口旺營運需求增溫　國銀中小企業放款前8月增額創同期次高", "date": "2026-10-15", "map": "", "source_name": "中央社：出口旺營運需求增溫　國銀中小企業放款前8月增額創同期次高", "url": "https://www.cna.com.tw/news/afe/202610150280.aspx", "summary": "金管會統計，本國銀行8月底對中小企業放款餘額達新台幣11兆4599億元、月增361億元，前8月增額5714.21億元，創10年來同期次高，僅低於2021年的5807億元，以今年增加5000億元目標換算達成率114.28%。銀行局指主因出口持續成長、中小企業購料與營運資金需求增加；前8月增額以玉山銀行673.26億元最多，其次為中信銀行487.55億元。"}, {"no": 5, "title": "台股大跌1655點　金管會：跌幅亞洲中段、密切注意", "date": "2026-10-15", "map": "", "source_name": "中央社：台股大跌1655點　金管會：跌幅亞洲中段、密切注意", "url": "https://www.cna.com.tw/news/afe/202610150272.aspx", "summary": "台股15日大跌1655.96點、跌幅3.41%，金管會證期局表示同時段韓國下跌8.19%、日本下跌4.55%，台股跌幅居亞洲中段，將密切注意國際股市與台股表現。基本面方面，截至9月底台股本益比約26.68倍、現金殖利率1.54%，上市櫃公司累計營收48兆元、年增37.86%；截至10月14日信用交易整戶擔保維持率192.32%，借券賣出占市場成交值比率4.47%。"}]}, {"name": "航運", "items": [{"no": 1, "title": "羅馬尼亞黑海商船遭無人機襲擊起火　造成7人失蹤", "date": "2026-10-16", "map": "https://www.google.com/maps/search/?api=1&query=Sulina%2C%20Romania", "source_name": "中央社：羅馬尼亞黑海商船遭無人機襲擊起火　造成7人失蹤", "url": "https://www.cna.com.tw/news/aopl/202610160011.aspx", "summary": "兩艘化學品運輸船在羅馬尼亞黑海沿岸、通往多瑙河的蘇利納運河河口附近遭無人機擊中起火，掛聖馬利諾旗的「葡萄酒貿易商號」12名船員中5人獲救、7人失蹤，另一艘葛摩籍「雅拉J」船員均平安。北約軍方消息人士稱無人機來自俄羅斯；過去10天羅馬尼亞與保加利亞沿岸附近至少還有5艘貨船遭擊中，據報至少23名船員失蹤或死亡，這條烏克蘭重要出口航道的安全再受關注。"}, {"no": 2, "title": "高運價促使老舊船舶延役 全球拆船量萎縮", "date": "2026-10-15", "map": "", "source_name": "Yahoo新聞（台灣新生報）：高運價促使老舊船舶延役 全球拆船量萎縮", "url": "https://tw.news.yahoo.com/%E9%AB%98%E9%81%8B%E5%83%B9%E4%BF%83%E4%BD%BF%E8%80%81%E8%88%8A%E8%88%B9%E8%88%B6%E5%BB%B6%E5%BD%B9-%E5%85%A8%E7%90%83%E6%8B%86%E8%88%B9%E9%87%8F%E8%90%8E%E7%B8%AE-121614704.html", "summary": "克拉克森研究統計，2026年1至9月全球共273艘船舶出售拆解，合計約550萬總噸、約800萬載重噸，較去年同期減少13%，比2000與2010年代平均水準低約6成。航運收益強勁使船東延後拆船，克拉克森海運指數截至10月9日當週上漲12%至每日84951美元，創歷史新高並連續第5次刷新紀錄；船齡20年以上商船運力已超過3億4千萬總噸、占全球船隊比重接近20%，油輪老化尤其明顯。"}, {"no": 3, "title": "摩根大通看好Kirby航運股 內陸駁船需求結構性緊俏成利多", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（商傳媒）：摩根大通看好Kirby航運股 內陸駁船需求結構性緊俏成利多", "url": "https://tw.stock.yahoo.com/news/%E6%91%A9%E6%A0%B9%E5%A4%A7%E9%80%9A%E7%9C%8B%E5%A5%BDkirby%E8%88%AA%E9%81%8B%E8%82%A1-%E5%85%A7%E9%99%B8%E9%A7%81%E8%88%B9%E9%9C%80%E6%B1%82%E7%B5%90%E6%A7%8B%E6%80%A7%E7%B7%8A%E4%BF%8F%E6%88%90%E5%88%A9%E5%A4%9A-003908360.html", "summary": "摩根大通首次將美國海運運輸公司Kirby納入研究範圍，給予「增持」評級、目標價每股200美元。分析師指出，美國內陸駁船市場結構性供給緊俏、資料中心帶動的電力需求，以及《瓊斯法案》形成的受保護國內航運市場，是支撐Kirby前景的主因；近乎零的船隊增長推高利用率與運價，強勁自由現金流將支持股票回購與反景氣循環船隊收購，Kirby股價週三盤中上揚0.6%。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "投資人轉向AI以外標的　美股道瓊終場漲逾500點", "date": "2026-10-16", "map": "", "source_name": "中央社：投資人轉向AI以外標的　美股道瓊終場漲逾500點", "url": "https://www.cna.com.tw/news/afe/202610160008.aspx", "summary": "美股15日多收高，市場擔心科技公司過度投入人工智慧領域，促使投資人尋求其他標的，交易員同時消化顯示美國通膨壓力持續的數據。道瓊工業指數勁揚556.21點或1.08%收52177.69點，標普500指數上漲25.12點或0.33%收7744.06點，那斯達克指數小漲20.16點或0.08%收26713.03點，費城半導體指數則下跌103.17點或0.88%收11581.22點。"}, {"no": 2, "title": "股后川湖跌出萬金股　千金股盤中19檔跌停", "date": "2026-10-15", "map": "", "source_name": "中央社：股后川湖跌出萬金股　千金股盤中19檔跌停", "url": "https://www.cna.com.tw/news/afe/202610150270.aspx", "summary": "台股15日盤中重挫1830點、收盤跌1655.96點，高價千金股成為殺盤重心，盤中包括股王信驊在內共19檔千金股觸及跌停，收盤仍有10檔跌停，如旺矽收5300元、穎崴5055元、漢測3300元。股后川湖跌出萬金股，景碩、環球晶跌出千金股之列，千 s.yahoo.com/%E5%BF%AB%E8%A8%8A-%E7%BE%8E%E8%82%A1%E9%96%8B%E7%9B%A4%E7%B9%BC%E7%BA%8C%E6%AE%BA-%E5%8F%B0%E7%A9%8D%E9%9B%BBadr%E5%86%8D%E6%91%944-3-%E5%8F%B0%E6%8C%87%E6%9C%9F%E5%A4%9C%E7%9B%A4%E5%A4%B1%E5%AE%8847k-134400605.html", "summary": "美國9月PPI年增6.3%、月增1.3%，均高於市場預期，核心PPI年增5.0%也高於預期的4.4%。15日美股開盤後截至發稿，道瓊上漲0.40%，那斯達克跌1.32%、費半跌3.45%，台積電ADR下跌4.38%、日月光ADR下跌6.50%；台指期夜盤約21時38分暫報46890點、下跌41點，盤中最高47166點、最低46674點，失守47000點關卡。"}, {"no": 3, "title": "10月電子期跌　金融期漲", "date": "2026-10-15", "map": "", "source_name": "中央社：10月電子期跌　金融期漲", "url": "https://www.cna.com.tw/news/afe/202610150134.aspx", "summary": "台股15日下跌1655.96點，10月電子期收2926.05點、下跌136.7點，與電子現貨2933.03點相較為逆價差6.98點，成交118口；10月金融期則逆勢上漲3.4點收3677.4點，金融現貨收3709.66點、上漲26.79點，期現貨逆價差32.26點，成交383口。實際收盤價以期交所公告為準。"}, {"no": 4, "title": "10月台股期指跌1819點", "date": "2026-10-15", "map": "", "source_name": "中央社：10月台股期指跌1819點", "url": "https://www.cna.com.tw/news/afe/202610150131.aspx", "summary": "台股15日終場跌1655.96點收46969.87點，10月台指期以46979點作收、下跌1819點，與現貨相較正價差9.13點，成交8萬1787口；11月期貨收47142點、跌1820點，成交1889口。台灣期貨交易所訂定近2個月指數期貨契約開盤參考價為10月期貨48798點、11月期貨48962點。"}]}, {"name": "Rates & Bonds", "items": [{"no": 1, "title": "AI泡沫破了錢往哪跑？美銀點名美債 OpenAI風波已提前預演", "date": "2026-10-16", "map": "", "source_name": "Yahoo股市（鉅亨網）：AI泡沫破了錢往哪跑？美銀點名美債 OpenAI風波已提前預演", "url": "https://tw.stock.yahoo.com/news/ai%E6%B3%A1%E6%B2%AB%E7%A0%B4%E4%BA%86%E9%8C%A2%E5%BE%80%E5%93%AA%E8%B7%91-%E7%BE%8E%E9%8A%80%E9%BB%9E%E5%90%8D%E7%BE%8E%E5%82%B5-openai%E9%A2%A8%E6%B3%A2%E5%B7%B2%E6%8F%90%E5%89%8D%E9%A0%90%E6%BC%94-171002574.html", "summary": "美國銀行警告，若AI泡沫破裂，美股與美債殖利率可能同步下跌，債券將重新發揮避險功能，並把10月8日OpenAI營收報導引發科技股重挫、殖利率走低視為「AI交易平倉的最佳預演」。報導指出10月15日10年期美債殖利率下跌10個基點至5.09%、觸及三週低點；美銀以2000年網路泡沫為例，當時10年期美債殖利率由約6.5%降至4%區間中段。"}, {"no": 2, "title": "美債殖利率創20年新高 買盤進場狂掃", "date": "2026-10-15", "map": "", "source_name": "Yahoo新聞（自立晚報）：美債殖利率創20年新高 買盤進場狂掃", "url": "https://tw.news.yahoo.com/%E7%BE%8E%E5%82%B5%E6%AE%96%E5%88%A9%E7%8E%87%E5%89%B520%E5%B9%B4%E6%96%B0%E9%AB%98-%E8%B2%B7%E7%9B%A4%E9%80%B2%E5%A0%B4%E7%8B%82%E6%8E%83-153408145.html", "summary": "美國10年期公債殖利率10月7日盤中飆升至5.362%，創2002年以來新高；同日美國財政部標售390億美元10年期公債，超額認購倍數升至2.77倍、創2016年以來新高，代表海外央行與機構的間接投標人獲配比重80.34%，得標殖利率5.30%低於預期的5.317%。中租基金平台總經理蘇皓毅指出，10月美債殖利率單月飆升53個基點中，有49個基點來自實質殖利率，而非通膨預期。"}, {"no": 3, "title": "美債殖利率5.25%很高？BNY執行長：歷史上不罕見 正在回歸正常", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：美債殖利率5.25%很高？BNY執行長：歷史上不罕見 正在回歸正常", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E5%82%B5%E6%AE%96%E5%88%A9%E7%8E%875-25-%E5%BE%88%E9%AB%98-bny%E5%9F%B7%E8%A1%8C%E9%95%B7-%E6%AD%B7%E5%8F%B2%E4%B8%8A%E4%B8%8D%E7%BD%95%E8%A6%8B-153008577.html", "summary": "紐約梅隆銀行執行長文斯表示，10年期美債殖利率約5.25%從歷史角度看並不罕見，更像是殖利率曲線回歸正常，美國經濟強勁是推升通膨與利率的主因之一。報導指10年期美債殖利率第三季創1994年以來最大升幅，但本週AI股重挫促使資金轉向公債避險；紐約梅隆第三季歸屬普通股股東淨利年增20%至16.1億美元，保管與行政管理資產規模達63.4兆美元。"}, {"no": 4, "title": "美國9月PPI年增6.3%　創2022年底以來最大增幅", "date": "2026-10-15", "map": "", "source_name": "中央社：美國9月PPI年增6.3%　創2022年底以來最大增幅", "url": "https://www.cna.com.tw/news/aopl/202610150346.aspx", "summary": "美國勞工統計局公布9月生產者物價指數月增1.3%、年增6.3%，分別創2022年3月與12月以來最大月增幅及年增幅，遠高於道瓊調查經濟學家預估的月增0.6%、年增5.5%。美伊戰爭推升能源價格是重要因素，排除食品、能源與貿易服務後的PPI月增0.5%、年增5%，顯示通膨持續衝擊消費者與企業，也加深市場升息疑慮。"}]}, {"name": "Currencies", "items": [{"no": 1, "title": "資金移轉、股匯連動 台幣短期貶壓恐難消", "date": "2026-10-16", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：資金移轉、股匯連動 台幣短期貶壓恐難消", "url": "https://tw.news.yahoo.com/%E8%B3%87%E9%87%91%E7%A7%BB%E8%BD%89-%E8%82%A1%E5%8C%AF%E9%80%A3%E5%8B%95-%E5%8F%B0%E5%B9%A3%E7%9F%AD%E6%9C%9F%E8%B2%B6%E5%A3%93%E6%81%90%E9%9B%A3%E6%B6%88-223914174.html", "summary": "美國科技股高估值修正、AI投資報酬疑慮升高，外資大舉賣超台股並買進美元匯出，十月上旬外匯市場兩度爆出巨量，股匯連動下新台幣短線貶值壓力恐難迅速消退。央行統計截至九月底，外資持有國內股票、債券連同新台幣存款合計達1兆9272億美元創高檔；央行先前指出台股與那斯達克相關係數一度達0.95至0.96，後續關注美國科技股能否止跌及外資是否持續賣超。"}, {"no": 2, "title": "匯市成交爆天量91億美元　新台幣重貶外資狂撤", "date": "2026-10-15", "map": "", "source_name": "中央社：匯市成交爆天量91億美元　新台幣重貶外資狂撤", "url": "https://www.cna.com.tw/news/afe/202610150287.aspx", "summary": "通膨壓力升溫加上科技股賣壓，熱錢上演大逃殺，新台幣兌美元15日盤中最低觸及32.452元、重貶3.79角，央行進場調節後終場收在32.265元，仍貶1.92角，改寫逾2個月新 %升至約42%，12月升息機率攀升至93%。"}, {"no": 4, "title": "必和必拓Escondida銅礦暫緩罷工，LME期銅週三跌0.6%", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Escondida%20mine%2C%20Chile", "source_name": "Yahoo股市（財訊快報）：必和必拓Escondida銅礦暫緩罷工，LME期銅週三跌0.6%", "url": "https://tw.stock.yahoo.com/news/%E5%BF%85%E5%92%8C%E5%BF%85%E6%8B%93escondida%E9%8A%85%E7%A4%A6%E6%9A%AB%E7%B7%A9%E7%BD%B7%E5%B7%A5-lme%E6%9C%9F%E9%8A%85%E9%80%B1%E4%B8%89%E8%B7%8C0-6-003453407.html", "summary": "必和必拓位於智利的Escondida銅礦避免了一場罷工，倫敦金屬交易所期銅週三下跌87.50美元或0.6%，報每噸14490.5美元，稍早一度逼近歷史高點；歐洲主要銅生產商Aurubis表示，大量銅運往美國正加劇市場供應緊張。其他基本金屬同步走低，期鋁跌1.7%報2987.5美元、期錫跌2.6%報50446美元、期鎳跌0.5%報15510美元。"}, {"no": 5, "title": "金價昨日微幅回落至每盎司4095美元 貴金屬投資管道多元", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（商傳媒）：金價昨日微幅回落至每盎司4095美元 貴金屬投資管道多元", "url": "https://tw.stock.yahoo.com/news/%E9%87%91%E5%83%B9%E6%98%A8%E6%97%A5%E5%BE%AE%E5%B9%85%E5%9B%9E%E8%90%BD%E8%87%B3%E6%AF%8F%E7%9B%8E%E5%8F%B84095%E7%BE%8E%E5%85%83-%E8%B2%B4%E9%87%91%E5%B1%AC%E6%8A%95%E8%B3%87%E7%AE%A1%E9%81%93%E5%A4%9A%E5%85%83-234722166.html", "summary": "CNBC報導，截至10月14日美東時間上午9點，黃金現貨價格為每盎司4095.81美元，較週二同時間的4179.27美元略有下降。報導指出黃金被視為避險資產，投資管道包括購買金條、金塊及金幣等實體黃金，開設可享稅務優惠但需負擔多項費用的黃金個人退休帳戶，以及透過多數投資平台交易、可分散風險的黃金ETF。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "禾伸堂獲輝達大追單 本季全面啟動漲價", "date": "2026-10-16", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：禾伸堂獲輝達大追單 本季全面啟動漲價", "url": "https://tw.news.yahoo.com/%E7%A6%BE%E4%BC%B8%E5%A0%82%E7%8D%B2%E8%BC%9D%E9%81%94%E5%A4%A7%E8%BF%BD%E5%96%AE-%E6%9C%AC%E5%AD%A3%E5%85%A8%E9%9D%A2%E5%95%9F%E5%8B%95%E6%BC%B2%E5%83%B9-224605036.html", "summary": "被動元件廠禾伸堂打入輝達Vera Rubin供應鏈後，高階積層陶瓷電容（MLCC）訂單以倍數以上增加、產能滿載，市場傳出本季全面啟動價格調整。業界指AI伺服器電源朝高功率、高電壓發展，帶動中高壓、高容值及耐高溫MLCC需求，高階產品交期拉長到16至20周；禾伸堂已向上游索取翻倍規模貨源，今年產能預估增加2%至3%，明年再擴充3%至4%。"}, {"no": 2, "title": "鴻海砸逾173億元增資　擴大美國AI製造", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Houston%2C%20Texas", "source_name": "中央社：鴻海砸逾173億元增資　擴大美國AI製造", "url": "https://www.cna.com.tw/news/afe/202610150345.aspx", "summary": "鴻海公告子公司Foxconn Assembly Holding Corporation取得美國子公司Q-Edge Corporation股份，投資金額5.37億美元（約新台幣173.2億元），市場評估此舉持續擴大美國AI相關製造規模；鴻海8月下旬曾公告增資Q-Edge約1.88億美元，該公司於2000年在德州休士頓成立。鴻海預期今年資本支出年增超過3成，提前擴充AI伺服器、機櫃、液冷系統及測試等關鍵產能。"}, {"no": 3, "title": "毅嘉布局光通訊明年占比拚4成　評估北美據點", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Kulim%2C%20Kedah%2C%20Malaysia", "source_name": "中央社：毅嘉布局光通訊明年占比拚4成　評估北美據點", "url": "https://www.cna.com.tw/news/afe/202610150215.aspx", "summary": "PCB與軟板大廠毅嘉第3季自結營收約新台幣34.17億元、季增4%、年增18%，稅後淨利約1.01億元、每股約0.33元。隨Flip-chip第4季導入量產、mSAP啟動客戶打樣，看好2027年來自AI的營收占比由今年6%成長至40%，光通訊營收占比拉高至30%到40%；馬來西亞居林新廠產能持續開出，北美據點初步以德州為主評估，目標2028年海外營收占比逾50%。"}, {"no": 4, "title": "玉晶光私募引資3M逾48億元　共同衝刺光通訊布局", "date": "2026-10-15", "map": "", "source_name": "中央社：玉晶光私募引資3M逾48億元　共同衝刺光通訊布局", "url": "https://www.cna.com.tw/news/afe/202610150092.aspx", "summary": "玉晶光宣布與3M集團達成戰略合作，共同推進光通訊解決方案研發、製造與產能擴充，3M United Kingdom Limited將以每股869.6元認購玉晶光私募普通股553萬4440股，投資總金額約新台幣48.12億元（約1.5億美元），交易完成後持股約4.68%。雙方將布局高速光通訊、AI資料中心及高效能運算市場；玉晶光前3季營收196億3619萬元、年增10.12%。"}, {"no": 5, "title": "台股重挫電信股成避風港　中華電、台灣大股價攻新高", "date": "2026-10-15", "map": "", "source_name": "中央社：台股重挫電信股成避風港　中華電、台灣大股價攻新高", "url": "https://www.cna.com.tw/news/afe/202610150085.aspx", "summary": "美國通膨升息疑慮升溫，台股15日盤中狂瀉逾1800點、摜破47000點，權值股普遍走弱，電信股逆勢成為資金避風港。中華電信盤中最高至154元、漲幅逾3%，台灣大漲逾5%、最高至133元，雙雙刷新股價歷史高點，遠傳漲逾4%至113元，距離歷史新高113.5元僅一步之遙；台灣大前9月每股盈餘4.26元居電信三雄之冠。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "〈能源盤後〉美擬放寬影子船隊制裁 美庫存大減860萬桶 WTI漲逾3%、Brent小跌", "date": "2026-10-16", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "Yahoo股市（鉅亨網）：〈能源盤後〉美擬放寬影子船隊制裁 美庫存大減860萬桶 WTI漲逾3%、Brent小跌", "url": "https://tw.stock.yahoo.com/news/%E8%83%BD%E6%BA%90%E7%9B%A4%E5%BE%8C-%E7%BE%8E%E6%93%AC%E6%94%BE%E5%AF%AC%E5%BD%B1%E5%AD%90%E8%88%B9%E9%9A%8A%E5%88%B6%E8%A3%81-%E7%BE%8E%E5%BA%AB%E5%AD%98%E5%A4%A7%E6%B8%9B860%E8%90%AC%E6%A1%B6-wti%E6%BC%B2%E9%80%BE3-brent%E5%B0%8F%E8%B7%8C-215105894.html", "summary": "布蘭特原油期貨15日收跌14美分或0.13%報每桶105.92美元，WTI期貨則上漲2.88美元或3.03%收97.97美元。美國研議放寬全球「影子船隊」部分制裁以增加油輪供應、降低運費，但官員強調並非開放俄羅斯或伊朗受制裁石油出口；美國能源資訊署公布截至10月9日當週商業原油庫存減少860萬桶至4.156億桶，遠大於預期的減少28.8萬桶，荷姆茲海峽周邊船舶遇襲也持續支撐風險溢價。"}, {"no": 2, "title": "中油採購阿拉斯加天然氣　龔明鑫：2032年美採購占比達3成", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Alaska%2C%20USA", "source_name": "中央社：中油採購阿拉斯加天然氣　龔明鑫：2032年美採購占比達3成", "url": "https://www.cna.com.tw/news/afe/202610150268.aspx", "summary": "經濟部長龔明鑫表示，台灣自美國採購天然氣比重已由去年約1成增至今年2成以上，預計2029年提高至25%，若2032年阿拉斯加天然氣開始供應，占比可望逾3成。中油規劃每年採購600萬噸阿拉斯加天然氣並參與專案開發，預估投資最高44億美元；他指出至2035年預計增加25部大型天然氣機組，阿拉斯加航程約10天，長約有助降低價格波動風險並平衡台美貿易順差。"}, {"no": 3, "title": "IMF示警　波斯灣國家經濟中期不會回到戰前成長狀態", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Bangkok%2C%20Thailand", "source_name": "中央社：IMF示警　波斯灣國家經濟中期不會回到戰前成長狀態", "url": "https://www.cna.com.tw/news/aopl/202610150257.aspx", "summary": "國際貨幣基金中東和中亞部主任阿祖爾在曼谷IMF與世界銀行年會期間表示，能源資源豐富的中東將會經濟復甦，但波斯灣國家無法在中期回到戰前發展軌跡，因衝擊對各產業造成創傷並破壞部分基礎設施。IMF於13日預測中東和中亞地區今年經濟將萎縮0.3%，沙烏地阿拉伯預估萎縮3.3%，當地能源出口海運也持續受影響。"}, {"no": 4, "title": "台達電鄭平：電力基建跟不上　供電缺口成AI發展關鍵挑戰", "date": "2026-10-15", "map": "", "source_name": "中央社：台達電鄭平：電力基建跟不上　供電缺口成AI發展關鍵挑戰", "url": "https://www.cna.com.tw/news/afe/202610150208.aspx", "summary": "台達電董事長鄭平表示，美國4大雲端服務供應商今年資本支出估為2022年的4.7倍，電力系統投資成長僅約1.8倍，供電缺口已成AI發展的關鍵挑戰；預估美國到2028年新增資料中心用電需求達44GW，電網新增供電能力僅25GW，缺口19GW。台達電投入的固態氧化物燃料電池結合能源回收後整體效率可達85%，預計明年進入量產。"}, {"no": 5, "title": "AI搶電潮席捲　台電：大型燃氣機組交貨期拉長、價格翻4倍", "date": "2026-10-15", "map": "", "source_name": "中央社：AI搶電潮席捲　台電：大型燃氣機組交貨期拉長、價格翻4倍", "url": "https://www.cna.com.tw/news/afe/202610150084.aspx", "summary": "台電副總經理鄭慶鴻表示，AI帶動電力需求，全球僅3家大型燃氣機組製造商、年產能約60至70GW，去年訂單已逾110GW，交期由約2年延長至4年以上，價格上漲3至4倍，即使現在下單最快也要到2033年才有機會供電。國內大潭、台中及興達電廠到今年底累計增加約9.6GW供電能力，約占目前尖峰負載1/4；台電正研議將電力設施納入都市計畫及國土規劃以縮短建設時程。"}]}], "warnings": [], "day": "2026-10-16"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-13 至 2026-10-15）", "compiled": "2026-10-15 07:21（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件；10月14日台股在台塑集團等傳產帶動下上漲284.52點收48625.83點，外資連6賣但賣超收斂至200.37億元，新台幣尾盤翻升收32.073元；美國9月CPI年增3.7%高於預期，費半重挫4.30%、台積電ADR跌3.40%，台指期夜盤下殺853點至47945點，市場焦點轉向台積電15日第3季法說會與Fed升息路徑", "note": "11類各5則，無不足5則或空缺類別；入選新聞皆為10月14日至15日（台灣時間）新稿，10月13日重要題材（台股重挫960點、新台幣爆量貶破32元、超大型油輪運價等）已見前一日整理，本期未重複收錄；已依指定條件排除黑名單人物與政黨、社會、運動、彩券與抽獎，並排除以中國為主軸之新聞（如晶片聯盟對抗長鑫、中國購金、美光受長鑫技術進展壓抑等），部分報導僅順帶提及中國者（如ASML提及美中科技戰、軟銀提及中國AI實驗室、亞股提及港陸股、PC出貨提及產能移回中國、鋁價提及中國出口）予以保留，但摘要未納入該段；中央社公股投信四合一及公股行庫加薪報導因內容以黑名單政黨立委質詢為主，未予收錄；同一事件多家報導僅在面向不同時並列（如台指期夜盤分列盤前個股期貨與升息機率、新台幣分列收盤與區間預測），內容相同者僅擇一收錄。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "輝達、超微、蘋果爭相下單！美銀：台積電2027年產能有望提前達標　2奈米營收貢獻升至11%", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：輝達、超微、蘋果爭相下單！美銀：台積電2027年產能有望提前達標　2奈米營收貢獻升至11%", "url": "https://tw.stock.yahoo.com/news/%E8%BC%9D%E9%81%94-%E8%B6%85%E5%BE%AE-%E8%98%8B%E6%9E%9C%E7%88%AD%E7%9B%B8%E4%B8%8B%E5%96%AE-%E7%BE%8E%E9%8A%80-%E5%8F%B0%E7%A9%8D%E9%9B%BB2027%E5%B9%B4%E7%94%A2%E8%83%BD%E6%9C%89%E6%9C%9B%E6%8F%90%E5%89%8D%E9%81%94%E6%A8%99-221004332.html", "summary": "市場將台積電今年底2奈米月產能預估上調兩成至12萬片晶圓，有機會在2026年就達成原訂2027年底月產11萬至14萬片的目標，主因輝達、超微、蘋果、高通訂單激增；美國銀行指出2奈米訂單能見度已排至2028年。台積電高級副總裁侯永清透露，2奈米投產首年產量較3奈米首年高出45%，2026至2028年產能年複合成長率可達70%。美銀預估2奈米營收占比將由第二季的3%在第三季躍升至11%，先進製程產能利用率穩定超過90%；台積電第三季毛利率財測為65%至67%。"}, {"no": 2, "title": "台積電法說登場！明年營收拚增4成", "date": "2026-10-15", "map": "", "source_name": "Yahoo新聞（今日新聞NOWNEWS）：台積電法說登場！明年營收拚增4成", "url": "https://tw.news.yahoo.com/%E5%8F%B0%E7%A9%8D%E9%9B%BB%E6%B3%95%E8%AA%AA%E7%99%BB%E5%A0%B4-%E6%98%8E%E5%B9%B4%E7%87%9F%E6%94%B6%E6%8B%9A%E5%A2%9E4%E6%88%90-210000044.html", "summary": "台積電15日下午2時舉行第3季法說會，第三季新台幣營收達1兆4942億元，已超越財測高標，前三季累計營收3兆8987億元、年增逾4成。路透社引述LSEG彙整16名分析師預估，第三季淨利可望達7463億元、年增65%，有望連續第6季創新高。摩根士丹利預期台積電可能將全年營收成長預測上修至4成出頭至4成中段，花旗則看好2027年營收再成長逾4成；市場也關注2奈米擴產對下半年毛利率約3至4個百分點的影響，以及2027年晶圓代工漲價傳聞。"}, {"no": 3, "title": "CoWoS+TPU爆發！「這封測大廠」吃下台積電外溢訂單　目標價上看800元", "date": "2026-10-15", "map": "", "source_name": "Yahoo新聞（三立新聞網）：CoWoS+TPU爆發！「這封測大廠」吃下台積電外溢訂單　目標價上看800元", "url": "https://tw.news.yahoo.com/cowos-tpu%E7%88%86%E7%99%BC-%E9%80%99%E5%B0%81%E6%B8%AC%E5%A4%A7%E5%BB%A0-%E5%90%83%E4%B8%8B%E5%8F%B0%E7%A9%8D%E9%9B%BB%E5%A4%96%E6%BA%A2%E8%A8%82%E5%96%AE-%E7%9B%AE%E6%A8%99%E5%83%B9%E4%B8%8A%E7%9C%8B800%E5%85%83-180500684.html", "summary": "法人看好日月光投控受惠台積電CoWoS訂單外溢與Google TPU拉貨，重申「買進」評等，預估2026至2028年EPS分別為18元、31元與45元，目標價800元；日月光14日收747元、上漲0.95%。為消化訂單，日月光全年資本支出預估達105億美元。營運方面，9月營收881.30億元、年增45.52%創新高，第三季營收2441.61億元、年增44.8%，前三季營收6088.87億元、年增30.25%，均改寫紀錄。"}, {"no": 4, "title": "馬斯克擬自建晶圓廠　楊應超：中短期對台積電無影響", "date": "2026-10-14", "map": "", "source_name": "中央社：馬斯克擬自建晶圓廠　楊應超：中短期對台積電無影響", "url": "https://www.cna.com.tw/news/afe/202610140174.aspx", "summary": "特斯拉執行長馬斯克傳有意打造Terafab巨型晶圓廠，科克蘭資本董事長楊應超表示，晶圓廠難度極高，連台積電建廠都需好幾年，馬斯克蓋廠成真也是5到10年後的事，中短期對台積電完全沒有影響。他指出馬斯克初期規劃以約30億美元（約新台幣966億元）打造試驗性晶圓廠，主要合作夥伴仍會鎖定英特爾等美商；若採廠房分租（sublease）模式讓台積電提供技術諮詢或進駐，反而有助台積電更了解英特爾動態。"}, {"no": 5, "title": "ASML第3季營收創新高　AI需求強到供不應求", "date": "2026-10-14", "map": "", "source_name": "中央社：ASML第3季營收創新高　AI需求強到供不應求", "url": "https://www.cna.com.tw/news/afe/202610140166.aspx", "summary": "艾司摩爾（ASML）第3季營收達創紀錄的117億歐元，去年同期為75億歐元；淨利50億歐元，遠高於去年同期的21億歐元，全年營收預測由430億至450億歐元上調至440億至450億歐元。執行長福克表示，客戶討論已超越2027年，2028年訂單大量湧入，也有客戶希望提前下2029年甚至2030年訂單；公司7月曾表示2027年、2028年各擴產30%，目前需求超過供給，正尋求進一步擴充2028年產能的方法。"}]}, {"name": "AI", "items": [{"no": 1, "title": "輝達「親兒子」CoreWeave狂瀉逾15% 債券殖利率逼近15% 馬斯克直呼「不妙」", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：輝達「親兒子」CoreWeave狂瀉逾15% 債券殖利率逼近15% 馬斯克直呼「不妙」", "url": "https://tw.stock.yahoo.com/news/%E8%BC%9D%E9%81%94-%E8%A6%AA%E5%85%92%E5%AD%90-coreweave%E7%8B%82%E7%80%89%E9%80%BE15-%E5%82%B5%E5%88%B8%E6%AE%96%E5%88%A9%E7%8E%87%E9%80%BC%E8%BF%9115-%E9%A6%AC%E6%96%AF%E5%85%8B%E7%9B%B4%E5%91%BC-214004722.html", "summary": "AI基礎建設借貸需求引發疑慮，AI雲端業者CoreWeave週三收跌15.46%、報65.78美元，其票面利率9.625%、2032年到期債券殖利率約14.8%，9.75%、2031年到期債券約14.9%；賣壓擴散，甲骨文崩跌近9%、Nebius跌約10%、戴爾跌約11%，SpaceX跌2.8%。CoreWeave第二季底債務合計逾300億美元，市場預估2026、2027年自由現金流分別為負270億與負320億美元，標普給予B+非投資等級評等；執行長則稱市場反應不理性，對在手訂單具信心。"}, {"no": 2, "title": "黃仁勳：客戶若開發不安全AI　將停止供應晶片", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=London", "source_name": "中央社：黃仁勳：客戶若開發不安全AI　將停止供應晶片", "url": "https://www.cna.com.tw/news/aopl/202610153001.aspx", "summary": "輝達執行長黃仁勳在倫敦接受彭博主播張秀春專訪時表示，若客戶開發不安全的AI軟體，他會停止向對方供應晶片，但在採取行動前會先與對方溝通，並強調輝達不經營別人的公司、技術屬通用型。彭博指出輝達在AI模型訓練與推論專用晶片市場占主導地位；正在歐洲巡迴訪問的黃仁勳認為，外界對AI安全的擔憂是快速擴張產業的成長陣痛，相關軟體能受到控制並以安全方式部署。"}, {"no": 3, "title": "AI基建資金吃緊　童子賢：花式跳水要先蹲一下缺口是暫時", "date": "2026-10-14", "map": "", "source_name": "中央社：AI基建資金吃緊　童子賢：花式跳水要先蹲一下缺口是暫時", "url": "https://www.cna.com.tw/news/afe/202610140159.aspx", "summary": "針對AI基礎建設資金吃緊與泡沫化疑慮，和碩董事長童子賢表示，AI仍處基礎建設階段，投入資金規模可能超越當年網路時代，就像花式跳水前要先「墊一下腳尖、稍微蹲一下」，目前資金缺口只是短暫現象。他並說明和碩今年2月私募入股BBU廠系統電是「見賢思齊」，以廣達筆電營收占比由約7成以上降至不到3成的轉型為例；對近期美股與台股AI族群回檔，他提醒投資人「股海航行、各自小心」。"}, {"no": 4, "title": "軟銀以歷史新高殖利率發債　孫正義豪賭AI成敗備受考驗", "date": "2026-10-14", "map": "", "source_name": "中央社：軟銀以歷史新高殖利率發債　孫正義豪賭AI成敗備受考驗", "url": "https://www.cna.com.tw/news/ait/202610140138.aspx", "summary": "軟銀集團在總額110億美元的非投資等級債券發行案中承諾支付史上最高殖利率，上月發行的2034年到期債券票面利率達9.75%，相較Alphabet今年8月發行、2033年到期債券殖利率僅5.2%。孫正義累計承諾向OpenAI投入646億美元，軟銀投資顧問公司執行長克拉維爾表示，借款是為了不出售未來仍會增值的資產；分析師則關注軟銀投資組合過度集中及AI鉅額支出何時帶來回報，軟銀已成觀察市場對AI信心的重要指標。"}, {"no": 5, "title": "Google釋出新AI模型Argon　開放訂閱用戶使用", "date": "2026-10-14", "map": "", "source_name": "中央社：Google釋出新AI模型Argon　開放訂閱用戶使用", "url": "https://www.cna.com.tw/news/ait/202610140065.aspx", "summary": "Google宣布最新前沿模型Gemini 4 Argon即日起透過Gemini API開放全球開發者與企業使用，Google AI Pro與Google AI Ultra訂閱用戶也可在Gemini應用程式、Google搜尋AI模式及代理式開發平台Google Antigravity中體驗。DeepMind資深副總裁卡烏克庫魯表示，Argon在評估金融、程式、法律與稅務等領域實力的「Vals指數」高居第一；Google內部導入後，AI代理提交程式碼的比例提升35%以上，需要回覆程式碼的情形降低近1/3。"}]}, {"name": "金融", "items": [{"no": 1, "title": "一表看10家金控排名大洗牌！9月合計獲利月減近24%", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（Yahoo股市）：一表看10家金控排名大洗牌！9月合計獲利月減近24%", "url": "https://tw.stock.yahoo.com/news/%E4%B8%80%E8%A1%A8%E7%9C%8B10%E5%AE%B6%E9%87%91%E6%8E%A7%E6%8E%92%E5%90%8D%E5%A4%A7%E6%B4%97%E7%89%8C%EF%BC%819%E6%9C%88%E5%90%88%E8%A8%88%E7%8D%B2%E5%88%A9%E6%9C%88%E6%B8%9B%E8%BF%9124-122400458.html", "summary": "受美債殖利率飆升衝擊債市評價、證券手續費收入減少，已公布9月獲利的10家金控合計354.88億元、月減近24%，累計前三季3674.55億元、年增52.52%。EPS以元大金3.96元暫居第一、中信金3.18元次之，永豐金2.49元超越台新新光金2.47元；單月獲利以中信金93.58億元領先，兆豐金是唯一單月成長的金控，凱基金月減54%最多。富邦金、國泰金及玉山金尚未公布9月自結獲利，排名仍可能變動。"}, {"no": 2, "title": "銀行公會：因應新興科技發展　研提穩定幣發行建議條文", "date": "2026-10-14", "map": "", "source_name": "中央社：銀行公會：因應新興科技發展　研提穩定幣發行建議條文", "url": "https://www.cna.com.tw/news/afe/202610140320.aspx", "summary": "銀行公會舉行會員代表大會，表示已修訂「金融機構運用人工智慧技術作業規範」、研提穩定幣發行授權子法可行建議條文，並完成「量子科技對我國金融業的影響與因應」研究報告，同時增修資安事件通報程序及遭勒索軟體、供應鏈攻擊的處理參考做法。金管會主委彭金隆對銀行業提出3大期許：晴天廣積糧持續強化資本強韌度、以良好績效回饋社會深化信任，以及採取外部引進與內部培育並重的雙軌人才策略。"}, {"no": 3, "title": "9月台股有交易戶數542.7萬戶　月增13.7萬戶", "date": "2026-10-14", "map": "", "source_name": "中央社：9月台股有交易戶數542.7萬戶　月增13.7萬戶", "url": "https://www.cna.com.tw/news/afe/202610140268.aspx", "summary": "證交所統計，9月集中市場有交易戶數542萬7896戶，較8月的529萬816戶增加約13.7萬戶；自然人成交值比重51.11%、略高於8月的50.92%，外資成交值比重38.40%、較8月38.84%略降。9月成交量週轉率11.16%，低於8月的12.84%；當沖成交值占比38.31%、平均每日當沖戶數17萬5749戶，均較8月減少。ETF成交值占比7.05%、高於8月6.46%，定期定額投資金額約365.72億元，較8月368.78億元減少。"}, {"no": 4, "title": "看好AI產業鏈價值　施羅德亞洲首檔主動ETF台灣出發", "date": "2026-10-14", "map": "", "source_name": "中央社：看好AI產業鏈價值　施羅德亞洲首檔主動ETF台灣出發", "url": "https://www.cna.com.tw/news/afe/202610140261.aspx", "summary": "施羅德宣布在台推出旗下亞洲首檔主動式ETF「施羅德AI科技台股主動式ETF（00419A）」，預計11月2日開募，是繼澳洲、美國及歐洲之後首度前進亞洲。施羅德投信董事長謝誠晃表示，台灣是全球科技重鎮，也是亞洲最活躍的ETF市場之一。台股投資團隊主管游秋華指出，IMF已上修台灣今年經濟成長率預估至10.7%，台股估值約17倍，與過去5年平均約16倍相去不遠，看好台股有基本面挑戰前高。"}, {"no": 5, "title": "國泰世華銀：全球經濟邁向「一高二強」　AI續支撐景氣成長", "date": "2026-10-14", "map": "", "source_name": "中央社：國泰世華銀：全球經濟邁向「一高二強」　AI續支撐景氣成長", "url": "https://www.cna.com.tw/news/afe/202610140131.aspx", "summary": "國泰世華銀第4季投資研究報告指出，全球經濟正邁向「高利率、強投資、強獲利」的新均衡格局，中東地緣風險與能源供應不確定性推升全球公債殖利率，但AI資本支出擴張與企業獲利動能持續增強。報告認為公債、信用債殖利率面臨上行壓力，投等債仍可分批布局；油價走高使市場對聯準會路徑轉趨謹慎，支撐美元盤堅。展望第4季，美國選舉年股市常見第3季震盪、第4季回穩，在企業獲利支撐下市場表現仍可期待。"}]}, {"name": "航運", "items": [{"no": 1, "title": "2艘新加坡籍貨櫃船荷莫茲海峽遇襲　1沉沒1船體受損", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "中央社：2艘新加坡籍貨櫃船荷莫茲海峽遇襲　1沉沒1船體受損", "url": "https://www.cna.com.tw/news/aopl/202610140348.aspx", "summary": "新加坡海事及港務管理局表示，環球支線航運公司（GFS）旗下2艘新加坡籍貨櫃船通過荷莫茲海峽時遭不明射彈擊中，榮耀號（GFS Pride）13日遇襲後起火沉沒，船上21人已事先安全撤離；吉塞爾號（GFS Giselle）14日遇襲後船體受損，靠自身推進力抵達安全錨地，22人均安。伊朗伊斯蘭革命衛隊則稱有貨櫃船行經未獲授權航道觸雷沉沒，並稱該船載運2500多只貨櫃，海峽航運風險持續升高。"}, {"no": 2, "title": "美期中選舉逼近　伊朗官員：換戰術襲船盼推升油價", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "中央社：美期中選舉逼近　伊朗官員：換戰術襲船盼推升油價", "url": "https://www.cna.com.tw/news/aopl/202610140230.aspx", "summary": "兩名伊朗高層官員向路透社表示，德黑蘭正採取新戰術鎖定通過荷莫茲海峽的船舶，目標是維持高油價、挫敗美國及盟邦壓低油價的努力，並影響美國期中選舉。官員稱約10天前開始對違反限制措施的船隻採取不同攻擊戰術，已使相關襲擊增加，策略同時調整攻擊類型與節奏。美軍官員透露，伊朗雷達能力遭摧毀後，革命衛隊改以小型船隻上的非武裝觀測人員辨識目標；這場戰爭讓美國每月耗資數十億美元。"}, {"no": 3, "title": "日本郵船攜手馬來西亞航運 新造LNG船拓展馬日貿易", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（商傳媒）：日本郵船攜手馬來西亞航運 新造LNG船拓展馬日貿易", "url": "https://tw.stock.yahoo.com/news/%E6%97%A5%E6%9C%AC%E9%83%B5%E8%88%B9%E6%94%9C%E6%89%8B%E9%A6%AC%E4%BE%86%E8%A5%BF%E4%BA%9E%E8%88%AA%E9%81%8B-%E6%96%B0%E9%80%A0lng%E8%88%B9%E6%8B%93%E5%B1%95%E9%A6%AC%E6%97%A5%E8%B2%BF%E6%98%93-054545460.html", "summary": "日本主要航運業者日本郵船（NYK）與馬來西亞國家航運公司馬來西亞航運（MISC）宣布攜手合作一項小型液化天然氣（LNG）運輸船新造船業務，新船將獲得馬來西亞液化天然氣私人有限公司（Malaysia LNG）長期租賃合約，主要服務馬來西亞與日本之間的貿易航線。報導指出，LNG新造船專案是航運業者確保長期營收與市場地位的重要策略，合作有助鞏固東南亞與日本之間的LNG供應鏈。"}, {"no": 4, "title": "萬海Q4近洋線旺季續好，遠洋運價則估有壓", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=Panama%20Canal", "source_name": "Yahoo股市（MoneyDJ）：萬海Q4近洋線旺季續好，遠洋運價則估有壓", "url": "https://tw.stock.yahoo.com/news/%E8%90%AC%E6%B5%B7q4%E8%BF%91%E6%B4%8B%E7%B7%9A%E6%97%BA%E5%AD%A3%E7%BA%8C%E5%A5%BD-%E9%81%A0%E6%B4%8B%E9%81%8B%E5%83%B9%E5%89%87%E4%BC%B0%E6%9C%89%E5%A3%93-021400087.html", "summary": "法人評估萬海第四季迎來亞洲近洋線旺季，近洋線價量可望延續第三季成長動能；遠洋方面，美國線10月需求仍有支撐但隨後進入淡季，且巴拿馬運河自10月15日起放寬每日通航預約名額，船舶周轉效率可望改善，先前限航對美東線運價的支撐將逐步減弱，美東等航線運價估將回落。法人看好萬海第三季獲利明顯優於上半年，全年獲利較去年明顯成長，全年EPS有望上看20元。"}, {"no": 5, "title": "荷莫茲海峽襲擊升溫航運風險 運費下跌與地緣衝突夾擊業者", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "Yahoo股市（商傳媒）：荷莫茲海峽襲擊升溫航運風險 運費下跌與地緣衝突夾擊業者", "url": "https://tw.stock.yahoo.com/news/%E8%8D%B7%E8%8E%AB%E8%8C%B2%E6%B5%B7%E5%B3%BD%E8%A5%B2%E6%93%8A%E5%8D%87%E6%BA%AB%E8%88%AA%E9%81%8B%E9%A2%A8%E9%9A%AA-%E9%81%8B%E8%B2%BB%E4%B8%8B%E8%B7%8C%E8%88%87%E5%9C%B0%E7%B7%A3%E8%A1%9D%E7%AA%81%E5%A4%BE%E6%93%8A%E6%A5%AD%E8%80%85-004600217.html", "summary": "荷莫茲海峽11日共有6艘船隻在海峽及周邊海域遇襲，為衝突爆發以來單日最高紀錄，包括塞浦路斯籍貨櫃船GFS Galaxy遭擊中，23名船員獲阿曼海軍救出、1名工程師失蹤。國際海事組織統計，自2月28日衝突爆發至10月初已有24名海員喪生；11日當天僅290萬桶原油通過海峽，7天平均流量較衝突前減少約43%。布蘭特原油12日盤中一度漲至每桶106.65美元，航運業同時面臨運費下跌與地緣風險夾擊。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "〈美股盤後〉美CPI升溫、AI融資疑慮夾擊 費半重摔超4% 台積電ADR跌逾3%", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈美股盤後〉美CPI升溫、AI融資疑慮夾擊 費半重摔超4% 台積電ADR跌逾3%", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E7%9B%A4%E5%BE%8C-%E7%BE%8Ecpi%E5%8D%87%E6%BA%AB-ai%E8%9E%8D%E8%B3%87%E7%96%91%E6%85%AE%E5%A4%BE%E6%93%8A-%E8%B2%BB%E5%8D%8A%E9%87%8D%E6%91%94%E8%B6%854-%E5%8F%B0%E7%A9%8D%E9%9B%BBadr%E8%B7%8C%E9%80%BE3-220235513.html", "summary": "美國9月CPI年增3.7%、核心CPI年增2.6%，均高於預期，加上AI業者舉債疑慮，美股14日道瓊跌48.62點收51621.48點、那指跌511.51點或1.88%、標普500跌1.11%，費半重挫4.30%收11684.38點。半導體股AMD大跌5.73%、輝達跌3.16%、博通跌3.10%；台積電ADR重挫3.40%、日月光ADR暴跌6.87%。財報方面，美國銀行第三季獲利69億美元，但受財政部12億美元罰款拖累，股價走低約4.7%；貝萊德資產管理規模達15.5兆美元，股價上漲約0.7%。"}, {"no": 2, "title": "美通膨推高升息預期　歐股逆勢收高", "date": "2026-10-15", "map": "", "source_name": "中央社：美通膨推高升息預期　歐股逆勢收高", "url": "https://www.cna.com.tw/news/afe/202610150003.aspx", "summary": "美國通膨數據高於預期，投資人提高對聯準會本月稍晚升息的預期，美元與公債殖利率隨之攀升，但歐洲主要股市14日逆勢收高。倫敦FTSE 100指數上揚74.53點或0.70%，收10724.86點；法蘭克福DAX指數上漲38.71點或0.15%，收25298.61點；巴黎CAC 40指數揚升45.48點或0.58%，收7873.11點，三大指數同步走揚。"}, {"no": 3, "title": "美股平靜時光所剩不多 月底起四大事件接力、預期波動增50%", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：美股平靜時光所剩不多 月底起四大事件接力、預期波動增50%", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E5%B9%B3%E9%9D%9C%E6%99%82%E5%85%89%E6%89%80%E5%89%A9%E4%B8%8D%E5%A4%9A-%E6%9C%88%E5%BA%95%E8%B5%B7%E5%9B%9B%E5%A4%A7%E4%BA%8B%E4%BB%B6%E6%8E%A5%E5%8A%9B-%E9%A0%90%E6%9C%9F%E6%B3%A2%E5%8B%95%E5%A2%9E50-160004874.html", "summary": "道瓊市場數據分析選擇權定價顯示，隨聯準會利率決策登場，自10月28日起標普500指數預期單日波動幅度平均將激增約50%，聯準會決策、重磅企業財報、11月3日期中選舉及11月6日公布的10月非農就業報告「四大事件」將接連登場。BTIG首席技術策略師克林斯基指出，截至週一標普500已連續52個交易日未出現單日1%以上跌幅；Bespoke統計距最近一次修正結束已過552個交易日，VIX數月來持續走低。"}, {"no": 4, "title": "科技股走弱　亞股多收跌", "date": "2026-10-14", "map": "", "source_name": "中央社：科技股走弱　亞股多收跌", "url": "https://www.cna.com.tw/news/afe/202610140281.aspx", "summary": "市場對艾司摩爾出現失望情緒，加上博通執行長將AI熱潮比喻為「賭博」的評論，亞洲科技股承壓，首爾與東京受影響尤深，SK海力士與愛德萬測試等大型科技股重挫，日經指數收跌0.1%至67744.29點，台北則收紅。盛寶金融分析師查納納表示，半導體類股受高債券收益率、地緣政治不確定性及AI資本支出規模疑慮影響，投資人正重新評估估值；市場聚焦美國通膨數據與台積電15日財報。"}, {"no": 5, "title": "外資賣超200.37億元　砍南亞科2.29萬張居首", "date": "2026-10-14", "map": "", "source_name": "中央社：外資賣超200.37億元　砍南亞科2.29萬張居首", "url": "https://www.cna.com.tw/news/afe/202610140219.aspx", "summary": "台股14日在台塑、台化強攻漲停、南亞勁揚逾9%帶動下，上漲284.52點收48625.83點，成交值9286.24億元。外資賣超200.37億元，賣超南亞科2萬2967張最多，京元電子、台塑化、聯電等居後；買超則以中鋼7.7萬張居首，台塑、台玻、華新、台化等亦獲青睞。投信買超161.11億元、自營商賣超114.71億元，三大法人合計賣超153.97億元；法人指美國9月CPI與台積電法說會為市場關注重點。"}]}, {"name": "Futures", "items": [{"no": 1, "title": "【盤前】美CPI高預期4大指數全倒！台指夜盤崩853點　台股今恐失守4萬8", "date": "2026-10-15", "map": "", "source_name": "Yahoo新聞（三立新聞網）：【盤前】美CPI高預期4大指數全倒！台指夜盤崩853點　台股今恐失守4萬8", "url": "https://tw.news.yahoo.com/%E7%9B%A4%E5%89%8D-%E7%BE%8Ecpi%E9%AB%98%E9%A0%90%E6%9C%9F4%E5%A4%A7%E6%8C%87%E6%95%B8%E5%85%A8%E5%80%92-%E5%8F%B0%E6%8C%87%E5%A4%9C%E7%9B%A4%E5%B4%A9853%E9%BB%9E-%E5%8F%B0%E8%82%A1%E4%BB%8A%E6%81%90%E5%A4%B1%E5%AE%884%E8%90%AC8-223000407.html", "summary": "美國9月CPI年增3.7%高於預期，加上AI產業融資疑慮擴大，美股四大指數全面收黑，費半重挫4.3%，台指期夜盤大跌853點，台積電期貨跌31元，台股15日恐面臨4萬8千點保衛戰。報導指出，通膨數據公布後美債一度遭拋售，美元升至2025年5月以來最高；全美汽油平均價格約每加侖4.33美元，高於一年前約3.08美元，西德州原油期貨收漲1.01%報每桶95.09美元。"}, {"no": 2, "title": "通膨掀升息疑慮美股收黑 台指期下殺853點、台積電ADR挫逾3％", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（中時財經即時）：通膨掀升息疑慮美股收黑 台指期下殺853點、台積電ADR挫逾3％", "url": "https://tw.stock.yahoo.com/news/%E9%80%9A%E8%86%A8%E6%8E%80%E5%8D%87%E6%81%AF%E7%96%91%E6%85%AE%E7%BE%8E%E8%82%A1%E6%94%B6%E9%BB%91-%E5%8F%B0%E6%8C%87%E6%9C%9F%E4%B8%8B%E6%AE%BA853%E9%BB%9E-%E5%8F%B0%E7%A9%8D%E9%9B%BBadr%E6%8C%AB%E9%80%BE3-221546492.html", "summary": "一度站上49000點的台指期夜盤在美國通膨數據公布後迅速下殺，收盤下跌853點報47945點、跌幅1.75%，台積電ADR下跌14.88美元、跌幅3.34%。美國9月CPI年增3.7%，高於市場預期的3.6%，根據芝商所FedWatch工具，聯準會10月27日至28日會議升息機率提高至44%，年底前至少再升息一次的可能性升至96%以上。美國勞工統計局15日將公布9月生產者物價指數（PPI）。"}, {"no": 3, "title": "10月電子期漲　金融期跌", "date": "2026-10-14", "map": "", "source_name": "中央社：10月電子期漲　金融期跌", "url": "https://www.cna.com.tw/news/afe/202610140143.aspx", "summary": "台股14日上漲284.52點收48625.83點。10月電子期收3062.2點、上漲23.2點，電子現貨收3050.05點，正價差12.15點；11月電子期收3093點、上漲38.05點。10月金融期收3674點、下跌13.2點，金融現貨收3682.87點、上漲5.11點，期貨與現貨逆價差8.87點；11月金融期收3650.6點、下跌45.6點。"}, {"no": 4, "title": "10月台股期指漲400點", "date": "2026-10-14", "map": "", "source_name": "中央社：10月台股期指漲400點", "url": "https://www.cna.com.tw/news/afe/202610140142.aspx", "summary": "台股14日終場漲284.52點收48625.83點，成交金額9286.24億元。10月台指期貨以48792點作收，上漲400點，成交4萬3404口，與現貨相較正價差166.17點；11月期貨以48964點作收，上漲357點，成交1790口。台灣期貨交易所為近2個月指數期貨契約訂定的開盤參考價，10月期貨為48392點、11月期貨為48607點。"}, {"no": 5, "title": "台指期夜盤上揚　法人：台股可望回穩", "date": "2026-10-14", "map": "", "source_name": "中央社：台指期夜盤上揚　法人：台股可望回穩", "url": "https://www.cna.com.tw/news/afe/202610140018.aspx", "summary": "美股13日主要指數全面收低，道瓊跌180.45點、標普500跌1.79點、那指跌41.52點，費半跌27.99點或0.23%，台積電ADR則上漲0.17%。法人表示，台股13日下挫960.65點收48341.31點，台指期夜盤上漲363點，台股14日可望回穩。產業訊息方面，京元電與輝達簽訂客戶預付款協議以擴充美國測試產能，矽格子公司以21.88億元得標購置建漢科技竹科廠房，因應美系客戶AI高效能運算晶片需求。"}]}, {"name": "Rates & Bonds", "items": [{"no": 1, "title": "通膨還高也不急！鮑曼：Fed才升息 可以再看看", "date": "2026-10-15", "map": "https://www.google.com/maps/search/?api=1&query=Bangkok", "source_name": "Yahoo股市（鉅亨網）：通膨還高也不急！鮑曼：Fed才升息 可以再看看", "url": "https://tw.stock.yahoo.com/news/%E9%80%9A%E8%86%A8%E9%82%84%E9%AB%98%E4%B9%9F%E4%B8%8D%E6%80%A5-%E9%AE%91%E6%9B%BC-fed%E6%89%8D%E5%8D%87%E6%81%AF-%E5%8F%AF%E4%BB%A5%E5%86%8D%E7%9C%8B%E7%9C%8B-193006809.html", "summary": "聯準會負責金融監理的副主席鮑曼在曼谷出席國際金融協會（IIF）年度會員峰會時表示，雖然通膨仍高於目標，但Fed 9月才剛升息1碼至3.75%至4.00%，目前沒有迫切需要進一步行動，可先觀察金融情勢與經濟如何演變。她的觀望立場與副主席傑佛森、紐約聯準銀行總裁威廉斯相近，波士頓聯準銀行總裁柯林斯則認為年底前有必要再升息。鮑曼也提醒AI資料中心競相籌資，需關注銀行等資金來源。"}, {"no": 2, "title": "柴油變貴一路傳！Fed褐皮書揭成本壓力 企業預期還會漲價", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：柴油變貴一路傳！Fed褐皮書揭成本壓力 企業預期還會漲價", "url": "https://tw.stock.yahoo.com/news/%E6%9F%B4%E6%B2%B9%E8%AE%8A%E8%B2%B4-%E8%B7%AF%E5%82%B3-fed%E8%A4%90%E7%9A%AE%E6%9B%B8%E6%8F%AD%E6%88%90%E6%9C%AC%E5%A3%93%E5%8A%9B-%E4%BC%81%E6%A5%AD%E9%A0%90%E6%9C%9F%E9%82%84%E6%9C%83%E6%BC%B2%E5%83%B9-184005442.html", "summary": "聯準會最新褐皮書資料蒐集至10月5日，指出柴油與能源成本透過燃料附加費向供應鏈傳導，關稅、原物料及保險也持續推高成本；12個轄區中3區形容物價漲勢強勁、8區溫和上漲，4區表示漲價速度較前次調查加快，多區企業預期未來數月仍可能漲價。經濟活動整體小幅成長，就業維持「低招聘、低裁員」；同日9月CPI年增3.7%高於預期，市場對10月27日至28日會議升息的押注升至約37%。"}, {"no": 3, "title": "美債殖利率若衝上6%怎麼辦？戴蒙示警風險 科技七巨頭意外成資金避風港", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：美債殖利率若衝上6%怎麼辦？戴蒙示警風險 科技七巨頭意外成資金避風港", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E5%82%B5%E6%AE%96%E5%88%A9%E7%8E%87%E8%8B%A5%E8%A1%9D%E4%B8%8A6-%E6%80%8E%E9%BA%BC%E8%BE%A6-%E6%88%B4%E8%92%99%E7%A4%BA%E8%AD%A6%E9%A2%A8%E9%9A%AA-%E7%A7%91%E6%8A%80%E4%B8%83%E5%B7%A8%E9%A0%AD%E6%84%8F%E5%A4%96%E6%88%90%E8%B3%87%E9%87%91%E9%81%BF%E9%A2%A8%E6%B8%AF-163005623.html", "summary": "美國10年期公債殖利率近期升破5%，摩根大通執行長戴蒙表示，他並非預測殖利率一定升至6%，但建議投資人做好準備。分析人士指出殖利率上升與AI投資資金需求、通膨疑慮、一年接近2兆美元預算赤字及40兆美元國債等因素有關，今年約2500億美元AI相關債券湧入投資級公司債市場。Roundhill科技七巨頭ETF一個月內上漲6.4%，同期10年期美債殖利率上升約1.3個百分點；DWS指10年期殖利率週二約5.23%。"}, {"no": 4, "title": "美國9月CPI年增3.7%、月增0.6%　高於市場預期", "date": "2026-10-14", "map": "", "source_name": "中央社：美國9月CPI年增3.7%、月增0.6%　高於市場預期", "url": "https://www.cna.com.tw/news/aopl/202610140339.aspx", "summary": "美國勞工部公布，9月消費者物價指數（CPI）年增率升至3.7%，高於經濟學家原本預測的3.6%，也較8月的3.4%顯著攀升，主要受燃料成本上漲影響；CPI月增率則由8月的0.4%增至9月的0.6%。去除波動較大的食品與能源價格後，9月核心CPI年增2.6%，通膨壓力較8月明顯升溫。"}, {"no": 5, "title": "中東衝突遇上AI熱潮　全球央行抗通膨難度升高", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=Bangkok", "source_name": "中央社：中東衝突遇上AI熱潮　全球央行抗通膨難度升高", "url": "https://www.cna.com.tw/news/aopl/202610140220.aspx", "summary": "IMF與世界銀行年會在曼谷登場，韓國央行總裁申鉉松表示，中東衝突與AI熱潮透過成本推升與需求拉動導致「通膨惡化」，韓國央行今年7、8月連續升息至3%。日本央行今年6、9月兩度升息，印度央行啟動3年多來首度升息循環，澳洲央行今年已4度升息。穆迪分析指升息對供給面通膨衝擊作用有限；IMF指全球公共債務接近二戰結束以來最高，很快將超過全球GDP的100%。"}]}, {"name": "Currencies", "items": [{"no": 1, "title": "台股收紅外資賣壓收斂　新台幣由貶翻升終止連4黑", "date": "2026-10-14", "map": "", "source_name": "中央社：台股收紅外資賣壓收斂　新台幣由貶翻升終止連4黑", "url": "https://www.cna.com.tw/news/afe/202610140275.aspx", "summary": "新台幣兌美元14日以32.1元開出後一度重貶逾1.4角、盤中最低32.228元，午後外資反手匯入、出口商積極拋匯，加上央行尾盤調節，終場由貶翻升收32.073元、升1.2分，終止連4黑，台北及元太外匯市場總成交金額33.835億美元，較13日71.145億美元的史上最大量明顯縮減。外匯交易員表示，市場氛圍逐漸回穩，後續關注美國9月CPI及台積電法說，若法說釋出正面訊號，外資匯出壓力可望減輕。"}, {"no": 2, "title": "股匯脫鉤！新台幣5天貶逾4角 分析師：下一步恐回測32.6關卡", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（Yahoo股市）：股匯脫鉤！新台幣5天貶逾4角 分析師：下一步恐回測32.6關卡", "url": "https://tw.stock.yahoo.com/news/%E8%82%A1%E5%8C%AF%E8%84%AB%E9%89%A4%EF%BC%81%E6%96%B0%E5%8F%B0%E5%B9%A35%E5%A4%A9%E8%B2%B6%E9%80%BE4%E8%A7%92-%E5%88%86%E6%9E%90%E5%B8%AB%EF%BC%9A%E4%B8%8B%E4%B8%80%E6%AD%A5%E6%81%90%E5%9B%9E%E6%B8%AC326%E9%97%9C%E5%8D%A1-033629816.html", "summary": "儘管台股14日走揚，但受制於美元指數高檔強勢盤整，新台幣兌美元盤中最低觸及32.213元，較前一交易日收盤價32.085元貶值逾1角；若以這波高點31.76元計算，短短五個交易日累計最大貶幅已超過4角。資深外匯專家李其展分析，若新台幣持續收貶並於32元大關附近沉澱，整體格局將重回橫盤整理，預期短期匯價將在32.2元至32.6元區間反覆震盪。"}, {"no": 3, "title": "東京匯市早盤美元指數自18個月高點回落，市場聚焦美國CPI與Fed談話", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（財訊快報）：東京匯市早盤美元指數自18個月高點回落，市場聚焦美國CPI與Fed談話", "url": "https://tw.stock.yahoo.com/news/%E6%9D%B1%E4%BA%AC%E5%8C%AF%E5%B8%82%E6%97%A9%E7%9B%A4%E7%BE%8E%E5%85%83%E6%8C%87%E6%95%B8%E8%87%AA18%E5%80%8B%E6%9C%88%E9%AB%98%E9%BB%9E%E5%9B%9E%E8%90%BD-%E5%B8%82%E5%A0%B4%E8%81%9A%E7%84%A6%E7%BE%8E%E5%9C%8Bcpi%E8%88%87fed%E8%AB%87%E8%A9%B1-015621897.html", "summary": "東京匯市14日早盤美元指數繼前一日下跌0.35%後再小跌0.02%至102.16，低於12日觸及的18個月高點102.607；歐元小漲0.04%至1.1203美元，日圓大致持平於158.32日圓兌1美元，英鎊、澳幣與紐幣小漲。紐約聯準銀行總裁威廉斯表示仍預期今年再升息一次，但看不到2027年需進一步加息的理由。市場預估美國9月CPI年增率由3.4%升至3.6%，FedWatch顯示10月會議維持利率不變機率為77%。"}, {"no": 4, "title": "債市走強、油價走跌，紐約匯市週二美元兌主要貨幣下跌", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（財訊快報）：債市走強、油價走跌，紐約匯市週二美元兌主要貨幣下跌", "url": "https://tw.stock.yahoo.com/news/%E5%82%B5%E5%B8%82%E8%B5%B0%E5%BC%B7-%E6%B2%B9%E5%83%B9%E8%B5%B0%E8%B7%8C-%E7%B4%90%E7%B4%84%E5%8C%AF%E5%B8%82%E9%80%B1%E4%BA%8C%E7%BE%8E%E5%85%83%E5%85%8C%E4%B8%BB%E8%A6%81%E8%B2%A8%E5%B9%A3%E4%B8%8B%E8%B7%8C-235647843.html", "summary": "紐約匯市13日美元兌一籃子主要貨幣下跌，美元指數跌0.40%報102.180，因全球債市上漲推動殖利率走低、油價下跌；歐元報1.1199美元，美元兌日圓貶值0.28日圓報158.33日圓，英鎊升至1.3255美元。基準10年期美債殖利率下降3個基點至5.21%。德意志銀行美洲外匯研究主管Tim Baker認為風險偏向通膨數據低於預期；知情人士則稱日本央行官員傾向本月不升息，但考慮最快12月再行動。"}, {"no": 5, "title": "美國CPI數據今晚揭曉 牽動美元加幣匯率走勢", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（商傳媒）：美國CPI數據今晚揭曉 牽動美元加幣匯率走勢", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E5%9C%8Bcpi%E6%95%B8%E6%93%9A%E4%BB%8A%E6%99%9A%E6%8F%AD%E6%9B%89-%E7%89%BD%E5%8B%95%E7%BE%8E%E5%85%83%E5%8A%A0%E5%B9%A3%E5%8C%AF%E7%8E%87%E8%B5%B0%E5%8B%A2-232834356.html", "summary": "全球市場等待美國9月CPI，市場普遍預期整體通膨年增率可能加速至3.6%、核心通膨升至2.5%，結果將牽動美元與加幣匯率及各國央行政策。報導指出，美元兌多數主要貨幣週二盤中自18個月高點顯著回落，部分原因來自市場對AI相關股票估值過高的疑慮及油價下跌，但美國9月成屋銷售數據優於預期使美元賣壓減輕；美國10年期公債殖利率已從近期高點回落至5.2%區間，美元兌加幣近日維持盤整。"}]}, {"name": "Commodities", "items": [{"no": 1, "title": "【金屬盤後】金銅價跌", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（中央社財經）：【金屬盤後】金銅價跌", "url": "https://tw.stock.yahoo.com/news/%E9%87%91%E5%B1%AC%E7%9B%A4%E5%BE%8C-%E9%87%91%E9%8A%85%E5%83%B9%E8%B7%8C-223524007.html", "summary": "美國公布9月消費者物價指數月增0.6%、年增3.7%，引發聯準會升息疑慮，黃金與銅價同步下跌。數據出爐後，國際金價一度下跌2.1%至每盎司4070美元；基本金屬方面，倫敦金屬交易所（LME）3個月後交割期銅價格下跌88美元，每噸報14490美元。"}, {"no": 2, "title": "貴金屬十月持續走弱 白銀價格跌至每盎司59美元關卡", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（商傳媒）：貴金屬十月持續走弱 白銀價格跌至每盎司59美元關卡", "url": "https://tw.stock.yahoo.com/news/%E8%B2%B4%E9%87%91%E5%B1%AC%E5%8D%81%E6%9C%88%E6%8C%81%E7%BA%8C%E8%B5%B0%E5%BC%B1-%E7%99%BD%E9%8A%80%E5%83%B9%E6%A0%BC%E8%B7%8C%E8%87%B3%E6%AF%8F%E7%9B%8E%E5%8F%B859%E7%BE%8E%E5%85%83%E9%97%9C%E5%8D%A1-050246991.html", "summary": "白銀價格13日跌向每盎司59美元，COMEX 10月白銀期貨下跌1.63%至約59.16美元，近兩個交易日累計跌幅2.49%，今年以來已下跌約15.7%，主因聯準會貨幣政策、投資需求轉變、美元走強及殖利率上升。Silver Institute預估全球白銀市場2026年將連續第六年供應赤字，總供應量增加1.5%至約10.5億盎司，工業需求則因太陽能業者減少用銀而下降2%至約6.5億盎司；報導指出宏觀經濟惡化仍可能壓低價格。"}, {"no": 3, "title": "鋁價守3,000美元掩蓋供應壓力，LME註冊庫存降至本世紀最低", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（財訊快報）：鋁價守3,000美元掩蓋供應壓力，LME註冊庫存降至本世紀最低", "url": "https://tw.stock.yahoo.com/news/%E9%8B%81%E5%83%B9%E5%AE%883-000%E7%BE%8E%E5%85%83%E6%8E%A9%E8%93%8B%E4%BE%9B%E6%87%89%E5%A3%93%E5%8A%9B-lme%E8%A8%BB%E5%86%8A%E5%BA%AB%E5%AD%98%E9%99%8D%E8%87%B3%E6%9C%AC%E4%B8%96%E7%B4%80%E6%9C%80%E4%BD%8E-011952341.html", "summary": "路透專欄作家Andy Home指出，伊朗飛彈攻擊波斯灣煉鋁廠及荷姆茲海峽受阻，曾使近300萬公噸鋁產能停擺，但LME三個月期鋁仍在每公噸3000美元略上方。波斯灣原鋁8月年化產量回升至350萬公噸，仍較戰前少260萬公噸；日本買家第四季鋁升水降至每公噸255美元，歐洲含稅實體升水約559美元，美國中西部升水達2312美元。LME註冊鋁庫存降至23萬8625公噸，創本世紀最低。"}, {"no": 4, "title": "LME期銅週二震盪下跌0.28%，市場權衡AI基礎設施過熱隱憂與供應風險", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（財訊快報）：LME期銅週二震盪下跌0.28%，市場權衡AI基礎設施過熱隱憂與供應風險", "url": "https://tw.stock.yahoo.com/news/lme%E6%9C%9F%E9%8A%85%E9%80%B1%E4%BA%8C%E9%9C%87%E7%9B%AA%E4%B8%8B%E8%B7%8C0-28-%E5%B8%82%E5%A0%B4%E6%AC%8A%E8%A1%A1ai%E5%9F%BA%E7%A4%8E%E8%A8%AD%E6%96%BD%E9%81%8E%E7%86%B1%E9%9A%B1%E6%86%82%E8%88%87%E4%BE%9B%E6%87%89%E9%A2%A8%E9%9A%AA-002741394.html", "summary": "倫敦銅價13日震盪走低，LME期銅下跌40.50美元或0.28%，報每噸14578美元，市場在AI基礎設施投資過熱擔憂與供應風險之間權衡；在多項警告指數據中心快速擴張將越來越難取得融資後，全球AI與科技股下跌。其他基本金屬方面，LME期鋁下跌0.4%報3039美元，期鎳跌0.2%報15587美元，期鋅跌0.7%報3731.5美元，期錫跌2.7%報51767美元，期鉛上漲1%報1902美元。"}, {"no": 5, "title": "〈貴金屬盤後〉金價走低 投資人觀望CPI報告和華許演說", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈貴金屬盤後〉金價走低 投資人觀望CPI報告和華許演說", "url": "https://tw.stock.yahoo.com/news/%E8%B2%B4%E9%87%91%E5%B1%AC%E7%9B%A4%E5%BE%8C-%E9%87%91%E5%83%B9%E8%B5%B0%E4%BD%8E-%E6%8A%95%E8%B3%87%E4%BA%BA%E8%A7%80%E6%9C%9Bcpi%E5%A0%B1%E5%91%8A%E5%92%8C%E8%8F%AF%E8%A8%B1%E6%BC%94%E8%AA%AA-223854287.html", "summary": "黃金13日走低，現貨黃金下跌0.3%報每盎司4157.90美元，美國黃金期貨收低0.3%報4177.30美元，投資人靜待美國通膨數據及聯準會主席華許週四演說。Fed理事華勒表示美債殖利率上升反映經濟成長力道增強，通膨預期仍穩定；FedWatch顯示本月升息機率僅19%，12月升息機率達88%。德國商業銀行指升息對黃金愈來愈像雙面刃；現貨白銀下跌1.8%報59.25美元，白金跌1.4%、鈀金跌1.5%。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "PC 出貨驟減成本漲 2027 年筆電恐更貴", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（商傳媒）：PC 出貨驟減成本漲 2027 年筆電恐更貴", "url": "https://tw.stock.yahoo.com/news/pc-%E5%87%BA%E8%B2%A8%E9%A9%9F%E6%B8%9B%E6%88%90%E6%9C%AC%E6%BC%B2-2027-%E5%B9%B4%E7%AD%86%E9%9B%BB%E6%81%90%E6%9B%B4%E8%B2%B4-190952582.html", "summary": "IDC數據顯示，全球PC出貨量2026年第三季年減20.1%，由7850萬台降至6270萬台，跌幅較第二季的3.8%擴大。中央處理器、DRAM及SSD等核心零組件成本飆升，第三季已占一台建議售價900美元大眾筆電約68%成本，遠高於2025年第一季的45%，AI伺服器與資料中心需求加劇供應緊張。集邦科技預測2027年全球筆電出貨將再下滑數個百分點，若成本轉嫁消費者，跌幅可能接近10%。"}, {"no": 2, "title": "國際智慧能源週登場　業者搶攻屋頂光電及AI電力商機", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=%E5%8D%97%E6%B8%AF%E5%B1%95%E8%A6%BD%E9%A4%A81%E9%A4%A8", "source_name": "中央社：國際智慧能源週登場　業者搶攻屋頂光電及AI電力商機", "url": "https://www.cna.com.tw/news/afe/202610140310.aspx", "summary": "台灣國際淨零永續展與智慧能源週14日至16日在南港展覽1館登場。聯合再生執行長張為策表示，台灣屋頂型光電每年新增約500至700MW，隨建築型及住宅光電政策推動可望上看1GW；其與中美晶規劃的美國模組廠預計明年第3季量產，美國買家詢問量已超過1GW。元晶推出最高625W模組，雲豹能源今年完成收購187MW光電案場並切入AI資料中心能源建設，泓德能源旗下星舟快充全台布局超過300座充電站。"}, {"no": 3, "title": "迎戰AI用電平均1年蓋3座　台電規劃15年擴建43座變電所", "date": "2026-10-14", "map": "", "source_name": "中央社：迎戰AI用電平均1年蓋3座　台電規劃15年擴建43座變電所", "url": "https://www.cna.com.tw/news/afe/202610140274.aspx", "summary": "台電董事長曾文生表示，未來15年將新擴建43座變電所、新建線路1922公里、新增變電容量約52GW，並投資約300億元建置12套STATCOM提升電網穩定度。台電預估半導體產業用電將由今年約520億度成長至2035年的1100億度、約占全國用電3成，南科2031年用電負載將達約4GW；未來10年規劃新增25部、約26GW天然氣機組。他並以100MW AI資料中心為例，估算所需資金可能達1500億元。"}, {"no": 4, "title": "台達電強攻氫能　攜手大台北瓦斯建首座國產SOFC案場", "date": "2026-10-14", "map": "", "source_name": "中央社：台達電強攻氫能　攜手大台北瓦斯建首座國產SOFC案場", "url": "https://www.cna.com.tw/news/afe/202610140255.aspx", "summary": "台達電氫能源應用新事業發展部總經理蔡文蔭表示，台達電已與大台北瓦斯簽約，將打造台灣首座國產550kW固態氧化物燃料電池（SOFC）案場。他指出AI推升用電，傳統電網建置至少需5年以上，SOFC可快速部署且發電效率可達60%。台達電台南2廠預計2026年底試量產，桃園觀音SOFC電堆與系統生產基地預計2028年正式量產；另首度亮相預製型SST直流電力解決方案，可縮短50%現場部署時間。"}, {"no": 5, "title": "大同：AI機櫃建置與台電標案回流　看好明年營收成長", "date": "2026-10-14", "map": "", "source_name": "中央社：大同：AI機櫃建置與台電標案回流　看好明年營收成長", "url": "https://www.cna.com.tw/news/afe/202610140161.aspx", "summary": "大同總經理張松鑌表示，新產品TTG AIDC CUBE模組化AI資料中心整合電力、冷卻、算力與智慧監控，最快180天即可提供從電網到算力的AI機櫃建置服務；原遭台電喊停的公共工程標案透過新成立子公司承接，已回流3成，明年營收可望大幅成長。北美市場方面，大同銷往當地的變壓器為500Kv，高於台灣使用的345Kv，未來不排除進一步布局北美與東南亞，並與EPC合作提供一條龍服務。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "〈能源盤後〉沙烏地阿美遭襲、伊朗改變攻船戰術! Brent站上106美元", "date": "2026-10-15", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈能源盤後〉沙烏地阿美遭襲、伊朗改變攻船戰術! Brent站上106美元", "url": "https://tw.stock.yahoo.com/news/%E8%83%BD%E6%BA%90%E7%9B%A4%E5%BE%8C-%E6%B2%99%E7%83%8F%E5%9C%B0%E9%98%BF%E7%BE%8E%E9%81%AD%E8%A5%B2-%E4%BC%8A%E6%9C%97%E6%94%B9%E8%AE%8A%E6%94%BB%E8%88%B9%E6%88%B0%E8%A1%93-brent%E7%AB%99%E4%B8%8A106%E7%BE%8E%E5%85%83-220007636.html", "summary": "中東局勢升溫推升油價，布蘭特原油期貨14日收漲37美分或0.35%報每桶106.06美元，WTI上漲95美分或1.01%報95.09美元、創3週新高。葉門胡塞武裝組織攻擊沙烏地阿美位於達蘭的行政大樓，伊朗官員則稱約10天前開始採用新攻船戰術。供應面上，排除伊朗後波斯灣產油國9月原油流量回升至戰前水準81%以上；國際能源署數據顯示，波灣產油國9月原油出口較前月增加440萬桶/日，恢復至戰前約75%。"}, {"no": 2, "title": "葉門叛軍襲沙烏地阿美石油公司　傳總部大樓多樓層受損", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=Dhahran%2C%20Saudi%20Arabia", "source_name": "中央社：葉門叛軍襲沙烏地阿美石油公司　傳總部大樓多樓層受損", "url": "https://www.cna.com.tw/news/aopl/202610140334.aspx", "summary": "葉門叛軍青年運動宣布攻擊沙烏地阿美石油公司設施，沙國能源部官員表示，位於達蘭的一棟建築被擊中引發局部火警、無人傷亡；知情人士指遇襲辦公大樓頂部3層樓嚴重受損，執行長納瑟的辦公室亦在遇襲範圍內。該園區設有營運中心，協助監控陸上及海上石油平台、煉油廠、出口終端及管線，目前維持營運，但部分員工被要求在家工作；叛軍並稱也空襲利雅德機場及一座煉油廠，未來將持續鎖定沙國機場與石油設施。"}, {"no": 3, "title": "國際能源總署：柴油供應緊張將持續至2027年", "date": "2026-10-14", "map": "", "source_name": "中央社：國際能源總署：柴油供應緊張將持續至2027年", "url": "https://www.cna.com.tw/news/aopl/202610140319.aspx", "summary": "國際能源總署（IEA）每月能源市場報告指出，美國對伊朗發動戰爭導致波斯灣柴油供應中斷，加上補充枯竭庫存需要時間，柴油市場供需緊縮將持續至2027年。波灣原油出口減少與當地煉油廠受損，使歐美柴油價格近幾週屢創新高。IEA預測煉油產能恢復後，明年第一季柴油市場將出現過剩、庫存大致回升，但仍無法完全彌補2月底以來的缺口，並警告若波灣供應無法盡快恢復，可能需進一步降低需求。"}, {"no": 4, "title": "離岸風電3-3期選商競爭　沃旭：若獲准能馬上展開工作", "date": "2026-10-14", "map": "", "source_name": "中央社：離岸風電3-3期選商競爭　沃旭：若獲准能馬上展開工作", "url": "https://www.cna.com.tw/news/afe/202610140187.aspx", "summary": "沃旭能源表示，已規劃總容量3GW的大肚1號、2號風場，其中裝置容量1GW的大肚1號已投標離岸風電區塊開發3-3期選商，若獲核准可馬上展開工作，2號風場正進行環評。3-3期選商9月底截止，哥本哈根基礎建設基金（CIP）以渢妙3號風場投標，兩處選址在台中、彰化外海高度重疊，外界評估最終可能只有1家獲選，經濟部預計今年底前完成選商與容量分配；沃旭並指韓國1.4GW專案盼年底前取得環評核准。"}, {"no": 5, "title": "經部：中油每年採購600萬噸阿拉斯加天然氣　估最高投資44億美元", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=Alaska", "source_name": "中央社：經部：中油每年採購600萬噸阿拉斯加天然氣　估最高投資44億美元", "url": "https://www.cna.com.tw/news/afe/202610140108.aspx", "summary": "美國總統川普表示台灣已同意在未來20年內採購阿拉斯加液化天然氣管線計畫30%天然氣。經濟部表示，中油已與美方開發商協商取得重大進展，依目前規劃將每年採購600萬噸液化天然氣並參與專案開發，預估投資金額最高44億美元；若計畫順利推進，最快2032年起可挹注國內天然氣供應。經濟部指該計畫可透過太平洋航線直達台灣，有助分散運輸路線及地緣政治風險，具體持股比例與條件仍待協商。"}]}], "warnings": [], "day": "2026-10-15"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-12 至 2026-10-14）", "compiled": "2026-10-14 07:25（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件；10月13日台股受AI投資疑慮與費半連跌拖累重挫960.65點、外資單日賣超1653.42億元，新台幣爆量貶破32元，美股13日小幅收低、台指期夜盤反彈363點，市場焦點轉向美國9月CPI與台積電15日法說會", "note": "11類各5則，無不足5則或空缺類別；入選新聞皆為10月13日至14日（台灣時間）新稿，10月12日重要題材（南亞科法說、貨櫃三雄漲停、國銀高資產客戶等）已見前一日整理，本期未重複收錄；已依指定條件排除黑名單人物與政黨、社會、運動、彩券與抽獎，並排除以中國為主軸之新聞（如長鑫存儲新技術、輝達中國市占、中國購金等），部分市場報導僅順帶提及中國記憶體廠或中國需求者予以保留，但摘要未納入該段；同一事件多家報導僅在面向不同時並列（如新台幣重貶分列盤勢與央行、美元指數觀點），內容相同者僅擇一收錄，新台幣13日外匯成交量依中央社與中時「71億美元史上最大量」口徑，鉅亨網另報兩大外匯市場54.33億美元為史上次高，統計口徑不同。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "台積電明法說　外資調升目標價3300元", "date": "2026-10-14", "map": "", "source_name": "Yahoo新聞（中時新聞網）：台積電明法說　外資調升目標價3300元", "url": "https://tw.news.yahoo.com/%E5%8F%B0%E7%A9%8D%E9%9B%BB%E6%98%8E%E6%B3%95%E8%AA%AA-%E5%A4%96%E8%B3%87%E8%AA%BF%E5%8D%87%E7%9B%AE%E6%A8%99%E5%83%B93300%E5%85%83-201000290.html", "summary": "台積電15日將舉行第3季法說會，市場普遍預期第4季美元營收季增上看10至15％，今年全年美元營收年增率有望上修至40至45%區間。高盛與摩根大通將目標價升至3300元，摩根士丹利調升至3088元；法人指第3季毛利率可望貼近財測高標67.5％，預期明年先進製程報價仍有5至10％調漲空間。高盛預估明年底2奈米與3奈米月產能將各達14萬片與20萬片，法人預期今年資本支出維持600億至640億美元高標。"}, {"no": 2, "title": "AI晶片變強不只靠製程！先進封裝成新關鍵　台積電布局受矚目", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：AI晶片變強不只靠製程！先進封裝成新關鍵　台積電布局受矚目", "url": "https://tw.stock.yahoo.com/news/ai%E6%99%B6%E7%89%87%E8%AE%8A%E5%BC%B7%E4%B8%8D%E5%8F%AA%E9%9D%A0%E8%A3%BD%E7%A8%8B-%E5%85%88%E9%80%B2%E5%B0%81%E8%A3%9D%E6%88%90%E6%96%B0%E9%97%9C%E9%8D%B5-%E5%8F%B0%E7%A9%8D%E9%9B%BB%E5%B8%83%E5%B1%80%E5%8F%97%E7%9F%9A%E7%9B%AE-194003092.html", "summary": "《華爾街日報》報導，AI晶片競爭正從電晶體能做多小，延伸至不同晶片如何整合，先進封裝成為提升效能的重要途徑。輝達採用台積電技術，在同一封裝內整合AI運算晶片與大量高頻寬記憶體（HBM），封裝產能擴張受限曾成為輝達銷售成長瓶頸，台積電已將舊晶圓廠轉作封裝設施並將相關產能擴增數倍；應用材料執行長表示公司今年封裝相關營收預計成長逾70%。台積電將於週四公布季度財報。"}, {"no": 3, "title": "京元電與輝達簽預付款協議　母子公司供應測試產能", "date": "2026-10-13", "map": "", "source_name": "中央社：京元電與輝達簽預付款協議　母子公司供應測試產能", "url": "https://www.cna.com.tw/news/afe/202610130188.aspx", "summary": "晶圓測試廠京元電公告，董事會決議與輝達簽訂客戶預付款協議，由輝達預付款項，京元電及美國全資子公司AeternZ Semiconductor Testing Corporation在美國建置產能，為輝達保留產能並提供測試服務，預付款以日後服務款項抵減。京元電先前公告董事會決議在美國設立孫公司及投資設廠，授權董事長謝其俊在14億美元（約新台幣449億元）額度內全權處理美國投資設廠事宜。"}, {"no": 4, "title": "矽格集團砸21.88億元　購建漢竹科廠房擴AI測試", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E7%AB%B9%E7%A7%91%E5%AD%B8%E5%9C%92%E5%8D%80", "source_name": "中央社：矽格集團砸21.88億元　購建漢竹科廠房擴AI測試", "url": "https://www.cna.com.tw/news/afe/202610130315.aspx", "summary": "矽格子公司矽格聯測以新台幣21.88億元得標購置建漢科技竹科廠房，因應美系客戶AI高效能運算晶片的強勁需求；廠房與附屬設備占地7870坪、建物約1萬4215坪，新廠房量產後預估較現有量產廠區再增加25%產能，將聚焦AI互連矽光子高速光通訊IC測試、AI特殊應用晶片（ASIC）晶圓及CoWoS晶片測試服務。矽格前8月AI、CPU/GPU、ASIC、矽光子等業績占比增至24%，預估2027年可提升至3成。"}, {"no": 5, "title": "愛普GDR折價5.22%發行　籌4.16億美元支應外幣購料", "date": "2026-10-13", "map": "", "source_name": "中央社：愛普GDR折價5.22%發行　籌4.16億美元支應外幣購料", "url": "https://www.cna.com.tw/news/afe/202610130031.aspx", "summary": "客製化記憶體設計廠愛普科技完成海外存託憑證（GDR）發行訂價，每單位56.15美元（約每股新台幣898元），較12日收盤價947元折價約5.22%，共發行740萬單位GDR、募集資金4.16億美元，短時間內即獲5倍超額認購，預計於盧森堡證券交易所掛牌。受消費性設備記憶體供不應求、價格調漲及矽電容放量帶動，9月營收攀高至11.9億元創歷史新高；分離式矽電容今年第2季量產出貨。"}]}, {"name": "AI", "items": [{"no": 1, "title": "「歐洲必須加入競賽！」黃仁勳預告20億美元AI投資", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：「歐洲必須加入競賽！」黃仁勳預告20億美元AI投資", "url": "https://tw.stock.yahoo.com/news/%E6%AD%90%E6%B4%B2%E5%BF%85%E9%A0%88%E5%8A%A0%E5%85%A5%E7%AB%B6%E8%B3%BD-%E9%BB%83%E4%BB%81%E5%8B%B3%E9%A0%90%E5%91%8A20%E5%84%84%E7%BE%8E%E5%85%83ai%E6%8A%95%E8%B3%87-172003186.html", "summary": "輝達執行長黃仁勳13日在巴黎表示，公司計劃未來一周宣布20億美元的歐洲投資案，延續過去一年已投入當地的80億美元布局，並宣布對Doctolib、Genesis AI、Pigment及Entalpic等法國新創提供新資金，喊話「歐洲必須加入競賽」。巴黎是此次歐洲行首站，後續將前往倫敦與柏林；黃仁勳將開源模型視為歐洲追趕美國AI發展的途徑，輝達已投資Mistral AI，Mistral最新模型使用4,000顆Grace Blackwell晶片訓練。"}, {"no": 2, "title": "AI支出何時降溫？高盛緊盯三大訊號、兩項已浮現", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：AI支出何時降溫？高盛緊盯三大訊號、兩項已浮現", "url": "https://tw.stock.yahoo.com/news/ai%E6%94%AF%E5%87%BA%E4%BD%95%E6%99%82%E9%99%8D%E6%BA%AB-%E9%AB%98%E7%9B%9B%E7%B7%8A%E7%9B%AF%E4%B8%89%E5%A4%A7%E8%A8%8A%E8%99%9F-%E5%85%A9%E9%A0%85%E5%B7%B2%E6%B5%AE%E7%8F%BE-171003199.html", "summary": "高盛資深宏觀交易員Bobby Molavi指出，判斷AI資本支出週期是否逼近轉折的三大訊號中，股價與實際獲利背離、信貸市場重新評估AI融資風險兩項已出現，資本支出增速放緩則尚待驗證。今年已有超過5,000億美元債務發行用於支持AI基礎設施；高盛預測超大規模雲端服務商資本支出年增率將於2026年第三季達116%高峰，到2027年底降至20%出頭。10檔核心AI相關股票占標普500總市值約40%。"}, {"no": 3, "title": "AMD推代理式AI機櫃Helion　11月供貨、鴻海緯穎雲達挺進", "date": "2026-10-13", "map": "", "source_name": "Yahoo新聞（緯來新聞網）：AMD推代理式AI機櫃Helion　11月供貨、鴻海緯穎雲達挺進", "url": "https://tw.news.yahoo.com/amd-%E6%8E%A8%E4%BB%A3%E7%90%86%E5%BC%8F-ai-%E6%A9%9F%E6%AB%83-helion-095900680.html", "summary": "AMD於2026 OCP全球高峰會發表代理式AI機櫃AMD Helion，預計2026年11月供貨。「純CPU機櫃」搭載第6代EPYC處理器，單一機櫃最多可容納32,768個CPU核心，鎖定超大規模雲端業者；「整合式機櫃」則把EPYC CPU、Instinct MI350P GPU與通用運算節點放進同一平台，瞄準企業用戶。Helion是參考設計，AMD計劃把規格提交給OCP交由合作夥伴開發，鴻海、雲達、緯穎等台廠已表態支援。"}, {"no": 4, "title": "鴻海參加OCP高峰會　聚焦新一代AI機櫃方案", "date": "2026-10-13", "map": "", "source_name": "中央社：鴻海參加OCP高峰會　聚焦新一代AI機櫃方案", "url": "https://www.cna.com.tw/news/afe/202610130153.aspx", "summary": "2026年開放運算計畫（OCP）全球高峰會登場，鴻海旗下鴻佰科技展出輝達Vera Rubin NVL72平台等方案，以及對MGX架構Vera Rubin平台的完整產品支援，鴻騰精密則聚焦AI資料中心高速互連、供電與散熱需求。鴻海並持續攜手英特爾，以Intel Xeon平台為基礎共同推進Rack-scale Agentic AI解決方案，呈現集團從關鍵零組件、運算托盤到機架級系統的布局。"}, {"no": 5, "title": "日媒：Anthropic日本首座數據中心擬設於大阪", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E5%BA%9C", "source_name": "中央社：日媒：Anthropic日本首座數據中心擬設於大阪", "url": "https://www.cna.com.tw/news/aopl/202610130104.aspx", "summary": "日本經濟新聞報導，NTT子公司NTT DATA集團與Anthropic正協商於大阪府南部灣岸地區新設數據中心據點，計劃在2026年度內簽約、2028年開始局部運轉，建設費用上看1兆日圓，若大量導入搭載先進GPU的伺服器，整體設施投資額預計擴大至數兆日圓規模。這將是Anthropic在日本的首座數據中心；日本政府目標在2035年度前由公私部門合計投入32.7兆日圓於數據中心與蓄電池等領域。"}]}, {"name": "金融", "items": [{"no": 1, "title": "8月國銀存款衝8382億　改寫歷年同月新紀錄", "date": "2026-10-14", "map": "", "source_name": "Yahoo新聞（卡優新聞網）：8月國銀存款衝8382億　改寫歷年同月新紀錄", "url": "https://tw.news.yahoo.com/8%E6%9C%88%E5%9C%8B%E9%8A%80%E5%AD%98%E6%AC%BE%E8%A1%9D8382%E5%84%84-%E6%94%B9%E5%AF%AB%E6%AD%B7%E5%B9%B4%E5%90%8C%E6%9C%88%E6%96%B0%E7%B4%80%E9%8C%84-191629991.html", "summary": "金管會統計，38家本國銀行8月底存款餘額達67兆7,973億元，單月彈升8,382億元，創史上8月新高、史上單月第3高；放款月增3,627億元至49兆2,155億元，為歷年8月次高。8月個人放款增加1,870億元，企業投資單月暴增296億元衝上歷年8月最高；累計1~8月存款增4兆7,049億元、放款增4兆3,950億元，均超越去年全年水準。8月底逾放比維持0.14%，備抵呆帳覆蓋率升至963.6%。"}, {"no": 2, "title": "華爾街大行財報亮點藏隱憂！股票交易撐場　成長動能能否延續？", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：華爾街大行財報亮點藏隱憂！股票交易撐場　成長動能能否延續？", "url": "https://tw.stock.yahoo.com/news/%E8%8F%AF%E7%88%BE%E8%A1%97%E5%A4%A7%E8%A1%8C%E8%B2%A1%E5%A0%B1%E4%BA%AE%E9%BB%9E%E8%97%8F%E9%9A%B1%E6%86%82-%E8%82%A1%E7%A5%A8%E4%BA%A4%E6%98%93%E6%92%90%E5%A0%B4-%E6%88%90%E9%95%B7%E5%8B%95%E8%83%BD%E8%83%BD%E5%90%A6%E5%BB%B6%E7%BA%8C-165004233.html", "summary": "摩根大通、富國銀行與花旗等華爾街大型銀行第三季業績呈現兩樣情，股債震盪推升股票交易收入，但企業併購、IPO與部分債券交易降溫，多家銀行高層指出9月下旬業務放緩尤其明顯。摩根大通第三季市場業務收入年增15%，其中股票交易收入大增49%；高盛第三季獲利優於預期，但固定收益、外匯及大宗商品交易收入年減1%。富國銀行財務長表示，美國10年期公債殖利率大幅攀升已對業務產生影響。"}, {"no": 3, "title": "金管會：疊券要確保客戶風險承受　控管準則預計年底上路", "date": "2026-10-13", "map": "", "source_name": "中央社：金管會：疊券要確保客戶風險承受　控管準則預計年底上路", "url": "https://www.cna.com.tw/news/afe/202610130290.aspx", "summary": "外界關注「疊券」槓桿風險，金管會銀行局副局長王允中表示，日常監理發現少數銀行槓桿操作偏高，今年4月20日已邀銀行公會研議「銀行以金融資產辦理擔保授信的強化措施」，公會近期將函報，若沒問題將在今年底公布施行，並透過金融檢查了解財富管理、私人銀行業務有無過度疊券。據了解，強化措施包含禁止銀行勸誘客戶做疊券、評估最壞情況能否承擔，以及針對客戶做總額度管理。"}, {"no": 4, "title": "金管會10措施強化投信治理　估明年7業者須設類獨董", "date": "2026-10-13", "map": "", "source_name": "中央社：金管會10措施強化投信治理　估明年7業者須設類獨董", "url": "https://www.cna.com.tw/news/afe/202610130281.aspx", "summary": "金管會就公司治理、內部控制及資訊揭露3大面向提出10項強化投信事業治理措施，分2階段推動：第1階段5項措施預計今年底上路，第2階段預計明年6月底實施，將規範負責人兼職行為，並要求資產規模達1兆元以上的投信設置非利害關係董事及公司治理委員會。以今年1月至8月情況預估，元大、國泰、群益、富邦、復華、安聯、統一等7家投信可能適用；國泰投信先前因內控失靈遭重罰600萬元。"}, {"no": 5, "title": "違約交割管控加嚴新制　明年4/1上路", "date": "2026-10-13", "map": "", "source_name": "中央社：違約交割管控加嚴新制　明年4/1上路", "url": "https://www.cna.com.tw/news/afe/202610130297.aspx", "summary": "測試設備廠致茂發生約新台幣5859萬元鉅額違約交割，為上市公司今年第13起。金管會表示，違約管理新制明年4月1日起實施，違約結案者追蹤列管期間延長到5年，首次違約者需預收足額款券10個交易日，再次違約者提高到30個交易日。證期局副局長黃厚銘指出，今年1月到9月集中市場違約金額占全體市場總成交金額比例為10萬分之1.8，交割風險在可控範圍；當沖降稅是否展延將與財政部充分討論。"}]}, {"name": "航運", "items": [{"no": 1, "title": "戰爭紅利持續釋放　全球超大型油輪運費漲到60年來最高", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（鉅亨網）：戰爭紅利持續釋放　全球超大型油輪運費漲到60年來最高", "url": "https://tw.stock.yahoo.com/news/%E6%88%B0%E7%88%AD%E7%B4%85%E5%88%A9%E6%8C%81%E7%BA%8C%E9%87%8B%E6%94%BE-%E5%85%A8%E7%90%83%E8%B6%85%E5%A4%A7%E5%9E%8B%E6%B2%B9%E8%BC%AA%E9%81%8B%E8%B2%BB%E6%BC%B2%E5%88%B060%E5%B9%B4%E4%BE%86%E6%9C%80%E9%AB%98-012738826.html", "summary": "中東戰事延宕大幅拉升長距離原油運輸需求，加上船隊供給嚴重短缺，全球超大型油輪（VLCC）運費已飆升至60年來最高水準。荷蘭國際集團報告指出，一艘9月從沙烏地阿拉伯出發前往荷蘭的油輪，運費折算每桶原油運輸成本達35美元，去年同期均值僅2美元；部分船齡10年左右的二手VLCC成交價已突破1.5億美元，高於約1.35億美元的新船平均造價，出現船價倒掛，部分油輪船長月薪已漲至10萬美元。"}, {"no": 2, "title": "伊朗宣稱兩天內打擊3艘油輪，近日至少10艘超大型油輪停航或掉頭", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=Strait%20of%20Hormuz", "source_name": "Yahoo股市（財訊快報）：伊朗宣稱兩天內打擊3艘油輪，近日至少10艘超大型油輪停航或掉頭", "url": "https://tw.stock.yahoo.com/news/%E4%BC%8A%E6%9C%97%E5%AE%A3%E7%A8%B1%E5%85%A9%E5%A4%A9%E5%85%A7%E6%89%93%E6%93%8A3%E8%89%98%E6%B2%B9%E8%BC%AA-%E8%BF%91%E6%97%A5%E8%87%B3%E5%B0%9110%E8%89%98%E8%B6%85%E5%A4%A7%E5%9E%8B%E6%B2%B9%E8%BC%AA%E5%81%9C%E8%88%AA%E6%88%96%E6%8E%89%E9%A0%AD-233034262.html", "summary": "伊朗伊斯蘭革命衛隊海軍聲明，12日在荷姆茲海峽打擊一艘大型油輪，稱是兩天內第三艘試圖駛離海峽遭打擊的「違規」大型油輪，並警告在海峽及波斯灣與美軍合作的商船或油輪將招致行動。船舶追蹤數據顯示，近幾日至少10艘超大型原油運輸船（VLCC）及數艘蘇伊士型油輪在駛向阿聯富查伊拉港途中停航或掉頭；報導指若空載油輪撤離擴大，海上接駁與轉運效率恐下降，推高運輸成本並拖慢海灣原油出口恢復。"}, {"no": 3, "title": "關稅提前拉貨與航線改道　洛杉磯港9月貨櫃量新高", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=Port%20of%20Los%20Angeles", "source_name": "Yahoo新聞（台灣新生報）：關稅提前拉貨與航線改道　洛杉磯港9月貨櫃量新高", "url": "https://tw.news.yahoo.com/%E9%97%9C%E7%A8%85%E6%8F%90%E5%89%8D%E6%8B%89%E8%B2%A8%E8%88%87%E8%88%AA%E7%B7%9A%E6%94%B9%E9%81%93-%E6%B4%9B%E6%9D%89%E7%A3%AF%E6%B8%AF9%E6%9C%88%E8%B2%A8%E6%AB%83%E9%87%8F%E6%96%B0%E9%AB%98-121309222.html", "summary": "美國洛杉磯港今年九月貨櫃處理量達一百零四萬二千六百五十二TEU，創港口有史以來單月最高紀錄，較二○二五年七月前次紀錄增加約二萬三千個TEU，是連續第四個月締造歷史性運量；九月滿載進口貨櫃達五十四萬TEU、空貨櫃處理量達三十七萬TEU，同創新高。執行董事Gene Seroka表示，零售業者為因應關稅提前進口、加上全球航線調整推升貨量，聖嬰現象可能影響巴拿馬運河通航，預估未來洛杉磯與長堤兩港貨櫃運量可能增加約五％。"}, {"no": 4, "title": "水手上船時間到？大咖法人「3原因」喊買長榮　全年EPS估飆1倍挑戰43元", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（FTNN新聞網）：水手上船時間到？大咖法人「3原因」喊買長榮　全年EPS估飆1倍挑戰43元", "url": "https://tw.stock.yahoo.com/news/%E6%B0%B4%E6%89%8B%E4%B8%8A%E8%88%B9%E6%99%82%E9%96%93%E5%88%B0-%E5%A4%A7%E5%92%96%E6%B3%95%E4%BA%BA-3%E5%8E%9F%E5%9B%A0-%E5%96%8A%E8%B2%B7%E9%95%B7%E6%A6%AE-%E5%85%A8%E5%B9%B4eps%E4%BC%B0%E9%A3%861%E5%80%8D%E6%8C%91%E6%88%B043%E5%85%83-224000385.html", "summary": "長榮9月營收達497.11億元、年增65%，第3季營收1467.76億元、季增39.6%、年增51.4%。本土法人將長榮第3季稅後EPS預估由7.01元上修至19.43元，2026年稅後EPS上修至43.53元、2027年估51.04元，投資評等調升至「買進」、目標價290元。法人看好美國零售商回補庫存，巴拿馬運河限航效應可能延續至2027年上半年；2026年9月歐洲線平均運價年增121%，美西線及美東線年增均超過250%。"}, {"no": 5, "title": "李在明歡迎北極航線貨櫃輪返國　拚2030年前開通定期服務", "date": "2026-10-13", "map": "https://www.google.com/maps/search/?api=1&query=%E9%87%9C%E5%B1%B1", "source_name": "中央社：李在明歡迎北極航線貨櫃輪返國　拚2030年前開通定期服務", "url": "https://www.cna.com.tw/news/aopl/202610130286.aspx", "summary": "韓國總統李在明在釜山的儀式中，歡迎首艘經由北極航線成功往返歐洲的韓國貨櫃輪PanStar Acro號返國；該船11日返抵韓國，完成長達50天航程，期間停靠英國費利克斯托、荷蘭鹿特丹及波蘭格但斯克。當局指北極航線應可比蘇伊士運河航線縮減約1/3航行時間；海洋水產部長官黃鐘宇表示，預計2027年進一步試航，目標2030年正式啟動定期航班服務，約在2040年達成經濟效益。"}]}, {"name": "Stocks", "items": [{"no": 1, "title": "〈美股盤後〉美光跌3.6%晶片股承壓　那指收低、費半連五跌", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈美股盤後〉美光跌3.6%晶片股承壓　那指收低、費半連五跌", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E7%9B%A4%E5%BE%8C-%E7%BE%8E%E5%85%89%E8%B7%8C3-6-%E6%99%B6%E7%89%87%E8%82%A1%E6%89%BF%E5%A3%93-%E9%82%A3%E6%8C%87%E6%94%B6%E4%BD%8E-214147916.html", "summary": "美股13日收低，道瓊指數下跌180.45點收51,670.10點，那斯達克指數下跌41.52點收27,204.38點，S&P 500指數下跌1.79點收7,805.45點，費城半導體指數下跌0.23%、連續第五個交易日走低，過去五個交易日累計下跌逾8%。美光下跌3.6%、應用材料重挫近7%；銀行財報季開跑，花旗下跌5.6%、富國銀行下跌3.1%、摩根大通下跌0.9%。蘋果盤中創348.15美元歷史新高，台積電ADR上漲0.17%。"}, {"no": 2, "title": "美股太樂觀了？花旗指標亮警訊　撤回加碼建議", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：美股太樂觀了？花旗指標亮警訊　撤回加碼建議", "url": "https://tw.stock.yahoo.com/news/%E7%BE%8E%E8%82%A1%E5%A4%AA%E6%A8%82%E8%A7%80%E4%BA%86-%E8%8A%B1%E6%97%97%E6%8C%87%E6%A8%99%E4%BA%AE%E8%AD%A6%E8%A8%8A-%E6%92%A4%E5%9B%9E%E5%8A%A0%E7%A2%BC%E5%BB%BA%E8%AD%B0-182003359.html", "summary": "花旗集團13日撤回對美股的「加碼」建議，並結束標普500等權重指數的多頭部位，理由是其綜合觀察市場部位、樂觀程度、流動性、槓桿及壓力的POLLS指標，近期讀數已觸及歷史上曾與市場高點同時出現的水準，因此決定「戰術性降低部分風險曝險」。花旗強調此舉並非全面看空；高盛則於週一將全球股票評等上調至「加碼」，認為近期市場回檔後估值已更具吸引力。"}, {"no": 3, "title": "台股挫960點科技股賣壓沉重　塑化、航運與金融強勢", "date": "2026-10-13", "map": "", "source_name": "中央社：台股挫960點科技股賣壓沉重　塑化、航運與金融強勢", "url": "https://www.cna.com.tw/news/afe/202610130147.aspx", "summary": "博通執行長陳福陽、英特爾執行長陳立武雙雙示警AI擴張最大瓶頸是資金，引爆科技股賣壓，台股13日盤中最多重跌逾1200點，終場下跌960.65點、收48341.31點，成交值放大到新台幣1兆1250億元。台積電跌50元收2490元，聯發科跌100元收4525元，台達電跌125元或6.58%收1775元；華南金大漲3.57%收49.35元，台塑化攻上漲停板119元，國喬亮燈漲停。分析師指本週頭號重點為週四台積電法說會。"}, {"no": 4, "title": "三大法人賣超1984億元　外資減碼1653億元史上第3大", "date": "2026-10-13", "map": "", "source_name": "中央社：三大法人賣超1984億元　外資減碼1653億元史 .30日圓報158.61日圓，美元兌瑞郎報0.8347瑞郎，英鎊兌美元報1.3208美元。烏克蘭質疑俄烏「能源停火」後布蘭特原油一度突破每桶107美元，加劇通膨擔憂；匯豐外匯策略分析師認為若CPI僅略高於預期，可能增強市場對10月按兵不動、12月升息的信心，不會實質改變美元趨勢，歐元此前已連續五週下跌。"}, {"no": 4, "title": "東京匯市早盤美元指數自18個月高點小落，日圓、歐元和英鎊小漲", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（財訊快報）：東京匯市早盤美元指數自18個月高點小落，日圓、歐元和英鎊小漲", "url": "https://tw.stock.yahoo.com/news/%E6%9D%B1%E4%BA%AC%E5%8C%AF%E5%B8%82%E6%97%A9%E7%9B%A4%E7%BE%8E%E5%85%83%E6%8C%87%E6%95%B8%E8%87%AA18%E5%80%8B%E6%9C%88%E9%AB%98%E9%BB%9E%E5%B0%8F%E8%90%BD-%E6%97%A5%E5%9C%93-%E6%AD%90%E5%85%83%E5%92%8C%E8%8B%B1%E9%8E%8A%E5%B0%8F%E6%BC%B2-013126379.html", "summary": "日本金融市場13日恢復交易，東京匯市早盤美元指數微跌0.02%至102.57，前一日觸及的102.607為18個月高點；美元跌0.11%報158.43日圓，歐元微升0.05%至1.1161美元，英鎊小漲0.02%至1.3209美元。日本央行公布9月企業物價指數年增6.80%，低於市場預估的7.60%，但以日圓計價的進口物價年增24.50%；市場關注日本央行10月29日至30日會議，評估下一次升息時機，日圓仍無力收復156關口。"}, {"no": 5, "title": "高市籲緊急推動積極財政，重申美日協調穩匯、未提日圓防守價位", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（財訊快報）：高市籲緊急推動積極財政，重申美日協調穩匯、未提日圓防守價位", "url": "https://tw.stock.yahoo.com/news/%E9%AB%98%E5%B8%82%E7%B1%B2%E7%B7%8A%E6%80%A5%E6%8E%A8%E5%8B%95%E7%A9%8D%E6%A5%B5%E8%B2%A1%E6%94%BF-%E9%87%8D%E7%94%B3%E7%BE%8E%E6%97%A5%E5%8D%94%E8%AA%BF%E7%A9%A9%E5%8C%AF-%E6%9C%AA%E6%8F%90%E6%97%A5%E5%9C%93%E9%98%B2%E5%AE%88%E5%83%B9%E4%BD%8D-052601060.html", "summary": "日本首相高市早苗13日表示，當前正是緊急實施「負責任、積極主動」財政政策的時刻，日本將持續與美國保持溝通以確保外匯市場穩定，美日兩國正努力維持匯市秩序，但未提出具體干預安排或匯率防守價位。日本政府10月9日宣布擴大支出檢討，聚焦201項專用基金，預估下一財政年度底合計餘額約7兆日圓以尋找政策財源；報導指相關表態尚不能解讀為已決定聯手進場干預。"}]}, {"name": "Commodities", "items": [{"no": 1, "title": "《貴金屬》美元指數上漲　COMEX黃金下跌0.6%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（MoneyDJ）：《貴金屬》美元指數上漲　COMEX黃金下跌0.6%", "url": "https://tw.stock.yahoo.com/news/%E8%B2%B4%E9%87%91%E5%B1%AC-%E7%BE%8E%E5%85%83%E6%8C%87%E6%95%B8%E4%B8%8A%E6%BC%B2-comex%E9%BB%83%E9%87%91%E4%B8%8B%E8%B7%8C0-6-221600063.html", "summary": "COMEX 12月黃金期貨12日收盤下跌25.7美元或0.6%至每盎司4,190.6美元，美元指數上漲0.4%；12月白銀期貨下跌0.9%至每盎司60.51美元，NYMEX 1月鉑金期貨上漲0.1%至1,695.7美元，12月鈀金期貨下跌0.7%至1,142美元，COMEX 12月期銅上漲1%至每磅6.7615美元。分析師指美元接近一年半高點令金價承壓，市場關注聯準會主席華許談話及週三公布的CPI；SPDR黃金ETF持有量持平於1,053.13公噸。"}, {"no": 2, "title": "全球央行購金第4大戶轉賣方　年底前黃金儲存占比降至75%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（鉅亨網）：全球央行購金第4大戶轉賣方　年底前黃金儲存占比降至75%", "url": "https://tw.stock.yahoo.com/news/%E5%85%A8%E7%90%83%E5%A4%AE%E8%A1%8C%E8%B3%BC%E9%87%91%E7%AC%AC4%E5%A4%A7%E6%88%B6%E8%BD%89%E8%B3%A3%E6%96%B9-%E5%B9%B4%E5%BA%95%E5%89%8D%E9%BB%83%E9%87%91%E5%84%B2%E5%AD%98%E5%8D%A0%E6%AF%94%E9%99%8D%E8%87%B375-012003875.html", "summary": "哈薩克央行副行長Moldabekova表示，美國公債殖利率升至多年高點使美元資產吸引力明顯提高，央行計劃今年底前將黃金占外匯存底比重從目前約78%降至75%，一半透過出售黃金相關選擇權、一半透過出售實體黃金。哈薩克黃金儲備已增至386噸，9月底外匯存底規模達664億美元；世界黃金協會數據顯示，2026年前八個月哈薩克央行為全球第四大黃金買家。金價今年1月曾一度攀升至每盎司5,600美元。"}, {"no": 3, "title": "黃金最壞時刻已過？瑞銀：美債殖利率回落將讓黃金復甦", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（鉅亨網）：黃金最壞時刻已過？瑞銀：美債殖利率回落將讓黃金復甦", "url": "https://tw.stock.yahoo.com/news/%E9%BB%83%E9%87%91%E6%9C%80%E5%A3%9E%E6%99%82%E5%88%BB%E5%B7%B2%E9%81%8E-%E7%91%9E%E9%8A%80-%E7%BE%8E%E5%82%B5%E6%AE%96%E5%88%A9%E7%8E%87%E5%9B%9E%E8%90%BD%E5%B0%87%E8%AE%93%E9%BB%83%E9%87%91%E5%BE%A9%E7%94%A6-234002390.html", "summary": "瑞銀12日報告指出，金價自9月初以來累計下跌約5%，同期美國10年期公債殖利率從約4.8%升至5.3%以上，美元指數從約100升至102以上，金價從每盎司逾4,400美元回落至約4,140美元；市場對進一步升息的預期已大致反映，若勞動市場降溫帶動殖利率回落，黃金有機會反彈。瑞銀將每盎司3,990至4,030美元視為近期重要支撐區，若站穩4,280至4,320美元以上則顯示技術動能改善。"}, {"no": 4, "title": "智利銅礦崩塌事故引發斷供隱憂，LME期銅週一上漲0.54%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（財訊快報）：智利銅礦崩塌事故引發斷供隱憂，LME期銅週一上漲0.54%", "url": "https://tw.stock.yahoo.com/news/%E6%99%BA%E5%88%A9%E9%8A%85%E7%A4%A6%E5%B4%A9%E5%A1%8C%E4%BA%8B%E6%95%85%E5%BC%95%E7%99%BC%E6%96%B7%E4%BE%9B%E9%9A%B1%E6%86%82-lme%E6%9C%9F%E9%8A%85%E9%80%B1-%E4%B8%8A%E6%BC%B20-54-001728577.html", "summary": "倫敦金屬交易所（LME）3個月銅合約12日收盤上漲78.50美元或0.54%，報每噸14,618.50美元，智利國家銅業公司（Codelco）一座礦山發生崩塌並造成人員死亡，加劇市場對銅供應的擔憂。其他基本金屬方面，錫上漲203美元報每噸53,209美元，鋅下跌1.26%報3,757.50美元，鉛下跌0.24%報1,883.50美元，鋁上漲0.13%報3,052.50美元，鎳下跌0.02%報15,619美元。"}, {"no": 5, "title": "礦山增產受限　白銀市場連續六年供給短缺", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（MoneyDJ）：礦山增產受限　白銀市場連續六年供給短缺", "url": "https://tw.stock.yahoo.com/news/%E7%A4%A6%E5%B1%B1%E5%A2%9E%E7%94%A2%E5%8F%97%E9%99%90-%E7%99%BD%E9%8A%80%E5%B8%82%E5%A0%B4%E9%80%A3%E7%BA%8C%E5%85%AD%E5%B9%B4%E4%BE%9B%E7%B5%A6%E7%9F%AD%E7%BC%BA-014900324.html", "summary": "白銀協會《世界白銀調查報告》指出，全球白銀市場預計在2026年連續第六年出現供應短缺，缺口將由2025年的4,030萬盎司擴大至4,630萬盎司；全球礦山產量預計持平，白銀總供應量則可能減少約2%。報導指礦山增產能力有限、新礦開發週期漫長及高品位礦床儲備不足等結構性限制，可能形成中長期支撐，但供應短缺並不代表價格必然持續上漲，仍須觀察需求變化與投資資金流向。"}]}, {"name": "Sectors", "items": [{"no": 1, "title": "第3季PC智慧手機出貨年減逾2成　記憶體高漲衝擊", "date": "2026-10-13", "map": "", "source_name": "中央社：第3季PC智慧手機出貨年減逾2成　記憶體高漲衝擊", "url": "https://www.cna.com.tw/news/afe/202610130119.aspx", "summary": "研調機構顧能統計，第3季全球個人電腦出貨量滑落至5540萬台，為2023年初以來最低水準，年減22.4%，主因第2季DRAM成本較去年同期飆升5倍，電腦廠將成本轉嫁客戶。Counterpoint Research估計第3季全球智慧手機出貨量年減20%，為2012年以來同期新低，智慧手機零售價格今年來上漲20%，消費者拉長換機時間；該機構表示在零組件成本和供應狀況改善前，整體出貨量不太可能實質復甦。"}, {"no": 2, "title": "光通訊台、美股雙殺！「這指標股」跌停摔破3000元　IET、上詮暴跌逾9%", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（FTNN新聞網）：光通訊台、美股雙殺！「這指標股」跌停摔破3000元　IET、上詮暴跌逾9%", "url": "https://tw.stock.yahoo.com/news/%E5%85%89%E9%80%9A%E8%A8%8A%E5%8F%B0-%E7%BE%8E%E8%82%A1%E9%9B%99%E6%AE%BA-%E9%80%99%E6%8C%87%E6%A8%99%E8%82%A1-%E8%B7%8C%E5%81%9C%E6%91%94%E7%A0%B43000%E5%85%83-%E5%85%A8%E6%96%B0-102500283.html", "summary": "美股12日光通訊族群集體下挫，Lumentum暴跌9.78%、Coherent挫7.87%、Ciena暴跌近10%；台股13日光通訊概念股同受牽連呈一片綠海，指標股聯亞收跌停價2725元，全新跌停收508元、成交量破萬張，前鼎跌停收219元，IET-KY、上詮均暴跌逾9%，華星光、訊芯-KY、聯鈞全跌逾8%；盤面僅台通小漲0.61%、台星科漲1.53%收266元逆勢收紅。"}, {"no": 3, "title": "銅箔基板也撐不住...聯茂、台光電慘吞跌停　分析師看法曝", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（Yahoo財經）：銅箔基板也撐不住...聯茂、台光電慘吞跌停　分析師看法曝", "url": "https://tw.stock.yahoo.com/news/%E9%8A%85%E7%AE%94%E5%9F%BA%E6%9D%BF%E4%B9%9F%E6%92%90%E4%B8%8D%E4%BD%8F%E8%81%AF%E8%8C%82%E3%80%81%E5%8F%B0%E5%85%89%E9%9B%BB%E6%85%98%E5%90%9E%E8%B7%8C%E5%81%9C-%E5%88%86%E6%9E%90%E5%B8%AB%E7%9C%8B%E6%B3%95%E6%9B%9D-031542064.html", "summary": "台股13日重挫，銅箔基板龍頭台光電一早最低來到5535元一度跌停、摔破5600元大關，聯茂重挫跌停，台燿大跌半根以上，族群氣氛低迷。資深分析師謝明哲認為產業本身沒有問題，在ASIC、GPU的需求與發展下，明後兩年銅箔基板需求持續提升並帶動M8至M9的發展，但族群先前漲勢強勁、跌幅更深，建議暫時觀望，待股價出現止穩再做布局。"}, {"no": 4, "title": "車用零配件台廠　搶攻AI伺服器液冷散熱商機", "date": "2026-10-13", "map": "", "source_name": "中央社：車用零配件台廠　搶攻AI伺服器液冷散熱商機", "url": "https://www.cna.com.tw/news/afe/202610130117.aspx", "summary": "車用零配件和車用精密機械加工台廠加速切入AI伺服器和資料中心供應鏈，主要聚焦AI伺服器液冷散熱關鍵零組件。宇隆看好液冷系統關鍵元件通用快接頭UQD，目標今年UQD業績占比力拚1成；時碩獲日系大廠伺服器散熱應用訂單，劍麟加快液冷散熱分歧管客戶驗證與量產，智伸科已切入AI晶片和美系機櫃水冷板等大廠供應鏈，吉茂獲北美客戶認證、今年逐步放量。"}, {"no": 5, "title": "全體上市公司前9月總營收45.18兆元　年增38%", "date": "2026-10-13", "map": "", "source_name": "中央社：全體上市公司前9月總營收45.18兆元　年增38%", "url": "https://www.cna.com.tw/news/afe/202610130205.aspx", "summary": "證交所統計，1054家上市公司前9月累計總營收達新台幣45兆1846億元，較去年同期成長38.3%，營收成長公司739家、衰退315家；9月全體上市公司總營收6兆1679億元，年增47.28%。前9月營收成長較大產業為受惠AI應用與新世代記憶體需求的電子通路業、受惠AI伺服器需求的電腦及周邊設備業，以及受惠AI應用與高效能運算需求的半導體業；9月油電燃氣業則因中東戰事推升產品價格。"}]}, {"name": "Energy", "items": [{"no": 1, "title": "〈能源盤後〉多空拉鋸！俄美柴油協議遇上中東戰火　油市漲跌互現", "date": "2026-10-14", "map": "", "source_name": "Yahoo股市（鉅亨網）：〈能源盤後〉多空拉鋸！俄美柴油協議遇上中東戰火　油市漲跌互現", "url": "https://tw.stock.yahoo.com/news/%E8%83%BD%E6%BA%90%E7%9B%A4%E5%BE%8C-%E5%A4%9A%E7%A9%BA%E6%8B%89%E9%8B%B8-%E4%BF%84%E7%BE%8E%E6%9F%B4%E6%B2%B9%E5%8D%94%E8%AD%B0%E9%81%87%E4%B8%8A%E4%B8%AD%E6%9D%B1%E6%88%B0%E7%81%AB-%E6%B2%B9%E5%B8%82%E6%BC%B2%E8%B7%8C%E4%BA%92%E7%8F%BE-214004022.html", "summary": "國際油價13日收盤漲跌互見，布蘭特原油期貨下跌0.96美元或0.9%收每桶105.69美元，WTI期貨上漲0.40美元或0.4%收每桶94.14美元；WTI 2027年期貨連續第12個交易日創紀錄高點、觸及每桶84美元。美國柴油期貨上漲約5%，美國柴油零售價格週一平均約每加侖6.27美元，較去年同期高出71%。OPEC連續第6個月下調2026年全球石油需求成長預測，已由年初的每日140萬桶下調至每日40萬桶。"}, {"no": 2, "title": "川普稱青年運動企圖在美期中選舉前推升油價　批行徑惡劣", "date": "2026-10-14", "map": "https://www.google.com/maps/search/?api=1&query=King%20Khalid%20International%20Airport", "source_name": "中央社：川普稱青年運動企圖在美期中選舉前推升油價　批行徑惡劣", "url": "https://www.cna.com.tw/news/aopl/202610140004.aspx", "summary": "美伊戰爭引發的區域衝突擴大之際，美國總統川普發文指控葉門叛軍「青年運動」企圖在美國期中選舉前蓄意推升油價，並警告他「絕不忘記」該組織襲擊沙烏地阿拉伯一事，警告將延續至11月3日期中選舉結束後。青年運動近日對沙國展開一系列攻擊，包括空襲利雅德的哈立德國王國際機場，造成13死、逾300人受傷，迫使機場暫停營運；川普指該組織在伊朗授意下重啟攻擊。"}, {"no": 3, "title": "沙國計畫將輸油管線出口能力提高至每日千萬桶", "date": "2026-10-13", "map": "", "source_name": "Yahoo股市（MoneyDJ）：沙國計畫將輸油管線出口能力提高至每日千萬桶", "url": "https://tw.stock.yahoo.com/news/%E6%B2%99%E5%9C%8B%E8%A8%88%E7%95%AB%E5%B0%87%E8%BC%B8%E6%B2%B9%E7%AE%A1%E7%B7%9A%E5%87%BA%E5%8F%A3%E8%83%BD%E5%8A%9B%E6%8F%90%E9%AB%98%E8%87%B3%E6%AF%8F%E6%97%A5%E5%8D%83%E8%90%AC%E6%A1%B6-230400319.html", "summary": "沙烏地阿拉伯能源部長阿卜杜勒阿齊茲親王在利雅德世界石油大會表示，沙國計畫將輸油管線原油出口能力從700萬桶/日提高至每日最高1,000萬桶；可透過暫時將一條天然氣管線改作原油運輸用途，在七至八週內增加每日最高120萬桶出口能力，若進一步投入資金，新增出口能力總計可達每日300萬桶。升級東西向輸油管線抽油站等建設，可望在未來兩至三年內將避開波斯灣及紅海主要航線的運輸能力提高至每日約1,000萬桶。"}, {"no": 4, "title": "川普稱俄將對外供應柴油　俄估年底前月出口量上看350萬公噸", "date": "2026-10-13", "map": "", "source_name": "中央社：川普稱俄將對外供應柴油　俄估年底前月出口量上看350萬公噸", "url": "https://www.cna.com.tw/news/aopl/202610130283.aspx", "summary": "川普表示俄羅斯將立即向美國及全球市場供應逾30萬公噸柴油，11月再供應50萬噸，之後追加100萬噸，美國並暫時解除對俄羅斯燃料的制裁。俄國副總理諾瓦克表示，今年底前柴油出口量可能達到每月300萬到350萬公噸，重返危機前水準；俄羅斯上個月對中亞出口相當於42.7萬公噸柴油。美國柴油價格飆升已成11月3日期中選舉前關注議題，協議則引發部分美國國會議員強烈反彈。"}, {"no": 5, "title": "中油：油氣供應至年底無虞　已提前規劃明年第1季採購", "date": "2026-10-13", "map": "", "source_name": "中央社：中油：油氣供應至年底無虞　已提前規劃明年第1季採購", "url": "https://www.cna.com.tw/news/afe/202610130019.aspx", "summary": "中東情勢升溫，台灣中油表示已增購非中東地區原油、彈性調整油輪及液化天然氣（LNG）船期，國內油氣供應至年底無虞，並已提前規劃明年第1季採購量。中油指出，9月中旬沙烏地阿美因東西管線遭炸，無法供應9、10月期約貨油，已立即增購現貨原油補足缺口；近期國際原油價格高檔震盪、運費及保險費大幅上漲，中油將配合政府穩定物價政策，持續凍漲或緩漲主要油氣產品價格。"}]}], "warnings": [], "day": "2026-10-14"}, {"title": "近3日重大股票、期貨新聞整理（2026-10-11 至 2026-10-13）", "compiled": "2026-10-13 07:11（台灣時間）", "sort_note": "各類近日優先；新聞日期以台灣時間發布日為準，國際新聞多為當地前一日事件；10月12日為國慶連假後首個台股交易日，台指期夜盤及美股收盤依台灣時間12日晚間至13日凌晨報導", "note": "金融類4則、Currencies類4則、Commodities類2則、Sectors類4則（近3日符合條件且來源可查證之新聞不足5則；Commodities類以貴金屬與銅為主，原油走勢歸入Energy類），其餘各類各5則；10月12日為國慶連假後首個台股交易日，期貨類涵蓋連假夜盤補跌與12日夜盤費半拖累；航運與部分產業新聞對「十一長假後出貨」僅作過境提及、未以中國為主軸；全文已依指定排除條件篩選。", "categories": [{"name": "半導體", "items": [{"no": 1, "title": "微軟推新一代AI晶片Maia 300　部分採台積電2奈米製程", "date": "2026-10-12", "map": "", "source_name": "中央社：微軟推新一代AI晶片Maia 300　部分採台積電2奈米製程", "url": "https://www.cna.com.tw/news/ait/202610120307.aspx", "summary": "微軟宣布推出第3代自研AI晶片Maia 300，計劃明年部署數量可能超過100萬顆、規模達數個GW。負責關鍵運算的小晶片採用台積電2奈米製程，其餘小晶片採成本較低的3奈米製程負責資料傳輸；每機櫃容納96顆晶片、耗電約167kW，對照輝達GB300機櫃72顆GPU、耗電約142kW。微軟先前表示今年資本支出將超過1750億美元。"}, {"no": 2, "title": "南亞科：DRAM仍非常缺貨　第4季價格和毛利率看升", "date": "2026-10-12", "map": "", "source_name": "中央社：南亞科：DRAM仍非常缺貨　第4季價格和毛利率看升", "url": "https://www.cna.com.tw/news/afe/202610120167.aspx", "summary": "南亞科第3季營收新台幣1336.49億元、季增61.9%，DRAM平均售價季增逾60%，毛利率85.7%、稅後淨利876.27億元、每股純益25.4元；前9月稅後淨利1638.77億元、每股純益49.28元。總經理李培瑛表示DRAM仍非常缺貨，第4季價格可望續漲、毛利率有機會再升；AI基礎設施相關營收比重逾20%，5A新廠預計2027年第1季裝機，2028年底月投片3萬片、2030年底5萬片。"}, {"no": 3, "title": "南亞科擴大資本支出　林口5A新廠投資近4800億元", "date": "2026-10-12", "map": "https://www.google.com/maps/search/?api=1&query=%E6%9E%97%E5%8F%A3%E5%8D%97%E4%BA%9E%E7%A7%91", "source_name": "Yahoo股市（三立新聞網）：南亞科擴大資本支出　未來月產能5萬片", "url": "https://tw.stock.yahoo.com/news/%E5%8D%97%E4%BA%9E%E7%A7%91%E6%93%B4%E5%A4%A7%E8%B3%87%E6%9C%AC%E6%94%AF%E5%87%BA-%E6%9C%AA%E4%BE%86%E6%9C%88%E7%94%A2%E8%83%BD5%E8%90%AC%E7%89%87-070600257.html", "summary": "南亞科總經理李培瑛在法說會表示，林口5A新廠含廠房建設及EUV等設備，總投資金額預估接近新台幣4800億元，可由自有資金支應；產能目標由先前約4.5萬片上修，2028年達月投片3萬片、2030年有機會至5萬片。另規劃屏東科學園區3D晶圓封測廠，以3D IC及晶圓對晶圓鍵合為方向，預計2028年下半年有機會開始裝機。"}, {"no": 4, "title": "ASML對三星及海力士漲價、可能與台積電談判中　應材、東京威力科創也要漲價", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（東森財經新聞）：ASML對三星及海力士漲價、可能與台積電談判中　應材、東京威力科創也要漲價", "url": "https://tw.stock.yahoo.com/news/asml%E5%B0%8D%E4%B8%89%E6%98%9F%E5%8F%8A%E6%B5%B7%E5%8A%9B%E5%A3%AB%E6%BC%B2%E5%83%B9-%E5%8F%AF%E8%83%BD%E8%88%87%E5%8F%B0%E7%A9%8D%E9%9B%BB%E8%AB%87%E5%88%A4%E4%B8%AD-%E6%87%89%E6%9D%90-%E6%9D%B1%E4%BA%AC%E5%A8%81%E5%8A%9B%E7%A7%91%E5%89%B5%E4%B9%9F%E8%A6%81%E6%BC%B2%E5%83%B9-014500552.html", "summary": "韓媒《THE ELEC》報導，ASML對三星電子與SK海力士發送漲價通知，自2027年1月供貨起全面調漲韓國市場維護與替換零件價格10%，涵蓋EUV與DUV全部更換零組件，兩大記憶體廠已接受。業界消息指ASML亦正與客戶協商新機台價格調漲；應用材料與東京威力科創也已對新產品與既有產品線實施或規劃漲價。"}, {"no": 5, "title": "世芯-KY擴大2奈米封裝整合，年底新案投片", "date": "2026-10-11", "map": "", "source_name": "Yahoo股市（MoneyDJ）：世芯-KY擴大2奈米封裝整合，年底新案投片", "url": "https://tw.stock.yahoo.com/news/%E4%B8%96%E8%8A%AF-ky%E6%93%B4%E5%A4%A72%E5%A5%88%E7%B1%B3%E5%B0%81%E8%A3%9D%E6%95%B4%E5%90%88-%E5%B9%B4%E5%BA%95%E6%96%B0%E6%A1%88%E6%8A%95%E7%89%87-023100581.html", "summary": "世芯-KY在AI Infra Summit 2026展示2奈米設計平台，現階段90%設計採7奈米以下製程，並列入NVIDIA NVLink Fusion首批客製化晶片合作夥伴。北美CSP客戶3奈米AI加速器已於第2季末量產、第3季出貨放大；下一代2奈米AI加速器目標2026年底前完成tape-out。前8月營收278.95億元、年增13.58%，8月營收87.76億元、年增273.61%。"}]}, {"name": "AI", "items": [{"no": 1, "title": "伺服器出貨1520萬台　台廠受惠12強", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（三立新聞網）：伺服器出貨1520萬台　台廠受惠12強", "url": "https://tw.news.yahoo.com/%E4%BC%BA%E6%9C%8D%E5%99%A8%E5%87%BA%E8%B2%A81520%E8%90%AC%E5%8F%B0-%E5%8F%B0%E5%BB%A0%E5%8F%97%E6%83%A012%E5%BC%B7-190500110.html", "summary": "法人將2026年全球伺服器總出貨量預估上調至1520萬台、年增21%，2027年上修至1900萬台、年增25%；AI伺服器2026年可望達350萬台、年增45%，2027年520萬台。2026年上半年全球伺服器出貨717萬台、年增22%，其中AI伺服器160萬台、年增56%。輝達GB與VR平台高階伺服器2026年出貨估6.9萬至7萬櫃；鴻海、緯創、緯穎、奇鋐、健策、台達電、台光電、金像電、欣興、川湖、嘉澤、信驊等台廠受惠。"}, {"no": 2, "title": "台達電第3季營收續創新高　積極因應美337調查維護權益", "date": "2026-10-12", "map": "", "source_name": "中央社：台達電第3季營收續創新高　積極因應美337調查維護權益", "url": "https://www.cna.com.tw/news/afe/202610120169.aspx", "summary": "台達電公布9月營收新台幣654億元，年增14.6%、月增1.3%，創單月營收第3高；第3季營收1970.59億元，季增7.5%、年增31.1%，連2季創歷史新高；前9月營收5396.68億元、年增37.2%。針對美國USITC啟動垂直電力傳輸系統337調查，台達電表示將依程序積極因應，相關產品目前未受影響。"}, {"no": 3, "title": "輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：輝達衝刺機器人加碼投資新創Figure所羅門、廣運、台達電等沾光", "url": "https://tw.news.yahoo.com/%E8%BC%9D%E9%81%94%E8%A1%9D%E5%88%BA%E6%A9%9F%E5%99%A8%E4%BA%BA%E5%8A%A0%E7%A2%BC%E6%8A%95%E8%B3%87%E6%96%B0%E5%89%B5figure%E6%89%80%E7%BE%85%E9%96%80-%E5%BB%A3%E9%81%8B-%E5%8F%B0%E9%81%94%E9%9B%BB%E7%AD%89%E6%B2%BE%E5%85%89-223210290.html", "summary": "輝達傳擬斥資10億美元（近新台幣320億元）加碼投資AI機器人新創Figure，Figure目前估值約380億美元。業界認為這是黃仁勳加速擴大機器人布局的關鍵訊號，所羅門、廣運、台達電、達明、新漢等輝達機器人供應鏈有望受惠；所羅門董事長陳政隆透露，今年AI視覺與機器人相關業績可望增長七成。"}, {"no": 4, "title": "AI伺服器催油門！電子五哥Q3營收齊增　緯創、廣達雙創單季新高", "date": "2026-10-11", "map": "", "source_name": "Yahoo新聞（壹蘋新聞網）：AI伺服器催油門！電子五哥Q3營收齊增　緯創、廣達雙創單季新高", "url": "https://tw.news.yahoo.com/ai%E4%BC%BA%E6%9C%8D%E5%99%A8%E5%82%AC%E6%B2%B9%E9%96%80-%E9%9B%BB%E5%AD%90%E4%BA%94%E5%93%A5q3%E7%87%9F%E6%94%B6%E9%BD%8A%E5%A2%9E-%E7%B7%AF%E5%89%B5-%E5%BB%A3%E9%81%94%E9%9B%99%E5%89%B5%E5%96%AE%E5%AD%A3%E6%96%B0%E9%AB%98-085100111.html", "summary": "AI伺服器需求強勁，電子五哥第三季營收全面年增。緯創第三季營收1.15兆元、年增101%，廣達第三季營收1.12兆元、年增125.2%，英業達第三季營收2720.94億元，三者均創單季新高；和碩9月營收2147.53億元，首度突破2000億元。廣達表示新一代Vera Rubin第四季預計開始小量出貨，主要專案明年第一季才會啟動。"}, {"no": 5, "title": "金融時報：輝達討論加強投資或收購Reflection AI", "date": "2026-10-11", "map": "", "source_name": "中央社：金融時報：輝達討論加強投資或收購Reflection AI", "url": "https://www.cna.com.tw/news/aopl/202610110140.aspx", "summary": "英國金融時報引述知情人士報導，輝達正與美國開源AI新創Reflection AI討論加強投資或直接收購。輝達至今已對其投資8億美元（約新台幣256億元），雙方考慮的交易形式包括由輝達聘僱其職員並取得技術授權的「人才收購」，這麼做或許能避免冗長的監管審查；Reflection AI已於5日推出首款開放權重模型Beam。"}]}, {"name": "金融", "items": [{"no": 1, "title": "國銀高資產大戶8月突破3萬人　資產管理規模達3.1兆", "date": "2026-10-12", "map": "", "source_name": "中央社：國銀高資產大戶8月突破3萬人　資產管理規模達3.1兆", "url": "https://www.cna.com.tw/news/afe/202610120276.aspx", "summary": "金管會統計，截至2026年8月底，23家國銀高資產客戶管理資產規模（AUM）增至新台幣3兆1089億元，月增1698億元；高資產客戶達3萬596人，月增1984人，AUM與客戶數單月增額皆創歷來新高。存款比率跌破4成至39.4%，創2022年4月以來新低，基金升至17.3%、債券14.9%、保險13.2%。證券商高資產業務累計客戶2136人、交易金額約6585億元。"}, {"no": 2, "title": "疊券風險引關注　金管會：公會提強化措施估年底上路", "date": "2026-10-12", "map": "", "source_name": "中央社：疊券風險引關注　金管會：公會提強化措施估年底上路", "url": "https://www.cna.com.tw/news/afe/202610120244.aspx", "summary": "美債殖利率攀升、債券價格下跌，市場關注投資人以金融資產反覆質押的「疊券」槓桿風險。金管會表示，銀行公會近期將函報金融資產擔保授信強化措施，預計今年底前上路，高雄專區內外皆適用；銀行須在銷售端評估客戶風險承受度，並落實「三要一不」原則（要做好風險管控、要落實內控及洗錢防制、要培育人才、不做惡性競爭）。"}, {"no": 3, "title": "美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "date": "2026-10-12", "map": "", "source_name": "Yahoo新聞（聯合新聞網）：美債投資也爆「四貸同堂」金管會指示從授信、銷售端雙管齊下強化控管", "url": "https://tw.news.yahoo.com/%E7%BE%8E%E5%82%B5%E6%8A%95%E8%B3%87%E4%B9%9F%E7%88%86-%E5
